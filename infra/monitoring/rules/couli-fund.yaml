# Prometheus alerting rules of couli: fund alerts (B1-01zzi; 规划/02 §13; BR-FUND-02, BR-FUND-04,
# BR-CALC-13, BR-WDR-14, BR-WDR-24). Same format and YAML subset as couli.yaml (which stays as it
# is): every string single-quoted, 2-space indentation.
# Every rule here carries labels fund: 'true' (a string) for the night routing of fund alerts:
# at night only fund alerts are pushed (规划/02 §13). Alertmanager routing itself is not in this
# file (B1-25).
# Source of the metrics: the worker's internal /metrics listener (METRICS_PORT;
# apps/api/src/modules/platform/metrics), read through the orders, settlement and payout read
# ports at scrape time, across every app_id. A failed read fails the scrape (target down), it is
# never exported as 0.
# Granularity: the common 5m.
# Auto-payout daily cap (B1-01zzp; 规划/02 §13 资金类「自动到账日合计触顶」; BR-WDR-30 ⑨): the worker
# exports today's automatic total and the cap per app_id; both rules divide them and alert on
# reaching 80 % and 100 % (>=). The cap is the one B2-11c executes with (payout's reading, injected
# by entry.ts): an app_id with no cap row or a malformed one carries B2-11c's default (D10-393 (c)).
# The log alerts config_change_alert, sms_daily_budget_alert and device_hash_hot_alert are not in
# the fund list of 规划/02 §13, so they get no rule here (D10-393 (d)).
# TODO(规划/11 §2.3): W6 ratio and repeated W6 (BR-WDR-24) — blocked on B2-06a.
# TODO(规划/11 §2.3): corporate Alipay balance watermark W < 1.5P (BR-WDR-18) — blocked on B2-06fz.
groups:
  - name: couli-fund-orders
    rules:
      - alert: CouliOrderStatusUnmapped
        expr: 'couli_order_sync_pending_open{reason="UNMAPPED_STATUS"} > 0'
        for: '5m'
        labels:
          severity: critical
          fund: 'true'
        annotations:
          summary: 'Platform order status codes outside the status map are waiting for a person'
          description: 'Open order_sync_pending rows with reason UNMAPPED_STATUS (BR-FUND-02): the code was neither dropped nor guessed; add it to the map or resolve the rows.'
  - name: couli-fund-settlement
    rules:
      - alert: CouliSettleBillJobFailed
        expr: 'couli_settle_bill_jobs_failed > 0'
        for: '5m'
        labels:
          severity: critical
          fund: 'true'
        annotations:
          summary: 'Monthly bill generation failed'
          description: 'settle_jobs rows with job bill in status failed (BR-FUND-04); the bill of that platform and month needs a rerun.'
      - alert: CouliSettleBatchPartial
        expr: 'couli_settle_batches_partial > 0'
        for: '5m'
        labels:
          severity: critical
          fund: 'true'
        annotations:
          summary: 'A settlement batch finished PARTIAL'
          description: 'settle_batches rows in status PARTIAL (BR-FUND-04): some orders of the batch were not credited.'
      - alert: CouliBeneficiaryHeldOver30Days
        expr: 'couli_beneficiary_held_over_30d > 0'
        for: '5m'
        labels:
          severity: warning
          fund: 'true'
        annotations:
          summary: 'Beneficiary shares held for 30 days without a risk decision'
          description: 'Shares whose latest event is held, 30 x 24 hours after their first held event (BR-CALC-13 FUND-17). A person decides; the share stays held, nothing is credited or forfeited automatically.'
  - name: couli-fund-payout
    rules:
      - alert: CouliWithdrawalResultUnknown
        expr: 'couli_withdrawals_paying_needs_manual > 0'
        for: '5m'
        labels:
          severity: critical
          fund: 'true'
        annotations:
          summary: 'Withdrawals in PAYING with an unknown result need a person'
          description: 'PAYING withdrawals set to needs_manual (BR-WDR-14, BR-WDR-24): only query the channel, never pay again.'
      - alert: CouliAutoPayoutDailyNearCap
        expr: 'couli_auto_payout_daily_total_fen / couli_auto_payout_daily_cap_fen >= 0.8'
        for: '5m'
        labels:
          severity: warning
          fund: 'true'
        annotations:
          summary: 'Automatic payouts today reached 80% of the platform daily cap'
          description: 'Sum of amount_fen of auto-reviewed withdrawals (not REJECTED or FAILED) reviewed in the current +08:00 day reached 80% of withdraw.auto_payout.platform_daily_max_fen (BR-WDR-30 ⑨, BR-WDR-24); finance should check.'
      - alert: CouliAutoPayoutDailyCapReached
        expr: 'couli_auto_payout_daily_total_fen / couli_auto_payout_daily_cap_fen >= 1'
        for: '5m'
        labels:
          severity: critical
          fund: 'true'
        annotations:
          summary: 'Automatic payouts today reached the platform daily cap'
          description: 'The automatic total of the current +08:00 day reached withdraw.auto_payout.platform_daily_max_fen (BR-WDR-30 ⑨).'
