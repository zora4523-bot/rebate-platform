# 错误码表（契约唯一来源，CT-01）。
# 码值、含义、客户端动作、可重试照 规划/08_业务规则/13_命名与编码对照.md §13.11 转写（唯一分配表）；
# data 字段形状照 规划/04 §7。两处不一致时以 §13.11 为准，本文件随之改。
# 本表没有的码视为未分配，不得实现；废弃码不回收、不复用。文案不在这里：客户端取字典
# error.<code>（带 data.reason 的取 error.<code>.<reason>，未命中回落 error.<code>，BR-TEXT-14）。
#
# 字段：
#   code        5 位整数码值
#   http        HTTP 状态码。§13.11 与 04 只规定了 30803、30804 为 409，其余按码段由契约任务自定：
#               鉴权 401 / 403，参数 400，并发 409，业务 422（不存在类 404），限流 429，服务端 5xx。
#               客户端只按 code 处理，不按 HTTP 状态分支。
#   meaning     含义（§13.11「含义」列）
#   action      客户端动作（§13.11「客户端动作」列，去掉文案引用）
#   retry       §13.11「可重试」列原文
#   retry_kind  never（原样重发仍失败）/ after_action（完成前置动作后重放）/ later（等待后再发）/
#               immediate（可立即自动重试，遵守退避）/ not_applicable（「—」）；不带 data.reason 时适用
#   retry_kind_by_reason  §13.11 按 data.reason 区分可重试时，各 reason 的 retry_kind（优先于 retry_kind）
#   data        data 里的字段：字段名 → 取值列表；~ 表示取值不在本表枚举（见来源条目）
#   headers     响应头
#   sources     来源条目（§13.11「来源条目」列）
#   phase       P1 表示 MVP 不返回
#   deprecated  true = 废弃，服务端不再返回；客户端收到按表外 3xxxx 处理
version: 1
