    action: 淘礼金按钮置灰，给普通购买入口
    retry: 否
    retry_kind: never
    sources: [BR-PRICE-14]
  - code: 30603
    http: 422
    meaning: 活动未开始或已结束
    action: 仅提示
    retry: 否
    retry_kind: never
    sources: [规划/04 §7]
  - code: 30604
    http: 422
    meaning: 不满足领取条件
    action: 仅提示
    retry: 否
    retry_kind: never
    sources: [规划/04 §7]
  - code: 30701
    http: 404
    meaning: 页面或内容不存在
    action: 显示空态
    retry: 否
    retry_kind: never
    sources: [规划/04 §7]
  - code: 30801
    http: 422
    meaning: 当前已达到目标价
    action: 仅提示
    retry: 否
    retry_kind: never
    data:
      reason: [watch_target_already_met]
    sources: [BR-WATCH-04]
    phase: P1
  - code: 30802
    http: 422
    meaning: 提醒数量已达上限
    action: 列表显示已设数量，引导删除旧提醒
    retry: 删除旧提醒或到期后
    retry_kind: after_action
    data:
      reason: [watch_limit_exceeded]
    sources: [BR-WATCH-17]
    phase: P1
  - code: 30803
    http: 409
    meaning: 同商品已有提醒
    action: 跳到已有提醒（修改目标价）
    retry: 否
    retry_kind: never
    data:
      reason: [watch_duplicate]
      watch_id: ~
    sources: [BR-WATCH-02]
    phase: P1
  - code: 30804
    http: 409
    meaning: 同商品有可续期的过期提醒
    action: 跳到已有提醒（续期）
    retry: 否
    retry_kind: never
    data:
      reason: [watch_expired_renewable]
      watch_id: ~
    sources: [BR-WATCH-02, BR-WATCH-10]
    phase: P1
  - code: 30805
    http: 422
    meaning: 暂时无法获取价格（不建 watch 行）
    action: 仅提示，不建提醒
    retry: 稍后
    retry_kind: later
    data:
      reason: [watch_quote_unavailable]
    sources: [BR-WATCH-07, BR-WATCH-10]
    phase: P1
  - code: 30806
    http: 422
    meaning: 该平台提醒暂停服务
    action: 仅提示
    retry: 否
    retry_kind: never
    data:
      reason: [watch_platform_disabled]
    sources: [BR-WATCH-27]
    phase: P1
  - code: 40901
    http: 409
    meaning: 同一请求正在处理
    action: 保持加载态，稍后查询结果
    retry: 稍后
    retry_kind: later
    sources: [BR-ID-01, BR-ID-08, BR-WDR-03, BR-WDR-07]
  - code: 42901
    http: 429
    meaning: 请求过于频繁
    action: 按 Retry-After 禁用按钮，缺省 5 秒
    retry: 稍后
    retry_kind: later
    headers: [Retry-After]
    sources: [BR-TEXT-14, BR-ID-05, BR-INV-02, BR-AI-23]
  - code: 44001
    http: 403
    meaning: 风控拦截（号段或手机号黑名单、设备或 IP 注册上限、封禁用户的受限操作）
    action: 给申诉入口；文案取字典 risk_msg.<code>，未命中回落 error.44001
    retry: 否
    retry_kind: never
    data:
      risk_msg_code: ~
    sources: [BR-TEXT-14, BR-ID-05, BR-ID-06, BR-ID-31, BR-ID-32]
  - code: 44002
    http: 403
    meaning: 设备环境异常
    action: 仅提示
    retry: 否
    retry_kind: never
    sources: [BR-ID-01]
  - code: 44003
    http: 403
    meaning: 需要人机验证（是否启用待决策，08 §13.3）
    action: 拉起人机验证组件，通过后带验证凭证重放
    retry: 验证后
    retry_kind: after_action
    sources: [BR-ID-05, BR-ID-32]
  - code: 50001
    http: 500
    meaning: 服务端错误
    action: 通用错误态 + trace_id 后 6 位
    retry: 是
    retry_kind: immediate
    sources: [BR-TEXT-14, BR-INV-06]
  - code: 50301
    http: 503
    meaning: 平台维护或熔断，或平台未开放
    action: maintenance 弹 Toast、购买按钮禁用；not_launched 购买按钮禁用、不弹 Toast；无 reason 按 maintenance
    retry: maintenance：稍后；not_launched：否
    retry_kind: later
    retry_kind_by_reason:
      maintenance: later
      not_launched: never
    data:
      platform: ~
      reason: [maintenance, not_launched]
    sources: [BR-TEXT-14, BR-PRICE-13, BR-PROD-05, BR-PROD-10]
  - code: 50302
    http: 503
    meaning: AI 暂不可用（只在服务端按关键词无模型出卡也失败时返回）
    action: 跳搜索
    retry: 稍后
    retry_kind: later
    data:
      fallback: ~
    sources: [BR-TEXT-14, BR-AI-14]
  - code: 50303
    http: 503
    meaning: 暂时无法确认价格或生成链接（点击复核失败且无缓存，或取价成功但转链失败）
    action: 不外跳返利链接；给重试主按钮与无返利购买次按钮（BR-PRICE-08）
    retry: 稍后
    retry_kind: later
    sources: [BR-PRICE-08, BR-PRICE-13]
  - code: 50304
    http: 503
    meaning: 某平台搜索暂不可用（联盟超时、限流或熔断且无可用搜索缓存）
    action: 搜索页显示空态与重试按钮；Agent 改查其他平台
    retry: 稍后
    retry_kind: later
    data:
      platform: ~
    sources: [BR-PROD-07, BR-PRICE-11, BR-TEXT-14]
  - code: 50401
    http: 504
    meaning: 依赖超时
    action: 通用错误态 + trace_id 后 6 位
    retry: 是
    retry_kind: immediate
    sources: [BR-PROD-05, BR-ID-25]
