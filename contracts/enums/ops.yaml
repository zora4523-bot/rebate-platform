# 消息、等级、Agent 与提醒（规划/04 §2.5、§8.2、§8.3；08 §13.2、§13.6）。
# 客服工单的 ticket_type、ticket_status 于 2026-10-04 随客服工单取消作废，编码不再使用、不改作他用（04 §2.5）。
enums:
  notify_template_code:
    source: 规划/04 §2.5；BR-TEXT-09、BR-TEXT-20
    description: 消息模板编码；UNION_AUTH_EXPIRING、UNION_AUTH_EXPIRED 只发站长手机号，不属于用户通知分类
    values:
      ORDER_TRACKED: 订单已跟单
      ORDER_INVALID: 订单失效
      CREDITED: 月结批次入账（按受益人汇总）
      CLAWBACK: 扣回
      WD_SUCCESS: 提现成功
      WD_REJECTED: 提现驳回
      WD_FAILED: 提现失败
      WD_OVERDUE: 提现审核超时
      CLAIM_RESULT: 找回结果
      RISK_STATE_CHANGED: 风控状态变化（只发站内信）
      APPEAL_RESULT: 申诉结果（只发站内信）
      DELETION_PROGRESS: 注销进度（只发站内信）
      BALANCE_ADJUSTED: 人工调账调减（只发站内信）
      SMS_CODE: 短信验证码
      UNION_AUTH_EXPIRING: 站长授权即将到期（短信）
      UNION_AUTH_EXPIRED: 站长授权已过期（短信）
  notify_category:
    source: 规划/04 §2.5；拍板第二批 OPS-16；BR-WATCH-19
    description: 用户通知分类；交易与提现模板都归 service，MVP 只开放 service 开关，subscription、marketing 预埋不展示（待负责人确认）
    values:
      service: 服务类
      subscription: 订阅类（预埋）
      marketing: 营销类（预埋）
  user_level:
    source: 规划/04 §2.5
    description: 分销等级，晋升只看本人推广订单；用户端不展示（拍板第二批 OPS-20）
    values:
      L1: 一级
      L2: 二级
      L3: 三级
  agent_intent:
    source: 规划/04 §2.5
    values:
      find_by_link: 按链接找货
      search: 搜索
      refine: 追加条件
      order_query: 查订单
      rule_qa: 规则问答
      handoff: 转人工
      clarify: 澄清
      out_of_scope: 范围外
      page_guide: 页面引导（不是工具，输出带 guide_route；BR-AI-01 细则「页面引导」，D31）
      earnings_query: 查收益（由 get_my_earnings 工具名推出；BR-AI-01 细则「收益查询」，D32）
  agent_card_type:
    source: 规划/04 §8.3；08 §13.2
    description: Agent 卡片类型；watch_confirm、watch_list 为 P1，MVP 不注册，不列入
    values:
      product_list: 商品列表
      rebate_quote: 查返利
      order_status: 订单状态
      claim_draft: 找回草稿
      handoff: 转人工
      auth_required: 需要授权
      notice: 提示
      rule_ref: 规则引用
      page_guide: 页面引导（D31）
      earnings_summary: 收益摘要（只读，D32）
  page_guide_reject_reason:
    source: 规划/04 §3.2
    description: agent_runs.page_guide_reject_reason，页面引导意图不出卡的原因（BR-AI-01 细则「页面引导」）
    values:
      not_allowed: 不在 agent.page_guide.routes 内（含其他路由名、URL、空值）
      extra_fields: 带了 agent_intent、guide_route 以外的字段
      disabled: 开关 agent.page_guide.enabled 为 off
      untrusted_input: 本条消息含不可信文本或链接
      params_requested: 用户要求带参数打开
  agent_finish_reason:
    source: 规划/04 §8.2；BR-AI-01、BR-AI-14、BR-AI-16、BR-AI-18
    description: SSE done 事件的 finish_reason
    values:
      stop: 正常结束
      cancelled: 已取消
      limit: 达到上限
      budget: 预算用完
      error: 出错
      auth_required: 需要授权
      safety: 安全拦截
      fallback: 无模型降级出卡
      timeout: 单轮时限到
  watch_status:
    source: 规划/04 §2.5；BR-WATCH-10（P1）
    values:
      active: 生效中
      paused: 已暂停
      unavailable: 不可用
      expired: 已过期
      cancelled: 已取消
  watch_event_status:
    source: 规划/04 §2.5；BR-WATCH-11（P1）
    values:
      pending: 待发送
      suppressed: 已抑制
      sent: 已发送
