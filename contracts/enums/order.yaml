# 订单、维权与找回（规划/04 §2.3、§2.5；08 §13.2、§13.6）。订单采用双状态（BR-FUND-01，C-01 默认）。
enums:
  platform_status:
    source: 规划/04 §2.3；BR-FUND-02
    description: 联盟订单状态，唯一写者 order-sync；SETTLED 只表示联盟结算，不表示回款或我方入账
    values:
      DEPOSIT_PAID: 预售已付定金
      PAID: 已付款
      RECEIVED: 已确认收货
      SETTLED: 联盟已结算
      INVALID: 已失效
  rebate_status:
    source: 规划/04 §2.3；BR-FUND-01
    description: 返利状态，唯一写者 settlement；VOID、CLAWED_BACK 为终态——自动事件不得离开，只有人工恢复 R12、R13 可以离开，R3b 在 VOID 上只写归属（BR-FUND-01）
    values:
      UNATTRIBUTED: 未归因（不对用户展示）
      ESTIMATED: 预估
      WAITING: 等待月结入账
      CREDITED: 已入账
      VOID: 已作废（终态）
      CLAWED_BACK: 已扣回（终态）
  display_status:
    source: 规划/04 §2.3；BR-FUND-17
    description: 用户可见状态，接口按 BR-FUND-17 派生表派生、不入库；文案取字典 order_status.<值>（BR-TEXT-02）；WAITING_SETTLE 在月结口径下停用，不进契约
    values:
      PAID: 见 BR-FUND-17 派生表
      DEPOSIT_PAID: 见 BR-FUND-17 派生表
      WAITING: 见 BR-FUND-17 派生表
      CREDITING: 见 BR-FUND-17 派生表
      REVIEWING: 见 BR-FUND-17 派生表
      RIGHTS_PENDING: 见 BR-FUND-17 派生表
      CREDITED: 见 BR-FUND-17 派生表
      CREDITED_PART_CLAWED: 见 BR-FUND-17 派生表
      NO_REBATE: 见 BR-FUND-17 派生表
      INVALID: 见 BR-FUND-17 派生表
      CLAWED_BACK: 见 BR-FUND-17 派生表
  order_hold_reason:
    source: 规划/04 §2.3；08 §13.6；BR-FUND-06、BR-FUND-02
    description: orders.hold_reason，不改 rebate_status
    values:
      RISK: 风控暂停入账
      CS: 客服暂停入账
      UNMAPPED_STATUS: 映射表之外的平台状态码出现时由系统置（BR-FUND-02）
  order_status_group:
    source: 规划/04 §6.4；BR-TEXT-02 细则「订单列表的状态分组与查找」
    description: GET /v1/orders 的 status_group；各组包含哪些 display_status 只在 BR-TEXT-02 细则
    values:
      all: 全部（含未知编码）
      estimating: 预估中
      credited: 已结算
      no_rebate: 无返利
  order_timeline_node:
    source: 规划/04 §6.4；BR-TEXT-02 细则「时间线」
    description: 订单详情时间线节点（编码代理自定；04 只点名 deposit_paid，final_paid 与 08 12_TEXT 文案表的键 order_timeline.final_paid 对齐（BR-TEXT-02 细则「时间线」））；未发生的节点 at 为空
    values:
      deposit_paid: 付定金（只有预售单，在最前面；文案键 order_timeline.deposit_paid）
      paid: 付款（非预售单）
      final_paid: 付尾款（预售单用它代替 paid；文案键 order_timeline.final_paid）
      received: 收货
      credit_expected: 预计结算月份（period）
      credited: 已结算
      invalid: 失效
      clawed_back: 扣回
      part_clawed_back: 部分扣回
  order_reason:
    source: 规划/04 §2.3；BR-TEXT-05；08 §13.2
    description: 订单原因码；NOT_TRACKED、EXPIRED_CLICK、OTHER_TLJ、RELATION_INVALID 不写入 orders.reason。CANCELLED 待 09 实测，启用前不写入。rebate_status=CLAWED_BACK 同样写 orders.reason（迁移 R8 同事务写，取值按 BR-FUND-08 细则的映射表）
    values:
      REFUND: 退款
      RIGHTS: 维权
      PUNISH: 处罚
      PRESALE_UNPAID: 预售尾款未付
      COMMISSION_ZERO: 佣金为 0
      OTHER: 其他
      BLACKLIST: 黑名单
      PART_REFUND: 部分退款（差额类）
      PRICE_COMPARE: 比价（差额类）
      PRICE_PROTECT: 价保（差额类）
      SETTLE_DIFF: 结算差异（差额类）
      NOT_TRACKED: 未跟单
      EXPIRED_CLICK: 点击已过期
      OTHER_TLJ: 他人淘礼金
      RELATION_INVALID: 渠道关系失效
      CANCELLED: 订单取消（待定，启用前不写入）
  diff_reason:
    source: 规划/04 §2.3；BR-CALC-14；08 §13.2（settle_diff_reason）
    description: orders.diff_reason_code，差额原因只用这 4 个
    values:
      PART_REFUND: 部分退款
      PRICE_COMPARE: 比价
      PRICE_PROTECT: 价保
      SETTLE_DIFF: 结算差异
  order_rights_status:
    source: 规划/04 §2.3；BR-FUND-06
    description: order_rights.status；PROCESSING、WAIT_COMMISSION 使 rights_pending=true
    values:
      PROCESSING: 处理中
      WAIT_COMMISSION: 待扣佣
      SUCCEEDED: 维权成功
      FAILED: 维权失败
  order_rights_type:
    source: 规划/04 §2.3；BR-FUND-02、BR-FUND-06
    description: order_rights.type；处罚类平台码与处罚接口写 PUNISH；淘宝维权码到 order_rights.status 的映射待 CAP-TB-08
    values:
      RIGHTS: 维权
      PUNISH: 处罚
      INVALID_AFTER_SETTLE: 结算后失效
      REFUND_AFTER_SETTLE: 结算后退款
  claim_status:
    source: 规划/04 §2.5；BR-ATTR-16、BR-ATTR-18
    values:
      submitted: 已提交
      auto_matched: 全部子项 strong，待客服确认
      manual_review: 人工审核
      approved: 已通过
      rejected: 已驳回
      cancelled: 同步已自动归因给申请人
  claim_evidence_level:
    source: 规划/04 §2.3；BR-ATTR-16
    values:
      strong: 强
      weak: 弱
      none: 无
  claim_item_decision:
    source: 规划/04 §2.3；BR-ATTR-18
    description: claim_items.decision，待审为 null
    values:
      approved: 通过
      rejected: 驳回
      cancelled: 同步已自动归因给申请人
  claim_reject_reason:
    source: 规划/04 §2.3；BR-ATTR-18
    description: 前 6 个客服可选，NOT_IN_POOL、ORDER_INVALID 系统专用
    values:
      NO_EVIDENCE: 缺少证据
      EXPIRED_CLICK: 点击已过期
      NOT_TRACKED: 未跟单
      OTHER_TLJ: 他人淘礼金
      FRAUD: 欺诈
      OTHER: 其他
      NOT_IN_POOL: 不在未归因池（系统专用）
      ORDER_INVALID: 订单已失效（系统专用）
