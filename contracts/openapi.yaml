  /v1/share-pages/{link_id}/tpwd:
    post:
      operationId: getShareTpwd
      tags:
        - trade
      summary: Token of the share page for the copy-token button
      description: |
        Called when the user taps the copy-token button on the share page: the body carries the
        tpwd_ticket of GET /v1/share-pages/{link_id}; returns the token (BR-ATTR-10 细则). The
        ticket is bound to the link_id, valid 600 s, at most 3 exchanges. An invalid, expired or
        used-up ticket, or a request whose User-Agent is the WeChat in-app browser or missing →
        20001 with data.fields=[ticket], no token. Rate limited per IP × link_id
        (share.tpwd_rate_per_min) → 42901 with Retry-After. The response carries Cache-Control:
        no-store. Not signed. Version gate: 不判定：非三端请求 (written false, BR-ID-01 细则).
      x-auth: none
      x-signed: false
      x-idempotent: false
      x-min-version-gate: false
      x-implementation: planned
      x-error-codes:
        - 20001
        - 42901
      security: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/Build'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/LinkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShareTpwdRequest'
            example:
              ticket: placeholder-ticket-01
      responses:
        '200':
          description: The token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareTpwdResponse'
              example:
                code: 0
                msg: ''
                data:
                  tpwd: placeholder-tpwd
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
        '429':
          $ref: '#/components/responses/NoStoreTooManyRequests'
        4XX:
          $ref: '#/components/responses/NoStoreClientError'
        5XX:
          $ref: '#/components/responses/NoStoreServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>`; ES256 JWT with uid, app_id, sid, device_id, scp,
        valid 2 hours (BR-ID-07). After login app_id is taken from the token only.
  parameters:
    AppId:
      name: X-App-Id
      in: header
      required: true
      description: App (brand) the request belongs to; before login it must match the app_id the device was registered with (10403, BR-ID-07).
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^[a-z0-9_]+$'
    Platform:
      name: X-Platform
      in: header
      required: true
      description: Client platform (enum client_platform, 03 §4.2).
      schema:
        $ref: '#/components/schemas/ClientPlatformCode'
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: SemVer, the same number on all three apps (拍板第二批 TECH-07).
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        maxLength: 32
    Build:
      name: X-Build
      in: header
      required: false
      description: Build number of the client.
      schema:
        type: string
        maxLength: 32
    Channel:
      name: X-Channel
      in: header
      required: false
      description: Install channel of the app package (enum install_channel); absent for H5.
      schema:
        $ref: '#/components/schemas/InstallChannelCode'
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Client-generated trace id, echoed as `trace_id` when well-formed.
      schema:
        $ref: '#/components/schemas/TraceId'
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: device_id issued by POST /v1/devices; anything else is 10402 (BR-ID-09).
      schema:
        $ref: '#/components/schemas/Id'
    OptionalDeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: device_id issued by POST /v1/devices, when the device is registered.
      schema:
        $ref: '#/components/schemas/Id'
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix seconds; |server time − ts| ≤ 300 s (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9]{10}$'
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: 32 lowercase hex characters; (device_id, nonce) unique within 600 s (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    Sign:
      name: X-Sign
      in: header
      required: true
      description: |
        lowercase_hex(HMAC-SHA256(install_secret, METHOD + "\n" + path with raw query + "\n" + ts
        + "\n" + nonce + "\n" + lowercase_hex(sha256(raw body)))) (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      description: |
        step_up_token from POST /v1/auth/step-up for the operation's x-step-up action (04 §5). Missing,
        expired or for another action → 10003 (not 20001; that is why the header is optional).
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TipKeyPath:
      name: tip_key
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TipKey'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on operations marked I (04 §6); missing → 20001. Same key while processing →
        40901; same key with another body → 20901; a retry after a timeout reuses the key and gets
        the first result (拍板第二批 TRADE-22). On the x-step-up operations a key abandoned through
        POST /v1/idempotency-keys/abandon → 20903, without comparing the body (04 §5「幂等」).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    UnionPlatform:
      name: platform
      in: path
      required: true
      description: Platform code (enum platform).
      schema:
        $ref: '#/components/schemas/PlatformCode'
    PendingTrackLinkId:
      name: link_id
      in: path
      required: true
      description: |
        link_id of the pending-track card. Unlike other link operations an unknown link, or one that
        does not own the attempt_id in the body, is 20001 with data.fields=[attempt_id] (no 30144).
      schema:
        $ref: '#/components/schemas/Id'
    LinkId:
      name: link_id
      in: path
      required: true
      description: link_id from a card; unknown or of another app → 30144.
      schema:
        $ref: '#/components/schemas/Id'
    ProductKey:
      name: product_key
      in: path
      required: true
      description: Opaque product key, URL-encoded by the client (BR-PROD-02).
      schema:
        $ref: '#/components/schemas/ProductKey'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; absent for the first page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, at most 50 (04 §5).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
  responses:
    NoStoreClientError:
      description: Same as ClientError, with Cache-Control no-store (share pages, BR-ATTR-10 细则).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
