        category) sources; closing and content-version rules only in BR-TEXT-13 细则「首页公告条的
        关闭与内容版本」 (04 §6.2).
      additionalProperties: false
      not:
        type: object
        additionalProperties: true
        description: A notice that cannot be closed must have end_at (BR-TEXT-13 细则「生效区间」).
        properties:
          closable:
            const: false
          end_at:
            type: 'null'
        required:
          - closable
          - end_at
      required:
