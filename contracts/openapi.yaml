    OrderScope:
      type: string
      enum:
        - self
        - share
    OrderStatusGroup:
      type: string
      description: Status group of the order list (enum order_status_group; members in BR-TEXT-02 细则).
      enum:
        - all
        - estimating
        - credited
        - no_rebate
    OrderDisplayStatus:
      type: string
      description: User-visible order status (enum display_status; BR-FUND-17); unknown codes map to UNKNOWN.
      enum:
        - PAID
        - DEPOSIT_PAID
        - WAITING
        - CREDITING
        - REVIEWING
        - RIGHTS_PENDING
        - CREDITED
        - CREDITED_PART_CLAWED
        - NO_REBATE
        - INVALID
        - CLAWED_BACK
    OrderReasonCode:
      type: string
      description: Order reason code (enum order_reason); texts and actions come from /v1/dict.
      enum:
        - REFUND
        - RIGHTS
        - PUNISH
        - PRESALE_UNPAID
        - COMMISSION_ZERO
        - OTHER
        - BLACKLIST
        - PART_REFUND
        - PRICE_COMPARE
        - PRICE_PROTECT
        - SETTLE_DIFF
        - NOT_TRACKED
        - EXPIRED_CLICK
        - OTHER_TLJ
        - RELATION_INVALID
        - CANCELLED
    OrderTimelineNode:
      type: string
      description: |
        Timeline node of the order detail (enum order_timeline_node; BR-TEXT-02 细则「时间线」):
        a pre-sale order starts with deposit_paid and has final_paid instead of paid; invalid /
        clawed_back / part_clawed_back only when the order reached that state.
      enum:
        - deposit_paid
        - paid
        - final_paid
        - received
        - credit_expected
        - credited
        - invalid
        - clawed_back
        - part_clawed_back
    OrderSummary:
      type: object
      description: |
        One row of GET /v1/orders. Exactly one of order_no (my own purchase) and masked_order_no (a
        shared order); the oneOf branches declare the property they require (strict Ajv2020). A
        shared order with is_other_product=true has title and image_url null and never the full
        order_no (BR-TEXT-02 细则
        「订单的检索范围与分享单的投影」). OrderDetail repeats these fields (kept as two closed
        objects; redocly's example check closes every allOf member, so no shared allOf base).
      additionalProperties: false
      required:
        - order_id
        - platform
        - title
        - image_url
        - pay_amount_fen
        - quantity
        - display_status
        - reason
        - est_rebate_fen
        - paid_at
        - is_other_product
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
        platform:
          $ref: '#/components/schemas/PlatformCode'
        title:
          type:
            - string
            - 'null'
        image_url:
          type:
            - string
            - 'null'
          format: uri
        pay_amount_fen:
          $ref: '#/components/schemas/NullableFen'
        quantity:
          type: integer
          format: int32
          minimum: 1
        order_no:
          type: string
          minLength: 1
          description: Full platform order number (self-purchase only, copyable).
        masked_order_no:
          type: string
          minLength: 1
          description: Masked by the server (BR-TEXT-02 细则「订单号的显示」); shared orders never carry the full number.
        display_status:
          $ref: '#/components/schemas/OrderDisplayStatus'
        reason:
          anyOf:
            - $ref: '#/components/schemas/OrderReasonCode'
            - type: 'null'
        est_rebate_fen:
          $ref: '#/components/schemas/NullableFen'
        paid_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Payment time (the final payment of a pre-sale order); null for a pre-sale order still in
            DEPOSIT_PAID (BR-ATTR-25 keeps paid_at for the final payment).
        is_other_product:
          type: boolean
          description: A shared order whose bought product is not the shared one.
      not:
        type: object
        additionalProperties: true
        properties:
          is_other_product:
            const: true
        required:
          - is_other_product
        anyOf:
          - type: object
            properties:
              title:
                type: string
            required:
              - title
          - type: object
            properties:
              image_url:
                type: string
            required:
              - image_url
          - type: object
            properties:
              order_no:
                type: string
            required:
              - order_no
      oneOf:
        - type: object
          properties:
            order_no:
              type: string
          required:
            - order_no
        - type: object
          properties:
            masked_order_no:
              type: string
          required:
            - masked_order_no

