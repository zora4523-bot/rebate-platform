    AdminConfigItemVersion:
      type: object
      description: One stored version of a configuration item (config_item_versions).
      additionalProperties: false
      required:
        - version
        - value
        - updated_by
        - reason
        - created_at
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        value:
          $ref: '#/components/schemas/AdminConfigValue'
        updated_by:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Username of the admin who wrote the version; null = written by the system.
        reason:
          type:
            - string
            - 'null'
          maxLength: 200
        created_at:
          type: string
          format: date-time
    AdminConfigItemVersionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          description: Newest version first.
          items:
            $ref: '#/components/schemas/AdminConfigItemVersion'
        page:
          type: integer
          format: int32
          minimum: 1
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int32
          minimum: 0
    AdminConfigItemVersionPageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminConfigItemVersionPage'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminConfigItemUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - value
        - expected_version
      properties:
        value:
          $ref: '#/components/schemas/AdminConfigValue'
        expected_version:
          allOf:
            - $ref: '#/components/schemas/AdminConfigVersionNumber'
          description: The item's `version` as the console showed it; a mismatch is 20902.
        reason:
          $ref: '#/components/schemas/AdminConfigReason'
    AdminConfigItemBatchEntry:
      type: object
      additionalProperties: false
      required:
        - key
        - value
        - expected_version
      properties:
        key:
          $ref: '#/components/schemas/AdminConfigKey'
        value:
          $ref: '#/components/schemas/AdminConfigValue'
        expected_version:
          allOf:
            - $ref: '#/components/schemas/AdminConfigVersionNumber'
          description: The item's `version` as the console showed it; any mismatch is 20902 for the whole batch.
    AdminConfigItemBatchRequest:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Keys of one permission point, each at most once.
          minItems: 1
          maxItems: 200
          items:
            $ref: '#/components/schemas/AdminConfigItemBatchEntry'
        reason:
          $ref: '#/components/schemas/AdminConfigReason'
    AdminConfigItemRollbackRequest:
      type: object
      additionalProperties: false
      required:
        - to_version
        - expected_version
      properties:
        to_version:
          type: integer
          format: int32
          minimum: 1
          description: The stored version whose value becomes the new current value; must be older than the current one.
        expected_version:
          type: integer
          format: int32
          minimum: 1
          description: The item's current `version` as the console showed it; a mismatch is 20902.
        reason:
          $ref: '#/components/schemas/AdminConfigReason'
    AdminUserRiskStateCode:
      type: string
      description: Risk state of a user (enum risk_state; BR-ID-31, BR-ID-36).
      enum:
        - normal
        - frozen
        - appealing
        - banned
    AdminRiskReasonCategory:
      type: string
      description: |
        User-visible reason category of a ban or freeze (enum risk_reason_category; BR-TEXT-23 细则
        「原因类别」, user text from the dictionary risk_reason.<category>).
      enum:
        - malicious_rights
        - fraud_invite
        - abnormal_trade
        - account_security
        - other
    AdminUserLevel:
      type: string
      description: Distribution level of the user (enum user_level; not shown to the user, OPS-20).
      enum:
        - L1
        - L2
        - L3
    AdminUnionBindingStatus:
      type: string
      description: Status of a union binding (enum union_binding_status; BR-ID-19, BR-ID-20).
      enum:
        - unbound
        - pending_auth
        - active
        - invalid
        - released
        - blocked
    AdminUnionBindingBlockedReason:
      type: string
      description: Why a binding is blocked (enum union_binding_blocked_reason; BR-ID-20).
      enum:
        - ban
        - admin_disable
        - deletion
    AdminRowVersion:
      type: integer
      format: int32
      minimum: 0
      description: |
        row_version of the row as read (users' risk state, a union binding); plus 1 on every
        change. The CAS value `expected_row_version` of the writes.
    AdminUserReason:
      type: string
      minLength: 1
      maxLength: 200
      description: Required free-text reason, kept in the audit record.
    AdminMaskedPhone:
      type:
        - string
        - 'null'
      maxLength: 32
      description: Phone number masked 3 + 4 (`138****5678`, BR-ID-33); null when no phone is bound.
    AdminUserListItem:
      type: object
      description: A user row of the list; non-sensitive fields only (04 §11.1 user.list).
      additionalProperties: false
      required:
        - user_id
        - nickname
        - phone_masked
        - level
        - risk_state
        - created_at
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
        phone_masked:
          $ref: '#/components/schemas/AdminMaskedPhone'
        level:
          $ref: '#/components/schemas/AdminUserLevel'
        risk_state:
          $ref: '#/components/schemas/AdminUserRiskStateCode'
        created_at:
          type: string
          format: date-time
          description: Registration time.
    AdminUserPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserListItem'
        page:
          type: integer
          format: int32
          minimum: 1
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int32
          minimum: 0
    AdminUserPageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminUserPage'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminUserRiskState:
      type: object
      description: |
        The user's user_risk_state row as the console sees it (no rule details). A user without a
        row reads as state normal, nulls and row_version 0.
      additionalProperties: false
      required:
        - state
        - reason_category
        - reason
        - frozen_until
        - changed_by
        - changed_at
        - row_version
      properties:
        state:
          $ref: '#/components/schemas/AdminUserRiskStateCode'
        reason_category:
          anyOf:
            - $ref: '#/components/schemas/AdminRiskReasonCategory'
            - type: 'null'
        reason:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Internal reason of the last change (console only, never shown to the user).
        frozen_until:
          type:
            - string
            - 'null'
          format: date-time
          description: End of a freeze; null for a freeze without end and for every other state.
        changed_by:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Admin username or `system` of the last change; null when there is no row.
        changed_at:
          type:
            - string
            - 'null'
          format: date-time
        row_version:
          $ref: '#/components/schemas/AdminRowVersion'
    AdminUserRiskStateResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminUserRiskState'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminUserUnionBinding:
      type: object
      description: |
        A union binding row of the user (union_bindings; BR-ID-19, BR-ID-20), without relation_id or
        other union identifiers.
      additionalProperties: false
      required:
        - platform
        - status
        - blocked_reason
        - bound_at
        - released_at
        - cooldown_until
        - reason
        - row_version
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        status:
          $ref: '#/components/schemas/AdminUnionBindingStatus'
        blocked_reason:
          anyOf:
            - $ref: '#/components/schemas/AdminUnionBindingBlockedReason'
            - type: 'null'
          description: Set when status is blocked, null otherwise.
        bound_at:
          type:
            - string
            - 'null'
          format: date-time
        released_at:
          type:
            - string
            - 'null'
          format: date-time
        cooldown_until:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the cooldown after a release (BR-ID-19); null unless released.
        reason:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Reason of the last console change (reset, disable, enable); null when none.
        row_version:
          $ref: '#/components/schemas/AdminRowVersion'
    AdminUserUnionBindingResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminUserUnionBinding'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminUserDetail:
      type: object
      description: |
        A user as the console sees it (04 §11.1): non-sensitive fields, the masked phone number,
        the risk state and the union bindings. No identity number, payout account or real name.
      additionalProperties: false
      required:
        - user_id
        - nickname
        - phone_masked
        - invite_code
        - inviter_user_id
        - level
        - register_method
        - registered_channel
        - created_at
        - risk
        - union_bindings
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
        phone_masked:
          $ref: '#/components/schemas/AdminMaskedPhone'
        invite_code:
          type: string
          minLength: 1
          maxLength: 32
        inviter_user_id:
          anyOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
          description: user_id of the current inviter (users.parent_id); null when none is bound.
        level:
          $ref: '#/components/schemas/AdminUserLevel'
        register_method:
          type: string
          minLength: 1
          maxLength: 32
          description: How the account was created (users.register_method), as stored.
        registered_channel:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Install channel at registration (users.registered_channel), as stored.
        created_at:
          type: string
          format: date-time
          description: Registration time.
        risk:
          $ref: '#/components/schemas/AdminUserRiskState'
        union_bindings:
          type: array
          description: One entry per platform the user has a binding row on.
          items:
            $ref: '#/components/schemas/AdminUserUnionBinding'
    AdminUserDetailResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminUserDetail'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminUserRevealField:
      type: string
      description: |
        The sensitive field to show in full. Only phone (permission point pii.reveal_phone) for
        now; the identity number and payout account (pii.reveal_identity) come later.
      enum:
        - phone
    AdminUserRevealRequest:
      type: object
      additionalProperties: false
      required:
        - field
        - reason
      properties:
        field:
          $ref: '#/components/schemas/AdminUserRevealField'
        reason:
          $ref: '#/components/schemas/AdminUserReason'
    AdminUserReveal:
      type: object
      additionalProperties: false
      required:
        - user_id
        - field
        - value
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        field:
          $ref: '#/components/schemas/AdminUserRevealField'
        value:
          type: string
          minLength: 1
          maxLength: 64
          description: The full value (for phone, the normalised 11-digit number).
    AdminUserRevealResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminUserReveal'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminUserRiskStateAction:
      type: string
      description: |
        ban and unban (permission point risk.ban), freeze and unfreeze (risk.freeze); 04 §11.2,
        BR-ID-31, BR-ID-36.
      enum:
        - ban
        - unban
        - freeze
        - unfreeze
    AdminUserRiskStateUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - reason
        - expected_row_version
      properties:
        action:
          $ref: '#/components/schemas/AdminUserRiskStateAction'
        reason_category:
          allOf:
            - $ref: '#/components/schemas/AdminRiskReasonCategory'
          description: Required for ban and freeze; not accepted for unban and unfreeze (20001).
        reason:
          $ref: '#/components/schemas/AdminUserReason'
        frozen_until:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Only for freeze: end of the freeze, later than the server's current time; null or
            absent = without end (BR-ID-36). Given with another action → 20001.
        expected_row_version:
          allOf:
            - $ref: '#/components/schemas/AdminRowVersion'
          description: risk.row_version as the console showed it (0 when the user has no row); a mismatch is 20902.
    AdminUserUnionBindingActionRequest:
      type: object
      additionalProperties: false
      required:
        - reason
        - expected_row_version
      properties:
        reason:
          $ref: '#/components/schemas/AdminUserReason'
        expected_row_version:
          allOf:
            - $ref: '#/components/schemas/AdminRowVersion'
          description: The binding's row_version as the console showed it; a mismatch is 20902.
    AgentSession:
      type: object
      description: An Agent conversation (agent_sessions; owner and expiry per BR-AI-20).
      additionalProperties: false
      required:
        - session_id
        - started_at
        - last_active_at
      properties:
        session_id:
          $ref: '#/components/schemas/Id'
        started_at:
          type: string
          format: date-time
        last_active_at:
          type: string
          format: date-time
          description: Time of the last accepted message; expiry counts from it (BR-AI-20).
    AgentSessionResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AgentSession'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AgentCurrentSessionData:
      type: object
      additionalProperties: false
      required:
        - session
      properties:
        session:
          anyOf:
            - $ref: '#/components/schemas/AgentSession'
            - type: 'null'
    AgentCurrentSessionResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AgentCurrentSessionData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AgentMessageRequest:
      type: object
      additionalProperties: false
      required:
        - client_msg_id
        - text
      properties:
        client_msg_id:
          type: string
          description: Generated by the client, unique in the session; a repeat returns the original run (BR-AI-23 ⑥).
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
        text:
          type: string
          minLength: 1
          description: |
            The message. Its length limit is step ⑤ of BR-AI-23 (20001, data.fields=[text]), checked
            after ①–④, so the schema sets no maxLength.
        context:
          $ref: '#/components/schemas/AgentMessageContext'
    AgentMessageContext:
      description: Entry context of 01 §4 情境入口, exactly one of product_key, order_id or text.
      oneOf:
        - $ref: '#/components/schemas/AgentContextProduct'
        - $ref: '#/components/schemas/AgentContextOrder'
        - $ref: '#/components/schemas/AgentContextText'
    AgentContextProduct:
      type: object
      additionalProperties: false
      required:
        - product_key
      properties:
        product_key:
          $ref: '#/components/schemas/ProductKey'
    AgentContextOrder:
      type: object
      additionalProperties: false
      required:
        - order_id
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
    AgentContextText:
      type: object
      additionalProperties: false
      required:
        - text
      properties:
        text:
          type: string
          description: Clipboard text, untrusted (BR-AI-05).
          minLength: 1
          maxLength: 2000
    AgentFinishReason:
      type: string
      description: finish_reason of the done frame (contracts/enums agent_finish_reason, 04 §8.2).
      enum:
        - stop
        - cancelled
        - limit
        - budget
        - error
        - auth_required
        - safety
        - fallback
        - timeout
    AgentHistoryCard:
      type: object
      description: |
        A card frame as it was sent, without seq (04 §6.5). data follows
        contracts/agent-stream.schema.json card_<type> (earnings_summary: earnings_summary_history
        only); an unknown type is shown as fallback_text (03 §7.4).
      additionalProperties: false
      required:
        - card_id
        - type
        - schema_version
        - data
        - fallback_text
      properties:
        card_id:
          type: string
          description: Card id inside the session (c1, c2…, BR-AI-05).
          pattern: '^c[1-9][0-9]*$'
        type:
          type: string
          description: Card type (contracts/enums agent_card_type); a newer type stays valid for an older client.
          minLength: 1
        schema_version:
          type: integer
          format: int32
          minimum: 1
        data:
          type: object
          description: Shape per type in contracts/agent-stream.schema.json (contracts/README.md 书写规则第 12 条).
          additionalProperties: true
        fallback_text:
          type: string
          minLength: 1
    AgentHistoryMessage:
      type: object
      description: One agent_messages row (04 §6.5 会话历史响应的形状).
      additionalProperties: false
      required:
        - message_id
        - role
        - created_at
        - text
        - cards
        - finish_reason
      properties:
        message_id:
          $ref: '#/components/schemas/Id'
        role:
          type: string
          description: agent_messages.role (04 §3.2).
          enum:
            - user
            - assistant
        created_at:
          type: string
          format: date-time
        text:
          type: string
          description: user, the text as sent; assistant, the text after OutputGuard ('' while nothing has been written).
        cards:
          type: array
          description: Always empty for user.
          items:
            $ref: '#/components/schemas/AgentHistoryCard'
        finish_reason:
          description: assistant once the run has ended; null for user and for a run still going.
          anyOf:
            - $ref: '#/components/schemas/AgentFinishReason'
            - type: 'null'
    AgentHistoryData:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - expired
      properties:
        items:
          type: array
          description: Oldest first within the page.
          items:
            $ref: '#/components/schemas/AgentHistoryMessage'
        next_cursor:
          description: Cursor of the earlier page; null when there are no earlier messages.
          type:
            - string
            - 'null'
        expired:
          type: boolean
          description: true when the session has expired; the history is then read-only (BR-AI-20).
    AgentHistoryResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AgentHistoryData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AgentFeedbackRequest:
      type: object
      additionalProperties: false
      required:
        - feedback
      properties:
        feedback:
          type: string
          description: agent_messages.feedback (04 §3.2); down marks a badcase (BR-AI-19).
          enum:
            - up
            - down
    AgentReportRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          description: Free text kept in agent_messages.report_reason; 08 has no reason set yet, so no enum.
          minLength: 1
          maxLength: 200
