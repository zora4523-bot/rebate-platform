            required:
              - title
          - type: object
            properties:
              image_url:
                type: string
            required:
              - image_url
          - type: object
            properties:
              order_no:
                type: string
            required:
              - order_no
          - type: object
            properties:
              product_key:
                type: string
            required:
              - product_key
      oneOf:
        - type: object
          properties:
            order_no:
              type: string
          required:
            - order_no
        - type: object
          properties:
            masked_order_no:
              type: string
          required:
            - masked_order_no

