          description: Jump plan and price re-check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenLinkResponse'
              examples:
                unchanged:
                  $ref: '#/components/examples/OpenLinkUnchanged'
                priceChanged:
                  $ref: '#/components/examples/OpenLinkPriceChanged'
                priceCompare:
                  $ref: '#/components/examples/OpenLinkPriceCompare'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
  /v1/links/convert:
    post:
      operationId: convertLink
      tags:
        - trade
      summary: Register and convert in one call (entries without a link_id)
      description: |
        Only for entries that have no link_id, such as the H5 bridge method
        `trade.convertAndOpen` (scene=h5): registers the link and then
        re-checks and converts exactly like open, returning `link_id` plus the open result
        (拍板第二批 TRADE-03). Pass `product_key` with the tapped card's `item_ref` (a missing
        item_ref is not an error, BR-PROD-11), or `url`. A url whose product key cannot be
        derived is 30131 and nothing is registered (BR-PROD-03). A missing or invalid `scene`
        is 20001 (BR-ATTR-08). Writes a link_log `convert` row (BR-ATTR-14).
        A request stopped by 30101, 30102 or 30111 and sent again after the user authorized is a
        new request with a new Idempotency-Key; the original key is only for retrying the same
        request (BR-ID-10 细则). 30101 / 30102 carry auth_url, state and auth_methods; 30111
        carries auth_jump.
      x-auth: login
      x-signed: true
      x-idempotent: true
      x-min-version-gate: true
      x-implementation: planned
      x-error-codes:
        - 30101
        - 30102
        - 30103
        - 30111
        - 30121
        - 30131
        - 30141
        - 30143
        - 30151
        - 30153
        - 50301
        - 50303
        - 10405
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppId'
        - $ref: '#/components/parameters/Platform'
        - $ref: '#/components/parameters/AppVersion'
        - $ref: '#/components/parameters/Build'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Sign'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertLinkRequest'
            example:
              platform: jd
              product_key: jd:i_100012043978
              item_ref: v1.Zm9vYmFyLmJhei5xdXg
              scene: h5
              spm: h5_activity.banner.1
              installed: unknown
      responses:
        '200':
          description: The registered link and its jump plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertLinkResponse'
              examples:
                ok:
                  $ref: '#/components/examples/ConvertLinkOk'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        4XX:
          $ref: '#/components/responses/ClientError'
        5XX:
          $ref: '#/components/responses/ServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>`; ES256 JWT with uid, app_id, sid, device_id, scp,
        valid 2 hours (BR-ID-07). After login app_id is taken from the token only.
  parameters:
    AppId:
      name: X-App-Id
      in: header
      required: true
      description: App (brand) the request belongs to; before login it must match the app_id the device was registered with (10403, BR-ID-07).
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^[a-z0-9_]+$'
    Platform:
      name: X-Platform
      in: header
      required: true
      description: Client platform (enum client_platform, 03 §4.2).
      schema:
        $ref: '#/components/schemas/ClientPlatformCode'
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: SemVer, the same number on all three apps (拍板第二批 TECH-07).
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        maxLength: 32
    Build:
      name: X-Build
      in: header
      required: false
      description: Build number of the client.
      schema:
        type: string
        maxLength: 32
    Channel:
      name: X-Channel
      in: header
      required: false
      description: Install channel of the app package (enum install_channel); absent for H5.
      schema:
        $ref: '#/components/schemas/InstallChannelCode'
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Client-generated trace id, echoed as `trace_id` when well-formed.
      schema:
        $ref: '#/components/schemas/TraceId'
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: device_id issued by POST /v1/devices; anything else is 10402 (BR-ID-09).
      schema:
        $ref: '#/components/schemas/Id'
    OptionalDeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: device_id issued by POST /v1/devices, when the device is registered.
      schema:
        $ref: '#/components/schemas/Id'
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix seconds; |server time − ts| ≤ 300 s (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9]{10}$'
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: 32 lowercase hex characters; (device_id, nonce) unique within 600 s (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    Sign:
      name: X-Sign
      in: header
      required: true
      description: |
        lowercase_hex(HMAC-SHA256(install_secret, METHOD + "\n" + path with raw query + "\n" + ts
        + "\n" + nonce + "\n" + lowercase_hex(sha256(raw body)))) (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on operations marked I (04 §6); missing → 20001. Same key while processing →
        40901; same key with another body → 20901; a retry after a timeout reuses the key and gets
        the first result (拍板第二批 TRADE-22). On the x-step-up operations a key abandoned through
        POST /v1/idempotency-keys/abandon → 20903, without comparing the body (04 §5「幂等」).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    UnionPlatform:
      name: platform
      in: path
      required: true
      description: Platform code (enum platform).
      schema:
        $ref: '#/components/schemas/PlatformCode'
    PendingTrackLinkId:
      name: link_id
      in: path
      required: true
      description: |
        link_id of the pending-track card. Unlike other link operations an unknown link, or one that
        does not own the attempt_id in the body, is 20001 with data.fields=[attempt_id] (no 30144).
      schema:
        $ref: '#/components/schemas/Id'
    LinkId:
      name: link_id
      in: path
      required: true
      description: link_id from a card; unknown or of another app → 30144.
      schema:
        $ref: '#/components/schemas/Id'
    ProductKey:
      name: product_key
      in: path
      required: true
      description: Opaque product key, URL-encoded by the client (BR-PROD-02).
      schema:
        $ref: '#/components/schemas/ProductKey'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; absent for the first page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, at most 50 (04 §5).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
  responses:
    ClientError:
      description: |
        Business or request error. Clients act on `code` only (contracts/error-codes.yaml);
        the HTTP status per code is listed there as well.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unionAuthRequired:
              summary: 30101 Taobao not authorized
              value:
                code: 30101
                msg: 请先授权淘宝
                data:
                  auth_url: https://oauth.example.test/authorize?state=st_01
                  state: st_01
                  auth_methods:
                    - sdk_token
                    - web_code
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            pddAuthRequired:
              summary: 30111 Pinduoduo not authorized
              value:
                code: 30111
                msg: 请先授权拼多多
                data:
                  auth_jump:
                    primary:
                      type: universal_link
                      value: https://auth.example.test/pdd/authorize?state=st_02
                    fallbacks:
                      - type: h5
                        value: https://auth.example.test/pdd/authorize?state=st_02&web=1
                    expire_at: '2026-10-02T09:40:00+08:00'
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            phoneInvalid:
              summary: 20001 the phone does not normalise to a mainland mobile number
              value:
                code: 20001
                msg: 手机号格式不正确
                data:
                  fields:
                    - phone
                  reason: phone_invalid
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            invalidParams:
              summary: 20001 parameter validation failed
              value:
                code: 20001
                msg: 参数错误
                data:
                  fields:
                    - scene
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    TooManyRequests:
      description: Rate limited (42901) with the required Retry-After header in seconds (BR-ID-05, BR-TEXT-14).
      headers:
        Retry-After:
          required: true
          description: Seconds to wait before retrying.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 42901
            msg: 请求过于频繁
            trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    ServerError:
      description: Server-side error; 503 codes carry `data.platform` / `data.reason` where listed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            searchUnavailable:
              summary: 50304 search unavailable for one platform
              value:
                code: 50304
                msg: 京东搜索暂不可用
                data:
                  platform: jd
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            searchDisabled:
              summary: 50304 search switched off for one platform
              value:
                code: 50304
                msg: 京东搜索已关闭
                data:
                  platform: jd
                  reason: search_disabled
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            notLaunched:
              summary: 50301 platform not launched yet
              value:
                code: 50301
                msg: 即将开放
                data:
                  platform: pdd
                  reason: not_launched
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
