                          role: user
                          created_at: '2026-10-14T10:00:00+08:00'
                          text: 提现记录在哪看
                          cards: []
                          finish_reason: null
                        - message_id: 019a0000-0000-7000-8000-000000000222
                          role: assistant
                          created_at: '2026-10-14T10:00:03+08:00'
                          text: 提现进度在提现记录里查看。
                          cards:
                            - card_id: c1
                              type: page_guide
                              schema_version: 1
                              data:
                                route: WithdrawRecords
                                text_key: agent.guide.WithdrawRecords
                              fallback_text: 提现进度在提现记录里查看。
                          finish_reason: stop
                        - message_id: 019a0000-0000-7000-8000-000000000223
