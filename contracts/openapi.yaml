  schemas:
    EntryName:
      type: string
      description: Process entry that produced the response (ADR-0001 §2).
      enum:
        - api
        - stream
        - admin
        - worker
        - payout
    HealthzData:
      type: object
      additionalProperties: false
      required:
        - status
        - entry
        - now
      properties:
        status:
          type: string
          enum:
            - ok
        entry:
          $ref: '#/components/schemas/EntryName'
        now:
          type: string
          format: date-time
          description: Current instant of the process clock (follows CLOCK_NOW outside prod).
    HealthzResponse:
      type: object
      description: Response envelope of 规划/04 §5 carrying the health payload.
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/HealthzData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SuccessCode:
      type: integer
      format: int32
      description: 0 means success.
      enum:
        - 0
    TraceId:
      type: string
      description: Echo of a well-formed X-Trace-Id request header, otherwise a generated UUID.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    Id:
      type: string
      description: Entity id, a UUIDv7 string (04 §5).
      minLength: 1
      maxLength: 64
    ProductKey:
      type: string
      description: |
        `<key_prefix>:<stable_id>`, at most 128 characters, opaque to clients (BR-PROD-02).
      minLength: 3
      maxLength: 128
    ItemRef:
      type: string
      description: Server-signed opaque product reference; passed through unchanged (BR-PROD-11).
      minLength: 1
      maxLength: 1024
    Fen:
      type: integer
      format: int64
      description: Amount in fen (ADR-0001 §4.2 item 3).
    NullableFen:
      type:
        - integer
        - 'null'
      format: int64
      description: Amount in fen, null when unknown.
    PlatformCode:
      type: string
      description: Platform (contracts/enums/platform.yaml platform).
      enum:
        - taobao
        - jd
        - pdd
        - meituan
        - vip
        - douyin
        - eleme
        - kuaishou
        - suning
    ClientPlatformCode:
      type: string
      description: Client platform (contracts/enums/platform.yaml client_platform).
      enum:
        - ios
        - android
        - harmony
        - h5
        - admin
    InstallChannelCode:
      type: string
      description: Install channel (contracts/enums/platform.yaml install_channel).
      enum:
        - appstore
        - official
        - huawei
        - agc
    SortCode:
      type: string
      description: Search sort (contracts/enums/trade.yaml sort).
      enum:
        - relevance
        - sales_desc
        - final_price_asc
        - rebate_desc
    NoRebateCause:
      type: string
      description: Why a card or an open result has no rebate (enum no_rebate_cause).
      enum:
        - price_compare
    RebateBasis:
      type: string
      description: |
        contracts/enums/trade.yaml rebate_basis. The three 查返利 states are derived from
        coupon_fen and rebate_basis only (BR-PRICE-21); amount_unknown and login_required are
        outside them.
      enum:
        - normal
        - price_compare_risk
        - no_rebate
        - amount_unknown
        - login_required
    Availability:
      type: string
      description: contracts/enums/trade.yaml availability.
      enum:
        - ok
        - off_shelf
        - coupon_gone
        - ref_expired
        - price_unavailable
        - unknown
    InstalledState:
      type: string
      description: |
        Whether the platform app is installed, as detected by the client (BR-ATTR-27 ①); the
        strings "true" / "false" / "unknown" (enum installed_state).
      enum:
        - 'true'
        - 'false'
        - unknown
    JumpStep:
      type: object
      description: |
        One step of a jump plan. `sdk` is required on every type=sdk step and never present on any
        other type; the schema keeps it optional so the already-served shape stays compatible, and
        the server that builds the plan (linking) guarantees the pairing, checked against the
        examples by the contracts-ts consistency test. For a type=sdk step the client acts on
        `sdk` only; `value` repeats `sdk.url` (open_by=url) or `sdk.item_id` (open_by=code) for
        logs and compatibility.
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: contracts/enums/trade.yaml jump_type.
          enum:
            - sdk
            - scheme
            - universal_link
            - h5
            - copy_tpwd
        value:
          type: string
          minLength: 1
          description: URL, scheme or token to execute; produced by the server only.
        sdk:
          $ref: '#/components/schemas/BaichuanOpen'
    BaichuanOpen:
      type: object
      description: |
        Taobao open instruction executed by the Baichuan SDK (docs/changes/20261003 §1; 03 §4.5).
        The server builds it from the link snapshot; the client passes it to the SDK unchanged and
        never rewrites, fills in or drops `taoke` (BR-ATTR-05). open_by=url opens our own promotion
        link of this user and scene and carries no commission parameter at all (BR-ATTR-27 Taobao
        row); open_by=code opens the item detail page and lets the SDK convert with `taoke`. A
        code step carries no URL, so JumpPlan.expire_at does not limit it (04 §8.4). Whether the
        SDK returns to the app afterwards is a platform capability (CAP-TB-11), not promised here.
        The oneOf branches declare the properties they constrain (strict Ajv2020, ADR-0001 §4.2
        #15).
      additionalProperties: false
      required:
        - provider
        - open_by
      properties:
        provider:
          type: string
          enum:
            - baichuan
        open_by:
          type: string
          description: url = openByUrl with our promotion link; code = openByCode with the item ID.
          enum:
            - url
            - code
        url:
          type: string
          format: uri
          maxLength: 2048
          description: Required for open_by=url; only our own promotion link of this user and scene.
        page:
          type: string
          description: Required for open_by=code; the page openByCode opens.
          enum:
            - detail
        item_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Required for open_by=code; the union item ID (new string form).
        sku_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Optional SKU for open_by=code.
        taoke:
          $ref: '#/components/schemas/BaichuanTaoke'
      oneOf:
        - type: object
          properties:
            open_by:
              type: string
              enum:
                - url
            url:
              type: string
          required:
            - open_by
            - url
          not:
            type: object
            additionalProperties: true
            properties:
              taoke:
                $ref: '#/components/schemas/BaichuanTaoke'
              page:
                type: string
              item_id:
                type: string
              sku_id:
                type: string
            anyOf:
              - type: object
                properties:
                  taoke:
                    $ref: '#/components/schemas/BaichuanTaoke'
                required:
                  - taoke
              - type: object
                properties:
                  page:
                    type: string
                required:
                  - page
              - type: object
                properties:
                  item_id:
                    type: string
                required:
                  - item_id
              - type: object
                properties:
                  sku_id:
                    type: string
                required:
                  - sku_id
        - type: object
          properties:
            open_by:
              type: string
              enum:
                - code
            page:
              type: string
              enum:
                - detail
            item_id:
              type: string
            taoke:
              $ref: '#/components/schemas/BaichuanTaoke'
          required:
            - open_by
            - page
            - item_id
            - taoke
          not:
            type: object
            additionalProperties: true
            properties:
              url:
                type: string
            required:
              - url
    BaichuanTaoke:
      type: object
      description: |
        AlibcTaokeParams of an open_by=code instruction, built by linking from the snapshot
        identity (BR-ATTR-05); the client must not change, fill in or drop any of it.
      additionalProperties: false
      required:
        - pid
      properties:
        pid:
          type: string
          pattern: '^mm_\d+_\d+_\d+$'
          maxLength: 64
        relation_id:
          type: string
          minLength: 1
          maxLength: 32
          description: Active binding of the snapshot user (the sharer on a share link).
    JumpPlan:
      type: object
      description: |
        Executed strictly in order; clients never build schemes or add fallbacks themselves
        (BR-ATTR-27, 03 §4.5). The client jumps only after a user tap (BR-ATTR-21).
      additionalProperties: false
      required:
        - primary
        - fallbacks
        - expire_at
      properties:
        primary:
          $ref: '#/components/schemas/JumpStep'
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/JumpStep'
        expire_at:
          type: string
          format: date-time
          description: |
            Until when the returned union URL can be used directly (BR-ATTR-05); it does not
            limit opening the link_id again. A Taobao sdk step with open_by=code carries no URL and
            is not limited by it (04 §8.4).
    IdempotencyKey:
      type: string
      description: Value of the Idempotency-Key header (04 §5「幂等」).
      minLength: 8
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    SessionScope:
      type: string
      description: scp of an access token (enum session_scope; meaning in BR-ID-01 细则「受限会话」).
      enum:
        - full
        - deletion_only
    H5TokenScope:
      type: string
      description: Scope of an h5_token (enum h5_token_scope; BR-ID-32 细则「只读作用域」).
      enum:
        - standard
        - read_only
    IssueH5TokenRequest:
      type: object
      additionalProperties: false
      properties:
        scope:
          $ref: '#/components/schemas/H5TokenScope'
          description: |
            Filled by the native app from its force-update state; H5 cannot choose it. The value
            used when it is absent is set in BR-ID-32 细则「只读作用域」.
    H5TokenData:
      type: object
      additionalProperties: false
      required:
        - token
        - expire_at
        - scope
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
        expire_at:
          type: string
          format: date-time
        scope:
          $ref: '#/components/schemas/H5TokenScope'
    H5TokenResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/H5TokenData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    StepUpAction:
      type: string
      description: Action a step_up_token is bound to; one per x-step-up operation (04 §2.5, §5).
      enum:
        - withdraw
        - payout_account_change
        - phone_change
        - account_deletion
    IdempotencyAbandonOutcome:
      type: string
      description: Result of POST /v1/idempotency-keys/abandon (04 §6.1).
      enum:
        - abandoned
        - completed
    AbandonIdempotencyKeyRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - idempotency_key
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    AbandonIdempotencyKeyData:
      type: object
      description: |
        `original` is null exactly when `outcome=abandoned`. The oneOf branches declare the
        properties they constrain (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - outcome
        - original
      properties:
        outcome:
          $ref: '#/components/schemas/IdempotencyAbandonOutcome'
        original:
          type:
            - object
            - 'null'
          description: |
            The response envelope stored with the completed idempotency record, unchanged
            (`code` 0 or a 3xxxx business code; 1xxxx and 2xxxx results are never stored,
            BR-WDR-07). `data` keeps the shape of the original operation, so it is left open.
          additionalProperties: false
          required:
            - code
            - msg
          properties:
            code:
              type: integer
              format: int32
              anyOf:
                - type: integer
                  format: int32
                  enum:
                    - 0
                - type: integer
                  format: int32
                  minimum: 30000
                  maximum: 39999
            msg:
              type: string
            data:
              type: object
              additionalProperties: true
      oneOf:
        - type: object
          properties:
            outcome:
              type: string
              enum:
                - abandoned
            original:
              type: 'null'
          required:
            - outcome
            - original
        - type: object
          properties:
            outcome:
              type: string
              enum:
                - completed
            original:
              type: object
              additionalProperties: true
          required:
            - outcome
            - original
    AbandonIdempotencyKeyResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AbandonIdempotencyKeyData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ErrorEnvelope:
      type: object
      description: |
        Error response (04 §5, §7). `data` is present only for codes that define it; its fields
        per code are listed in contracts/error-codes.yaml, so it is left open here.
      additionalProperties: false
      required:
        - code
        - msg
        - trace_id
      properties:
        code:
          type: integer
          format: int32
          minimum: 10000
          maximum: 99999
        msg:
          type: string
          description: Fallback text only; clients show the dictionary text error.<code>.
        data:
          type: object
          additionalProperties: true
        trace_id:
          $ref: '#/components/schemas/TraceId'
    FreeForm:
      type: object
      description: Configuration block whose inner shape is not fixed by 规划/04 yet.
      additionalProperties: true
    DeviceIdSource:
      type: string
      description: Which device identifier was hashed (enum device_id_source, BR-ID-09).
      enum:
        - idfv
        - android_id
        - oaid
        - odid
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required:
        - device_hash
        - id_source
      properties:
        device_hash:
          type: string
          description: |
            lowercase_hex(SHA-256(UTF-8 bytes of the identifier, trimmed and lower-cased)) of IDFV
            (iOS), ANDROID_ID (Android, MVP) or ODID (Harmony) (BR-ID-09 细则「设备标识的无效值」).
          pattern: '^[0-9a-f]{64}$'
        id_source:
          $ref: '#/components/schemas/DeviceIdSource'
    RegisterDeviceData:
      type: object
      additionalProperties: false
      required:
        - device_id
        - install_secret
      properties:
        device_id:
          $ref: '#/components/schemas/Id'
        install_secret:
          type: string
          description: Signing secret, stored only in Keychain / Keystore / HUKS.
          minLength: 16
          maxLength: 128
    RegisterDeviceResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/RegisterDeviceData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    Phone:
      type: string
      description: |
        Phone number as typed or pasted; it may carry spaces, hyphens and +86 / 0086 / 86. The
        server normalises it (BR-ID-05 细则「手机号规范化」); a result that is not a mainland mobile
        number is 20001 with `data.fields=[phone]` and `data.reason=phone_invalid` (an empty
        string included). No length bound in the schema: any spacing of a valid number must reach
        the normaliser, and adding a bound to a request property is a breaking change (oasdiff).
    SendSmsCodeRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - purpose
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        purpose:
          type: string
          description: contracts/enums/identity.yaml sms_purpose.
          enum:
            - login
            - bind
            - step_up
        captcha_token:
          type: string
          description: Human-verification token, required after 44003 (BR-ID-05).
          maxLength: 2048
        action:
          $ref: '#/components/schemas/StepUpAction'
          description: |
            With purpose=step_up the client always sends the action the code is for; the version
            gate and the session scope are decided from it (BR-ID-01 细则): only
            action=account_deletion is exempt, and a step_up request without action is gated.
            purpose=login is exempt regardless of action; purpose=bind is gated.
    SendSmsCodeData:
      type: object
      additionalProperties: false
      required:
        - resend_after_sec
        - expires_in_sec
      properties:
        resend_after_sec:
          type: integer
          format: int32
          description: |
            Seconds until another code may be requested: at least 60, the latest release among the
            per-phone limits (BR-ID-05).
        expires_in_sec:
          type: integer
          format: int32
          description: Validity of the code in seconds (300, BR-ID-05).
    SendSmsCodeResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SendSmsCodeData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    LegalVersions:
      type: object
      description: Versions of the privacy policy and user agreement the user agreed to (BR-ID-04).
      additionalProperties: false
      required:
        - privacy
        - agreement
      properties:
        privacy:
          type: integer
          format: int32
          minimum: 1
        agreement:
          type: integer
          format: int32
          minimum: 1
    LoginBySmsRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - code
        - legal_versions
        - consent_at
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
          description: When the box was ticked or the confirm dialog accepted (client clock).
        invite_code:
          type: string
          description: Optional invite code; ignored for an existing account (BR-INV-06).
          maxLength: 32
    LoginProvider:
      type: string
      description: Third-party identity provider (enum login_provider, BR-ID-04).
      enum:
        - wechat
        - apple
        - huawei
    RecordConsentRequest:
      type: object
      additionalProperties: false
      required:
        - type
        - version
        - accepted
        - channel
        - client_at
      properties:
        type:
          type: string
          description: consent_type without labor_agreement (BR-ID-12, BR-WDR-31).
          enum:
            - privacy
            - agreement
            - ai_third_party
            - id_verification
            - personalization
        version:
          type: integer
          format: int32
          minimum: 1
          description: The version of the text the user saw (legal.privacy.version and the like).
        accepted:
          type: boolean
          description: true = agreed; false = withdrawn.
        channel:
          type: string
          description: consent_channel without the server-written login_merge, h5_landing and withdraw_flow.
          enum:
            - first_launch
            - login_page
            - agent_sheet
            - realname_sheet
            - privacy_center
        client_at:
          type: string
          format: date-time
          description: When the user tapped (device clock).
    OauthAttemptPurpose:
      type: string
      description: What a third-party authorization attempt is for (enum oauth_attempt_purpose).
      enum:
        - login
        - step_up
        - payout_bind
    CreateOauthAttemptRequest:
      type: object
      description: |
        `action` is required exactly for purpose=step_up. purpose=payout_bind is for WeChat only
        and carries no `action`. The oneOf branches declare the properties they constrain (strict
        Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - provider
        - purpose
      properties:
        provider:
          $ref: '#/components/schemas/LoginProvider'
        purpose:
          $ref: '#/components/schemas/OauthAttemptPurpose'
        action:
          $ref: '#/components/schemas/StepUpAction'
      oneOf:
        - type: object
          properties:
            purpose:
              type: string
              enum:
                - login
          required:
            - purpose
        - type: object
          properties:
            purpose:
              type: string
              enum:
                - step_up
            action:
              $ref: '#/components/schemas/StepUpAction'
          required:
            - purpose
            - action
        - type: object
          properties:
            purpose:
              type: string
              enum:
                - payout_bind
            provider:
              type: string
              enum:
                - wechat
          required:
            - purpose
            - provider
          not:
            type: object
            additionalProperties: true
            properties:
              action:
                $ref: '#/components/schemas/StepUpAction'
            required:
              - action
    OauthAttemptData:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - nonce
        - expire_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        nonce:
          type: string
          description: At least 128 random bits, passed to the provider SDK (BR-ID-04 细则).
          minLength: 16
          maxLength: 256
        expire_at:
          type: string
          format: date-time
    OauthAttemptResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/OauthAttemptData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    OauthCredential:
      type: string
      description: An authorization credential from the provider SDK; never stored or logged.
      minLength: 1
      maxLength: 4096
    LoginByWechatRequest:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - code
        - legal_versions
        - consent_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        code:
          $ref: '#/components/schemas/OauthCredential'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
    LoginByAppleRequest:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - identity_token
        - authorization_code
        - legal_versions
        - consent_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        identity_token:
          $ref: '#/components/schemas/OauthCredential'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
    LoginByHuaweiRequest:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - authorization_code
        - legal_versions
        - consent_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
    StepUpBySmsRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    StepUpByWechatRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - provider
        - attempt_id
        - code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        provider:
          type: string
          enum:
            - wechat
        attempt_id:
          $ref: '#/components/schemas/Id'
        code:
          $ref: '#/components/schemas/OauthCredential'
    StepUpByAppleRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - provider
        - attempt_id
        - identity_token
        - authorization_code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        provider:
          type: string
          enum:
            - apple
        attempt_id:
          $ref: '#/components/schemas/Id'
        identity_token:
          $ref: '#/components/schemas/OauthCredential'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
    StepUpByHuaweiRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - provider
        - attempt_id
        - authorization_code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        provider:
          type: string
          enum:
            - huawei
        attempt_id:
          $ref: '#/components/schemas/Id'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
    StepUpRequest:
      type: object
      description: |
        Exactly one way of second verification: an SMS code, or a new authorization with one
        provider carrying that provider's login credential fields (BR-ID-08). Each branch is a
        closed object, so a body mixing two ways matches none.
      unevaluatedProperties: false
      oneOf:
        - $ref: '#/components/schemas/StepUpBySmsRequest'
        - $ref: '#/components/schemas/StepUpByWechatRequest'
        - $ref: '#/components/schemas/StepUpByAppleRequest'
        - $ref: '#/components/schemas/StepUpByHuaweiRequest'
    StepUpData:
      type: object
      additionalProperties: false
      required:
        - step_up_token
        - expire_at
      properties:
        step_up_token:
          type: string
          minLength: 1
          maxLength: 2048
        expire_at:
          type: string
          format: date-time
    StepUpResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/StepUpData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TokenPair:
      type: object
      description: |
        Token pair of a login or a refresh. session_scope is the scp of the access token, decided
        from this request (BR-ID-01 细则「受限会话」): deletion_only when the client is below the
        minimum supported version.
      additionalProperties: false
      required:
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
        - session_scope
      properties:
        session_scope:
          $ref: '#/components/schemas/SessionScope'
        access_token:
          type: string
          minLength: 1
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          minLength: 1
        refresh_expires_at:
          type: string
          format: date-time
    InviteBind:
      type: object
      description: Result of binding the invite code sent at registration (BR-INV-06).
      additionalProperties: false
      required:
        - result
        - code
      properties:
        result:
          type: string
          enum:
            - bound
            - failed
            - ignored_existing_user
        code:
          type:
            - integer
            - 'null'
          format: int32
          description: Error code when result=failed (50001 = internal binding error).
          enum:
            - 30401
            - 30403
            - 30408
            - 42901
            - 50001
            - null
    LoginData:
      type: object
      additionalProperties: false
      required:
        - user_id
        - is_new_user
        - tokens
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        is_new_user:
          type: boolean
        tokens:
          $ref: '#/components/schemas/TokenPair'
        invite_bind:
          $ref: '#/components/schemas/InviteBind'
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/LoginData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPairResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/TokenPair'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MeBalance:
      type: object
      description: Summary of the single balance (拍板第二批 §8 ADD-06); meanings per BR-FUND-18.
      additionalProperties: false
      required:
        - available_fen
        - withdrawable_fen
        - estimated_total_fen
      properties:
        available_fen:
          $ref: '#/components/schemas/Fen'
        withdrawable_fen:
          $ref: '#/components/schemas/Fen'
        estimated_total_fen:
          $ref: '#/components/schemas/Fen'
    UnionBindingState:
      type: object
      additionalProperties: false
      required:
        - platform
        - status
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        status:
          type: string
          description: contracts/enums/identity.yaml union_binding_status.
          enum:
            - unbound
            - pending_auth
            - active
            - invalid
            - released
            - blocked
    AuthMethod:
      type: string
      description: Taobao authorization method (enum auth_method; BR-ID-17 细则「授权方式」).
      enum:
        - web_code
        - sdk_token
    AuthJumpStep:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: A subset of jump_type; an h5 step opens in the system browser, not in the app.
          enum:
            - scheme
            - universal_link
            - h5
        value:
          type: string
          minLength: 1
    AuthJumpPlan:
      type: object
      description: |
        Authorization jump of 30111 and of the Pinduoduo auth-url (04 §7 30111): primary and
        fallbacks chosen by the server from the device record and installed (BR-ID-22 细则,
        BR-ATTR-27); executed in order by the same executor as a purchase jump plan, but not
        reported as link_jump and not a purchase jump (BR-ATTR-21).
      additionalProperties: false
      required:
        - primary
        - fallbacks
        - expire_at
      properties:
        primary:
          $ref: '#/components/schemas/AuthJumpStep'
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/AuthJumpStep'
        expire_at:
          type: string
          format: date-time
    UnionBindingsData:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UnionBindingState'
    UnionBindingsResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/UnionBindingsData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    UnionAuthUrlData:
      type: object
      description: |
        Exactly one of auth_methods (Taobao, ordered) and auth_jump (Pinduoduo); the oneOf branches
        declare the property they require (strict Ajv2020).
      additionalProperties: false
      required:
        - auth_url
        - state
      properties:
        auth_url:
          type: string
          format: uri
        state:
          type: string
          minLength: 1
          maxLength: 128
        auth_methods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuthMethod'
        auth_jump:
          $ref: '#/components/schemas/AuthJumpPlan'
      oneOf:
        - type: object
          properties:
            auth_methods:
              type: array
          required:
            - auth_methods
        - type: object
          properties:
            auth_jump:
              type: object
              additionalProperties: true
          required:
            - auth_jump
    UnionAuthUrlResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/UnionAuthUrlData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    BindUnionByWebCode:
      type: object
      additionalProperties: false
      required:
        - state
        - auth_method
        - code
