      required:
        - flags
        - platform_status
      properties:
        flags:
          type: object
          description: |
            Client switches by key: agent.entry.visible, clipboard.enabled.<platform>,
            home.fallback, h5.route.<page>.enabled, ui.grayscale (03 §4.3);
            external_page.product_intercept (a platform product page inside the third-party page
            container goes back to the native product detail) and external_page.union_host_block
            (the container does not load union platform pages; derived from the server setting of
            the same name; a client that cannot read it treats it as on) (BR-ATTR-29);
            earnings.dashboard.visible (earnings dashboard entry, derived from
            earnings.dashboard.enabled, BR-FUND-25).
          additionalProperties:
            type: boolean
        platform_status:
          type: object
          description: Purchase status by platform code.
          propertyNames:
            $ref: '#/components/schemas/PlatformCode'
          additionalProperties:
            $ref: '#/components/schemas/PlatformPurchaseStatus'
        search_status:
          type: object
          description: |
            Search switch by platform code, derived from search.enabled.<platform> (04 §10.1);
            how a client treats a missing platform is in BR-PROD-10 细则.
          propertyNames:
            $ref: '#/components/schemas/PlatformCode'
          additionalProperties:
            $ref: '#/components/schemas/PlatformSearchStatus'
    PlatformSearchStatus:
      type: string
      description: Whether search is open for a platform (enum platform_search_status).
      enum:
        - 'on'
        - 'off'
    ConfigLegalPrivacy:
      type: object
      additionalProperties: false
      required:
        - version
        - min_version
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        min_version:
          type: integer
          format: int32
          minimum: 1
          description: Below this version the user must agree again (BR-ID-12).
    ConfigLegalAgreement:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
    ConfigLegal:
      type: object
      description: legal.privacy.version, legal.privacy.min_version, legal.agreement.version (04 §10.1).
      additionalProperties: false
      required:
        - privacy
        - agreement
      properties:
        privacy:
          $ref: '#/components/schemas/ConfigLegalPrivacy'
        agreement:
          $ref: '#/components/schemas/ConfigLegalAgreement'
    ConfigInvite:
      type: object
      additionalProperties: false
      required:
        - required
        - backfill_hours
      properties:
        required:
          type: boolean
          description: Must be false in the MVP (BR-INV-06).
        backfill_hours:
          type: integer
          format: int32
          description: Window for entering an inviter later (BR-INV-07).
        bind_phone_guide:
          type: boolean
          description: |
            Show the bind-phone guide to new third-party accounts (BR-INV-03 细则). Optional in
            the schema like every key added after v0.9; the server always sends it.
        before_buy_tip:
          type: boolean
          description: Show the inviter tip before the first purchase (BR-INV-21).
    ConfigAgent:
      type: object
      description: Agent availability and guest quota (04 §10.1; BR-AI-11, BR-AI-12).
      additionalProperties: false
      required:
        - enabled
        - whitelist_only
        - filing_text
        - examples
        - guest_daily_quota
        - require_phone
      properties:
        enabled:
          type: boolean
        whitelist_only:
          type: boolean
        filing_text:
          type: string
        examples:
          type: array
          items:
            type: string
        guest_daily_quota:
          type: integer
          format: int32
          minimum: 0
        require_phone:
          type: boolean
    ConfigH5Release:
      type: object
      description: H5 version bucket for this caller (拍板第二批 TECH-28).
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: string
          minLength: 1
    ConfigKf:
      type: object
      description: WeCom customer-service chat link (chat entry only).
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    ConfigExternalPage:
      type: object
      description: Third-party page container settings (BR-ATTR-29).
      additionalProperties: false
      required:
        - nav_host_sample_bp
      properties:
        nav_host_sample_bp:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Sampling rate of document-level navigation hosts, 1/10000 (default in BR-ATTR-29).
    LinkPatternCategory:
      type: string
      description: Category of a platform link pattern (enum link_pattern_category, BR-ATTR-29).
      enum:
        - product
        - promo
        - union_host
    LinkPatternRule:
      type: object
      description: |
        Hosts and path patterns of one platform and category. How hosts match (union_host by
        registered domain including subdomains) and the path pattern syntax are defined with the
        source table specs/link-patterns.yaml (CT-15g); concrete values come from real samples (B1-07).
      additionalProperties: false
      required:
        - platform
        - category
        - hosts
        - path_patterns
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        category:
          $ref: '#/components/schemas/LinkPatternCategory'
        hosts:
          type: array
          items:
            type: string
            minLength: 1
        path_patterns:
          type: array
          items:
            type: string
            minLength: 1
    ConfigLinkPatterns:
      type: object
      description: |
        Client pre-filter subset of the platform link pattern table (source
        specs/link-patterns.yaml). Clients decide where a document-level navigation in the
        third-party page container goes (main frame, subframe, new window); product recognition
        follows the server. When the fetch fails they use the last good version, then the bundled
        snapshot, and never stop intercepting (BR-ATTR-29).
      additionalProperties: false
      required:
        - version
        - rules
      properties:
        version:
          type: string
          minLength: 1
        rules:
          type: array
          items:
            $ref: '#/components/schemas/LinkPatternRule'
    ConfigAppUpdate:
      type: object
      additionalProperties: false
      required:
        - recheck_interval_sec
      properties:
        recheck_interval_sec:
          type: integer
          format: int32
          minimum: 1
          description: |
            On returning to the foreground, call GET /v1/app-versions/check again when the last
            successful check is older than this (value and bundled default in BR-ID-01 细则
            「最低支持版本的接口层拦截」).
    HelpLinkTarget:
      type: object
      description: |
        Jump target {route, params} of a help_links entry: always one help article, the Help
        route of contracts/routes.json with its article_id (04 §10.1「原生页到帮助文章的入口表」).
        conformance.ts checks that the route exists there and that params is a subset of that
        route's params schema.
      additionalProperties: false
      required:
        - route
        - params
      properties:
        route:
          type: string
          enum:
            - Help
        params:
          type: object
          additionalProperties: false
          required:
            - article_id
          properties:
            article_id:
              type: string
              minLength: 1
    ConfigClaim:
      type: object
      additionalProperties: false
      required:
        - window_days
      properties:
        window_days:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          description: |
            Days within which an order claim may be filed, claim.window_hours rounded down to
            days; null when below one day or not configured. Only renders the claim form's period
            sentence (BR-ATTR-17 细则「找回页的填写指引」); claim.window_hours is not sent.
    Config:
      type: object
      description: |
        Top-level keys of /v1/config (04 §10.1, excerpt). Keys added after v0.9 (external_page,
        link_patterns, external_hosts, app_update, help_links, claim, platform_icons) are
        optional, so a client keeps reading an older last-good configuration (04 §5「兼容」); the
        server always sends them, except that platform_icons lists only the marks with a published
        replacement image (BR-TEXT-24). jump_tip, clipboard, bridge_origins, auth_tips, compliance and display are not
        shaped by 04 yet and stay free-form; the task that consumes each one types it
        (bridge_origins with CT-03, clipboard with B1-07).
      additionalProperties: false
      required:
        - dict_version
        - h5_base_url
        - h5_release
        - share_domains
        - features
        - texts
        - legal
        - invite
        - agent
        - kf
        - jump_tip
        - clipboard
        - bridge_origins
        - auth_tips
        - compliance
        - display
      properties:
        dict_version:
          type: string
          description: Version of the /v1/dict dictionary (BR-TEXT-12).
        h5_base_url:
          type: string
          format: uri
        h5_release:
          $ref: '#/components/schemas/ConfigH5Release'
        share_domains:
          type: array
          items:
            type: string
        features:
          $ref: '#/components/schemas/ConfigFeatures'
        texts:
          type: object
          description: Custom text keys, e.g. withdraw.sla_text (BR-TEXT-07).
          additionalProperties:
            type: string
        legal:
          $ref: '#/components/schemas/ConfigLegal'
        invite:
          $ref: '#/components/schemas/ConfigInvite'
        agent:
          $ref: '#/components/schemas/ConfigAgent'
        kf:
          $ref: '#/components/schemas/ConfigKf'
        jump_tip:
          $ref: '#/components/schemas/FreeForm'
        clipboard:
          $ref: '#/components/schemas/FreeForm'
        bridge_origins:
          $ref: '#/components/schemas/FreeForm'
        auth_tips:
          $ref: '#/components/schemas/FreeForm'
        compliance:
          $ref: '#/components/schemas/FreeForm'
        display:
          $ref: '#/components/schemas/FreeForm'
        external_page:
          $ref: '#/components/schemas/ConfigExternalPage'
        link_patterns:
          $ref: '#/components/schemas/ConfigLinkPatterns'
        external_hosts:
          type: array
          description: |
            Third-party page hosts a deep link may open in ExternalPage, matched by full host name
            (values and default in BR-ID-10 细则「深链能打开的第三方页面」); push and in-app
            targets are not limited by it (03 §4.4).
          items:
            type: string
            minLength: 1
        app_update:
          $ref: '#/components/schemas/ConfigAppUpdate'
        help_links:
          type: object
          description: |
            Native entries to help articles: key → jump target; an entry whose key is not
            configured is not shown. Keys are defined by the rules that use them: price_compare
            (BR-TEXT-03), claim_guide.<platform> (BR-ATTR-17 细则), login_help (BR-ID-02 细则),
            withdraw_rules (BR-WDR-04 细则). Values are operations configuration (article ids).
          additionalProperties:
            $ref: '#/components/schemas/HelpLinkTarget'
        claim:
          $ref: '#/components/schemas/ConfigClaim'
        platform_icons:
          $ref: '#/components/schemas/ConfigPlatformIcons'
    ConfigPlatformIcon:
      type: object
      description: |
        A replacement image published in the admin console for one platform mark (BR-TEXT-24).
        Stored in the OSS media bucket under its content SHA-256 and cached long; each platform is
        versioned on its own and a publish takes effect at once.
      additionalProperties: false
      required:
        - url
        - sha256
        - version
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: |
            Image address on the media domain (set by deployment, not fixed by the contract); the
            file name is the content SHA-256.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the image content, the same digest as the file name.
        version:
          type: integer
          format: int32
          minimum: 1
          description: Version of this platform's replacement image, counted per platform.
    ConfigPlatformIcons:
      type: object
      description: |
        Platform mark replacement images (04 §10.1, BR-TEXT-24 细则): mark key → replacement
        image. Lists only the keys for which the admin console has published a replacement; a
        missing key (never replaced, or 「恢复内置」) means the client shows the image bundled in
        the package, and the object may be empty. Native clients download the image and check its
        SHA-256 before use, falling back to the bundled image on a mismatch; H5 loads it with
        `<img src=url>` and falls back to the bundled image on error. The accessible name is always
        the platform's Chinese name and never follows the image. The keys are enum
        platform_icon_key (PlatformIconKey, also the {key} of /admin/v1/platform-icons); new
        platforms add a key to both the same way.
      additionalProperties: false
      properties:
        taobao:
          $ref: '#/components/schemas/ConfigPlatformIcon'
        tmall:
          $ref: '#/components/schemas/ConfigPlatformIcon'
        jd:
          $ref: '#/components/schemas/ConfigPlatformIcon'
        pdd:
          $ref: '#/components/schemas/ConfigPlatformIcon'
        wechat:
          $ref: '#/components/schemas/ConfigPlatformIcon'
        wechat_pay:
          $ref: '#/components/schemas/ConfigPlatformIcon'
        alipay:
          $ref: '#/components/schemas/ConfigPlatformIcon'
        wecom:
          $ref: '#/components/schemas/ConfigPlatformIcon'
    ConfigResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Config'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ProductCta:
      type: object
      description: |
        Buy button chosen by the server; the client never decides it (BR-TEXT-12, 拍板第二批
        TRADE-21): btn.buy.coupon (有券有返), btn.buy (无券有返 and amount_unknown),
        btn.buy.no_rebate (无返利); other keys come with login_required and taolijin cards.
      additionalProperties: false
      required:
        - text_key
      properties:
        text_key:
          type: string
          minLength: 1
    ProductTlj:
      type: object
      description: Taolijin of the card, absent when there is none (BR-PRICE-08); never folded into prices.
      additionalProperties: false
      required:
        - amount_fen
        - remain
        - kind
      properties:
        amount_fen:
          $ref: '#/components/schemas/Fen'
        remain:
          type: integer
          format: int32
        kind:
          type: string
          description: contracts/enums/trade.yaml tlj_kind.
          enum:
            - ours
            - brand_open
            - third_party
            - unknown
    ProductCard:
      type: object
      description: |
        Product card (04 §8.3). Price semantics BR-PRICE-01 / 05; rebate_* and est_net_price_fen
        are computed per request for the current caller and never cached (BR-PRICE-11). The card
        carries a registered `link_id`; buying always goes through POST /v1/links/{link_id}/open
        (BR-PRICE-12, BR-PRICE-21). amount_unknown cards have product_key, prices and rebate
        null (BR-PRICE-08).
      additionalProperties: false
      required:
        - product_key
        - item_ref
        - platform
        - title
        - image
        - price_fen
        - coupon_fen
        - final_price_fen
        - est_net_price_fen
        - rebate_min_fen
        - rebate_max_fen
        - rebate_basis
        - benefit_tags
        - is_presale
        - link_id
        - cta
        - quoted_at
        - stale
        - age_sec
        - source
        - disclaimer_keys
        - availability
      properties:
        card_id:
          type: string
          description: Agent card sequence id (c1, c2…), only on Agent cards (BR-AI-05).
        product_key:
          type:
            - string
            - 'null'
          description: Opaque product key (BR-PROD-02); null only on amount_unknown cards.
          minLength: 3
          maxLength: 128
        item_ref:
          type:
            - string
            - 'null'
          description: Opaque signed reference passed through unchanged (BR-PROD-11).
          minLength: 1
          maxLength: 1024
        platform:
          $ref: '#/components/schemas/PlatformCode'
        shop_type:
          type:
            - string
            - 'null'
          description: Shop type, e.g. tmall for Tmall shops on taobao.
        title:
          type:
            - string
            - 'null'
        image:
          type:
            - string
            - 'null'
          format: uri
        shop_name:
          type:
            - string
            - 'null'
        price_fen:
          $ref: '#/components/schemas/NullableFen'
        coupon_fen:
          $ref: '#/components/schemas/NullableFen'
        final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        est_net_price_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_basis:
          $ref: '#/components/schemas/RebateBasis'
        no_rebate_cause:
          description: |
            May be non-null only when rebate_basis=no_rebate (BR-PRICE-08 细则「无返利原因」);
            unknown values are treated as null. Not the open request's no_rebate_reason.
          anyOf:
            - $ref: '#/components/schemas/NoRebateCause'
            - type: 'null'
        benefit_tags:
          type: array
          description: Server-generated labels (有券, 预售, 标题显示为 X…); no per-card reasons.
          items:
            type: string
        match_tag:
          type: string
          description: Agent cards only (BR-AI-24); contracts/enums/trade.yaml match_tag.
          enum:
            - matched
            - relaxed
            - spec_unconfirmed
        spec_text:
          type:
            - string
            - 'null'
        is_presale:
          type: boolean
          description: Presale; shown with the total price (BR-PRICE-22).
        tlj:
          $ref: '#/components/schemas/ProductTlj'
        link_id:
          $ref: '#/components/schemas/Id'
        cta:
          $ref: '#/components/schemas/ProductCta'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Receipt time of the union response the price is based on (BR-PRICE-11).
        stale:
          type: boolean
        age_sec:
          type:
            - integer
            - 'null'
          format: int32
          description: Age of the price in seconds, computed by the server (BR-PRICE-11).
        source:
          type: string
          description: Price source (BR-PRICE-16).
          enum:
            - taobao_union
            - jd_union
            - pdd_union
        disclaimer_keys:
          type: array
          description: Ordered dictionary keys (BR-PRICE-17), including price_basis.
          items:
            type: string
        ad_label:
          type:
            - string
            - 'null'
          description: Ad label (BR-TEXT-17); null on Agent relevance cards.
        availability:
          $ref: '#/components/schemas/Availability'
        favorited:
          type: boolean
          description: |
            Only on the product detail response (GET /v1/products/{product_key}): whether the
            caller has favorited this product; false when not logged in (规划/01 F-PROD-12).
    SearchProductsData:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - has_more
        - fallback_items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProductCard'
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
          description: As reported by the union, not by the filtered page size (BR-PRICE-08).
        fallback_items:
          type: array
          description: Only when items is empty on the first page; the platform's first 10 feed items.
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductCard'
    SearchProductsResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SearchProductsData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ProductResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ProductCard'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    Favorite:
      type: object
      additionalProperties: false
      required:
        - platform
        - product_key
        - favorited_at
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        product_key:
          $ref: '#/components/schemas/ProductKey'
        favorited_at:
          type: string
          format: date-time
          description: When the product was favorited (the original time for a repeated add).
    FavoriteResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Favorite'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    InvalidFavoriteCard:
      type: object
      description: Card of an invalid favorite; only the title and the image, no price and no rebate.
      additionalProperties: false
      required:
        - title
        - image
      properties:
        title:
          type:
            - string
            - 'null'
        image:
          type:
            - string
            - 'null'
          format: uri
    FavoriteItem:
      type: object
      additionalProperties: false
      required:
        - platform
        - product_key
        - favorited_at
        - invalid
        - product_card
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        product_key:
          $ref: '#/components/schemas/ProductKey'
        favorited_at:
          type: string
          format: date-time
        invalid:
          type: boolean
          description: |
            true when fetching the card the union answered that the product does not exist, is
            off shelf or cannot be promoted.
        product_card:
          description: |
            invalid=false: the list card, same shape as a search card (ProductCard). invalid=true:
            InvalidFavoriteCard, only the title and the image.
          oneOf:
            - $ref: '#/components/schemas/ProductCard'
            - $ref: '#/components/schemas/InvalidFavoriteCard'
    FavoriteListData:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FavoriteItem'
        next_cursor:
          type:
            - string
            - 'null'
    FavoriteListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/FavoriteListData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    FavoriteRef:
      type: object
      additionalProperties: false
      required:
        - platform
        - product_key
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        product_key:
          $ref: '#/components/schemas/ProductKey'
    BatchDeleteFavoritesRequest:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/FavoriteRef'
    PriceTrendPoint:
      type: object
      additionalProperties: false
      required:
        - date
        - final_price_fen
      properties:
        date:
          type: string
          format: date
          description: Natural day in +08:00 (YYYY-MM-DD).
        final_price_fen:
          $ref: '#/components/schemas/Fen'
    ProductPriceTrend:
      type: object
      additionalProperties: false
      required:
        - status
        - points
        - start_date
        - window_days
        - source_key
      properties:
        status:
          type: string
          description: ok = points to draw; no_data = show price_trend.empty.
          enum:
            - ok
            - no_data
        points:
          type: array
          description: One point per day in date order; empty when status=no_data.
          items:
            $ref: '#/components/schemas/PriceTrendPoint'
        start_date:
          type:
            - string
            - 'null'
          format: date
          description: Date of the first record in the window; null when status=no_data.
        window_days:
          type: integer
          format: int32
          description: Window length in days, 30.
          enum:
            - 30
        source_key:
          type: string
          description: Text key of the source line (price_trend.source.general for a product without coupon).
          enum:
            - price_trend.source
            - price_trend.source.general
    ProductPriceTrendResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ProductPriceTrend'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ParseInputRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - scene
      properties:
        text:
          type: string
          description: |
            Locally filtered clipboard or typed text (03 §4.6). Text outside links and tokens
            is untrusted (BR-AI-05); prices in it are only material.claimed_price_fen.
          minLength: 1
          maxLength: 4000
        scene:
          type: string
          description: |
            Entry the text came from (subset of contracts/enums scene). Attribution-bearing
            scenes (share, agent, …) cannot be chosen by the client: share links come only from
            POST /v1/shares (phone level), Agent cards from the Agent service (BR-ATTR-05, 08).
            share_ext is P1.
          enum:
            - clipboard
            - search
            - share_ext
    InputHit:
      type: object
      description: One candidate found by parse_input (04 §8.5).
      additionalProperties: false
      required:
        - platform
        - kind
        - raw
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        kind:
          type: string
          description: contracts/enums/trade.yaml input_kind.
          enum:
            - tpwd
            - url
            - text
        raw:
          type: string
          description: The matched link or token as it appeared in the input.
    ParseResult:
      type: object
      description: |
        Result of one hit; exactly one of `card` and `error_code` is present. The oneOf branches
        declare the property they require (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - hit
      properties:
        hit:
          $ref: '#/components/schemas/InputHit'
        card:
          $ref: '#/components/schemas/ProductCard'
        error_code:
          type: integer
          format: int32
          minimum: 10000
          maximum: 59999
          description: Error code for this hit (30131, 30132, 30141, 50301…), see error-codes.yaml.
      oneOf:
        - type: object
          properties:
            card:
              $ref: '#/components/schemas/ProductCard'
          required:
            - card
        - type: object
          properties:
            error_code:
              type: integer
              format: int32
              minimum: 10000
              maximum: 59999
          required:
            - error_code
    ParseInputData:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ParseResult'
    ParseInputResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ParseInputData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    OpenLinkRequest:
      type: object
      additionalProperties: false
      properties:
        installed:
          $ref: '#/components/schemas/InstalledState'
          description: Default unknown; H5 always sends unknown (BR-ATTR-27 ①).
        no_rebate:
          type: boolean
          default: false
          description: Buy without rebate (BR-ID-18).
        no_rebate_reason:
          type: string
          description: |
            Only with no_rebate=true; default auth_declined. The server overrides it with
            relation_conflict / binding_blocked when it decides so (BR-ID-18).
          enum:
            - auth_declined
            - auth_failed
        spm:
          type: string
          description: page.module.slot of the tapped button (03 §4.7).
          maxLength: 128
    OpenLinkResult:
      type: object
      description: |
        Response of open (04 §8.4). old_final_price_fen is the link's quoted_final_price_fen;
        price_changed when |new − old| ≥ 100 fen or ≥ 5 % of old, both directions (BR-PRICE-13).
        Prices and rebates are null on amount_unknown links, which are not re-checked. There is no
        rebate_basis: no rebate is expressed by new_rebate_max_fen = 0 (BR-PRICE-08, BR-PRICE-13).
      additionalProperties: false
      required:
        - attempt_id
        - jump
        - price_changed
        - old_final_price_fen
        - new_final_price_fen
        - new_link_id
        - requote_failed
        - new_rebate_min_fen
        - new_rebate_max_fen
        - availability
        - quoted_at
      properties:
        attempt_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Issued by the server for this open attempt: a new one for every open of a link, the
            same one when the same Idempotency-Key is replayed. The client sends it in every
            link_jump of this jump (BR-ATTR-21 细则「待跟单卡按实际外跳选」).
        no_rebate_cause:
          description: |
            Non-null only when new_rebate_max_fen = 0 and the reason is known; unknown values are
            treated as null. Not the request's no_rebate_reason (BR-ID-18).
          anyOf:
            - $ref: '#/components/schemas/NoRebateCause'
            - type: 'null'
        jump:
          $ref: '#/components/schemas/JumpPlan'
        price_changed:
          type: boolean
        old_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_link_id:
          type:
            - string
            - 'null'
          description: |
            Set whenever the new price differs from the snapshot, or when a new link was
            registered for the current user (BR-PRICE-12, BR-ATTR-05 ③); the client replaces the
            card with it whether or not the user continues.
        requote_failed:
          type: boolean
          description: |
            Re-check failed: the user's cached link (≤ 900 s) is used, or, for a `no_rebate=true`
            open, the no-rebate conversion or unpromoted product page (BR-PRICE-13).
        new_rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        new_rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        availability:
          $ref: '#/components/schemas/Availability'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
    OpenLinkResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/OpenLinkResult'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ConvertLinkRequest:
      type: object
      description: |
        Either product_key (with the tapped card's item_ref) or url; neither, or both, is 20001.
        The oneOf branches declare the property they require (strict Ajv2020, ADR-0001 §4.2 #15).
        A Taobao url is first resolved to an item_id and answered with a Baichuan open instruction
        (JumpStep.sdk); the pasted link or token itself is never passed on (BR-PRICE-21).
      additionalProperties: false
      required:
        - platform
        - scene
      oneOf:
        - type: object
          properties:
            product_key:
              $ref: '#/components/schemas/ProductKey'
          required:
            - product_key
        - type: object
          properties:
            url:
              type: string
              format: uri
              maxLength: 2048
          required:
            - url
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        product_key:
          $ref: '#/components/schemas/ProductKey'
        item_ref:
          $ref: '#/components/schemas/ItemRef'
        url:
          type: string
          format: uri
          maxLength: 2048
        scene:
          type: string
          description: |
            Only the H5 entry (trade.convertAndOpen) uses convert (拍板第二批 TRADE-03); other
            scenes are rejected with 20001 so that the client cannot pick an attribution scene
            such as share (BR-ATTR-05, BR-ATTR-08).
          enum:
            - h5
        spm:
          type: string
          maxLength: 128
        installed:
          $ref: '#/components/schemas/InstalledState'
          description: Default unknown; H5 always sends unknown (BR-ATTR-27 ①).
    ConvertLinkData:
      type: object
      description: The registered link_id plus the same fields as the open result (04 §6.3).
      additionalProperties: false
      required:
        - link_id
        - attempt_id
        - jump
        - price_changed
        - old_final_price_fen
        - new_final_price_fen
        - new_link_id
        - requote_failed
        - new_rebate_min_fen
        - new_rebate_max_fen
        - availability
        - quoted_at
      properties:
        attempt_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Issued by the server for this open attempt: a new one for every open of a link, the
            same one when the same Idempotency-Key is replayed. The client sends it in every
            link_jump of this jump (BR-ATTR-21 细则「待跟单卡按实际外跳选」).
        no_rebate_cause:
          description: |
            Non-null only when new_rebate_max_fen = 0 and the reason is known; unknown values are
            treated as null. Not the request's no_rebate_reason (BR-ID-18).
          anyOf:
            - $ref: '#/components/schemas/NoRebateCause'
            - type: 'null'
        link_id:
          $ref: '#/components/schemas/Id'
        jump:
          $ref: '#/components/schemas/JumpPlan'
        price_changed:
          type: boolean
        old_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_link_id:
          type:
            - string
            - 'null'
        requote_failed:
          type: boolean
        new_rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        new_rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        availability:
          $ref: '#/components/schemas/Availability'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
    ConvertLinkResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ConvertLinkData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    LinkKind:
      type: string
      description: Kind of a link on the in-app landing page (contracts/enums/trade.yaml link_kind).
      enum:
        - share
        - other
    SharedProductCard:
      type: object
      description: |
        Product card subset of the share page and the in-app link landing page (04 §6.3): the
        fields of ProductCard without rebate_min_fen, rebate_max_fen, rebate_basis,
        no_rebate_cause and est_net_price_fen (no rebate amount is shown to the opener,
        BR-PRICE-06, BR-ATTR-10), without cta (its key is derived from the rebate state), and
        without the Agent-only card_id, match_tag and spec_text. quoted_at sits next to the card.
      additionalProperties: false
      required:
        - product_key
        - item_ref
        - platform
        - title
        - image
        - price_fen
        - coupon_fen
        - final_price_fen
        - benefit_tags
        - is_presale
        - link_id
        - stale
        - age_sec
        - source
        - disclaimer_keys
        - availability
      properties:
        product_key:
          type:
            - string
            - 'null'
          description: Opaque product key (BR-PROD-02); null only on amount_unknown cards.
          minLength: 3
          maxLength: 128
        item_ref:
          type:
            - string
            - 'null'
          description: Opaque signed reference passed through unchanged (BR-PROD-11).
          minLength: 1
          maxLength: 1024
        platform:
          $ref: '#/components/schemas/PlatformCode'
        shop_type:
          type:
            - string
            - 'null'
          description: Shop type, e.g. tmall for Tmall shops on taobao.
        title:
          type:
            - string
            - 'null'
        image:
          type:
            - string
            - 'null'
          format: uri
        shop_name:
          type:
            - string
            - 'null'
        price_fen:
          $ref: '#/components/schemas/NullableFen'
        coupon_fen:
          $ref: '#/components/schemas/NullableFen'
        final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        benefit_tags:
          type: array
          description: Server-generated labels (有券, 预售…).
          items:
            type: string
        is_presale:
          type: boolean
          description: Presale; shown with the total price (BR-PRICE-22).
        tlj:
          $ref: '#/components/schemas/ProductTlj'
        link_id:
          $ref: '#/components/schemas/Id'
        stale:
          type: boolean
        age_sec:
          type:
            - integer
            - 'null'
          format: int32
          description: Age of the price in seconds, computed by the server (BR-PRICE-11).
        source:
          type: string
          description: Price source (BR-PRICE-16).
          enum:
            - taobao_union
            - jd_union
            - pdd_union
        disclaimer_keys:
          type: array
          description: Ordered dictionary keys (BR-PRICE-17), including price_basis.
          items:
            type: string
        ad_label:
          type:
            - string
            - 'null'
          description: Ad label (BR-TEXT-17).
        availability:
          $ref: '#/components/schemas/Availability'
    LinkLandingData:
      type: object
      additionalProperties: false
      required:
        - link_kind
        - product_card
        - quoted_at
        - viewer_is_sharer
      properties:
        link_kind:
          $ref: '#/components/schemas/LinkKind'
        product_card:
          $ref: '#/components/schemas/SharedProductCard'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Receipt time of the union response the price is based on (BR-PRICE-11).
        viewer_is_sharer:
          type: boolean
          description: |
            True only when called with a token whose user is the sharer of this share link; only
            for the hint above the card (BR-ATTR-11). False for anonymous calls and other links.
    LinkLandingResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/LinkLandingData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SharePageData:
      type: object
      additionalProperties: false
      required:
        - product_card
        - quoted_at
        - jump_url
        - tpwd_ticket
        - open_in_app_url
      properties:
        product_card:
          $ref: '#/components/schemas/SharedProductCard'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Receipt time of the union response the price is based on (BR-PRICE-11).
        jump_url:
          type: string
          format: uri
          description: The sharer's converted short link used for the jump; never contains a token.
        tpwd_ticket:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 256
          description: |
            Short-lived ticket for POST /v1/share-pages/{link_id}/tpwd; null inside WeChat, without
            User-Agent, or when the link has no token (BR-ATTR-10 细则).
        open_in_app_url:
          type:
            - string
            - 'null'
          format: uri
          description: LinkLanding deep link; null while share.open_in_app.enabled is off.
    SharePageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SharePageData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ShareTpwdRequest:
      type: object
      additionalProperties: false
      required:
        - ticket
      properties:
        ticket:
          type: string
          description: tpwd_ticket from GET /v1/share-pages/{link_id}.
          minLength: 1
          maxLength: 256
    ShareTpwdData:
      type: object
      additionalProperties: false
      required:
        - tpwd
      properties:
        tpwd:
          type: string
          minLength: 1
          description: The token of the share link, to be copied by the page.
    ShareTpwdResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ShareTpwdData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    EarningsPeriod:
      type: object
      description: One period of the self or share column (BR-FUND-25).
      additionalProperties: false
      required:
        - paid_count
        - est_fen
        - credited_fen
      properties:
        paid_count:
          type: integer
          format: int32
          minimum: 0
          description: Paid child orders attributed to the user in the period (by paid_at).
        est_fen:
          type: integer
          format: int64
          minimum: 0
          description: Estimated share of the user, by paid_at.
        credited_fen:
          type: integer
          format: int64
          description: Signed sum of the credit entries by accounting_date; negative when the period has only reversals.
    ReferralEarningsPeriod:
      type: object
      description: One period of the referral column (BR-FUND-25); no count.
      additionalProperties: false
      required:
        - est_fen
        - credited_fen
      properties:
        est_fen:
          type: integer
          format: int64
          minimum: 0
          description: Estimated direct and indirect referral share, by paid_at.
        credited_fen:
          type: integer
          format: int64
          description: Signed sum of the REFERRAL_CREDIT entries by accounting_date.
    EarningsColumn:
      type: object
      description: Self or share column, four periods.
      additionalProperties: false
      required:
        - today
        - yesterday
        - this_month
        - last_month
      properties:
        today:
          $ref: '#/components/schemas/EarningsPeriod'
        yesterday:
          $ref: '#/components/schemas/EarningsPeriod'
        this_month:
          $ref: '#/components/schemas/EarningsPeriod'
        last_month:
          $ref: '#/components/schemas/EarningsPeriod'
    ReferralEarnings:
      type: object
      description: Referral column, only this month and last month, all platforms.
      additionalProperties: false
      required:
        - this_month
        - last_month
      properties:
        this_month:
          $ref: '#/components/schemas/ReferralEarningsPeriod'
        last_month:
          $ref: '#/components/schemas/ReferralEarningsPeriod'
    EarningsSummary:
      type: object
      additionalProperties: false
      required:
        - as_of
        - self
        - share
        - referral
      properties:
        as_of:
          type: string
          format: date-time
          description: Time the figures were computed (BR-FUND-25 细则).
        self:
          $ref: '#/components/schemas/EarningsColumn'
        share:
          $ref: '#/components/schemas/EarningsColumn'
        referral:
          description: null while earnings.dashboard.referral_visible is off.
          anyOf:
            - $ref: '#/components/schemas/ReferralEarnings'
            - type: 'null'
    EarningsSummaryResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/EarningsSummary'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminLoginTicket:
      type: string
      description: |
        Intermediate credential of the admin login (BR-ID-34 细则「首次绑定身份验证器」): valid only for
        the step it was issued for, sent in the request body, never an admin_token.
      minLength: 1
      maxLength: 2048
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Account name (unique; a disabled account keeps its name, BR-ID-34).
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
    AdminLoginTicketRequest:
      type: object
      additionalProperties: false
      required:
        - login_ticket
      properties:
        login_ticket:
          $ref: '#/components/schemas/AdminLoginTicket'
    AdminChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - login_ticket
        - new_password
      properties:
        login_ticket:
          $ref: '#/components/schemas/AdminLoginTicket'
        new_password:
          type: string
          description: Must differ from the initial password; composition rules are set by the server.
          minLength: 1
          maxLength: 128
    AdminTotpCode:
      type: string
      description: Current 6-digit code of the authenticator, or of the SMS for the sms tier.
      pattern: '^[0-9]{6}$'
    AdminTotpCodeRequest:
      type: object
      additionalProperties: false
      required:
        - login_ticket
        - code
      properties:
        login_ticket:
          $ref: '#/components/schemas/AdminLoginTicket'
        code:
          $ref: '#/components/schemas/AdminTotpCode'
    AdminLoginStep:
      type: string
      description: Next login step (enum admin_login_step).
      enum:
        - totp
        - change_password
        - bind_totp
    AdminLoginStepData:
      type: object
      additionalProperties: false
      required:
        - next
        - login_ticket
        - ticket_expires_at
      properties:
        next:
          $ref: '#/components/schemas/AdminLoginStep'
        login_ticket:
          $ref: '#/components/schemas/AdminLoginTicket'
        ticket_expires_at:
          type: string
          format: date-time
    AdminLoginStepResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminLoginStepData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminTotpSecretData:
      type: object
      additionalProperties: false
      required:
        - totp_secret
        - otpauth_uri
      properties:
        totp_secret:
          type: string
          description: Base32 TOTP secret, shown for manual entry.
          minLength: 16
          maxLength: 128
          pattern: '^[A-Z2-7]+=*$'
        otpauth_uri:
          type: string
          description: Key URI the console renders as the QR code.
          maxLength: 2048
          pattern: '^otpauth://totp/'
    AdminTotpSecretResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminTotpSecretData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminSession:
      type: object
      additionalProperties: false
      required:
        - admin_token
        - expires_at
        - idle_timeout_sec
      properties:
        admin_token:
          type: string
          description: Sent in the Authorization header as a Bearer token (security scheme adminBearerAuth).
          minLength: 1
          maxLength: 4096
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry of the session (BR-ID-34).
        idle_timeout_sec:
          type: integer
          format: int32
          minimum: 1
          description: Seconds without activity after which the token stops working (BR-ID-34).
    AdminSessionResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminSession'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminStepUpTier:
      type: string
      description: Admin step-up tier (enum admin_step_up_tier, BR-ID-34).
      enum:
        - totp
        - sms
    AdminStepUpRequest:
      type: object
      additionalProperties: false
      required:
        - tier
        - code
      properties:
        tier:
          $ref: '#/components/schemas/AdminStepUpTier'
        code:
          $ref: '#/components/schemas/AdminTotpCode'
    AdminStepUpData:
      type: object
      additionalProperties: false
      required:
        - step_up_token
        - tier
        - expire_at
      properties:
        step_up_token:
          type: string
          description: Sent as the `X-Step-Up-Token` header of the admin operation; records its tier.
          minLength: 1
          maxLength: 2048
        tier:
          $ref: '#/components/schemas/AdminStepUpTier'
        expire_at:
          type: string
          format: date-time
    AdminStepUpResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminStepUpData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminPermissionKey:
      type: string
      description: |
        A value of contracts/enums/admin.yaml `admin_permission` (04 §11). Kept a string here so the
        list lives in one place; clients ignore keys they do not know.
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z_]*(\.[a-z_]+)*$'
    AdminStepUpOperation:
      type: object
      additionalProperties: false
      required:
        - operation
        - tier
      properties:
        operation:
          type: string
          description: Operation key from specs/permissions.yaml (B1-18).
          minLength: 1
          maxLength: 128
          pattern: '^[a-z][a-z0-9_]*(\.[a-z0-9_]+)*$'
        tier:
          $ref: '#/components/schemas/AdminStepUpTier'
    AdminPermissionGrant:
      type: object
      description: A permission point of the account with its step-up annotation (04 §11 step-up column).
      additionalProperties: false
      required:
        - key
        - step_up_tier
        - step_up_operations
      properties:
        key:
          $ref: '#/components/schemas/AdminPermissionKey'
        step_up_tier:
          description: Tier of every step-up operation of this point; null = none needs step-up.
          anyOf:
            - $ref: '#/components/schemas/AdminStepUpTier'
            - type: 'null'
        step_up_operations:
          type: array
          description: Operations of this point whose tier differs from step_up_tier.
          items:
            $ref: '#/components/schemas/AdminStepUpOperation'
    AdminMe:
      type: object
      additionalProperties: false
      required:
        - admin_id
        - username
        - is_super
        - verify_phone_masked
        - permissions
      properties:
        admin_id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          description: Account name, also shown as the display name.
          minLength: 1
          maxLength: 64
        is_super:
          type: boolean
        verify_phone_masked:
          type:
            - string
            - 'null'
          description: Masked verify phone (BR-ID-33); null = none registered, sms tier unavailable.
          maxLength: 32
        permissions:
          type: array
          description: Every point for a super admin, the ticked points otherwise; empty = no permission.
          items:
            $ref: '#/components/schemas/AdminPermissionGrant'
    AdminMeResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminMe'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminAccountStatus:
      type: string
      description: Admin account status (enum admin_account_status).
      enum:
        - active
        - disabled
    AdminAccount:
      type: object
      description: Read-only view of an admin account; no password, hash, TOTP secret or full phone.
      additionalProperties: false
      required:
        - admin_id
        - username
        - is_super
        - status
        - totp_bound
        - verify_phone_masked
        - locked_until
        - permissions
        - created_at
      properties:
        admin_id:
          $ref: '#/components/schemas/Id'
        username:
          type: string
          minLength: 1
          maxLength: 64
        is_super:
          type: boolean
        status:
          $ref: '#/components/schemas/AdminAccountStatus'
        totp_bound:
          type: boolean
          description: false = the next login goes through the first binding.
        verify_phone_masked:
          type:
            - string
            - 'null'
          maxLength: 32
        locked_until:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the current login lock; null when not locked.
        permissions:
          type: array
          description: Ticked points (admin_permissions); empty for a super admin, who has every point.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AdminPermissionKey'
        created_at:
          type: string
          format: date-time
    AdminAccountResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminAccount'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminAccountPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccount'
        page:
          type: integer
          format: int32
          minimum: 1
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int32
          minimum: 0
    AdminAccountPageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminAccountPage'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    PlatformIconKey:
      type: string
      description: |
        Platform mark key (enum platform_icon_key, BR-TEXT-24 细则标识键表); the keys of /v1/config
        `platform_icons` (ConfigPlatformIcons) are the same list.
      enum:
        - taobao
        - tmall
        - jd
        - pdd
        - wechat
        - wechat_pay
        - alipay
        - wecom
    AdminPlatformIconFormat:
      type: string
      description: Format of a cleaned platform mark file.
      enum:
        - svg
        - png
    AdminPlatformIconSha256:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Lowercase hex SHA-256 of the cleaned file, the same digest as its file name.
    AdminPlatformIconUrl:
      type: string
      format: uri
      pattern: '^https://'
      maxLength: 2048
      description: |
        Cleaned file on the media domain (set by deployment), named by its SHA-256; shown only as
        an image (`<img>`), never inlined into the page.
    AdminPlatformIconSourceUrl:
      type: string
      format: uri
      pattern: '^https?://'
      maxLength: 2048
      description: Official brand or asset download page the file was taken from (BR-TEXT-24 细则「必填登记」).
    AdminPlatformIconVersion:
      type: object
      description: One saved version of a platform mark (BR-TEXT-24).
      additionalProperties: false
      required:
        - version
        - url
        - sha256
        - format
        - bytes
        - sanitized
        - source_url
        - downloaded_on
        - publishable
        - ever_published
        - revision
        - created_by
        - created_at
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          description: Counted per mark from 1; the same number /v1/config sends once published.
        url:
          $ref: '#/components/schemas/AdminPlatformIconUrl'
        sha256:
          $ref: '#/components/schemas/AdminPlatformIconSha256'
        format:
          $ref: '#/components/schemas/AdminPlatformIconFormat'
        bytes:
          type: integer
          format: int32
          minimum: 1
          description: Size of the cleaned file.
        sanitized:
          type: boolean
          description: true = the cleaned file differs from the uploaded original.
        source_url:
          anyOf:
            - $ref: '#/components/schemas/AdminPlatformIconSourceUrl'
            - type: 'null'
        downloaded_on:
          type:
            - string
            - 'null'
          format: date
          description: Date the file was downloaded from the source page; null = not registered.
        publishable:
          type: boolean
          description: true = both source_url and downloaded_on are registered; false = draft.
        ever_published:
          type: boolean
          description: true = published at least once; its registration can no longer be changed.
        revision:
          type: integer
          format: int32
          minimum: 1
          description: |
            1 when saved, plus 1 on every registration change (PATCH .../versions/{version}); the
            CAS value of that PATCH.
        created_by:
          type: string
          minLength: 1
          maxLength: 64
          description: Username of the admin who saved the version.
        created_at:
          type: string
          format: date-time
    AdminPlatformIcon:
      type: object
      description: A platform mark and its published version (null = built-in image).
      additionalProperties: false
      required:
        - key
        - current_version
        - revision
        - current
        - latest_version
        - updated_by
        - updated_at
      properties:
        key:
          $ref: '#/components/schemas/PlatformIconKey'
        current_version:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          description: Published version; null = the client shows the bundled image.
        revision:
          type: integer
          format: int32
          minimum: 0
          description: |
            0 until the first publish; plus 1 on every publish, rollback and restore-builtin, never
            going back (saving or registering a version does not change it). The CAS value of
            publish and restore-builtin, so a retried old request cannot undo a later change.
        current:
          anyOf:
            - $ref: '#/components/schemas/AdminPlatformIconVersion'
            - type: 'null'
        latest_version:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          description: Newest saved version, drafts included; null = nothing saved yet.
        updated_by:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Username of the admin who last saved, published, rolled back or restored; null = never changed.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    AdminPlatformIconList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: Every key of enum platform_icon_key once, in enum order.
          items:
            $ref: '#/components/schemas/AdminPlatformIcon'
    AdminPlatformIconListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminPlatformIconList'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminPlatformIconResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminPlatformIcon'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminPlatformIconVersionResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminPlatformIconVersion'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminPlatformIconVersionPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          description: Newest version first.
          items:
            $ref: '#/components/schemas/AdminPlatformIconVersion'
        page:
          type: integer
          format: int32
          minimum: 1
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int32
          minimum: 0
    AdminPlatformIconVersionPageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminPlatformIconVersionPage'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminPlatformIconUploadRequest:
      type: object
      description: multipart/form-data body of a platform mark upload; one part `file`.
      additionalProperties: false
      required:
        - file
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: The SVG or PNG file as uploaded (BR-TEXT-24 细则「上传与发布」).
    AdminPlatformIconUpload:
      type: object
      description: |
        The cleaned file of an upload, not yet a version. Saved with POST
        /admin/v1/platform-icons/{key}/versions until `expires_at`.
      additionalProperties: false
      required:
        - upload_id
        - url
        - sha256
        - format
        - bytes
        - sanitized
        - expires_at
      properties:
        upload_id:
          $ref: '#/components/schemas/Id'
        url:
          $ref: '#/components/schemas/AdminPlatformIconUrl'
        sha256:
          $ref: '#/components/schemas/AdminPlatformIconSha256'
        format:
          $ref: '#/components/schemas/AdminPlatformIconFormat'
        bytes:
          type: integer
          format: int32
          minimum: 1
          description: Size of the cleaned file.
        sanitized:
          type: boolean
          description: |
            true = the cleaned file differs from the original: the console shows 「已清除不安全内容」
            and saving needs sanitized_confirmed=true.
        expires_at:
          type: string
          format: date-time
    AdminPlatformIconUploadResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminPlatformIconUpload'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminPlatformIconVersionCreateRequest:
      type: object
      additionalProperties: false
      required:
        - upload_id
      properties:
        upload_id:
          $ref: '#/components/schemas/Id'
        sanitized_confirmed:
          type: boolean
          description: |
            The operator confirmed the cleaned preview; absent means false. Must be true when the
            upload has sanitized=true.
        source_url:
          $ref: '#/components/schemas/AdminPlatformIconSourceUrl'
        downloaded_on:
          type: string
          format: date
    AdminPlatformIconSourceRequest:
      type: object
      description: The version's revision as shown plus at least one of the two registrations.
      additionalProperties: false
      required:
        - expected_revision
      minProperties: 2
      properties:
        expected_revision:
          type: integer
          format: int32
          minimum: 1
          description: The version's `revision` as the console showed it; a mismatch is 20902.
        source_url:
          $ref: '#/components/schemas/AdminPlatformIconSourceUrl'
        downloaded_on:
          type: string
          format: date
    AdminPlatformIconPublishRequest:
      type: object
      additionalProperties: false
      required:
        - version
        - expected_revision
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
          description: Version to publish; older than the current one = rollback.
        expected_revision:
          type: integer
          format: int32
          minimum: 0
          description: The mark's `revision` as the console showed it; a mismatch is 20902.
    AdminPlatformIconRestoreRequest:
      type: object
      additionalProperties: false
      required:
        - expected_revision
      properties:
        expected_revision:
          type: integer
          format: int32
          minimum: 0
          description: The mark's `revision` as the console showed it; a mismatch is 20902.
    AdminConfigKey:
      type: string
      description: |
        A configuration or emergency-switch key (04 §10, §10.2): dotted segments, concrete per
        platform or channel (`convert.enabled.taobao`); the server's registry decides which keys
        exist.
      minLength: 1
      maxLength: 128
      pattern: '^[a-z][a-z0-9_]*(\.[A-Za-z0-9_]+)*$'
    AdminConfigValue:
      description: |
        Any JSON value of the key's `value_type` (an `enum` value is one of `options`); checked by
        the server against the key's registered type and rule, a mismatch → 20001 with
        data.fields=[value].
    AdminConfigValueType:
      type: string
      description: |
        Type of a configuration or switch value: boolean, enum (a string out of `options`), object
        (a JSON object or array, such as a list of routes or hosts), number or string.
      enum:
        - boolean
        - enum
        - object
        - number
        - string
    AdminConfigOptions:
      type:
        - array
        - 'null'
      description: Allowed values when `value_type` is enum; null for every other type.
      items:
        type: string
        minLength: 1
        maxLength: 64
    AdminConfigVersionNumber:
      type: integer
      format: int32
      minimum: 0
      description: |
        Version of the key's current value: 0 = never written (value null, the default applies);
        plus 1 on every change or rollback, never going back. The CAS value `expected_version`
        of the writes.
    AdminConfigReason:
      type: string
      minLength: 1
      maxLength: 200
      description: Optional free-text reason, kept in the audit record and the history version.
    AdminKillSwitch:
      type: object
      description: A registered emergency switch (04 §10.2) and its current value.
      additionalProperties: false
      required:
        - key
        - value
        - default
        - value_type
        - options
        - permissions
        - admin_editable
        - version
        - updated_by
        - updated_at
      properties:
        key:
          $ref: '#/components/schemas/AdminConfigKey'
        value:
          description: Current value; null = never written, `default` applies.
          anyOf:
            - $ref: '#/components/schemas/AdminConfigValue'
            - type: 'null'
        default:
          $ref: '#/components/schemas/AdminConfigValue'
        value_type:
          $ref: '#/components/schemas/AdminConfigValueType'
        options:
          $ref: '#/components/schemas/AdminConfigOptions'
        permissions:
          type: array
          description: Permission points of which any one may change the switch (04 §11.2).
          minItems: 1
          items:
            $ref: '#/components/schemas/AdminPermissionKey'
        admin_editable:
          type: boolean
          description: |
            false = the console shows the switch read only and a change is 20001 [key]. For
            `withdraw.auto_payout.enabled` true means it can only be turned off: the console offers
            `false` only and a change to `true` is 20001 [value] (BR-WDR-30).
        version:
          $ref: '#/components/schemas/AdminConfigVersionNumber'
        updated_by:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Username of the admin who last changed it; null = never changed or set by the system.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    AdminKillSwitchPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          description: Registered switches in registry order.
          items:
            $ref: '#/components/schemas/AdminKillSwitch'
        page:
          type: integer
          format: int32
          minimum: 1
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int32
          minimum: 0
    AdminKillSwitchPageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminKillSwitchPage'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminKillSwitchResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminKillSwitch'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminKillSwitchUpdateRequest:
      type: object
      additionalProperties: false
      required:
        - value
        - expected_version
      properties:
        value:
          $ref: '#/components/schemas/AdminConfigValue'
        expected_version:
          allOf:
            - $ref: '#/components/schemas/AdminConfigVersionNumber'
          description: The switch's `version` as the console showed it; a mismatch is 20902.
        reason:
          $ref: '#/components/schemas/AdminConfigReason'
    AdminConfigItem:
      type: object
      description: A registered configuration item (04 §10) and its current value.
      additionalProperties: false
      required:
        - key
        - value
        - value_type
        - options
        - permission
        - admin_editable
        - version
        - updated_by
        - updated_at
      properties:
        key:
          $ref: '#/components/schemas/AdminConfigKey'
        value:
          description: Current value; null = never written, the server's built-in default applies.
          anyOf:
            - $ref: '#/components/schemas/AdminConfigValue'
            - type: 'null'
        value_type:
          $ref: '#/components/schemas/AdminConfigValueType'
        options:
          $ref: '#/components/schemas/AdminConfigOptions'
        permission:
          allOf:
            - $ref: '#/components/schemas/AdminPermissionKey'
          description: The config.* point that guards changing the item, and so its step-up tier.
        admin_editable:
          type: boolean
          description: false = the console shows the item read only and a change is 20001 [key].
        version:
          $ref: '#/components/schemas/AdminConfigVersionNumber'
        updated_by:
          type:
            - string
            - 'null'
          maxLength: 64
          description: Username of the admin who last changed it; null = never changed or set by the system.
        updated_at:
          type:
            - string
            - 'null'
          format: date-time
    AdminConfigItemPage:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - page_size
        - total
      properties:
        items:
          type: array
          description: Registered configuration items in registry order.
          items:
            $ref: '#/components/schemas/AdminConfigItem'
        page:
          type: integer
          format: int32
          minimum: 1
        page_size:
          type: integer
          format: int32
          minimum: 1
          maximum: 200
        total:
          type: integer
          format: int32
          minimum: 0
    AdminConfigItemPageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminConfigItemPage'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminConfigItemResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AdminConfigItem'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    AdminConfigItemList:
