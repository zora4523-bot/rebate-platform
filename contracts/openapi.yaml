          required: true
          description: Platform to search (enum platform).
          schema:
            $ref: '#/components/schemas/PlatformCode'
        - name: q
          in: query
          required: true
          description: Keyword.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          required: false
          description: Sort order (enum sort); default relevance.
          schema:
            $ref: '#/components/schemas/SortCode'
        - name: has_coupon
          in: query
          required: false
          description: Only items with a coupon.
          schema:
            type: boolean
        - name: price_min_fen
          in: query
          required: false
          description: Lower bound of final_price_fen, inclusive.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: price_max_fen
          in: query
          required: false
          description: Upper bound of final_price_fen, inclusive.
          schema:
            type: integer
            format: int64
            minimum: 0
