components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <access_token>`; ES256 JWT with uid, app_id, sid, device_id, scp,
        valid 2 hours (BR-ID-07). After login app_id is taken from the token only.
    adminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <admin_token>` on every /admin/v1 operation after login (CT-02f).
        admin_token is a JWT signed with its own key (aud=admin, not accepted on /v1), valid
        8 hours and expiring after 30 minutes without activity (BR-ID-34); expired or idle → 10001
        without reason. The console keeps it only in memory and sessionStorage and sends it only in
        this header; it is never a cookie, so requests carry no ambient credential and need no
        CSRF token. The admin API allows CORS only from the exact admin console origin (02 §3.4).
        The step-up token of an operation goes in the `X-Step-Up-Token` header (04 §5).
  parameters:
    AppId:
      name: X-App-Id
      in: header
      required: true
      description: App (brand) the request belongs to; before login it must match the app_id the device was registered with (10403, BR-ID-07).
      schema:
        type: string
        minLength: 1
        maxLength: 32
        pattern: '^[a-z0-9_]+$'
    Platform:
      name: X-Platform
      in: header
      required: true
      description: Client platform (enum client_platform, 03 §4.2).
      schema:
        $ref: '#/components/schemas/ClientPlatformCode'
    AppVersion:
      name: X-App-Version
      in: header
      required: true
      description: SemVer, the same number on all three apps (拍板第二批 TECH-07).
      schema:
        type: string
        pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        maxLength: 32
    Build:
      name: X-Build
      in: header
      required: false
      description: Build number of the client.
      schema:
        type: string
        maxLength: 32
    Channel:
      name: X-Channel
      in: header
      required: false
      description: Install channel of the app package (enum install_channel); absent for H5.
      schema:
        $ref: '#/components/schemas/InstallChannelCode'
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      description: Client-generated trace id, echoed as `trace_id` when well-formed.
      schema:
        $ref: '#/components/schemas/TraceId'
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: device_id issued by POST /v1/devices; anything else is 10402 (BR-ID-09).
      schema:
        $ref: '#/components/schemas/Id'
    OptionalDeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: device_id issued by POST /v1/devices, when the device is registered.
      schema:
        $ref: '#/components/schemas/Id'
    Timestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix seconds; |server time − ts| ≤ 300 s (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9]{10}$'
    Nonce:
      name: X-Nonce
      in: header
      required: true
      description: 32 lowercase hex characters; (device_id, nonce) unique within 600 s (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9a-f]{32}$'
    Sign:
      name: X-Sign
      in: header
      required: true
      description: |
        lowercase_hex(HMAC-SHA256(install_secret, METHOD + "\n" + path with raw query + "\n" + ts
        + "\n" + nonce + "\n" + lowercase_hex(sha256(raw body)))) (BR-ID-09).
      schema:
        type: string
        pattern: '^[0-9a-f]{64}$'
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      description: |
        step_up_token from POST /v1/auth/step-up for the operation's x-step-up action (04 §5). Missing,
        expired or for another action → 10003 (not 20001; that is why the header is optional).
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    TipKeyPath:
      name: tip_key
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/TipKey'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Required on operations marked I (04 §6); missing → 20001. Same key while processing →
        40901; same key with another body → 20901; a retry after a timeout reuses the key and gets
        the first result (拍板第二批 TRADE-22). On the x-step-up operations a key abandoned through
        POST /v1/idempotency-keys/abandon → 20903, without comparing the body (04 §5「幂等」).
      schema:
        $ref: '#/components/schemas/IdempotencyKey'
    UnionPlatform:
      name: platform
      in: path
      required: true
      description: Platform code (enum platform).
      schema:
        $ref: '#/components/schemas/PlatformCode'
    PendingTrackLinkId:
      name: link_id
      in: path
      required: true
      description: |
        link_id of the pending-track card. Unlike other link operations an unknown link, or one that
        does not own the attempt_id in the body, is 20001 with data.fields=[attempt_id] (no 30144).
      schema:
        $ref: '#/components/schemas/Id'
    LinkId:
      name: link_id
      in: path
      required: true
      description: link_id from a card; unknown or of another app → 30144.
      schema:
        $ref: '#/components/schemas/Id'
    ProductKey:
      name: product_key
      in: path
      required: true
      description: Opaque product key, URL-encoded by the client (BR-PROD-02).
      schema:
        $ref: '#/components/schemas/ProductKey'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor`; absent for the first page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size, at most 50 (04 §5).
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 50
        default: 20
    AdminPage:
      name: page
      in: query
      required: false
      description: Page number of an admin list, from 1 (04 §5 后台分页).
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    AdminPageSize:
      name: page_size
      in: query
      required: false
      description: Page size of an admin list, at most 200 (04 §5 后台分页); above that → 20001.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    AdminIdPath:
      name: admin_id
      in: path
      required: true
      description: Id of an admin account; unknown → 20001 with data.fields=[admin_id].
      schema:
        $ref: '#/components/schemas/Id'
    AdminUserIdPath:
      name: user_id
      in: path
      required: true
      description: user_id of an app user of the console's app; unknown → 20001 with data.fields=[user_id].
      schema:
        $ref: '#/components/schemas/Id'
    AdminUserUnionPlatformPath:
      name: platform
      in: path
      required: true
      description: |
        Platform of the user's union binding (enum platform). Only platforms with user
        authorization have bindings (BR-ID-17); another platform, such as jd, → 20001 with
        data.fields=[platform].
      schema:
        $ref: '#/components/schemas/PlatformCode'
    AdminUserRiskStateFilter:
      name: risk_state
      in: query
      required: false
      description: Only users in this risk state (enum risk_state; no row counts as normal); absent = all.
      schema:
        $ref: '#/components/schemas/AdminUserRiskStateCode'
    AdminUserLookupUid:
      name: uid
      in: query
      required: false
      description: The user_id to look up; give exactly one of uid and phone (else 20001 with data.fields=[uid, phone]).
      schema:
        $ref: '#/components/schemas/Id'
    AdminUserLookupPhone:
      name: phone
      in: query
      required: false
      description: |
        The full phone number to look up, normalised as in BR-ID-05 细则「手机号规范化」 (not a
        mainland mobile number → 20001 with data.fields=[phone] and data.reason=phone_invalid);
        give exactly one of uid and phone.
      schema:
        $ref: '#/components/schemas/Phone'
    PlatformIconKeyPath:
      name: key
      in: path
      required: true
      description: Platform mark key (enum platform_icon_key); another value → 20001 with data.fields=[key].
      schema:
        $ref: '#/components/schemas/PlatformIconKey'
    PlatformIconVersionPath:
      name: version
      in: path
      required: true
      description: Version of the mark, counted per mark from 1; unknown → 20001 with data.fields=[version].
      schema:
        type: integer
        format: int32
        minimum: 1
    ConfigKeyPath:
      name: key
      in: path
      required: true
      description: |
        A configuration or emergency-switch key as registered by the server (04 §10, §10.2), dotted
        and concrete (`convert.enabled.taobao`, not `convert.enabled.<platform>`); an unregistered
        key → 20001 with data.fields=[key].
      schema:
        $ref: '#/components/schemas/AdminConfigKey'
    AdminStepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      description: |
        step_up_token from POST /admin/v1/auth/step-up, whose tier the operation checks (BR-ID-34;
        tier per permission point in GET /admin/v1/me/permissions). Missing, expired or of a lower
        tier than the operation needs → 10003 with data.tier (not 20001; that is why the header is
        optional). Only on admin console operations; app operations use StepUpToken.
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    AgentSessionId:
      name: id
      in: path
      required: true
      description: session_id. A session that does not exist or is not the caller's is 30504 either way (BR-AI-20).
      schema:
        $ref: '#/components/schemas/Id'
    AgentRunId:
      name: run_id
      in: path
      required: true
      description: run_id from meta.run_id or a history turn.
      schema:
        $ref: '#/components/schemas/Id'
    AgentMessageId:
      name: message_id
      in: path
      required: true
      description: |
        message_id from meta.message_id or a history item. A message that does not exist or whose
        session is not the caller's is 30504 either way (BR-AI-20).
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    NoStoreClientError:
      description: Same as ClientError, with Cache-Control no-store (share pages, BR-ATTR-10 细则).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unionAuthRequired:
              summary: 30101 Taobao not authorized
              value:
                code: 30101
                msg: 请先授权淘宝
                data:
                  auth_url: https://oauth.example.test/authorize?state=st_01
                  state: st_01
                  auth_methods:
                    - sdk_token
                    - web_code
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            pddAuthRequired:
              summary: 30111 Pinduoduo not authorized
              value:
                code: 30111
                msg: 请先授权拼多多
                data:
                  auth_jump:
                    primary:
                      type: universal_link
                      value: https://auth.example.test/pdd/authorize?state=st_02
                    fallbacks:
                      - type: h5
                        value: https://auth.example.test/pdd/authorize?state=st_02&web=1
                    expire_at: '2026-10-02T09:40:00+08:00'
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            phoneInvalid:
              summary: 20001 the phone does not normalise to a mainland mobile number
              value:
                code: 20001
                msg: 手机号格式不正确
                data:
                  fields:
                    - phone
                  reason: phone_invalid
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            invalidParams:
              summary: 20001 parameter validation failed
              value:
                code: 20001
                msg: 参数错误
                data:
                  fields:
                    - scene
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    NoStoreTooManyRequests:
      description: Same as TooManyRequests (42901 with Retry-After), with Cache-Control no-store (share pages).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          required: true
          description: Seconds to wait before retrying.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 42901
            msg: 请求过于频繁
            trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    NoStoreServerError:
      description: Same as ServerError, with Cache-Control no-store (share pages).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            searchUnavailable:
              summary: 50304 search unavailable for one platform
              value:
                code: 50304
                msg: 京东搜索暂不可用
                data:
                  platform: jd
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            searchDisabled:
              summary: 50304 search switched off for one platform
              value:
                code: 50304
                msg: 京东搜索已关闭
                data:
                  platform: jd
                  reason: search_disabled
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            notLaunched:
              summary: 50301 platform not launched yet
              value:
                code: 50301
                msg: 即将开放
                data:
                  platform: pdd
                  reason: not_launched
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    ClientError:
      description: |
        Business or request error. Clients act on `code` only (contracts/error-codes.yaml);
        the HTTP status per code is listed there as well.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            unionAuthRequired:
              summary: 30101 Taobao not authorized
              value:
                code: 30101
                msg: 请先授权淘宝
                data:
                  auth_url: https://oauth.example.test/authorize?state=st_01
                  state: st_01
                  auth_methods:
                    - sdk_token
                    - web_code
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            pddAuthRequired:
              summary: 30111 Pinduoduo not authorized
              value:
                code: 30111
                msg: 请先授权拼多多
                data:
                  auth_jump:
                    primary:
                      type: universal_link
                      value: https://auth.example.test/pdd/authorize?state=st_02
                    fallbacks:
                      - type: h5
                        value: https://auth.example.test/pdd/authorize?state=st_02&web=1
                    expire_at: '2026-10-02T09:40:00+08:00'
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            phoneInvalid:
              summary: 20001 the phone does not normalise to a mainland mobile number
              value:
                code: 20001
                msg: 手机号格式不正确
                data:
                  fields:
                    - phone
                  reason: phone_invalid
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            invalidParams:
              summary: 20001 parameter validation failed
              value:
                code: 20001
                msg: 参数错误
                data:
                  fields:
                    - scene
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    TooManyRequests:
      description: Rate limited (42901) with the required Retry-After header in seconds (BR-ID-05, BR-TEXT-14).
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
        Retry-After:
          required: true
          description: Seconds to wait before retrying.
          schema:
            type: integer
            format: int32
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            code: 42901
            msg: 请求过于频繁
            trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    ServerError:
      description: Server-side error; 503 codes carry `data.platform` / `data.reason` where listed.
      headers:
        X-Trace-Id:
          $ref: '#/components/headers/TraceId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            searchUnavailable:
              summary: 50304 search unavailable for one platform
              value:
                code: 50304
                msg: 京东搜索暂不可用
                data:
                  platform: jd
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            searchDisabled:
              summary: 50304 search switched off for one platform
              value:
                code: 50304
                msg: 京东搜索已关闭
                data:
                  platform: jd
                  reason: search_disabled
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
            notLaunched:
              summary: 50301 platform not launched yet
              value:
                code: 50301
                msg: 即将开放
                data:
                  platform: pdd
                  reason: not_launched
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
  headers:
    NoStore:
      required: true
      description: Always no-store; the response is not cached by the CDN or the browser (BR-ATTR-10 细则).
      schema:
        type: string
        enum:
          - no-store
    NoCache:
      required: true
      description: Always no-cache; the stream is neither cached nor buffered.
      schema:
        type: string
        enum:
          - no-cache
    TraceId:
      required: true
      description: The trace id of the request on every response, the same value as `trace_id` in the body (02 logging); echo of a well-formed X-Trace-Id request header, otherwise a generated UUID.
      schema:
        $ref: '#/components/schemas/TraceId'
  examples:
    AdminWrongPassword:
      summary: 10008 account or password wrong (no data)
      value:
        code: 10008
        msg: 账号或密码不正确
        trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    AdminLocked:
      summary: 10009 account locked until data.locked_until
      value:
        code: 10009
        msg: 账号已锁定，请稍后再试
        data:
          locked_until: '2026-10-07T10:30:00+08:00'
        trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    AdminIpNotAllowed:
      summary: 10403 source IP not on the admin whitelist
      value:
        code: 10403
        msg: 仅限公司网络访问
        data:
          reason: admin_ip_not_allowed
        trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    AdminPermissionDenied:
      summary: 10403 the account lacks the permission (here not a super admin)
      value:
        code: 10403
        msg: 当前账号没有这项操作的权限，请联系超级管理员开通
        data:
          reason: admin_permission_denied
        trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
