  schemas:
    EntryName:
      type: string
      description: Process entry that produced the response (ADR-0001 §2).
      enum:
        - api
        - stream
        - admin
        - worker
        - payout
    HealthzData:
      type: object
      additionalProperties: false
      required:
        - status
        - entry
        - now
      properties:
        status:
          type: string
          enum:
            - ok
        entry:
          $ref: '#/components/schemas/EntryName'
        now:
          type: string
          format: date-time
          description: Current instant of the process clock (follows CLOCK_NOW outside prod).
    HealthzResponse:
      type: object
      description: Response envelope of 规划/04 §5 carrying the health payload.
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/HealthzData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SuccessCode:
      type: integer
      format: int32
      description: 0 means success.
      enum:
        - 0
    TraceId:
      type: string
      description: Echo of a well-formed X-Trace-Id request header, otherwise a generated UUID.
      minLength: 1
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    Id:
      type: string
      description: Entity id, a UUIDv7 string (04 §5).
      minLength: 1
      maxLength: 64
    ProductKey:
      type: string
      description: |
        `<key_prefix>:<stable_id>`, at most 128 characters, opaque to clients (BR-PROD-02).
      minLength: 3
      maxLength: 128
    ItemRef:
      type: string
      description: Server-signed opaque product reference; passed through unchanged (BR-PROD-11).
      minLength: 1
      maxLength: 1024
    Fen:
      type: integer
      format: int64
      description: Amount in fen (ADR-0001 §4.2 item 3).
    NullableFen:
      type:
        - integer
        - 'null'
      format: int64
      description: Amount in fen, null when unknown.
    PlatformCode:
      type: string
      description: Platform (contracts/enums/platform.yaml platform).
      enum:
        - taobao
        - jd
        - pdd
        - meituan
        - vip
        - douyin
        - eleme
        - kuaishou
        - suning
    ClientPlatformCode:
      type: string
      description: Client platform (contracts/enums/platform.yaml client_platform).
      enum:
        - ios
        - android
        - harmony
        - h5
        - admin
    InstallChannelCode:
      type: string
      description: Install channel (contracts/enums/platform.yaml install_channel).
      enum:
        - appstore
        - official
        - huawei
        - agc
    SortCode:
      type: string
      description: Search sort (contracts/enums/trade.yaml sort).
      enum:
        - relevance
        - sales_desc
        - final_price_asc
        - rebate_desc
    RebateBasis:
      type: string
      description: |
        contracts/enums/trade.yaml rebate_basis. The three 查返利 states are derived from
        coupon_fen and rebate_basis only (BR-PRICE-21); amount_unknown and login_required are
        outside them.
      enum:
        - normal
        - price_compare_risk
        - no_rebate
        - amount_unknown
        - login_required
    Availability:
      type: string
      description: contracts/enums/trade.yaml availability.
      enum:
        - ok
        - off_shelf
        - coupon_gone
        - ref_expired
        - price_unavailable
        - unknown
    InstalledState:
      type: string
      description: |
        Whether the platform app is installed, as detected by the client (BR-ATTR-27 ①); the
        strings "true" / "false" / "unknown", default unknown; H5 always sends unknown.
      enum:
        - 'true'
        - 'false'
        - unknown
    JumpStep:
      type: object
      additionalProperties: false
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: contracts/enums/trade.yaml jump_type.
          enum:
            - sdk
            - scheme
            - universal_link
            - h5
            - copy_tpwd
        value:
          type: string
          minLength: 1
          description: URL, scheme or token to execute; produced by the server only.
    JumpPlan:
      type: object
      description: |
        Executed strictly in order; clients never build schemes or add fallbacks themselves
        (BR-ATTR-27, 03 §4.5). The client jumps only after a user tap (BR-ATTR-21).
      additionalProperties: false
      required:
        - primary
        - fallbacks
        - expire_at
      properties:
        primary:
          $ref: '#/components/schemas/JumpStep'
        fallbacks:
          type: array
          items:
            $ref: '#/components/schemas/JumpStep'
        expire_at:
          type: string
          format: date-time
          description: |
            Until when the returned union URL can be used directly (BR-ATTR-05); it does not
            limit opening the link_id again.
    IdempotencyKey:
      type: string
      description: Value of the Idempotency-Key header (04 §5「幂等」).
      minLength: 8
      maxLength: 64
      pattern: '^[A-Za-z0-9_-]+$'
    StepUpAction:
      type: string
      description: Action a step_up_token is bound to; one per x-step-up operation (04 §2.5, §5).
      enum:
        - withdraw
        - payout_account_change
        - phone_change
        - account_deletion
    IdempotencyAbandonOutcome:
      type: string
      description: Result of POST /v1/idempotency-keys/abandon (04 §6.1).
      enum:
        - abandoned
        - completed
    AbandonIdempotencyKeyRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - idempotency_key
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        idempotency_key:
          $ref: '#/components/schemas/IdempotencyKey'
    AbandonIdempotencyKeyData:
      type: object
      description: |
        `original` is null exactly when `outcome=abandoned`. The oneOf branches declare the
        properties they constrain (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - outcome
        - original
      properties:
        outcome:
          $ref: '#/components/schemas/IdempotencyAbandonOutcome'
        original:
          type:
            - object
            - 'null'
          description: |
            The response envelope stored with the completed idempotency record, unchanged
            (`code` 0 or a 3xxxx business code; 1xxxx and 2xxxx results are never stored,
            BR-WDR-07). `data` keeps the shape of the original operation, so it is left open.
          additionalProperties: false
          required:
            - code
            - msg
          properties:
            code:
              type: integer
              format: int32
              anyOf:
                - type: integer
                  format: int32
                  enum:
                    - 0
                - type: integer
                  format: int32
                  minimum: 30000
                  maximum: 39999
            msg:
              type: string
            data:
              type: object
              additionalProperties: true
      oneOf:
        - type: object
          properties:
            outcome:
              type: string
              enum:
                - abandoned
            original:
              type: 'null'
          required:
            - outcome
            - original
        - type: object
          properties:
            outcome:
              type: string
              enum:
                - completed
            original:
              type: object
              additionalProperties: true
          required:
            - outcome
            - original
    AbandonIdempotencyKeyResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/AbandonIdempotencyKeyData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ErrorEnvelope:
      type: object
      description: |
        Error response (04 §5, §7). `data` is present only for codes that define it; its fields
        per code are listed in contracts/error-codes.yaml, so it is left open here.
      additionalProperties: false
      required:
        - code
        - msg
        - trace_id
      properties:
        code:
          type: integer
          format: int32
          minimum: 10000
          maximum: 99999
        msg:
          type: string
          description: Fallback text only; clients show the dictionary text error.<code>.
        data:
          type: object
          additionalProperties: true
        trace_id:
          $ref: '#/components/schemas/TraceId'
    FreeForm:
      type: object
      description: Configuration block whose inner shape is not fixed by 规划/04 yet.
      additionalProperties: true
    DeviceIdSource:
      type: string
      description: Which device identifier was hashed (enum device_id_source, BR-ID-09).
      enum:
        - idfv
        - android_id
        - oaid
        - odid
    RegisterDeviceRequest:
      type: object
      additionalProperties: false
      required:
        - device_hash
        - id_source
      properties:
        device_hash:
          type: string
          description: |
            lowercase_hex(SHA-256(UTF-8 bytes of the identifier, trimmed and lower-cased)) of IDFV
            (iOS), ANDROID_ID (Android, MVP) or ODID (Harmony) (BR-ID-09 细则「设备标识的无效值」).
          pattern: '^[0-9a-f]{64}$'
        id_source:
          $ref: '#/components/schemas/DeviceIdSource'
    RegisterDeviceData:
      type: object
      additionalProperties: false
      required:
        - device_id
        - install_secret
      properties:
        device_id:
          $ref: '#/components/schemas/Id'
        install_secret:
          type: string
          description: Signing secret, stored only in Keychain / Keystore / HUKS.
          minLength: 16
          maxLength: 128
    RegisterDeviceResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/RegisterDeviceData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    Phone:
      type: string
      description: |
        Phone number as typed or pasted; it may carry spaces, hyphens and +86 / 0086 / 86. The
        server normalises it (BR-ID-05 细则「手机号规范化」); a result that is not a mainland mobile
        number is 20001 with `data.fields=[phone]` and `data.reason=phone_invalid` (an empty
        string included). No length bound in the schema: any spacing of a valid number must reach
        the normaliser, and adding a bound to a request property is a breaking change (oasdiff).
    SendSmsCodeRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - purpose
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        purpose:
          type: string
          description: contracts/enums/identity.yaml sms_purpose.
          enum:
            - login
            - bind
            - step_up
        captcha_token:
          type: string
          description: Human-verification token, required after 44003 (BR-ID-05).
          maxLength: 2048
    SendSmsCodeData:
      type: object
      additionalProperties: false
      required:
        - resend_after_sec
        - expires_in_sec
      properties:
        resend_after_sec:
          type: integer
          format: int32
          description: Seconds until another code may be requested (60, BR-ID-05).
        expires_in_sec:
          type: integer
          format: int32
          description: Validity of the code in seconds (300, BR-ID-05).
    SendSmsCodeResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SendSmsCodeData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    LegalVersions:
      type: object
      description: Versions of the privacy policy and user agreement the user agreed to (BR-ID-04).
      additionalProperties: false
      required:
        - privacy
        - agreement
      properties:
        privacy:
          type: integer
          format: int32
          minimum: 1
        agreement:
          type: integer
          format: int32
          minimum: 1
    LoginBySmsRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - code
        - legal_versions
        - consent_at
      properties:
        phone:
          $ref: '#/components/schemas/Phone'
        code:
          type: string
          pattern: '^[0-9]{6}$'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
          description: When the box was ticked or the confirm dialog accepted (client clock).
        invite_code:
          type: string
          description: Optional invite code; ignored for an existing account (BR-INV-06).
          maxLength: 32
    LoginProvider:
      type: string
      description: Third-party identity provider (enum login_provider, BR-ID-04).
      enum:
        - wechat
        - apple
        - huawei
    OauthAttemptPurpose:
      type: string
      description: What a third-party authorization attempt is for (enum oauth_attempt_purpose).
      enum:
        - login
        - step_up
    CreateOauthAttemptRequest:
      type: object
      description: |
        `action` is required exactly for purpose=step_up. The oneOf branches declare the
        properties they constrain (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - provider
        - purpose
      properties:
        provider:
          $ref: '#/components/schemas/LoginProvider'
        purpose:
          $ref: '#/components/schemas/OauthAttemptPurpose'
        action:
          $ref: '#/components/schemas/StepUpAction'
      oneOf:
        - type: object
          properties:
            purpose:
              type: string
              enum:
                - login
          required:
            - purpose
        - type: object
          properties:
            purpose:
              type: string
              enum:
                - step_up
            action:
              $ref: '#/components/schemas/StepUpAction'
          required:
            - purpose
            - action
    OauthAttemptData:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - nonce
        - expire_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        nonce:
          type: string
          description: At least 128 random bits, passed to the provider SDK (BR-ID-04 细则).
          minLength: 16
          maxLength: 256
        expire_at:
          type: string
          format: date-time
    OauthAttemptResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/OauthAttemptData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    OauthCredential:
      type: string
      description: An authorization credential from the provider SDK; never stored or logged.
      minLength: 1
      maxLength: 4096
    LoginByWechatRequest:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - code
        - legal_versions
        - consent_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        code:
          $ref: '#/components/schemas/OauthCredential'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
    LoginByAppleRequest:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - identity_token
        - authorization_code
        - legal_versions
        - consent_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        identity_token:
          $ref: '#/components/schemas/OauthCredential'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
    LoginByHuaweiRequest:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - authorization_code
        - legal_versions
        - consent_at
      properties:
        attempt_id:
          $ref: '#/components/schemas/Id'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
        legal_versions:
          $ref: '#/components/schemas/LegalVersions'
        consent_at:
          type: string
          format: date-time
    StepUpBySmsRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        code:
          type: string
          pattern: '^[0-9]{6}$'
    StepUpByWechatRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - provider
        - attempt_id
        - code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        provider:
          type: string
          enum:
            - wechat
        attempt_id:
          $ref: '#/components/schemas/Id'
        code:
          $ref: '#/components/schemas/OauthCredential'
    StepUpByAppleRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - provider
        - attempt_id
        - identity_token
        - authorization_code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        provider:
          type: string
          enum:
            - apple
        attempt_id:
          $ref: '#/components/schemas/Id'
        identity_token:
          $ref: '#/components/schemas/OauthCredential'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
    StepUpByHuaweiRequest:
      type: object
      additionalProperties: false
      required:
        - action
        - provider
        - attempt_id
        - authorization_code
      properties:
        action:
          $ref: '#/components/schemas/StepUpAction'
        provider:
          type: string
          enum:
            - huawei
        attempt_id:
          $ref: '#/components/schemas/Id'
        authorization_code:
          $ref: '#/components/schemas/OauthCredential'
    StepUpRequest:
      type: object
      description: |
        Exactly one way of second verification: an SMS code, or a new authorization with one
        provider carrying that provider's login credential fields (BR-ID-08). Each branch is a
        closed object, so a body mixing two ways matches none.
      unevaluatedProperties: false
      oneOf:
        - $ref: '#/components/schemas/StepUpBySmsRequest'
        - $ref: '#/components/schemas/StepUpByWechatRequest'
        - $ref: '#/components/schemas/StepUpByAppleRequest'
        - $ref: '#/components/schemas/StepUpByHuaweiRequest'
    StepUpData:
      type: object
      additionalProperties: false
      required:
        - step_up_token
        - expire_at
      properties:
        step_up_token:
          type: string
          minLength: 1
          maxLength: 2048
        expire_at:
          type: string
          format: date-time
    StepUpResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/StepUpData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    TokenPair:
      type: object
      additionalProperties: false
      required:
        - access_token
        - access_expires_at
        - refresh_token
        - refresh_expires_at
      properties:
        access_token:
          type: string
          minLength: 1
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          minLength: 1
        refresh_expires_at:
          type: string
          format: date-time
    InviteBind:
      type: object
      description: Result of binding the invite code sent at registration (BR-INV-06).
      additionalProperties: false
      required:
        - result
        - code
      properties:
        result:
          type: string
          enum:
            - bound
            - failed
            - ignored_existing_user
        code:
          type:
            - integer
            - 'null'
          format: int32
          description: Error code when result=failed (50001 = internal binding error).
          enum:
            - 30401
            - 30403
            - 30408
            - 42901
            - 50001
            - null
    LoginData:
      type: object
      additionalProperties: false
      required:
        - user_id
        - is_new_user
        - tokens
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        is_new_user:
          type: boolean
        tokens:
          $ref: '#/components/schemas/TokenPair'
        invite_bind:
          $ref: '#/components/schemas/InviteBind'
    LoginResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/LoginData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          minLength: 1
    TokenPairResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/TokenPair'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    MeBalance:
      type: object
      description: Summary of the single balance (拍板第二批 §8 ADD-06); meanings per BR-FUND-18.
      additionalProperties: false
      required:
        - available_fen
        - withdrawable_fen
        - estimated_total_fen
      properties:
        available_fen:
          $ref: '#/components/schemas/Fen'
        withdrawable_fen:
          $ref: '#/components/schemas/Fen'
        estimated_total_fen:
          $ref: '#/components/schemas/Fen'
    UnionBindingState:
      type: object
      additionalProperties: false
      required:
        - platform
        - status
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        status:
          type: string
          description: contracts/enums/identity.yaml union_binding_status.
          enum:
            - unbound
            - pending_auth
            - active
            - invalid
            - released
            - blocked
    RiskInfo:
      type: object
      description: Risk state for the ban / freeze explanation page (BR-ID-31, 拍板第二批 OPS-12).
      additionalProperties: false
      required:
        - state
        - reason_category
        - frozen_until
      properties:
        state:
          type: string
          description: contracts/enums/identity.yaml risk_state.
          enum:
            - normal
            - frozen
            - appealing
            - banned
        reason_category:
          type:
            - string
            - 'null'
          description: User-visible reason category (BR-ID-31); null when state=normal.
        frozen_until:
          type:
            - string
            - 'null'
          format: date-time
    Me:
      type: object
      additionalProperties: false
      required:
        - user_id
        - nickname
        - avatar_url
        - invite_code
        - inviter_bound
        - identity_level
        - phone_bound
        - balance
        - union_bindings
        - realname_status
        - need_reconsent
        - risk
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
        avatar_url:
          type: string
          format: uri
        invite_code:
          type:
            - string
            - 'null'
          description: Null when the user cannot invite.
        inviter_bound:
          type: boolean
          description: Only whether an inviter is bound, never who.
        identity_level:
          type: string
          description: contracts/enums/identity.yaml identity_level (BR-ID-01).
          enum:
            - basic
            - guest
            - member
            - phone
            - realname
        phone_bound:
          type: boolean
          description: Whether a phone number is bound (BR-ID-01).
        balance:
          $ref: '#/components/schemas/MeBalance'
        union_bindings:
          type: array
          items:
            $ref: '#/components/schemas/UnionBindingState'
        realname_status:
          type: string
          description: contracts/enums/identity.yaml realname_status.
          enum:
            - none
            - verified
            - failed
        need_reconsent:
          type: boolean
          description: The user must agree to the current legal version again (BR-ID-12).
        risk:
          $ref: '#/components/schemas/RiskInfo'
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Me'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    PlatformPurchaseStatus:
      type: string
      description: |
        Derived from convert.enabled.<platform> and convert.off_reason.<platform> (04 §10.1); lets
        cards tell "maintenance" from "coming soon" before a tap. The tap result (50301
        data.reason) still wins.
      enum:
        - 'on'
        - maintenance
        - not_launched
    ConfigFeatures:
      type: object
      additionalProperties: false
      required:
        - flags
        - platform_status
      properties:
        flags:
          type: object
          description: |
            Client switches by key: agent.entry.visible, clipboard.enabled.<platform>,
            home.fallback, h5.route.<page>.enabled, ui.grayscale (03 §4.3);
            external_page.product_intercept (a platform product page inside the third-party page
            container goes back to the native product detail) and external_page.union_host_block
            (the container does not load union platform pages; derived from the server setting of
            the same name; a client that cannot read it treats it as on) (BR-ATTR-29);
            earnings.dashboard.visible (earnings dashboard entry, derived from
            earnings.dashboard.enabled, BR-FUND-25).
          additionalProperties:
            type: boolean
        platform_status:
          type: object
          description: Purchase status by platform code.
          propertyNames:
            $ref: '#/components/schemas/PlatformCode'
          additionalProperties:
            $ref: '#/components/schemas/PlatformPurchaseStatus'
        search_status:
          type: object
          description: |
            Search switch by platform code, derived from search.enabled.<platform> (04 §10.1);
            how a client treats a missing platform is in BR-PROD-10 细则.
          propertyNames:
            $ref: '#/components/schemas/PlatformCode'
          additionalProperties:
            $ref: '#/components/schemas/PlatformSearchStatus'
    PlatformSearchStatus:
      type: string
      description: Whether search is open for a platform (enum platform_search_status).
      enum:
        - 'on'
        - 'off'
    ConfigLegalPrivacy:
      type: object
      additionalProperties: false
      required:
        - version
        - min_version
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        min_version:
          type: integer
          format: int32
          minimum: 1
          description: Below this version the user must agree again (BR-ID-12).
    ConfigLegalAgreement:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
    ConfigLegal:
      type: object
      description: legal.privacy.version, legal.privacy.min_version, legal.agreement.version (04 §10.1).
      additionalProperties: false
      required:
        - privacy
        - agreement
      properties:
        privacy:
          $ref: '#/components/schemas/ConfigLegalPrivacy'
        agreement:
          $ref: '#/components/schemas/ConfigLegalAgreement'
    ConfigInvite:
      type: object
      additionalProperties: false
      required:
        - required
        - backfill_hours
      properties:
        required:
          type: boolean
          description: Must be false in the MVP (BR-INV-06).
        backfill_hours:
          type: integer
          format: int32
          description: Window for entering an inviter later (BR-INV-07).
        bind_phone_guide:
          type: boolean
          description: |
            Show the bind-phone guide to new third-party accounts (BR-INV-03 细则). Optional in
            the schema like every key added after v0.9; the server always sends it.
        before_buy_tip:
          type: boolean
          description: Show the inviter tip before the first purchase (BR-INV-21).
    ConfigAgent:
      type: object
      description: Agent availability and guest quota (04 §10.1; BR-AI-11, BR-AI-12).
      additionalProperties: false
      required:
        - enabled
        - whitelist_only
        - filing_text
        - examples
        - guest_daily_quota
        - require_phone
      properties:
        enabled:
          type: boolean
        whitelist_only:
          type: boolean
        filing_text:
          type: string
        examples:
          type: array
          items:
            type: string
        guest_daily_quota:
          type: integer
          format: int32
          minimum: 0
        require_phone:
          type: boolean
    ConfigH5Release:
      type: object
      description: H5 version bucket for this caller (拍板第二批 TECH-28).
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: string
          minLength: 1
    ConfigKf:
      type: object
      description: WeCom customer-service chat link (chat entry only).
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    ConfigExternalPage:
      type: object
      description: Third-party page container settings (BR-ATTR-29).
      additionalProperties: false
      required:
        - nav_host_sample_bp
      properties:
        nav_host_sample_bp:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Sampling rate of document-level navigation hosts, 1/10000 (default in BR-ATTR-29).
    LinkPatternCategory:
      type: string
      description: Category of a platform link pattern (enum link_pattern_category, BR-ATTR-29).
      enum:
        - product
        - promo
        - union_host
    LinkPatternRule:
      type: object
      description: |
        Hosts and path patterns of one platform and category. How hosts match (union_host by
        registered domain including subdomains) and the path pattern syntax are defined with the
        source table specs/link-patterns.yaml (CT-15g); concrete values come from real samples (B1-07).
      additionalProperties: false
      required:
        - platform
        - category
        - hosts
        - path_patterns
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        category:
          $ref: '#/components/schemas/LinkPatternCategory'
        hosts:
          type: array
          items:
            type: string
            minLength: 1
        path_patterns:
          type: array
          items:
            type: string
            minLength: 1
    ConfigLinkPatterns:
      type: object
      description: |
        Client pre-filter subset of the platform link pattern table (source
        specs/link-patterns.yaml). Clients decide where a document-level navigation in the
        third-party page container goes (main frame, subframe, new window); product recognition
        follows the server. When the fetch fails they use the last good version, then the bundled
        snapshot, and never stop intercepting (BR-ATTR-29).
      additionalProperties: false
      required:
        - version
        - rules
      properties:
        version:
          type: string
          minLength: 1
        rules:
          type: array
          items:
            $ref: '#/components/schemas/LinkPatternRule'
    ConfigAppUpdate:
      type: object
      additionalProperties: false
      required:
        - recheck_interval_sec
      properties:
        recheck_interval_sec:
          type: integer
          format: int32
          minimum: 1
          description: |
            On returning to the foreground, call GET /v1/app-versions/check again when the last
            successful check is older than this (value and bundled default in BR-ID-01 细则
            「最低支持版本的接口层拦截」).
    HelpLinkTarget:
      type: object
      description: |
        Jump target {route, params} of a help_links entry: always one help article, the Help
        route of contracts/routes.json with its article_id (04 §10.1「原生页到帮助文章的入口表」).
        conformance.ts checks that the route exists there and that params is a subset of that
        route's params schema.
      additionalProperties: false
      required:
        - route
        - params
      properties:
        route:
          type: string
          enum:
            - Help
        params:
          type: object
          additionalProperties: false
          required:
            - article_id
          properties:
            article_id:
              type: string
              minLength: 1
    ConfigClaim:
      type: object
      additionalProperties: false
      required:
        - window_days
      properties:
        window_days:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          description: |
            Days within which an order claim may be filed, claim.window_hours rounded down to
            days; null when below one day or not configured. Only renders the claim form's period
            sentence (BR-ATTR-17 细则「找回页的填写指引」); claim.window_hours is not sent.
    Config:
      type: object
      description: |
        Top-level keys of /v1/config (04 §10.1, excerpt). Keys added after v0.9 (external_page,
        link_patterns, external_hosts, app_update, help_links, claim) are optional, so a client
        keeps reading an older last-good configuration (04 §5「兼容」); the server always sends
        them. jump_tip, clipboard, bridge_origins, auth_tips, compliance and display are not
        shaped by 04 yet and stay free-form; the task that consumes each one types it
        (bridge_origins with CT-03, clipboard with B1-07).
      additionalProperties: false
      required:
        - dict_version
        - h5_base_url
        - h5_release
        - share_domains
        - features
        - texts
        - legal
        - invite
        - agent
        - kf
        - jump_tip
        - clipboard
        - bridge_origins
        - auth_tips
        - compliance
        - display
      properties:
        dict_version:
          type: string
          description: Version of the /v1/dict dictionary (BR-TEXT-12).
        h5_base_url:
          type: string
          format: uri
        h5_release:
          $ref: '#/components/schemas/ConfigH5Release'
        share_domains:
          type: array
          items:
            type: string
        features:
          $ref: '#/components/schemas/ConfigFeatures'
        texts:
          type: object
          description: Custom text keys, e.g. withdraw.sla_text (BR-TEXT-07).
          additionalProperties:
            type: string
        legal:
          $ref: '#/components/schemas/ConfigLegal'
        invite:
          $ref: '#/components/schemas/ConfigInvite'
        agent:
          $ref: '#/components/schemas/ConfigAgent'
        kf:
          $ref: '#/components/schemas/ConfigKf'
        jump_tip:
          $ref: '#/components/schemas/FreeForm'
        clipboard:
          $ref: '#/components/schemas/FreeForm'
        bridge_origins:
          $ref: '#/components/schemas/FreeForm'
        auth_tips:
          $ref: '#/components/schemas/FreeForm'
        compliance:
          $ref: '#/components/schemas/FreeForm'
        display:
          $ref: '#/components/schemas/FreeForm'
        external_page:
          $ref: '#/components/schemas/ConfigExternalPage'
        link_patterns:
          $ref: '#/components/schemas/ConfigLinkPatterns'
        external_hosts:
          type: array
          description: |
            Third-party page hosts a deep link may open in ExternalPage, matched by full host name
            (values and default in BR-ID-10 细则「深链能打开的第三方页面」); push and in-app
            targets are not limited by it (03 §4.4).
          items:
            type: string
            minLength: 1
        app_update:
          $ref: '#/components/schemas/ConfigAppUpdate'
        help_links:
          type: object
          description: |
            Native entries to help articles: key → jump target; an entry whose key is not
            configured is not shown. Keys are defined by the rules that use them: price_compare
            (BR-TEXT-03), claim_guide.<platform> (BR-ATTR-17 细则), login_help (BR-ID-02 细则),
            withdraw_rules (BR-WDR-04 细则). Values are operations configuration (article ids).
          additionalProperties:
            $ref: '#/components/schemas/HelpLinkTarget'
        claim:
          $ref: '#/components/schemas/ConfigClaim'
    ConfigResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Config'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ProductCta:
      type: object
      description: |
        Buy button chosen by the server; the client never decides it (BR-TEXT-12, 拍板第二批
        TRADE-21): btn.buy.coupon (有券有返), btn.buy (无券有返 and amount_unknown),
        btn.buy.no_rebate (无返利); other keys come with login_required and taolijin cards.
      additionalProperties: false
      required:
        - text_key
      properties:
        text_key:
          type: string
          minLength: 1
    ProductTlj:
      type: object
      description: Taolijin of the card, absent when there is none (BR-PRICE-08); never folded into prices.
      additionalProperties: false
      required:
        - amount_fen
        - remain
        - kind
      properties:
        amount_fen:
          $ref: '#/components/schemas/Fen'
        remain:
          type: integer
          format: int32
        kind:
          type: string
          description: contracts/enums/trade.yaml tlj_kind.
          enum:
            - ours
            - brand_open
            - third_party
            - unknown
    ProductCard:
      type: object
      description: |
        Product card (04 §8.3). Price semantics BR-PRICE-01 / 05; rebate_* and est_net_price_fen
        are computed per request for the current caller and never cached (BR-PRICE-11). The card
        carries a registered `link_id`; buying always goes through POST /v1/links/{link_id}/open
        (BR-PRICE-12, BR-PRICE-21). amount_unknown cards have product_key, prices and rebate
        null (BR-PRICE-08).
      additionalProperties: false
      required:
        - product_key
        - item_ref
        - platform
        - title
        - image
        - price_fen
        - coupon_fen
        - final_price_fen
        - est_net_price_fen
        - rebate_min_fen
        - rebate_max_fen
        - rebate_basis
        - benefit_tags
        - is_presale
        - link_id
        - cta
        - quoted_at
        - stale
        - age_sec
        - source
        - disclaimer_keys
        - availability
      properties:
        card_id:
          type: string
          description: Agent card sequence id (c1, c2…), only on Agent cards (BR-AI-05).
        product_key:
          type:
            - string
            - 'null'
          description: Opaque product key (BR-PROD-02); null only on amount_unknown cards.
          minLength: 3
          maxLength: 128
        item_ref:
          type:
            - string
            - 'null'
          description: Opaque signed reference passed through unchanged (BR-PROD-11).
          minLength: 1
          maxLength: 1024
        platform:
          $ref: '#/components/schemas/PlatformCode'
        shop_type:
          type:
            - string
            - 'null'
          description: Shop type, e.g. tmall for Tmall shops on taobao.
        title:
          type:
            - string
            - 'null'
        image:
          type:
            - string
            - 'null'
          format: uri
        shop_name:
          type:
            - string
            - 'null'
        price_fen:
          $ref: '#/components/schemas/NullableFen'
        coupon_fen:
          $ref: '#/components/schemas/NullableFen'
        final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        est_net_price_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_basis:
          $ref: '#/components/schemas/RebateBasis'
        benefit_tags:
          type: array
          description: Server-generated labels (有券, 预售, 标题显示为 X…); no per-card reasons.
          items:
            type: string
        match_tag:
          type: string
          description: Agent cards only (BR-AI-24); contracts/enums/trade.yaml match_tag.
          enum:
            - matched
            - relaxed
            - spec_unconfirmed
        spec_text:
          type:
            - string
            - 'null'
        is_presale:
          type: boolean
          description: Presale; shown with the total price (BR-PRICE-22).
        tlj:
          $ref: '#/components/schemas/ProductTlj'
        link_id:
          $ref: '#/components/schemas/Id'
        cta:
          $ref: '#/components/schemas/ProductCta'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Receipt time of the union response the price is based on (BR-PRICE-11).
        stale:
          type: boolean
        age_sec:
          type:
            - integer
            - 'null'
          format: int32
          description: Age of the price in seconds, computed by the server (BR-PRICE-11).
        source:
          type: string
          description: Price source (BR-PRICE-16).
          enum:
            - taobao_union
            - jd_union
            - pdd_union
        disclaimer_keys:
          type: array
          description: Ordered dictionary keys (BR-PRICE-17), including price_basis.
          items:
            type: string
        ad_label:
          type:
            - string
            - 'null'
          description: Ad label (BR-TEXT-17); null on Agent relevance cards.
        availability:
          $ref: '#/components/schemas/Availability'
    SearchProductsData:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - has_more
        - fallback_items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProductCard'
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
          description: As reported by the union, not by the filtered page size (BR-PRICE-08).
        fallback_items:
          type: array
          description: Only when items is empty on the first page; the platform's first 10 feed items.
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductCard'
    SearchProductsResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SearchProductsData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ProductResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ProductCard'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ParseInputRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - scene
      properties:
        text:
          type: string
          description: |
            Locally filtered clipboard or typed text (03 §4.6). Text outside links and tokens
            is untrusted (BR-AI-05); prices in it are only material.claimed_price_fen.
          minLength: 1
          maxLength: 4000
        scene:
          type: string
          description: |
            Entry the text came from (subset of contracts/enums scene). Attribution-bearing
            scenes (share, agent, …) cannot be chosen by the client: share links come only from
            POST /v1/shares (phone level), Agent cards from the Agent service (BR-ATTR-05, 08).
            share_ext is P1.
          enum:
            - clipboard
            - search
            - share_ext
    InputHit:
      type: object
      description: One candidate found by parse_input (04 §8.5).
      additionalProperties: false
      required:
        - platform
        - kind
        - raw
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        kind:
          type: string
          description: contracts/enums/trade.yaml input_kind.
          enum:
            - tpwd
            - url
            - text
        raw:
          type: string
          description: The matched link or token as it appeared in the input.
    ParseResult:
      type: object
      description: |
        Result of one hit; exactly one of `card` and `error_code` is present. The oneOf branches
        declare the property they require (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - hit
      properties:
        hit:
          $ref: '#/components/schemas/InputHit'
        card:
          $ref: '#/components/schemas/ProductCard'
        error_code:
          type: integer
          format: int32
          minimum: 10000
          maximum: 59999
          description: Error code for this hit (30131, 30132, 30141, 50301…), see error-codes.yaml.
      oneOf:
        - type: object
          properties:
            card:
              $ref: '#/components/schemas/ProductCard'
          required:
            - card
        - type: object
          properties:
            error_code:
              type: integer
              format: int32
              minimum: 10000
              maximum: 59999
          required:
            - error_code
    ParseInputData:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ParseResult'
    ParseInputResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ParseInputData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    OpenLinkRequest:
      type: object
      additionalProperties: false
      properties:
        installed:
          $ref: '#/components/schemas/InstalledState'
        no_rebate:
          type: boolean
          default: false
          description: Buy without rebate (BR-ID-18).
        no_rebate_reason:
          type: string
          description: |
            Only with no_rebate=true; default auth_declined. The server overrides it with
            relation_conflict / binding_blocked when it decides so (BR-ID-18).
          enum:
            - auth_declined
            - auth_failed
        spm:
          type: string
          description: page.module.slot of the tapped button (03 §4.7).
          maxLength: 128
    OpenLinkResult:
      type: object
      description: |
        Response of open (04 §8.4). old_final_price_fen is the link's quoted_final_price_fen;
        price_changed when |new − old| ≥ 100 fen or ≥ 5 % of old, both directions (BR-PRICE-13).
        Prices and rebates are null on amount_unknown links, which are not re-checked.
      additionalProperties: false
      required:
        - jump
        - price_changed
        - old_final_price_fen
        - new_final_price_fen
        - new_link_id
        - requote_failed
        - new_rebate_min_fen
        - new_rebate_max_fen
        - availability
        - quoted_at
      properties:
        jump:
          $ref: '#/components/schemas/JumpPlan'
        price_changed:
          type: boolean
        old_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_link_id:
          type:
            - string
            - 'null'
          description: |
            Set whenever the new price differs from the snapshot, or when a new link was
            registered for the current user (BR-PRICE-12, BR-ATTR-05 ③); the client replaces the
            card with it whether or not the user continues.
        requote_failed:
          type: boolean
          description: Re-check failed and the user's cached link (≤ 900 s) is used (BR-PRICE-13).
        new_rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        new_rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        availability:
          $ref: '#/components/schemas/Availability'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
    OpenLinkResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/OpenLinkResult'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ConvertLinkRequest:
      type: object
      description: |
        Either product_key (with the tapped card's item_ref) or url; neither, or both, is 20001.
        The oneOf branches declare the property they require (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - platform
        - scene
      oneOf:
        - type: object
          properties:
            product_key:
              $ref: '#/components/schemas/ProductKey'
          required:
            - product_key
        - type: object
          properties:
            url:
              type: string
              format: uri
              maxLength: 2048
          required:
            - url
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        product_key:
          $ref: '#/components/schemas/ProductKey'
        item_ref:
          $ref: '#/components/schemas/ItemRef'
        url:
          type: string
          format: uri
          maxLength: 2048
        scene:
          type: string
          description: |
            Only the H5 entry (trade.convertAndOpen) uses convert (拍板第二批 TRADE-03); other
            scenes are rejected with 20001 so that the client cannot pick an attribution scene
            such as share (BR-ATTR-05, BR-ATTR-08).
          enum:
            - h5
        spm:
          type: string
          maxLength: 128
        installed:
          $ref: '#/components/schemas/InstalledState'
    ConvertLinkData:
      type: object
      description: The registered link_id plus the same fields as the open result (04 §6.3).
      additionalProperties: false
      required:
        - link_id
        - jump
        - price_changed
        - old_final_price_fen
        - new_final_price_fen
        - new_link_id
        - requote_failed
        - new_rebate_min_fen
        - new_rebate_max_fen
        - availability
        - quoted_at
      properties:
        link_id:
          $ref: '#/components/schemas/Id'
        jump:
          $ref: '#/components/schemas/JumpPlan'
        price_changed:
          type: boolean
        old_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_link_id:
          type:
            - string
            - 'null'
        requote_failed:
          type: boolean
        new_rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        new_rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        availability:
          $ref: '#/components/schemas/Availability'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
    ConvertLinkResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ConvertLinkData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
