            - 'null'
    WithdrawalListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/WithdrawalListData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    WithdrawalResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Withdrawal'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    EmptyData:
      type: object
      additionalProperties: false
    EmptyResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/EmptyData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    RiskInfo:
      type: object
      description: Risk state for the ban / freeze explanation page (BR-ID-31, 拍板第二批 OPS-12).
      additionalProperties: false
      required:
        - state
        - reason_category
        - frozen_until
      properties:
        state:
          type: string
          description: contracts/enums/identity.yaml risk_state.
          enum:
            - normal
            - frozen
            - appealing
            - banned
        reason_category:
          type:
            - string
            - 'null'
          description: User-visible reason category (BR-ID-31); null when state=normal.
        frozen_until:
          type:
            - string
            - 'null'
          format: date-time
    Me:
      type: object
      additionalProperties: false
      required:
        - user_id
        - nickname
        - avatar_url
        - invite_code
        - inviter_bound
        - invite_backfill
        - identity_level
        - phone_bound
        - balance
        - union_bindings
        - realname_status
        - need_reconsent
        - risk
      properties:
        user_id:
          $ref: '#/components/schemas/Id'
        nickname:
          type: string
        avatar_url:
          type: string
          format: uri
        invite_code:
          type:
            - string
            - 'null'
          description: Null when the user cannot invite.
        inviter_bound:
          type: boolean
          description: Only whether an inviter is bound, never who.
        invite_backfill:
          $ref: '#/components/schemas/InviteBackfill'
        identity_level:
          type: string
          description: contracts/enums/identity.yaml identity_level (BR-ID-01).
          enum:
            - basic
            - guest
            - member
            - phone
            - realname
        phone_bound:
          type: boolean
          description: Whether a phone number is bound (BR-ID-01).
        balance:
          $ref: '#/components/schemas/MeBalance'
        union_bindings:
          type: array
          items:
            $ref: '#/components/schemas/UnionBindingState'
        realname_status:
          type: string
          description: contracts/enums/identity.yaml realname_status.
          enum:
            - none
            - verified
            - failed
        need_reconsent:
          type: boolean
          description: The user must agree to the current legal version again (BR-ID-12).
        risk:
          $ref: '#/components/schemas/RiskInfo'
    MeResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Me'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    PlatformPurchaseStatus:
      type: string
      description: |
        Derived from convert.enabled.<platform> and convert.off_reason.<platform> (04 §10.1); lets
        cards tell "maintenance" from "coming soon" before a tap. The tap result (50301
        data.reason) still wins.
      enum:
        - 'on'
        - maintenance
        - not_launched
    ConfigFeatures:
      type: object
      additionalProperties: false
      required:
        - flags
        - platform_status
      properties:
        flags:
          type: object
          description: |
            Client switches by key: agent.entry.visible, clipboard.enabled.<platform>,
            home.fallback, h5.route.<page>.enabled, ui.grayscale (03 §4.3);
            external_page.product_intercept (a platform product page inside the third-party page
            container goes back to the native product detail) and external_page.union_host_block
            (the container does not load union platform pages; derived from the server setting of
            the same name; a client that cannot read it treats it as on) (BR-ATTR-29);
            earnings.dashboard.visible (earnings dashboard entry, derived from
            earnings.dashboard.enabled, BR-FUND-25).
          additionalProperties:
            type: boolean
        platform_status:
          type: object
          description: Purchase status by platform code.
          propertyNames:
            $ref: '#/components/schemas/PlatformCode'
          additionalProperties:
            $ref: '#/components/schemas/PlatformPurchaseStatus'
        search_status:
          type: object
          description: |
            Search switch by platform code, derived from search.enabled.<platform> (04 §10.1);
            how a client treats a missing platform is in BR-PROD-10 细则.
          propertyNames:
            $ref: '#/components/schemas/PlatformCode'
          additionalProperties:
            $ref: '#/components/schemas/PlatformSearchStatus'
    PlatformSearchStatus:
      type: string
      description: Whether search is open for a platform (enum platform_search_status).
      enum:
        - 'on'
        - 'off'
    ConfigLegalPrivacy:
      type: object
      additionalProperties: false
      required:
        - version
        - min_version
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
        min_version:
          type: integer
          format: int32
          minimum: 1
          description: Below this version the user must agree again (BR-ID-12).
    ConfigLegalAgreement:
      type: object
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: integer
          format: int32
          minimum: 1
    ConfigLegal:
      type: object
      description: legal.privacy.version, legal.privacy.min_version, legal.agreement.version (04 §10.1).
      additionalProperties: false
      required:
        - privacy
        - agreement
      properties:
        privacy:
          $ref: '#/components/schemas/ConfigLegalPrivacy'
        agreement:
          $ref: '#/components/schemas/ConfigLegalAgreement'
    ConfigInvite:
      type: object
      additionalProperties: false
      required:
        - required
        - backfill_hours
      properties:
        required:
          type: boolean
          description: Must be false in the MVP (BR-INV-06).
        backfill_hours:
          type: integer
          format: int32
          description: Window for entering an inviter later (BR-INV-07).
        bind_phone_guide:
          type: boolean
          description: |
            Show the bind-phone guide to new third-party accounts (BR-INV-03 细则). Optional in
            the schema like every key added after v0.9; the server always sends it.
        before_buy_tip:
          type: boolean
          description: Show the inviter tip before the first purchase (BR-INV-21).
    ConfigAgent:
      type: object
      description: Agent availability and guest quota (04 §10.1; BR-AI-11, BR-AI-12).
      additionalProperties: false
      required:
        - enabled
        - whitelist_only
        - filing_text
        - examples
        - guest_daily_quota
        - require_phone
      properties:
        enabled:
          type: boolean
        whitelist_only:
          type: boolean
        filing_text:
          type: string
        examples:
          type: array
          items:
            type: string
        guest_daily_quota:
          type: integer
          format: int32
          minimum: 0
        require_phone:
          type: boolean
    ConfigH5Release:
      type: object
      description: H5 version bucket for this caller (拍板第二批 TECH-28).
      additionalProperties: false
      required:
        - version
      properties:
        version:
          type: string
          minLength: 1
    ConfigKf:
      type: object
      description: WeCom customer-service chat link (chat entry only).
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
    ConfigExternalPage:
      type: object
      description: Third-party page container settings (BR-ATTR-29).
      additionalProperties: false
      required:
        - nav_host_sample_bp
      properties:
        nav_host_sample_bp:
          type: integer
          format: int32
          minimum: 0
          maximum: 10000
          description: Sampling rate of document-level navigation hosts, 1/10000 (default in BR-ATTR-29).
    LinkPatternCategory:
      type: string
      description: Category of a platform link pattern (enum link_pattern_category, BR-ATTR-29).
      enum:
        - product
        - promo
        - union_host
    LinkPatternRule:
      type: object
      description: |
        Hosts and path patterns of one platform and category. How hosts match (union_host by
        registered domain including subdomains) and the path pattern syntax are defined with the
        source table specs/link-patterns.yaml (CT-15g); concrete values come from real samples (B1-07).
      additionalProperties: false
      required:
        - platform
        - category
        - hosts
        - path_patterns
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        category:
          $ref: '#/components/schemas/LinkPatternCategory'
        hosts:
          type: array
          items:
            type: string
            minLength: 1
        path_patterns:
          type: array
          items:
            type: string
            minLength: 1
    ConfigLinkPatterns:
      type: object
      description: |
        Client pre-filter subset of the platform link pattern table (source
        specs/link-patterns.yaml). Clients decide where a document-level navigation in the
        third-party page container goes (main frame, subframe, new window); product recognition
        follows the server. When the fetch fails they use the last good version, then the bundled
        snapshot, and never stop intercepting (BR-ATTR-29).
      additionalProperties: false
      required:
        - version
        - rules
      properties:
        version:
          type: string
          minLength: 1
        rules:
          type: array
          items:
            $ref: '#/components/schemas/LinkPatternRule'
    ConfigAppUpdate:
      type: object
      additionalProperties: false
      required:
        - recheck_interval_sec
      properties:
        recheck_interval_sec:
          type: integer
          format: int32
          minimum: 1
          description: |
            On returning to the foreground, call GET /v1/app-versions/check again when the last
            successful check is older than this (value and bundled default in BR-ID-01 细则
            「最低支持版本的接口层拦截」).
    HelpLinkTarget:
      type: object
      description: |
        Jump target {route, params} of a help_links entry: always one help article, the Help
        route of contracts/routes.json with its article_id (04 §10.1「原生页到帮助文章的入口表」).
        conformance.ts checks that the route exists there and that params is a subset of that
        route's params schema.
      additionalProperties: false
      required:
        - route
        - params
      properties:
        route:
          type: string
          enum:
            - Help
        params:
          type: object
          additionalProperties: false
          required:
            - article_id
          properties:
            article_id:
              type: string
              minLength: 1
    ConfigClaim:
      type: object
      additionalProperties: false
      required:
        - window_days
      properties:
        window_days:
          type:
            - integer
            - 'null'
          format: int32
          minimum: 1
          description: |
            Days within which an order claim may be filed, claim.window_hours rounded down to
            days; null when below one day or not configured. Only renders the claim form's period
            sentence (BR-ATTR-17 细则「找回页的填写指引」); claim.window_hours is not sent.
    Config:
      type: object
      description: |
        Top-level keys of /v1/config (04 §10.1, excerpt). Keys added after v0.9 (external_page,
        link_patterns, external_hosts, app_update, help_links, claim) are optional, so a client
        keeps reading an older last-good configuration (04 §5「兼容」); the server always sends
        them. jump_tip, clipboard, bridge_origins, auth_tips, compliance and display are not
        shaped by 04 yet and stay free-form; the task that consumes each one types it
        (bridge_origins with CT-03, clipboard with B1-07).
      additionalProperties: false
      required:
        - dict_version
        - h5_base_url
        - h5_release
        - share_domains
        - features
        - texts
        - legal
        - invite
        - agent
        - kf
        - jump_tip
        - clipboard
        - bridge_origins
        - auth_tips
        - compliance
        - display
      properties:
        dict_version:
          type: string
          description: Version of the /v1/dict dictionary (BR-TEXT-12).
        h5_base_url:
          type: string
          format: uri
        h5_release:
          $ref: '#/components/schemas/ConfigH5Release'
        share_domains:
          type: array
          items:
            type: string
        features:
          $ref: '#/components/schemas/ConfigFeatures'
        texts:
          type: object
          description: Custom text keys, e.g. withdraw.sla_text (BR-TEXT-07).
          additionalProperties:
            type: string
        legal:
          $ref: '#/components/schemas/ConfigLegal'
        invite:
          $ref: '#/components/schemas/ConfigInvite'
        agent:
          $ref: '#/components/schemas/ConfigAgent'
        kf:
          $ref: '#/components/schemas/ConfigKf'
        jump_tip:
          $ref: '#/components/schemas/FreeForm'
        clipboard:
          $ref: '#/components/schemas/FreeForm'
        bridge_origins:
          $ref: '#/components/schemas/FreeForm'
        auth_tips:
          $ref: '#/components/schemas/FreeForm'
        compliance:
          $ref: '#/components/schemas/FreeForm'
        display:
          $ref: '#/components/schemas/FreeForm'
        external_page:
          $ref: '#/components/schemas/ConfigExternalPage'
        link_patterns:
          $ref: '#/components/schemas/ConfigLinkPatterns'
        external_hosts:
          type: array
          description: |
            Third-party page hosts a deep link may open in ExternalPage, matched by full host name
            (values and default in BR-ID-10 细则「深链能打开的第三方页面」); push and in-app
            targets are not limited by it (03 §4.4).
          items:
            type: string
            minLength: 1
        app_update:
          $ref: '#/components/schemas/ConfigAppUpdate'
        help_links:
          type: object
          description: |
            Native entries to help articles: key → jump target; an entry whose key is not
            configured is not shown. Keys are defined by the rules that use them: price_compare
            (BR-TEXT-03), claim_guide.<platform> (BR-ATTR-17 细则), login_help (BR-ID-02 细则),
            withdraw_rules (BR-WDR-04 细则). Values are operations configuration (article ids).
          additionalProperties:
            $ref: '#/components/schemas/HelpLinkTarget'
        claim:
          $ref: '#/components/schemas/ConfigClaim'
    ConfigResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/Config'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ProductCta:
      type: object
      description: |
        Buy button chosen by the server; the client never decides it (BR-TEXT-12, 拍板第二批
        TRADE-21): btn.buy.coupon (有券有返), btn.buy (无券有返 and amount_unknown),
        btn.buy.no_rebate (无返利); other keys come with login_required and taolijin cards.
      additionalProperties: false
      required:
        - text_key
      properties:
        text_key:
          type: string
          minLength: 1
    ProductTlj:
      type: object
      description: Taolijin of the card, absent when there is none (BR-PRICE-08); never folded into prices.
      additionalProperties: false
      required:
        - amount_fen
        - remain
        - kind
      properties:
        amount_fen:
          $ref: '#/components/schemas/Fen'
        remain:
          type: integer
          format: int32
        kind:
          type: string
          description: contracts/enums/trade.yaml tlj_kind.
          enum:
            - ours
            - brand_open
            - third_party
            - unknown
    ProductCard:
      type: object
      description: |
        Product card (04 §8.3). Price semantics BR-PRICE-01 / 05; rebate_* and est_net_price_fen
        are computed per request for the current caller and never cached (BR-PRICE-11). The card
        carries a registered `link_id`; buying always goes through POST /v1/links/{link_id}/open
        (BR-PRICE-12, BR-PRICE-21). amount_unknown cards have product_key, prices and rebate
        null (BR-PRICE-08).
      additionalProperties: false
      required:
        - product_key
        - item_ref
        - platform
        - title
        - image
        - price_fen
        - coupon_fen
        - final_price_fen
        - est_net_price_fen
        - rebate_min_fen
        - rebate_max_fen
        - rebate_basis
        - benefit_tags
        - is_presale
        - link_id
        - cta
        - quoted_at
        - stale
        - age_sec
        - source
        - disclaimer_keys
        - availability
      properties:
        card_id:
          type: string
          description: Agent card sequence id (c1, c2…), only on Agent cards (BR-AI-05).
        product_key:
          type:
            - string
            - 'null'
          description: Opaque product key (BR-PROD-02); null only on amount_unknown cards.
          minLength: 3
          maxLength: 128
        item_ref:
          type:
            - string
            - 'null'
          description: Opaque signed reference passed through unchanged (BR-PROD-11).
          minLength: 1
          maxLength: 1024
        platform:
          $ref: '#/components/schemas/PlatformCode'
        shop_type:
          type:
            - string
            - 'null'
          description: Shop type, e.g. tmall for Tmall shops on taobao.
        title:
          type:
            - string
            - 'null'
        image:
          type:
            - string
            - 'null'
          format: uri
        shop_name:
          type:
            - string
            - 'null'
        price_fen:
          $ref: '#/components/schemas/NullableFen'
        coupon_fen:
          $ref: '#/components/schemas/NullableFen'
        final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        est_net_price_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        rebate_basis:
          $ref: '#/components/schemas/RebateBasis'
        no_rebate_cause:
          description: |
            May be non-null only when rebate_basis=no_rebate (BR-PRICE-08 细则「无返利原因」);
            unknown values are treated as null. Not the open request's no_rebate_reason.
          anyOf:
            - $ref: '#/components/schemas/NoRebateCause'
            - type: 'null'
        benefit_tags:
          type: array
          description: Server-generated labels (有券, 预售, 标题显示为 X…); no per-card reasons.
          items:
            type: string
        match_tag:
          type: string
          description: Agent cards only (BR-AI-24); contracts/enums/trade.yaml match_tag.
          enum:
            - matched
            - relaxed
            - spec_unconfirmed
        spec_text:
          type:
            - string
            - 'null'
        is_presale:
          type: boolean
          description: Presale; shown with the total price (BR-PRICE-22).
        tlj:
          $ref: '#/components/schemas/ProductTlj'
        link_id:
          $ref: '#/components/schemas/Id'
        cta:
          $ref: '#/components/schemas/ProductCta'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Receipt time of the union response the price is based on (BR-PRICE-11).
        stale:
          type: boolean
        age_sec:
          type:
            - integer
            - 'null'
          format: int32
          description: Age of the price in seconds, computed by the server (BR-PRICE-11).
        source:
          type: string
          description: Price source (BR-PRICE-16).
          enum:
            - taobao_union
            - jd_union
            - pdd_union
        disclaimer_keys:
          type: array
          description: Ordered dictionary keys (BR-PRICE-17), including price_basis.
          items:
            type: string
        ad_label:
          type:
            - string
            - 'null'
          description: Ad label (BR-TEXT-17); null on Agent relevance cards.
        availability:
          $ref: '#/components/schemas/Availability'
    SearchProductsData:
      type: object
      additionalProperties: false
      required:
        - items
        - next_cursor
        - has_more
        - fallback_items
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ProductCard'
        next_cursor:
          type:
            - string
            - 'null'
        has_more:
          type: boolean
          description: As reported by the union, not by the filtered page size (BR-PRICE-08).
        fallback_items:
          type: array
          description: Only when items is empty on the first page; the platform's first 10 feed items.
          maxItems: 10
          items:
            $ref: '#/components/schemas/ProductCard'
    SearchProductsResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SearchProductsData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ProductResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ProductCard'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ParseInputRequest:
      type: object
      additionalProperties: false
      required:
        - text
        - scene
      properties:
        text:
          type: string
          description: |
            Locally filtered clipboard or typed text (03 §4.6). Text outside links and tokens
            is untrusted (BR-AI-05); prices in it are only material.claimed_price_fen.
          minLength: 1
          maxLength: 4000
        scene:
          type: string
          description: |
            Entry the text came from (subset of contracts/enums scene). Attribution-bearing
            scenes (share, agent, …) cannot be chosen by the client: share links come only from
            POST /v1/shares (phone level), Agent cards from the Agent service (BR-ATTR-05, 08).
            share_ext is P1.
          enum:
            - clipboard
            - search
            - share_ext
    InputHit:
      type: object
      description: One candidate found by parse_input (04 §8.5).
      additionalProperties: false
      required:
        - platform
        - kind
        - raw
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        kind:
          type: string
          description: contracts/enums/trade.yaml input_kind.
          enum:
            - tpwd
            - url
            - text
        raw:
          type: string
          description: The matched link or token as it appeared in the input.
    ParseResult:
      type: object
      description: |
        Result of one hit; exactly one of `card` and `error_code` is present. The oneOf branches
        declare the property they require (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - hit
      properties:
        hit:
          $ref: '#/components/schemas/InputHit'
        card:
          $ref: '#/components/schemas/ProductCard'
        error_code:
          type: integer
          format: int32
          minimum: 10000
          maximum: 59999
          description: Error code for this hit (30131, 30132, 30141, 50301…), see error-codes.yaml.
      oneOf:
        - type: object
          properties:
            card:
              $ref: '#/components/schemas/ProductCard'
          required:
            - card
        - type: object
          properties:
            error_code:
              type: integer
              format: int32
              minimum: 10000
              maximum: 59999
          required:
            - error_code
    ParseInputData:
      type: object
      additionalProperties: false
      required:
        - results
      properties:
        results:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/ParseResult'
    ParseInputResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ParseInputData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    OpenLinkRequest:
      type: object
      additionalProperties: false
      properties:
        installed:
          $ref: '#/components/schemas/InstalledState'
          description: Default unknown; H5 always sends unknown (BR-ATTR-27 ①).
        no_rebate:
          type: boolean
          default: false
          description: Buy without rebate (BR-ID-18).
        no_rebate_reason:
          type: string
          description: |
            Only with no_rebate=true; default auth_declined. The server overrides it with
            relation_conflict / binding_blocked when it decides so (BR-ID-18).
          enum:
            - auth_declined
            - auth_failed
        spm:
          type: string
          description: page.module.slot of the tapped button (03 §4.7).
          maxLength: 128
    OpenLinkResult:
      type: object
      description: |
        Response of open (04 §8.4). old_final_price_fen is the link's quoted_final_price_fen;
        price_changed when |new − old| ≥ 100 fen or ≥ 5 % of old, both directions (BR-PRICE-13).
        Prices and rebates are null on amount_unknown links, which are not re-checked. There is no
        rebate_basis: no rebate is expressed by new_rebate_max_fen = 0 (BR-PRICE-08, BR-PRICE-13).
      additionalProperties: false
      required:
        - attempt_id
        - jump
        - price_changed
        - old_final_price_fen
        - new_final_price_fen
        - new_link_id
        - requote_failed
        - new_rebate_min_fen
        - new_rebate_max_fen
        - availability
        - quoted_at
      properties:
        attempt_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Issued by the server for this open attempt: a new one for every open of a link, the
            same one when the same Idempotency-Key is replayed. The client sends it in every
            link_jump of this jump (BR-ATTR-21 细则「待跟单卡按实际外跳选」).
        no_rebate_cause:
          description: |
            Non-null only when new_rebate_max_fen = 0 and the reason is known; unknown values are
            treated as null. Not the request's no_rebate_reason (BR-ID-18).
          anyOf:
            - $ref: '#/components/schemas/NoRebateCause'
            - type: 'null'
        jump:
          $ref: '#/components/schemas/JumpPlan'
        price_changed:
          type: boolean
        old_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_link_id:
          type:
            - string
            - 'null'
          description: |
            Set whenever the new price differs from the snapshot, or when a new link was
            registered for the current user (BR-PRICE-12, BR-ATTR-05 ③); the client replaces the
            card with it whether or not the user continues.
        requote_failed:
          type: boolean
          description: Re-check failed and the user's cached link (≤ 900 s) is used (BR-PRICE-13).
        new_rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        new_rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        availability:
          $ref: '#/components/schemas/Availability'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
    OpenLinkResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/OpenLinkResult'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ConvertLinkRequest:
      type: object
      description: |
        Either product_key (with the tapped card's item_ref) or url; neither, or both, is 20001.
        The oneOf branches declare the property they require (strict Ajv2020, ADR-0001 §4.2 #15).
      additionalProperties: false
      required:
        - platform
        - scene
      oneOf:
        - type: object
          properties:
            product_key:
              $ref: '#/components/schemas/ProductKey'
          required:
            - product_key
        - type: object
          properties:
            url:
              type: string
              format: uri
              maxLength: 2048
          required:
            - url
      properties:
        platform:
          $ref: '#/components/schemas/PlatformCode'
        product_key:
          $ref: '#/components/schemas/ProductKey'
        item_ref:
          $ref: '#/components/schemas/ItemRef'
        url:
          type: string
          format: uri
          maxLength: 2048
        scene:
          type: string
          description: |
            Only the H5 entry (trade.convertAndOpen) uses convert (拍板第二批 TRADE-03); other
            scenes are rejected with 20001 so that the client cannot pick an attribution scene
            such as share (BR-ATTR-05, BR-ATTR-08).
          enum:
            - h5
        spm:
          type: string
          maxLength: 128
        installed:
          $ref: '#/components/schemas/InstalledState'
          description: Default unknown; H5 always sends unknown (BR-ATTR-27 ①).
    ConvertLinkData:
      type: object
      description: The registered link_id plus the same fields as the open result (04 §6.3).
      additionalProperties: false
      required:
        - link_id
        - attempt_id
        - jump
        - price_changed
        - old_final_price_fen
        - new_final_price_fen
        - new_link_id
        - requote_failed
        - new_rebate_min_fen
        - new_rebate_max_fen
        - availability
        - quoted_at
      properties:
        attempt_id:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Issued by the server for this open attempt: a new one for every open of a link, the
            same one when the same Idempotency-Key is replayed. The client sends it in every
            link_jump of this jump (BR-ATTR-21 细则「待跟单卡按实际外跳选」).
        no_rebate_cause:
          description: |
            Non-null only when new_rebate_max_fen = 0 and the reason is known; unknown values are
            treated as null. Not the request's no_rebate_reason (BR-ID-18).
          anyOf:
            - $ref: '#/components/schemas/NoRebateCause'
            - type: 'null'
        link_id:
          $ref: '#/components/schemas/Id'
        jump:
          $ref: '#/components/schemas/JumpPlan'
        price_changed:
          type: boolean
        old_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        new_link_id:
          type:
            - string
            - 'null'
        requote_failed:
          type: boolean
        new_rebate_min_fen:
          $ref: '#/components/schemas/NullableFen'
        new_rebate_max_fen:
          $ref: '#/components/schemas/NullableFen'
        availability:
          $ref: '#/components/schemas/Availability'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
    ConvertLinkResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ConvertLinkData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    LinkKind:
      type: string
      description: Kind of a link on the in-app landing page (contracts/enums/trade.yaml link_kind).
      enum:
        - share
        - other
    SharedProductCard:
      type: object
      description: |
        Product card subset of the share page and the in-app link landing page (04 §6.3): the
        fields of ProductCard without rebate_min_fen, rebate_max_fen, rebate_basis,
        no_rebate_cause and est_net_price_fen (no rebate amount is shown to the opener,
        BR-PRICE-06, BR-ATTR-10), without cta (its key is derived from the rebate state), and
        without the Agent-only card_id, match_tag and spec_text. quoted_at sits next to the card.
      additionalProperties: false
      required:
        - product_key
        - item_ref
        - platform
        - title
        - image
        - price_fen
        - coupon_fen
        - final_price_fen
        - benefit_tags
        - is_presale
        - link_id
        - stale
        - age_sec
        - source
        - disclaimer_keys
        - availability
      properties:
        product_key:
          type:
            - string
            - 'null'
          description: Opaque product key (BR-PROD-02); null only on amount_unknown cards.
          minLength: 3
          maxLength: 128
        item_ref:
          type:
            - string
            - 'null'
          description: Opaque signed reference passed through unchanged (BR-PROD-11).
          minLength: 1
          maxLength: 1024
        platform:
          $ref: '#/components/schemas/PlatformCode'
        shop_type:
          type:
            - string
            - 'null'
          description: Shop type, e.g. tmall for Tmall shops on taobao.
        title:
          type:
            - string
            - 'null'
        image:
          type:
            - string
            - 'null'
          format: uri
        shop_name:
          type:
            - string
            - 'null'
        price_fen:
          $ref: '#/components/schemas/NullableFen'
        coupon_fen:
          $ref: '#/components/schemas/NullableFen'
        final_price_fen:
          $ref: '#/components/schemas/NullableFen'
        benefit_tags:
          type: array
          description: Server-generated labels (有券, 预售…).
          items:
            type: string
        is_presale:
          type: boolean
          description: Presale; shown with the total price (BR-PRICE-22).
        tlj:
          $ref: '#/components/schemas/ProductTlj'
        link_id:
          $ref: '#/components/schemas/Id'
        stale:
          type: boolean
        age_sec:
          type:
            - integer
            - 'null'
          format: int32
          description: Age of the price in seconds, computed by the server (BR-PRICE-11).
        source:
          type: string
          description: Price source (BR-PRICE-16).
          enum:
            - taobao_union
            - jd_union
            - pdd_union
        disclaimer_keys:
          type: array
          description: Ordered dictionary keys (BR-PRICE-17), including price_basis.
          items:
            type: string
        ad_label:
          type:
            - string
            - 'null'
          description: Ad label (BR-TEXT-17).
        availability:
          $ref: '#/components/schemas/Availability'
    LinkLandingData:
      type: object
      additionalProperties: false
      required:
        - link_kind
        - product_card
        - quoted_at
        - viewer_is_sharer
      properties:
        link_kind:
          $ref: '#/components/schemas/LinkKind'
        product_card:
          $ref: '#/components/schemas/SharedProductCard'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Receipt time of the union response the price is based on (BR-PRICE-11).
        viewer_is_sharer:
          type: boolean
          description: |
            True only when called with a token whose user is the sharer of this share link; only
            for the hint above the card (BR-ATTR-11). False for anonymous calls and other links.
    LinkLandingResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/LinkLandingData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SharePageData:
      type: object
      additionalProperties: false
      required:
        - product_card
        - quoted_at
        - jump_url
        - tpwd_ticket
        - open_in_app_url
      properties:
        product_card:
          $ref: '#/components/schemas/SharedProductCard'
        quoted_at:
          type:
            - string
            - 'null'
          format: date-time
          description: Receipt time of the union response the price is based on (BR-PRICE-11).
        jump_url:
          type: string
          format: uri
          description: The sharer's converted short link used for the jump; never contains a token.
        tpwd_ticket:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 256
          description: |
            Short-lived ticket for POST /v1/share-pages/{link_id}/tpwd; null inside WeChat, without
            User-Agent, or when the link has no token (BR-ATTR-10 细则).
        open_in_app_url:
          type:
            - string
            - 'null'
          format: uri
          description: LinkLanding deep link; null while share.open_in_app.enabled is off.
    SharePageResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/SharePageData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    ShareTpwdRequest:
      type: object
      additionalProperties: false
      required:
        - ticket
      properties:
        ticket:
          type: string
          description: tpwd_ticket from GET /v1/share-pages/{link_id}.
          minLength: 1
          maxLength: 256
    ShareTpwdData:
      type: object
      additionalProperties: false
      required:
        - tpwd
      properties:
        tpwd:
          type: string
          minLength: 1
          description: The token of the share link, to be copied by the page.
    ShareTpwdResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/ShareTpwdData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    EarningsPeriod:
      type: object
      description: One period of the self or share column (BR-FUND-25).
      additionalProperties: false
      required:
        - paid_count
        - est_fen
        - credited_fen
      properties:
        paid_count:
          type: integer
          format: int32
          minimum: 0
          description: Paid child orders attributed to the user in the period (by paid_at).
        est_fen:
          type: integer
          format: int64
          minimum: 0
          description: Estimated share of the user, by paid_at.
        credited_fen:
          type: integer
          format: int64
          description: Signed sum of the credit entries by accounting_date; negative when the period has only reversals.
    ReferralEarningsPeriod:
      type: object
      description: One period of the referral column (BR-FUND-25); no count.
      additionalProperties: false
      required:
        - est_fen
        - credited_fen
      properties:
        est_fen:
          type: integer
          format: int64
          minimum: 0
          description: Estimated direct and indirect referral share, by paid_at.
        credited_fen:
          type: integer
          format: int64
          description: Signed sum of the REFERRAL_CREDIT entries by accounting_date.
    EarningsColumn:
      type: object
      description: Self or share column, four periods.
      additionalProperties: false
      required:
        - today
        - yesterday
        - this_month
        - last_month
      properties:
        today:
          $ref: '#/components/schemas/EarningsPeriod'
        yesterday:
          $ref: '#/components/schemas/EarningsPeriod'
        this_month:
          $ref: '#/components/schemas/EarningsPeriod'
        last_month:
          $ref: '#/components/schemas/EarningsPeriod'
    ReferralEarnings:
      type: object
      description: Referral column, only this month and last month, all platforms.
      additionalProperties: false
      required:
        - this_month
        - last_month
      properties:
        this_month:
          $ref: '#/components/schemas/ReferralEarningsPeriod'
        last_month:
          $ref: '#/components/schemas/ReferralEarningsPeriod'
    EarningsSummary:
      type: object
      additionalProperties: false
      required:
        - as_of
        - self
        - share
        - referral
      properties:
        as_of:
          type: string
          format: date-time
          description: Time the figures were computed (BR-FUND-25 细则).
        self:
          $ref: '#/components/schemas/EarningsColumn'
        share:
          $ref: '#/components/schemas/EarningsColumn'
        referral:
          description: null while earnings.dashboard.referral_visible is off.
          anyOf:
            - $ref: '#/components/schemas/ReferralEarnings'
            - type: 'null'
    EarningsSummaryResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/EarningsSummary'
        trace_id:
          $ref: '#/components/schemas/TraceId'
