          description: The account, or an empty object when nothing is bound.
          anyOf:
            - $ref: '#/components/schemas/PayoutAccount'
            - $ref: '#/components/schemas/EmptyData'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    SavePayoutAccountByAlipay:
      type: object
      additionalProperties: false
      required:
        - payout_method
        - alipay_logon_id
        - payee_name
      properties:
        payout_method:
          type: string
          enum:
            - alipay
        alipay_logon_id:
          type: string
          description: Alipay logon id (phone or e-mail form), normalised by the server (BR-WDR-02 细则).
          minLength: 1
          maxLength: 128
        payee_name:
          type: string
          minLength: 1
          maxLength: 64
    SavePayoutAccountByBankCard:
      type: object
      additionalProperties: false
      required:
        - payout_method
        - card_no
        - bank_name
        - payee_name
      properties:
        payout_method:
          type: string
          enum:
            - bank_card
        card_no:
          type: string
          description: |
            Card number as typed; the server removes spaces and hyphens, then checks 12–19 digits and
            Luhn (20001 data.fields=[card_no], BR-WDR-02 ⑥ and 细则).
          minLength: 1
          maxLength: 32
        bank_name:
          type: string
          description: Opening bank as chosen by the user (04 §6.1).
          minLength: 1
          maxLength: 64
        payee_name:
          type: string
          description: Account holder name (BR-WDR-02 ①).
          minLength: 1
          maxLength: 64
    SavePayoutAccountRequest:
      oneOf:
        - $ref: '#/components/schemas/SavePayoutAccountByAlipay'
        - $ref: '#/components/schemas/SavePayoutAccountByBankCard'
    ArticleCategory:
      type: string
      description: Article category (04 §6.2：帮助、规则、公告、协议; codes defined here, no enums/ entry yet).
      enum:
        - help
        - rule
        - notice
        - agreement
    RouteTarget:
      type: object
      description: |
        In-app jump target {route, params} (contracts/routes.json; TECH-04). route stays a string on
        purpose: a server may return a route newer than an installed client, which then opens the
        upgrade page (03 §4.4), so the HTTP contract cannot pin the route list. The client checks
        route and params against its own routes table (bridge RouteTarget) before opening; the
        server only stores targets checked against routes.json when they are saved.
      additionalProperties: false
      required:
        - route
      properties:
        route:
          type: string
          minLength: 1
        params:
          type: object
          additionalProperties: true
    NoticeItem:
      type: object
      description: |
        One notice-bar entry, shared by the static (home schema) and api (GET /v1/articles notice
        category) sources; closing and content-version rules only in BR-TEXT-13 细则「首页公告条的
        关闭与内容版本」 (04 §6.2).
      additionalProperties: false
      not:
        type: object
        additionalProperties: true
        description: A notice that cannot be closed must have end_at (BR-TEXT-13 细则「生效区间」).
        properties:
          closable:
            const: false
          end_at:
            type: 'null'
        required:
          - closable
          - end_at
      required:
        - item_id
        - content_version
        - text
        - target
        - closable
        - start_at
        - end_at
      properties:
        item_id:
          type: string
          minLength: 1
          description: For api entries the notice article id.
        content_version:
          type: integer
          format: int32
          minimum: 1
        text:
          type: string
          minLength: 1
        target:
          anyOf:
            - $ref: '#/components/schemas/RouteTarget'
            - type: 'null'
        closable:
          type: boolean
        start_at:
          type: string
          format: date-time
        end_at:
          type:
            - string
            - 'null'
          format: date-time
    ArticleSummary:
      description: A list item; items of the notice category carry notice (04 §6.2), others do not.
      oneOf:
        - $ref: '#/components/schemas/NoticeArticleSummary'
        - $ref: '#/components/schemas/PlainArticleSummary'
