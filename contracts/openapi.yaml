        is null when is_other_product=true; with is_other_product=true title and image_url are
        null too.
      additionalProperties: false
      required:
        - order_id
        - platform
        - title
        - image_url
        - pay_amount_fen
        - quantity
        - display_status
        - reason
        - est_rebate_fen
        - paid_at
        - is_other_product
        - product_key
        - reason_action
        - timeline
        - expected_credit_period
        - credit_overdue
        - actual_fen
        - clawback_fen
        - appeal_pending
        - is_price_compare
      properties:
        order_id:
          $ref: '#/components/schemas/Id'
        platform:
          $ref: '#/components/schemas/PlatformCode'
        title:
          type:
            - string
            - 'null'
        image_url:
          type:
            - string
            - 'null'
          format: uri
        pay_amount_fen:
          $ref: '#/components/schemas/NullableFen'
        quantity:
          type: integer
          format: int32
          minimum: 1
        order_no:
          type: string
          minLength: 1
          description: Full platform order number (self-purchase only, copyable).
        masked_order_no:
          type: string
          minLength: 1
          description: Masked by the server (BR-TEXT-02 细则「订单号的显示」); shared orders never carry the full number.
        display_status:
          $ref: '#/components/schemas/OrderDisplayStatus'
        reason:
          anyOf:
            - $ref: '#/components/schemas/OrderReasonCode'
            - type: 'null'
        est_rebate_fen:
          $ref: '#/components/schemas/NullableFen'
        paid_at:
          type:
            - string
            - 'null'
          format: date-time
          description: |
            Payment time (the final payment of a pre-sale order); null for a pre-sale order still in
            DEPOSIT_PAID (BR-ATTR-25 keeps paid_at for the final payment).
        is_other_product:
          type: boolean
          description: A shared order whose bought product is not the shared one.
        product_key:
          anyOf:
            - $ref: '#/components/schemas/ProductKey'
            - type: 'null'
        reason_action:
          type: array
          description: Action codes of the reason (the order_reason dictionary's action[], BR-TEXT-05).
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/OrderTimelineItem'
        expected_credit_period:
          type:
            - string
            - 'null'
          pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
        credit_overdue:
          type: boolean
        actual_fen:
          $ref: '#/components/schemas/NullableFen'
        clawback_fen:
          $ref: '#/components/schemas/NullableFen'
        appeal_pending:
          type: boolean
        is_price_compare:
          type:
            - boolean
            - 'null'
      not:
        type: object
        additionalProperties: true
        properties:
          is_other_product:
            const: true
        required:
          - is_other_product
        anyOf:
          - type: object
            properties:
              title:
                type: string
            required:
              - title
          - type: object
            properties:
              image_url:
                type: string
            required:
              - image_url
          - type: object
            properties:
              order_no:
                type: string
            required:
              - order_no
          - type: object
            properties:
              product_key:
                type: string
            required:
              - product_key
      oneOf:
        - type: object
          properties:
            order_no:
              type: string
          required:
            - order_no
        - type: object
          properties:
            masked_order_no:
              type: string
          required:
            - masked_order_no

    OrderDetailResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
          type: string
        data:
          $ref: '#/components/schemas/OrderDetail'
        trace_id:
          $ref: '#/components/schemas/TraceId'
    PendingTrack:
