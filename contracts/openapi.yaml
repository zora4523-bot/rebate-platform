        - bank_name
        - masked_payee_name
        - change_remaining_this_month
      properties:
        payout_method:
          type: string
          enum:
            - bank_card
        masked_account:
          type: string
          description: Masked by the server (BR-ID-33 细则「收款账号的脱敏格式」).
        bank_name:
          type: string
          description: From the card BIN.
        masked_payee_name:
          type: string
        change_remaining_this_month:
          type: integer
          format: int32
          minimum: 0
    PayoutAccountResponse:
      type: object
      additionalProperties: false
      required:
