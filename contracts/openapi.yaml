                  expire_at: '2026-10-02T09:35:00+08:00'
                trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
        '429':
          $ref: '#/components/responses/TooManyRequests'
        4XX:
