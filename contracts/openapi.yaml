      value:
        code: 20001
        msg: 参数错误
        data:
          fields:
            - platform
        trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    AdminUnionBindingNotAllowed:
      summary: 30154 the binding's current status does not allow the action
      value:
        code: 30154
        msg: 该授权当前的状态不允许这项操作，请刷新后查看
        trace_id: 0199a3b4-5c6d-7e8f-9a0b-1c2d3e4f5a6b
    AdminUnionBindingConflict:
      summary: 20902 the binding was changed by someone else (row_version moved on)
      value:
