      required:
        - items
      properties:
        items:
          type: array
          description: Every item of the batch, in request order.
          items:
            $ref: '#/components/schemas/AdminConfigItem'
    AdminConfigItemListResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - msg
        - data
        - trace_id
      properties:
        code:
          $ref: '#/components/schemas/SuccessCode'
        msg:
