      summary: Upload a platform mark image and get its cleaned preview
      description: |
        Permission point `content.platform_icon`. `multipart/form-data` with one part `file`: an
        SVG, or a PNG with a transparent background and sides of at least 512 px, at most
        `content.platform_icon.max_bytes` bytes (default 204800; BR-TEXT-24 细则「上传与发布」).
