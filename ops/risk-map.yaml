# Risk level by path (规划/11 §1.2). Read by tools/guard/risk-of-paths.ts from the trusted root.
# - Default is RV2: only paths listed here can be RV0 or RV1.
# - First match wins; a path that matches no rule is RV2.
# - Every directory under apps/api/src/modules/* and packages/* must appear here
#   (tools/guard/risk-map-coverage.ts fails otherwise).
# - The 分工 table in the root AGENTS.md is generated from this file
#   (node tools/guard/agents-table.ts --write); do not edit that table by hand.
# - Columns (规划/11 §1.1; owner decision 2026-10-05, ops/approvals.yaml id 19): impl is always
#   claude (a Claude Opus 5.5 subagent, model claude-opus-5-5, in the task worktree); tester is
#   codex where it was claude before (rule and acceptance tests written BEFORE the
#   implementation and red first, through tools/agent/codex-run.sh impl --phase test); none
#   stays none (docs, ledger); review is
#   codex (a fresh read-only Codex session) for RV0 / RV1 and claude+codex for RV2 (a fresh
#   read-only Codex session plus a fresh Claude subagent that is not the implementing one).
#   The rule-test assets themselves (test/**, packages/testing/**, db/invariants/**) are mapped
#   apart: impl codex (they are the test author's), review claude, risk unchanged.
# Protected path, class 3 (规划/11 §4.4): changing this file needs owner approval.
version: 1
rules:
  - path: 'docs/**'
    risk: RV0
    impl: claude
    tester: none
    review: codex
  # Task ledgers (ops/tasks/<id>.yaml): RV0, owner decision 2026-10-02 (ops/approvals.yaml
  # id 17). The guards still read a task's paths from the trusted root (or, for a ledger the
  # task PR itself adds, from its head: tools/guard/lib/checks.ts guardTask).
  - path: 'ops/tasks/**'
    risk: RV0
    impl: claude
    tester: none
    review: codex
  - path: 'contracts/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'packages/contracts-ts/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'apps/api/src/modules/health/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  # identity: 其他交易模块按规划/11 §1.1 为 RV1；分工按 2026-10-05 负责人改定的 §1.1（§7.3 第 12 项）：
  # Claude Opus 5.5 子代理实现、Codex 写 AC 映射测试（实现前先写）、Codex 新只读会话评审。
  # 负责人 2026-10-05 在对话中确认「按规划登记」。
  - path: 'apps/api/src/modules/identity/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  # risk: 其他交易模块（规划/11 §1.1 第 4 行）为 RV1，分工同 identity（2026-10-05 改定）。
  - path: 'apps/api/src/modules/risk/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  # union: 归属与订单状态机（规划/11 §1.1 第 3 行：orders、linking、union）为 RV2，评审另加 Claude 新子代理。
  - path: 'apps/api/src/modules/union/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  # admin、content: 规划/11 §1.1 没有单列，按 §1.2「未列入白名单的任何路径」为 RV2；分工按 2026-10-05 改定的通则。
  - path: 'apps/api/src/modules/admin/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  - path: 'apps/api/src/modules/content/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  # linking: 归属（规划/11 §1.1 第 3 行：orders、linking、union）为 RV2，评审另加 Claude 新子代理。
  - path: 'apps/api/src/modules/linking/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  # catalog、parsing: 规划/11 §1.1 第 4 行「其他交易模块」为 RV1，分工同 identity、risk（2026-10-05 改定）。
  - path: 'apps/api/src/modules/catalog/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'apps/api/src/modules/parsing/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  # agent: 规划/11 §1.1「Agent 服务：agent、judge」行为 RV1（2026-10-06 随 B3-02 / B3-03 首个子任务登记；
  # 列值照通则，B3-02、B3-03 等的 Codex 首发实现是任务级例外，见 tools/guard/codex-impl-tasks.json 与 ops/approvals.yaml 第 23 条）。
  - path: 'apps/api/src/modules/agent/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'apps/api/src/modules/platform/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  # evals: Agent 评测框架（规划/02 §9.3、§16.2「公开库只放加载器、schema 与合成样例」；05 B3-01）。
  # 非资金、非归属，按规划/11 §1.1「Agent 服务」为 RV1；正式评测题与录制只在 rebate-private。
  - path: 'packages/evals/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  # H5、后台与前端共用包（规划/11 §1.1「H5、后台」行：RV0 / RV1，提现、调账页面 RV2，评审另加 Claude 新子代理）。
  # 提现、调账页面在前，整包 RV1 在后（先匹配先生效）；不论放在 resources、pages 还是单文件都命中。
  # 桥 SDK 按 §1.2「桥」为 RV1；令牌包接近「生成物」（RV0），取 RV1 更严。
  - path: 'apps/admin/src/**/{withdrawals,adjustments}/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  - path: 'apps/admin/src/**/{withdrawals,adjustments}.*'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  - path: 'apps/admin/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'apps/h5/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'packages/bridge-sdk/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'packages/ui-tokens/**'
    risk: RV1
    impl: claude
    tester: codex
    review: codex
  - path: 'packages/money/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  - path: 'packages/domain/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  - path: 'packages/db/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  # Rule-test assets (class 1 of tools/guard/protected-paths.json) are written by the rule-test
  # author Codex and reviewed by the other model, Claude (the spec-test review by a fresh Claude
  # subagent, tools/agent/README.md §11); risk unchanged. db/invariants/** comes before db/**.
  - path: 'db/invariants/**'
    risk: RV2
    impl: codex
    tester: none
    review: claude
  - path: 'db/**'
    risk: RV2
    impl: claude
    tester: codex
    review: claude+codex
  - path: 'packages/testing/**'
    risk: RV2
    impl: codex
    tester: none
    review: claude
  - path: 'test/**'
    risk: RV2
    impl: codex
    tester: none
    review: claude
