# 2026-10-22 入账（admin-backend，派工 ③ F1-10i 后端）。依据：契约 CT-24o 原文与台账注释、08 BR-ID-34 BR-ID-43（初始密码、重新生成初始密码、重置身份验证器、停用后台账号；2026-10-22 自 BR-ID-34 拆出，couli #175）、BR-ID-42（停用即取消导出）。
# #1221 r1 Claude S2 待落实：① 停用与取消导出同事务——导出取消端口改为接收调用方事务（trx），由 app.module 在 admin 入口单独提供该端口、不装配整套导出 worker；② 会话作废——admin_token 与 login_ticket 带账号代际值（如 row_version），admin-check 与凭证兑换时比对（停用 / 重置验证器 / 重新生成初始密码都使旧会话与未走完的中间凭证失效），admin-check 另复核 TOTP 是否已绑定；③ 创建与重新生成初始密码各自只在当次响应出现一次。权限点整组保存拆为 B1-34k（引 BR-ID-34），本任务 refs 只 BR-ID-43（BR-ID-34 拆出 BR-ID-45 后仍约 10.9KB，与 BR-ID-43 同引超 24KB）。
# 本线技术取舍（由编排者摘进任务书第 9 节）：不加迁移（admin_users 已有 password_must_change / totp_* / status / display_name / row_version，admin_permissions 已有；如列级授权缺 UPDATE 再开迁移任务）；初始密码用 CSPRNG 生成、只存哈希、只在创建响应里出现一次，不进日志 / 审计；停用经 B1-34e 的 cancelByCreator 端口取消导出，会话作废复用现有 admin 会话存储；权限点键只收 specs/permissions.yaml 已登记的；所有写在同一事务内写 audit_logs。
