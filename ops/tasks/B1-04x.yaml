id: B1-04x
repo: rebate-platform
title: 拼多多「查询身份」装配与告警日志分流：loadConfig 读可选的 PDD_QUERY_CUSTOM_PARAMETERS（非密钥，JSON 字符串 ≤64 字节，缺失不拒绝启动），union.module 用 union_pids 的 pdd 查询场景 active 推广位 + 该配置构造 B1-04u 的 queryIdentity 提供者交给真实适配器；logPddWarning 按 event 分流（PRICE_ANOMALY 不再记成 PDD_ERROR_CODE_UNKNOWN）
type: impl
# 草稿 2026-10-15（拼多多接入线 pdd-lane）。来源：B1-04u 裁定 D-u2（商品接口要求已备案的 pid + custom_parameters，适配器构造时注入 queryIdentity，装配另开）与 B1-04u 实现 notes（价格异常经 warn 钩子发 event=PRICE_ANOMALY，union.module.ts 的 logPddWarning 记错类型）。
# 依据：probe（approvals 28 / 29；cap-tests/2026-10-15/pdd/）：商品接口缺已备案参数 → 50001 / sub_code 60001；备案按推广位分开（查询位备案与自购位无关）；BR-ATTR-08（按 scene 取 active 推广位，找不到不改用其他场景）。
# 做法（#492 评审后）：① PDD_QUERY_CUSTOM_PARAMETERS 是服务端配置的查询身份（不是密钥，不登记进 credential-env），作 AppConfig 上单独的可选字段（不放进 AppConfig.pdd）；只在设了值时校验（合法 JSON 对象字符串、≤64 字节，问题文本只写变量名）；任何环境缺失都不拒绝启动（受保护测试 wiring-config 的 staging 问题清单、B1-04t CONFIG#5、STARTUP#5–#7 不能变红），pdd live 而缺失时启动打一条只写变量名的告警，商品调用按 B1-04u 口径报 upstream_rejected。
# ② queryIdentity 提供者改为接收调用上下文（CallCtx），用 ctx.appId + platform pdd + 场景 query 取 active 推广位（经 union/pids 新增的只读入口，不需要超级账号校验与审计写入），取不到 → UnionError('upstream_rejected')，不改用其他场景；customParameters 原样用配置值。B1-04u 冻结的商品测试多传一个参数不变红。
# ③ registry 工厂（UNION_REGISTRY）的注入保持现有 4 个（受保护测试 kit.startUnion 只提供这 4 个）；读推广位的能力从另一个单独、可选的注入项按需取（隔离测试里可能没有数据库）。
# ④ 一份全局查询 custom_parameters：每个 app 的查询推广位都要用同一 uid 分别备案（备案按推广位分开），否则商品接口 50001 / 60001。③ logPddWarning：有 event 字段时按 event 记（PRICE_ANOMALY 记为价格异常、不带金额），否则维持现有错误码告警。
# 不改 config/union-endpoints/pdd.json；该 uid 的备案由负责人用本人拼多多账号一次性授权（编排会话用探测脚本生成备案链接），不在本任务。
# 风险：platform/config 与 union 装配 → RV2。与 B1-04w、B1-04h（infra/pdd/**）、B1-04p（union/**）重叠，派工串行。
