id: CT-24k
repo: rebate-platform
title: 契约：后台导出任务——POST /admin/v1/exports（resource + filters 异步生成）、GET /admin/v1/exports（分页，状态 / 来源 / 时间筛选）、GET /admin/v1/exports/{id}/download（签名链接，每次调用写审计）、POST /admin/v1/exports/{id}/retry（只 failed 可重试）；export 权限点、列表未勾 audit.view_all 只看本人、下载与重试只限创建人、默认脱敏（不脱敏须 pii 权限 + 二次验证 + 理由）；枚举 export_status / export_resource；planned
type: contract
# 2026-10-19 入账（admin-backend，从 CT-24c 拆出；规划 #137）。依据 01 F-ADM-03、04 §6.6 exports 段与 §11.1 export、08 BR-ID-34 细则「后台导出任务」、BR-ID-30 ⑨、BR-TEXT-25、design/specs/admin-ledger.md、10 AC-S2-111。
# 本线技术取舍（由编排者摘进任务书第 9 节）：export_status 六值 pending / running / done / failed / expired / cancelled（中文名已在 BR-TEXT-25）；没有取消接口（cancelled 只来自账号停用，设计稿「不可取消」）；filters 与该来源列表的查询参数同形；创建时还须持有该资源列表本身的权限点（如 user.list）；文件 CSV；任务生成后 24 小时内可下载（BR-ID-34、BR-ID-30 ⑨，到期置 expired）；每次调用下载接口重新鉴权并签发**短时签名链接**，有效期取 min(5 分钟, 任务剩余时长)，不沿用任务剩余寿命——创建人被停用或被撤权后旧链接很快失效（GitHub Codex #850 P1；对 BR-ID-34「24 小时」按任务可下载期理解，已在 notices 请规划确认）；
#   **可见与可操作**（台账 #850 Claude 评审 S1）：列表——持 audit.view_all 看全部、否则只看本人；**下载与重试只限创建人本人**（audit.view_all 只放开列表可见，不放开下载 / 重试）；他人任务号调 download / retry 与不存在同码 20001 [id]（防探测）；被停用账号的任务不能被他人重试；**下载时再校验创建人当前仍持有该来源列表权限点（未脱敏文件另需仍持有对应 pii.*），否则按不存在同码拒绝**。
#   **脱敏**（GitHub Codex #850 P1）：默认一律脱敏（与来源列表投影一致，如手机号 3+4）；只有创建请求明确要求不脱敏（如 unmasked: true）、创建人持有对应 pii.*（手机号 pii.reveal_phone）、并提交该 pii 权限点档位的二次验证（X-Step-Up-Token，totp）与理由（1–200 字）时才生成未脱敏文件，且该次创建单独写一条审计（含理由、来源、行数，不含明文）；缺 pii 权限 10403、缺 / 错令牌 10003；任务与文件记录 masked。**重试**同样只限创建人，且重试时重新校验来源列表权限；未脱敏任务的重试另需当前仍持有对应 pii.*、提交新的该档位二次验证令牌与理由，并单独写审计（每次生成明文文件都要一次新的二次验证，GitHub Codex #850 P1）。
#   拒绝码：下载时状态非 done（pending / running / failed / expired / cancelled）与重试时状态非 failed 共用一个新码（客户端动作相同，同 30154 先例），按 08 §13.11 在现有业务子段内顺序取号（不存在「后台专用段」），登记进 contracts/error-codes.yaml 与 packages/contracts-ts/scripts/texts.ts 的 ADMIN_ONLY_CODES（并同步 packages/contracts-ts/src/texts.test.ts 的列表，均在 packages/contracts-ts/** 内，非保护路径；不改 texts.default.json），并在 notices 请规划回写 13.11。行数上限与并发限额写成配置键说明、取值由实现任务定默认。
#   列表项字段（设计稿 admin-ledger.md:31）：{id, resource, filters_summary, masked, created_by, created_at, status, progress?, failure_reason?, file_name?, row_count?, expires_at?}；状态迁移写进描述：pending→running→done / failed，done→expired，pending / running→cancelled（账号停用），failed→pending（重试）。export_resource 首批放 users 与 audit_logs（审计日志由 CT-24c 定义，本任务依赖 CT-24c），其他来源随各列表契约追加；导出 audit_logs 时套用 CT-24c 列表相同的本人强制（不持 audit.view_all 时 actor_id 强制为本人，filters 里的他人 actor_id 得空文件）——审计日志没有专门的列表权限点，「须持有该资源列表权限点」对它即为登录即可（台账 #850 Claude 评审 r2 S2）。
# 实现由 B1-34 承接（另需私有对象存储签名端口、导出队列、停用账号即取消的钩子，依赖 B1-30 与后续 admins 停用契约）。权限点 export 已存在（无需 test-change）。
