title: 实现 POST /v1/shares（契约 CT-15t，planned → 实现；BR-ATTR-10 细则「分享页与分享赚入口页」、BR-TEXT-20 细则「分享页文案」、BR-PRICE-06、BR-INV-19）——以分享者身份按 share 场景登记新 link（pid_scene=share）并实时转链，京东 / 拼多多落 share_materials（share_url；tpwd 空）；淘宝取不到推广链接或口令时整次不生成、不留 link 与物料（现有错误码，D10-426）；未授权 30101 / 30111，未满 18 周岁 30413；images 取联盟商品详情主图与多图（≤9，不入库、不转存）；copy 六段按商品实际返回字段渲染（缺省段不返回或 null，include_default 只列本次返回的段）；est_promo 按 buy_type=share 报价，只回给分享者本人；poster_url 一律 null（TODO blocked on TECH-13 出图 worker 与 OSS 凭据）；source_link_id 只记来源、不改原 link；同时把 B1-15u 分享页的缺省物料提供者改读 share_materials（淘宝 promo_url 兜底保留）
type: impl
