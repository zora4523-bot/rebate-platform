id: CT-06r
repo: rebate-platform
title: 门禁小修：red-check 对「测试体未变、仅因 test_paths 内数据 / 夹具文件改动而入列」的用例，允许台账逐条声明豁免（red_exempt：file / test / reason，reason ≥ 10 字）并经规则测试评审确认（evidence spec_test_review.red_exempt_confirmed）后可绿；未声明的照 CT-06p 整文件全红，声明对新增 / 改动的用例无效
type: guard-change
# 2026-10-18 入账（编排会话；裁定见 couli-runs/FUNDS-quote/progress.md 10-18 21:5x「编排裁定（B2-01l 先红门禁）：本次按 C，规则按 A 另修」条）。
# 起因：资金线 B2-01l 的 test/spec/ledger-rules/ledger-rules.test.ts 等文件测试体未改，只因读取本任务改动的 expected.csv / fixtures.ts 入列；CT-06p 对这种情况整文件全红，但其中结构性用例（格式、借贷成对、红冲结构、md 说明）对旧 csv 也成立，骨架上必然绿，不可能有效红，造红等于作假。
# 做法：
#   台账新字段 red_exempt（可选，列表，每项 file / test / reason）：file 是 test_paths 内的规则测试文件，test 是红测报告里的用例全名（describe > … > 用例标题），reason 非空且 ≥ 10 字；task.ts check 校验形状、文件在 test_paths 内、tester 不是 none。声明写在主干台账（red-check 与 evidence-check 都从可信副本读台账，同 test_paths），所以先入账再重跑先红。
#   red-check（lib/red-check.ts）：base 上已存在、测试体比较正常、只因「可能读到本任务改动的 test_paths 内夹具 / helper / 数据文件」而整文件入列的文件，改判为「声明制」（baseline kind support）：测试体未变且台账逐条声明（file + test 精确匹配、reason 合规）的用例可绿（若红仍须有效原因），其余用例照旧须有效红；声明命中的用例列在 exempt（带 declared、reason）与 notes，notes 标明「需规则测试评审确认」。声明对新增 / 改动用例无效（仍须红）；测试体之外代码改动、读不懂、JSX、报告不是红测报告器的文件仍整文件全红，声明无效；全部用例都声明则失败（每文件至少一条红，与 evidence-check 一致）。拿不准一律全红。
#   evidence-check：可信台账 red_exempt 非空时，证据 spec_test_review 必须有 red_exempt_confirmed: true，reviewer 是规则测试作者之外的一家（tester codex → claude，tester claude → codex）、last_verdict pass；否则拒绝。每个应跑文件至少一条红、MONEY_PATHS、新文件 / 新用例先红要求、应跑清单都不变。
# tools/ 属保护路径第三类：负责人 10-02 常设授权的流程门禁小修（approvals #16），Claude 实现、Codex 对抗评审，评审通过、检查全绿后按 approvals #24 加标签。tools 自己的单元测试由实现者写，不需要先写规则测试。
