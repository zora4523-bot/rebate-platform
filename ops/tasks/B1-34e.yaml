# 2026-10-19 入账（admin-backend，B1-34 导出部分）。依据：契约 CT-24k 原文与台账注释、08 BR-ID-34 细则、BR-ID-33。配置键 admin.export.max_rows / admin.export.max_running_per_admin 用代码默认值 + ContentReader.configValue 覆盖，**不进配置注册表与种子**（registry 冻结测试）；规划 04 §10 无此两键、02 §11 队列清单无 export，已请规划回写。
# 状态迁移只经 B1-34g 生成的 transitionExportTask()（硬规则第 2 条）。队列只在 worker 入口注册（目录取值照 B1-34c），发送方在创建事务内 send(trx)；到期：任务转 done 的同一事务内 send(trx, expire, {delaySeconds 至 expires_at})——**不带 singletonKey**（export 为 standard 队列，validation.ts 拒绝 standard 队列带 singletonKey，冻结测试 contract.test.ts 钉住；#907 r3 Codex S1），重复投递由消费端 CAS done→expired 幂等兜住，到点 CAS done→expired 并删对象；**不起启动种子、不改 entry.ts**（队列在 startWorkerServices 才启动，onApplicationBootstrap 里 send 会 not_running；且三份入口冻结测试遇未知令牌会失败，#907 两家评审 r2）。
#   并发上限：领取任务时按创建人 pg_advisory_xact_lock(创建人) 后计数 running 再 CAS pending→running（防两 job 同时超限）；明文任务生成后另写一条 export_unmasked 审计带 row_count（审计只追加，契约要求）；本期读主库（worker 无只读库，02 部署表「导出走只读库」待 B1-30 一并处理，notices 已登记）。CSV：UTF-8 BOM、RFC 4180 转义，单元格防公式注入（以 = + - @ 开头加前导单引号）。账号停用即取消的接入要等 admins 停用契约与实现（未入账），本任务只提供端口。
