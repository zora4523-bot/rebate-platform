# （PROP_RUNS=1000000）05:16:24 起、30 分钟处被取消。此前 B2-01l 另有 5 次非成功：3 次在 30 分钟处取消，2 次（26m52s、28m17s）失败。
# 统计：最近 300 次 longrun-props 运行（2026-10-18 11:42～10-19 05:29 UTC）里 longrun-run 成功 177 次，4m30s～11m07s、p90 10m34s。
