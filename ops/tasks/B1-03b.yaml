id: B1-03b
repo: rebate-platform
title: risk 模块首建与请求签名 Guard（判定顺序 ①）：X-Device-Id 只认已签发未吊销的值（10402）、时间偏差 ±300 秒、(device_id, nonce) 600 秒内不重复（Redis）、签名串与 HMAC 校验（10401），只作用于契约标 x-signed 为 true 的接口
type: impl
# 草稿 2026-10-05。B1-03 按 PR ≤400 行拆分（规划/11 §3.4）：b 签名，c 最低支持版本，d 黑名单与 44001，e 三维限流，f 设备注册限额与热点告警，g 发码风控默认值，
# h 风控状态与 10006，i 账户申诉，j 冻结到期任务，k 同设备多账号（BR-ID-37）；B1-03a 是迁移（已入账）。
# 依据：BR-ID-09 条目行、BR-ID-01（判定顺序 ①）、02 §12.2，由编排者摘入任务书第 2 节；签名向量用 CT-15k 的 specs/request-sign.vectors.json。
# 哪些接口要签名只读契约 operation 扩展 x-signed（与 platform/validation 读同一份解引用后的 openapi），不手抄清单。
# install_secret 存在 identity 的 devices.install_secret_cipher（B1-02b、B1-02c）。risk 的依赖为「—」、identity 依赖 risk（02 §4.1），risk 不能 import identity：
# 本任务在 risk/index.ts 定义设备密钥查询端口，由 identity 实现、app.module 装配（依赖倒置，编排者 2026-10-05 裁定 §5 第 3 条）。
# nonce 键 = app_id + device_id + nonce，TTL 600 秒，SET NX 原子写；Redis 不可用时拒绝、不放行，返回 50001（编排者裁定 §5 第 8 条；ADR-0001 §4.2 第 17 项：
# 防重放键不得静默丢失）。比较用定时安全比较；日志不打 install_secret、签名串、X-Sign。
# H5 经桥代签、落地页不签名（BR-ID-32）不在本任务。签名属 ①，必须先于请求校验：Fastify 的 schema 校验在 Nest guard 之前（大写 nonce 会先得 20001、到不了 10401），
# 所以签名检查必须在 Fastify 解析请求体之前完成：在 preParsing 阶段读出原始字节、按 BR-ID-09 先查 X-Device-Id（10402）再验签（10401），通过后把同样的字节交回解析器
# （或等价地用自定义 JSON 解析器先验签后解析；platform 在 bootstrap 提供注册点，risk 注册检查）。验收含组合场景：签名错 + 损坏 JSON → 10401；签名对 + 损坏 JSON → 20001；
# 非签名接口不受影响（Codex 台账评审 2026-10-05 第 1、2 轮）；
# 出错响应经 B1-01za 的全局过滤器出 ErrorEnvelope。令牌守卫（B1-02e）在其后；整条判定链的接线见 B1-03c 注释。
# 串行：b～k 共享 risk/** 与 app.module.ts，只能依次派；b 另与 B1-02e（identity）、B1-01y / B1-01za（bootstrap、platform）相交；c 与 B1-02g（platform/idempotency）相交；
# i 与 B1-02e / f / g 共用 platform/validation/route-schemas.gen.ts。
# 开工前在 ops/risk-map.yaml 登记 apps/api/src/modules/risk/**（规划/11 §1.1：risk 为 RV1；保护路径第三类，要负责人标签）。app.module.ts 不在白名单，整体按 RV2。
