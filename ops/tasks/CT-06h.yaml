# 2026-10-09 入账（负责人同日「继续做」；接 CT-06g（#342）两家评审记下的 S2 与范围外项）。只收紧（① 是收窄误拒），不改任何 BR。
# 契约（规则测试按此写；CT-06a～CT-06g 的规则测试不改、继续通过，本任务只新增 test/spec/db/lint-migrations/ 下的文件）：
# ① CT-06g 的 squawk 例外扩到其他约束种类。squawk 对资金表约束按原定义同名重建实测报的规则：CHECK、EXCLUDE 只报 constraint-missing-not-valid；UNIQUE 另报
#    disallowed-unique-constraint；FOREIGN KEY 另报 adding-foreign-key-constraint；PRIMARY KEY 另报 adding-serial-primary-key-field。ignore 列的规则集合须恰好等于
#    该语句各 ADD CONSTRAINT 种类所需规则的并集（顺序不限）；门禁核实同定义重建（CT-06g 的条件不变）后，checkMigration 不报该 ignore，CLI 主跑与去 ignore 复跑只豁免
#    该语句范围内的这几条规则。多列、少列、列别的规则、种类与规则不符（CHECK 配 disallowed-unique-constraint）一律按资金表 ignore 拒。db/AGENTS.md 第 11 条写明。
# ② set_config 取值以 `$` 开头时须是完整的美元引号字面量（开闭标签相同）；`$1` 等参数引用（PREPARE … EXECUTE）按「关掉」报。
# ③ normaliseDefinition 把美元引号字面量（$$…$$、$tag$…$tag$）与其他字面量一样解码后按规范形式保留，不做小写化：`$$ACTIVE$$` 与 `$$active$$` 不同，`$$a$$` 与 `'a'` 相同。
# ④ 列约束与表约束等价比对：`id bigint CONSTRAINT x PRIMARY KEY` 与 `CONSTRAINT x PRIMARY KEY (id)`、列上 UNIQUE 与 `UNIQUE (列)`、列上 `REFERENCES t (c)` 与 `FOREIGN KEY (列) REFERENCES t (c)` 判为同定义（换列仍不同）。
# 已知不处理：appeals 是否算归属表（归属口径，待负责人或 Jev）；纯函数只给部分迁移史时的比对；pg-boss 生成器输出须按门禁改写。
# 碰 tools/**、db/AGENTS.md（第三类保护路径），合并前要批准标签（approvals 第 24 条）。RV2，两家 money 评审。
