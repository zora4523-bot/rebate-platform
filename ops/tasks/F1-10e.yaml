# 规划未定处的编排者裁定见 couli-runs/F1-10a/decision-orchestrator.md（编号即下文「裁定 N」）：开关仍存 config_items 由注册表区分（裁定 1），开关键进程内缓存 ≤5 秒直读 PG（裁定 2），历史表 config_item_versions（裁定 3），expected_version CAS（裁定 4），任一权限点守卫（裁定 5）。
# 要点：配置键注册表（键 → config.general / config.risk / config.business 与值类型）放 content/domain，与 F1-10b 的开关注册表互斥（开关键不出现在配置中心，裁定 1、5）；注册表外的键不能改（20001 [key]）；整批只允许同一权限点的键（混入别的点 20001 fields=[items]，守卫按该点判权限与档位；台账评审 S1-2），任一项的键或值校验失败 20001 fields 列出失败键、任一项 expected_version 不匹配 20902 resource=config_item，两者都整批回滚、什么都不写；先做全部键与值校验（有失败即 20001），都通过后才比版本（20902，data 只带 resource，与既有 20902 一致）（裁定 8；GitHub Codex 评审 P1，台账评审 r5 S2）；当前版本没有历史行（种子 db/seeds 写入的行）时改值、回滚与列历史照常（历史为空或从当前版本起）；回滚 version+1、审计 config_item_rollback；资金术语键与表 D 的键不登记（05 F1-10）；agent.page_guide.routes（候选集校验）与 external_hosts（union_host 校验）登记为配置项但标「后台暂不可改」，校验另行入账（台账评审 r3 S2）。依赖 F1-10d 以免两任务同改 content 后台模块冲突。
