id: B1-06p
repo: rebate-platform
title: linking open 复核失败分支：no_rebate=true 再次 open 不以复核成功为前提（不写报价快照、不弹变价窗、不显示返利，self_buy 位不带用户参数转链；转链再失败下发无推广参数商品页），不再回 50303
type: impl
# 草稿 2026-10-08（W1 搜索转链线）。依据 BR-PRICE-13 新句（Jev 方案 A，规划 couli#80）、BR-ID-18、BR-PRICE-08；AC-S1-14 ② 已补「复核失败时点次按钮也须外跳」。
# 单列，不并入 B1-06m（其规则测试已过审、spec_commit 已记）；linking/** 串行：B1-06e → B1-06m → 本任务 → B1-06w。
# 不变的例外：淘宝站长授权失效（淘宝 open 归 B1-06f；复核失败分支的改动不分平台、不在 requote 层加淘宝分支，淘宝这条用例归 B1-06f）；分享 link 被他人打开仍忽略 no_rebate（B1-06e 已实现，不得回退）。
# 规则测试（新增 test/spec/linking/open-norebate/**），京东、拼多多取价失败或熔断且无无返利缓存时 no_rebate=true 的 open：成功外跳；price_changed=false、new_final_price_fen=null、
# requote_failed=true（编排决定：本次确未复核成功）；返利 0/0、no_rebate_cause=null（沿 B1-06e #23、#37）；jump 不含任何用户参数（京东无 subUnionId 用户段、拼多多无 custom_parameters.uid），
# 用 pid_scene=self_buy 的 active 推广位；不新增报价快照 link；link_logs 记 no_rebate=true 与服务端判定的 no_rebate_reason；写 attempt 并返回 attempt_id；3 秒单飞窗口内、窗口外各一条（50303 后 3 秒内点次按钮）；
# 转链也失败时下发 BR-PRICE-08 无推广参数商品页，京东 jd:i_ 类键拼不出商品页时 50303 并告警（沿 B1-06e 降级口径；用例同时断言已尝试无返利转链且发了告警，才会先红）。
# no_rebate_reason 沿 B1-06e 口径（取请求里的原因，不读身份模块）。
# 「不变」项（他人打开分享 link 忽略 no_rebate、no_rebate=false 复核失败无缓存仍 50303）在现实现上是绿的，要并进必红用例里一起断言，不单列（先例 B1-06m）。
# 契约说明同步：openapi.yaml 的 openLink 说明「without cache, 50303」与 requote_failed 字段说明（现只说用缓存链接）改为与新口径一致，只改文字不改形状；改后跑 pnpm contracts:codegen 重生成 openapi.gen.ts（先例 B1-02e）。@couli/db/testing 只在 *.int.test.ts 里 import。
# refs 留空：BR-PRICE-13 单条超 24KB，且新句晚于当前 SPEC_REF；依据由编排者摘入任务书第 2 节（先例 B1-06m）。风险：linking/** RV2、openapi.yaml RV1。
