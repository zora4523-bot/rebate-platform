title: packages/db createDb 默认连接池补错误处理——池 'error' 与每个客户端 'error' 都有监听，使用中或空闲的连接被数据库断开时不成为未捕获异常、坏连接被池丢弃，同一 Kysely 实例上其他查询不受影响
type: impl
# 2026-10-09 编排者（staging-b3-term）：B3-03g（PG 受理）在 AWS 测试机完整验证 1990 条测试全过，但断连用例（AC-B3-03g#38、#69）留下 4 个 Uncaught Exception
#   "Connection terminated unexpectedly"（pg client.js:204）。根因不在 B3-03g：createDb 不传 poolFactory 时直接 new pg.Pool，没有 pool.on('error')，
#   也没有给客户端挂 'error' 监听（apps/api/src/modules/platform/db/index.ts:587、602 的平台句柄已有，默认工厂漏了）；任何用默认工厂的连接遇到断连都会让进程崩溃。
# 做法：照平台句柄的写法，默认工厂给池与每个新建客户端挂 error 监听（记录后交由 pg 丢弃坏连接），不改 poolFactory 路径与 int8 解析；不改 platform/db。
# 测试：集成测试在一次性库上用 pg_terminate_backend 断开使用中与空闲的连接，断言无未捕获异常、后续查询照常、池计数恢复。
