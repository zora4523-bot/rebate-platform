# 要点：① 发布校验：version = 当前 + 1；min_version 不降且 ≤ version；劳务协议 requires_resign ⇔ min_version = version，首版必为 true（L3）；隐私 / 用户协议 requires_resign 恒 false；
#   确认人、说明、确认日期三项非空（L4）；违者 20001 + data.fields。② needsSign(signed|null, current) = 未签或 signed < min_version（resign_from_version = min_version）。
# ③ 正文白名单：doc / paragraph / heading（1–3，L9）/ bulletList / orderedList / listItem / blockquote / horizontalRule / image（https 且主机 = 媒体 CDN，由调用方传入）/ text / hardBreak，
#   标记 bold / italic / link；未知节点或属性 → 20001 fields=[body]；body ≤ 200 000 字符、深度 ≤ 20（L10）。④ text_sha256 = sha256(正文 UTF-8)。只用 Node 内置，不读库、不读时钟。
# 待裁定 L1、L3、L4、L9、L10 用默认。
