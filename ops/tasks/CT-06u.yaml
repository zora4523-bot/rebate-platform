repo: rebate-platform
title: 加标签前等 head 的 ci 跑完；遗留 failure 的恢复脚本（ci.yml 不改）
type: guard-change
# 2026-10-19 入账（编排会话）。起因：PR 加 owner-approved 标签（ci.yml 监听 labeled）再触发一轮 ci，上一轮被并发组取消；ci-gate 是
# `if: always()` 的汇总作业，依赖被取消时仍跑并以 failure 结束，同一提交上留下一条 ci-gate=failure 的必需检查，新一轮 success 不覆盖，
# rollup 一直 FAILURE、合并被拦（#799、#815 同日），只能对被取消那轮 gh run rerun 才解开。
# 两个 ci.yml 方案都被 Codex 对抗评审否决、编排裁定不改 ci.yml：① `if: !cancelled()` 让汇总 skipped——GitHub 把 skipped 必需检查视为通过，
# 手动取消或旧提交重跑取消新头时头提交可未经验证合并（r1 S1）；② 有后继运行就 success——依赖作业只在 needs 完成时才创建，后继的 ci-gate 检查
# 出现前头提交同样可合并（r2 S1）。也不加并发分组（标签轮整套 verify 重跑太费 CI 分钟）。
# 改为流程 + 工具（couli-runs，不入库）：rebase-verify.sh 加标签前先 scripts/wait-head-ci.sh 等当前 head 的 ci 运行 completed 且
# verify-fast / verify-props / verify-int 全 success（guard-git / ci-gate 因缺标签红不算；有上限轮询、写 land-progress.log 一行），再
# gh pr edit --add-label，加标签后不再推提交，随后 pr-unblock.sh 对缺标签那轮 --failed 重跑；新增 scripts/pr-unblock.sh <pr>：head 上
# ci-gate=failure 的运行，conclusion=cancelled 的整轮 gh run rerun（不用 --failed），只因 guard-git / ci-gate 红的 --failed 重跑；
# land.sh 合并被拦时先调它。本仓库只改 tools/README.md 的批准标签段（加标签时机、恢复脚本名、ci.yml 为何不改）。
# tools/** 属保护路径第三类：approvals #16 常设授权的门禁流程小修，Claude 实现、Codex 评审脚本逻辑与文案，按 approvals #24 加标签；
# 按 approvals #12 走非 task 分支（chore/guard-change-CT-06u）、不带证据文件。
