# 2026-10-16 入账（后台后端线 admin-backend，编排会话 10-16 20:3x 派「后台配置中心与紧急开关后端」：05 F1-10 后端部分、05 F1-02「含 kill switches」；解开 QA-05c）。
# 依据 04 §3.2 config_items / kill_switches、§10（回滚、版本与操作记录）、§10.2（服务端 10 秒内生效、修改需 step-up 并告警）、§11.2 config.* / switch.*、§5 / §7（20902 CAS、10003 step-up）；02 §10、§14；01 F-ADM-13、F-CFG-04 / 07；08 BR-WDR-17、BR-INV-21。
# 规划未定处的编排者裁定见 couli-runs/F1-10a/decision-orchestrator.md（编号即下文「裁定 N」）：开关仍存 config_items 由注册表区分（裁定 1），开关键进程内缓存 ≤5 秒直读 PG（裁定 2），历史表 config_item_versions（裁定 3），expected_version CAS（裁定 4），任一权限点守卫（裁定 5）。
# 要点：按键传「任一」权限点数组（如 payout.* 为 [switch.all, switch.payout]、pay.* 为 [switch.all, switch.pay]、其余 [switch.all]；04 §11.2，台账评审 r2 S1）；只能改注册表里标为后台可改的开关键（其余 20001 [key]，裁定 5）；值按注册表类型校验（20001 [value]）；一个事务里 UPDATE config_items … WHERE version = expected 并 INSERT config_item_versions，不匹配 20902 resource=kill_switch（裁定 4）；审计 kill_switch_change（带 key、from/to version、前后值、reason）与 warn 日志 config_change_alert（裁定 7）；规则测试含「改后 10 秒内读取方看到新值」（注入时钟推进）；当前版本没有历史行（种子写入）时照常改值。payout.queue_paused / payout.channel_paused.* 以后由打款线系统置位：系统写入也须走同一套 version 比较并更新与历史行（在注册表注释里写明，台账评审 S2-4）。
