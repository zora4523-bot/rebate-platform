# 都以 Test timed out in 15000ms 失败，主干与各 PR 的 verify-props 时红时绿。不是业务失败。本机 100000 次约 4 秒。
# 同文件其余 14 条不是性质测试、CI 上都在 120ms 以内；同目录 cards / keyword 两文件合计 < 250ms，无需改。
# 做法：只给 #30 的 it 加第三参数 60_000（同文件、同目录没有性质测试超时先例，取 60 秒，约为 CI 实测的 3.7 倍）并加两行注释。
# 不改断言、生成器、propParams() / PROP_RUNS / 种子，不删用例，不动实现。长跑档 test:longrun 只跑 test/properties，不含本文件。
# 改既有规则测试属第一类保护路径，合并要负责人标签（owner-approved-<头提交前 12 位>，approvals #24），按 approvals 第 12 条走
