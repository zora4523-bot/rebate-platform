# 2026-10-19 入账（编排会话）。起因：test/spec/agent/tools-search/search.test.ts 的 [AC-B3-04b#30] 是 fast-check 性质测试，
# runs 由 propParams()（PROP_RUNS）决定，verify-props 两轮各 100000 次；B3-04b 为修 OOM 改成整轮共用一个 fixture，
# 每次 run 仍新建 handler、走完整 search_products 管线（多平台并发、复筛、合并排序、组卡）。
# CI 上单条 13.6–16.1 秒，撞 test/vitest.config.ts 的 15 秒 testTimeout：
