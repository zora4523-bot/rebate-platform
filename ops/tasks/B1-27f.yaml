id: B1-27f
repo: rebate-platform
title: identity：个人信息副本的取数端口——identity 声明 PersonalDataCopySources（账号资料、实名脱敏、订单、余额流水、提现记录（收款账号脱敏）、同意记录、未过期 Agent 对话、是否已绑邀请人），identity 自有部分自己实现，其余由 orders / ledger / payout / agent / growth 各自 index 的只读入口实现、app.module 组装；不含他人信息
type: impl
# 2026-10-24 草稿（admin-backend，B1-27 拆分）。依据：08 BR-ID-40 细则「导出范围（默认）」、04 §3.2 `personal_data_copies` 行（「副本内容由 identity 声明的取数端口经各模块的只读入口提供（02 §4.1）」）；脱敏格式见 BR-ID-33 细则（约 5.2KB，不进 refs，由编排者摘「实名」「收款账号」「手机号」三种脱敏格式各一句；复用 platform/masking 与 identity/domain/mask-*.ts，不另写规则）。
# refs 只列 BR-ID-40（正文约 1.1KB + 细则约 10.5KB，合计约 11.7KB）。
# 任务书预算（参照 B1-27b 实测：模板约 9KB + 第 3 节路径约 2KB）：规则原文约 11.7KB，第 9 节须压到约 3KB 内，技术取舍一段整体摘入。
# 拆分理由：取数横跨 6 个模块的只读入口，单独评审「范围对不对、有没有带出他人信息」；生成与交付（B1-27h）只消费这个端口，不认识各模块的表。
# 本线技术取舍（由编排者摘进任务书第 9 节）：端口放 identity/ports/personal-data-copy-sources.ts，按 (app_id, user_id) 取，所有读在调用方给的只读句柄上、不写；各模块在自己 index.ts 导出只读函数（只增导出，不改既有行为），app.module 组装；邀请关系只输出「是否已绑定邀请人」（J7），不输出邀请人或下级的任何字段；Agent 对话只取未过期的（BR-ID-30 ①，以 agent store 现有过期口径为准）；副本里的手机号为完整号码、实名为脱敏（BR-ID-40 细则「导出范围」与「企业微信会话交付的下载」）；输出为结构化对象，序列化与打包由 B1-27h 定；不加迁移。
# 涉及 RV2 模块（orders、ledger、payout、growth）只新增只读导出，评审照 approvals 第 27 / 36 条（Codex 一家；不可用时独立 Claude），资金评审清单照填。
