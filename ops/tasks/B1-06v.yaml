title: 拼多多 open 备案判定：快照用户拼多多绑定非 active 时先经授权查询端口复查（已授权置 active 后继续转链），未授权 → 30111（带 auth_jump）、blocked 且未封禁 → 30153；no_rebate 跳过但 blocked 时服务端记 binding_blocked；分享 link 他人打开分享者未备案 → 30111 不带授权入口；所用账号站长授权失效 → 50301 maintenance
type: impl
# 2026-10-08 从 B1-06f 拆出（W1 第七棒，D7-5；台账 #304 评审 fail 后按编排裁定 D7-6 补）。依据：BR-ATTR-05（按快照转链前先校验快照 user_id 的授权，拼多多需备案有效；分享链接校验不通过回 30111；③ 他人非分享 link 换当前用户新 link_id 后判当前用户）、BR-ATTR-11（分享者本人打开自己的分享 link 走自购位、判本人）、
# BR-ID-22（30111 与 auth_jump；授权查询返回已授权才置 active）、BR-ID-18（no_rebate 跳过 30111 / 30153；binding_blocked 由服务端判、永不可找回）、BR-ID-10（授权后新幂等键重发 open）、BR-ID-24 ④（某平台转链依赖站长授权时 50301 maintenance）、BR-ID-17 细则「授权管理页」，由编排者摘入任务书第 2 节。
# 30153 对拼多多：与 B1-06g auth-url 两平台一致；规划 BR-ID-17 末句未限定平台，待规划同步。
# 授权查询端口（S1-1，防「授权后重发仍 30111」死循环）：union 适配器加可选方法（如 queryPddAuthority(用户, 推广位)，经治理层读调用），演示适配器实现（可配置已授权 / 未授权），真实适配器 TODO(规划/11 §4.5) — blocked on CAP-PDD-05；
# open 遇拼多多绑定非 active 且非 blocked 时先查询：已授权则按单一写者、row_version CAS 置 active 后继续转链（不存在绑定行时按 B1-06h 同口径插入 active，union_account_id 取本次所用账号），未授权才 30111；规则测试必须有「授权后用新幂等键重发 open 成功」用例。
# no_rebate（S1-2）：no_rebate=true 跳过授权校验，但拼多多绑定为 blocked 时 link_logs.no_rebate_reason 由服务端写 binding_blocked（覆盖客户端上报）；淘宝由 B1-06f 判；relation_conflict 本批不测（30151 冲突日志未落库，followups）。
# 分享 link：他人或游客打开、分享者拼多多未备案或 blocked → 30111，data 不带 auth_jump / auth_url、不写 state（D7-4 ④，不泄露分享者状态，ErrorEnvelope 仍合法）；他人打开分享 link 忽略 no_rebate（B1-06p 不变项），故带 no_rebate=true 仍 30111。
# 30111 的 auth_jump 复用 union-auth-url 的同一构造与「本次所用账号」判定函数；所用账号站长授权 expired 时 open 回 50301 data.reason=maintenance（BR-ID-24 ④），至少一条用例。判定放在转链端口 / 组合层（同 B1-06f 淘宝），被 convert（B1-06i）共用，不进复核主流程。
# 本批按 union_bindings 平台粒度（user, platform）判定；BR-ID-22 的 (user, pid) 粒度与迁移加 pid 维度记 followups（已知偏离：同一用户换场景推广位不再要求授权）。
# 冻结测试冲突：open-jdpdd、open-owner、open-requote、open-norebate、register、wiring、landing 等连库规则测试打开拼多多 link 时不种绑定、断言 200。实现分支跑出 CI verify-int 失败清单后（可先静态 grep 补全）、本任务合并前，另立 test-change B1-06u（非 task/ 分支 test-change/B1-06u，只补种 active 拼多多绑定与对应 union_accounts、不改断言，先例 B1-06q / B1-06s），
# B1-06u 合并后本任务变基重验再合并，deps 届时加 B1-06u；B1-06u 若改共用 kit 的缺省，本任务新规则测试必须显式设置绑定状态，不依赖 kit 缺省。
# 实现时顺带改 linking/application/link-open-requote.ts 里指向 B1-06f 的拼多多 30111 旧注释。linking/** 串行（B1-06f 之后）；union/** 只加可选查询方法与演示实现。风险：linking RV2（归属与用户授权）。
