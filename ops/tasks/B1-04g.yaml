id: B1-04g
repo: rebate-platform
title: 拼多多 Adapter 请求底座：MD5 签名与公共参数（client_id + client_secret，不需用户令牌，timestamp 取注入的 Clock）、凭据经构造参数注入、真实 HTTPS UnionTransport、按接口登记的响应外层键解包、error_response 分类到 UnionError、端口方法先以 adapter_unimplemented 占位
type: impl
# 草稿 2026-10-05；2026-10-08 按 09 4_PDD_附修订；2026-10-14 按台账 #306 评审（PDD-lane/review-ledger-306.md S1-1/2/6、S2-2/4/11）拆分：本段只做不涉及业务字段映射的底座，商品四接口与 DTO 映射移到 B1-04u。
# 依据：4_PDD_附 §3.1～§3.5（网关、公共参数、签名四步与官方测试向量、响应外层键按接口登记、错误码表、限流）、§5 第 1 项（复用优券汇应用，三条红线）、02 §6.2（治理、超时），由编排者摘入任务书第 2 节。
# 签名：参数按名 ASCII 升序 → 名值拼接 → 头尾加 client_secret → MD5 大写；单元测试必须含 4 附 §3.3 的官方示例向量（secret 为示例值 testSecret）。数组 / 对象参数的序列化文档未写（4 附 §8）：按 JSON 字符串参与签名，标 TODO 待 probe 录制核对。
# 凭据：client_id / client_secret 是应用级密钥（不在 union_credentials，那张表存 OAuth 令牌）；适配器只经构造参数注入的凭据提供者取，不读环境变量、不读文件；secret 只在内存参与签名，不进日志、错误、录制。配置读取与注册表装配另开（等负责人定 staging 密钥存放）。
# 传输：新建 union/infra/http-transport.ts（只允许 https、超时与取消走注入的 signal、请求体与 secret 不进日志），实现 replay.ts 的 UnionTransport 类型；单元测试只用内存假传输，不联网、不 listen。
# 解包与错误：外层键按接口逐个登记（4 附 §3.4 列出的与官方原文为准），不由接口名推导；error_response{error_code,error_msg,sub_code,sub_msg,request_id} 分类：20005 / 20031 / 70036 / 20004 / 10019 / 70032 / 70034 / 70035 → upstream_rejected（20004、20005、70035 另记告警事件）；52101、70031 → rate_limited；52102、52103、70033、50000、50001、50002、52001、52002、HTTP 5xx 与网络错误 → upstream_unavailable；表外 error_code → upstream_rejected。
# 占位：searchItems / getItem / resolveLink / convert / listOrders 一律抛 UnionError('adapter_unimplemented')；不提供 queryPddAuthority（端口缺失时 linking 走 50303）。不写任何商品 / 订单字段映射（AGENTS §4 第 7 条、规划/11 §4.5：没有 probe 录制不写平台字段映射），不新增 fixtures/union-recordings/ 场景（第一类测试 test/spec/load/wiremock/union.test.ts 只认 synthetic-smoke）。
# 目录：只改 union/infra/pdd/** 与 union/infra/http-transport.ts。test_paths：test/spec/union/pdd-core/**。整体 RV2。
