title: platform：实名更正旧身份隔离存储的独立数据密钥——第二套字段密钥环（独立于 FIELD_KEYRING_FILE 的配置项与启动校验，local / test 用 LocalKeyProvider），经 platform/crypto 现有 openFieldCrypto 打开，供 identity 的旧身份迁入使用；B1-27a 前置
type: impl
# 2026-10-24 入账（admin-backend）。依据：08 BR-ID-25 细则「旧身份留存」（「隔离存储用独立的数据密钥」）、04 §3.2「实名更正旧身份」行；只摘这两句，refs 不引 BR-ID-25（约 11.5KB，留给 B1-27a）。
# 拆分理由：独立密钥是 platform/config + crypto 的改动（RV2，启动校验），与 identity 的更正业务分开评审；B1-27a 只接收已打开的第二个 FieldCrypto。
# 本线技术取舍（由编排者摘进任务书第 9 节）：① 照 FIELD_KEY_PROVIDER / FIELD_KEYRING_FILE 新增一组旧身份密钥环配置，变量名实现时定、说明写在 config 源码注释；安全禁区不读写 .env*，本任务不改 .env.example。
# ② staging / prod 缺这组配置时启动失败（同 keyring-startup.ts 口径）；local / test 自动用 LocalKeyProvider 生成。
# ③ 两套密钥环的数据密钥不同；盲索引沿用主密钥环（旧 id_no_hmac 原样迁移不重算）；context 用独立前缀，防止与 realname 列密文互换；KMS 适配器不在本任务。
# 部署：staging / prod 的密钥文件由负责人自己配，本任务只交付配置项与本地实现；未配置时这两个环境启动失败。
# 2026-10-24 paths 补 platform/config/admin-auth.test.ts：按取舍②（D10-324 / D10-325）staging / prod 缺 PRIOR_IDENTITY_* 即报缺配置，该单元测试只配 FIELD 的 staging / prod 用例需同步补这组变量（规则测试评审 r2 S2）。
