id: B2-15s
repo: rebate-platform
title: 停机等待在途 tick 设上限（FU-TICK-STOP-BOUND，B2-15q 后续）
type: impl
# 2026-11-02 be 入账（编排 18:21）。B2-15q 让 onModuleDestroy 等在途 tick，但无上限：tick 卡在 pool.connect()（PG 主机失联，连接池没有 connectionTimeoutMillis）时 context.close() 永远等不完，handles.close 走不到，docker 10 秒后 SIGKILL，没有一行日志。改成限时等待：平台层加一个公共函数，超时打 warn（tick 名）后返回，不抛错；定时器 unref、等到就清。TICK_STOP_WAIT_MS = 800：Nest 逐模块串行调 onModuleDestroy（已核源码），五个定时器最坏共 4 秒，加 queue.stop 5 秒共 9 秒，在 docker 10 秒内。超时后 handles.close 自带 5 秒上限，健康的慢 tick 仍能跑完。冻结 [AC-B2-15q#8] 钉 stop 一直等，与上限矛盾，由新鲜独立 Claude 改，编排按 #24 核。只改 B2-15q 动过的四个模块：payment、ledger daily-check、payout（两处）、union auth-expiry。其他无上限等待（deletion-expiry、payout-verify-recheck、settlement assemble、catalog-worker、invite-reward、order-rescan、sync-scheduler、query-recovery-worker、agent sweeper）不在本单。不用全局截止：staging 的 stop_grace_period 是 30 秒，统一 10 秒以内会截断。RV2。
