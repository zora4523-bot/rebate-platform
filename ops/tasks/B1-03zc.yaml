id: B1-03zc
repo: rebate-platform
title: identity 导出未成年只读端口（BR-ID-26，供 settlement BeneficiaryGate 的 MinorStatusReader）——按 app_id 与一批 user_id，在调用方事务上读 realname verified 记录、解密 birth_date，返回在给定时刻 at 未满 18 周岁（满周岁时刻用 @couli/domain isAtLeastAge）且识别时刻 verified_at 不晚于 at 的用户集合；不是 verified、无实名、不属于该 app 的一律不在集合内；只读、不加锁、不写、不记日志、不返回出生日期
type: impl
# 草稿 2026-10-30（身份与风控线 identity-lane）。依据：编排 D10-443 (b) 及 10-30 19:12 改派——minors 读口由 identity 导出只读端口，不做「永远无未成年」的假实现；funds 的 B2-04zd 改为 deps B1-03zc 并负责装配。
# 接口取舍（本线定）：形状对齐 settlement credit/beneficiary-gate.ts 的 MinorStatusReader——read(executor, { appId, userIds, at }) → ReadonlySet<user_id>；工厂 createMinorStatusBatchReader({ crypto: FieldCrypto })，解密域沿用 REALNAME_CONTEXT.birthDate；一条语句（app.users 内连 app.realname，status=verified），重复 id 去重，空数组不查库；verified 行缺 birth_date 密文或解密 / 日期非法时抛错（库已坏，不当成年人放过）。
# 识别时刻：BR-ID-26「以 realname verified 的时刻为识别时刻」——verified_at > at 的不算已识别。涉及用户授权边界，按编排要求过 money 级对抗评审（独立 Claude，Codex 到 11-02 不可用）。
