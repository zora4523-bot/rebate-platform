id: F1-06c
repo: rebate-platform
title: 首个超管引导命令行：admin_users 里没有超管时才可运行，建超管账号并绑定身份验证器（只在终端显示一次绑定信息，要求输入动态码确认后才落库），写审计；有超管后一律拒绝
type: impl
# 草稿 2026-10-05（W1 搜索转链线）。为什么要：05 B1-19 行要求推广位置 active 前由 super 用 TOTP 二次验证，F1-06 后台登录可用前走命令行；
# 但 F1-06b 只做审计端口与 TOTP 校验原语，明确不做「首次绑定」，仓库里没有任何办法产生第一个已绑定 TOTP 的超管。本任务补这一步（编排者待定，见 plan-draft 待决定第 4 条）。
# 依据：04 §3.2 admin_users / audit_logs 行、BR-ID-34（含细则「首次绑定身份验证器」：动态码错误不绑定）、BR-ID-33（TOTP 密钥经 platform/crypto 加密存）、BR-ID-30，由编排者摘入任务书第 2 节。
# 运行者：负责人本人在终端运行（规划/11 §7.1「必须本人做的事」）；脚本不打印密钥以外的敏感信息，绑定信息（otpauth URI）只显示一次、不写日志、不落文件；
# 密码只存哈希（列名随 F1-06a）。已有超管时退出码非 0 且不改任何数据；并发运行由数据库约束或锁保证只建一个。
# 不做：后台登录、权限点、step-up 令牌、/admin/v1 路由（都归 F1-06 其余部分）。脚本放 apps/api/scripts/（console 只允许在 **/scripts/**），
# 不改 package.json 的 scripts（保护路径第二类），README 写运行命令；如需构建产物，照 smoke-entries.ts 的做法。
# admin/** 与 F1-06b 相交，排在它之后。整体 RV2。
