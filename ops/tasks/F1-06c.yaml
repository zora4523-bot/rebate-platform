type: impl
# 草稿 2026-10-05（W1 搜索转链线），第 1 轮台账评审后改（S2-6）。为什么要：05 B1-19 行要求推广位变更由 super 用 TOTP 二次验证，F1-06 后台登录可用前走命令行；
# 但 F1-06b 只做审计端口与 TOTP 校验原语、明确不做「首次绑定」，仓库里没有任何办法产生第一个已绑定 TOTP 的超管（plan-draft 待决定第 4 条）。
# 依据：04 §3.2 admin_users / audit_logs 行、BR-ID-34（含细则「首次绑定身份验证器」：动态码错误不绑定）、BR-ID-33（TOTP 密钥经 platform/crypto 加密存）、BR-ID-30，由编排者摘入任务书第 2 节。
# 运行者：负责人本人在终端运行（规划/11 §7.1「必须本人做的事」）；绑定信息（otpauth URI）只显示一次、不写日志、不落文件；密码只存哈希（列名随 F1-06a）。
# 已有超管时退出码非 0 且不改任何数据；并发运行由数据库约束或锁保证只建一个。
# 结构（S1-6 裁定「纯模块」做法）：引导逻辑写成 admin/ 下无装饰器、只用可擦除语法、可被 node 直接运行的纯模块，复用 F1-06b 的 TOTP 与审计纯模块；
# 脚本 apps/api/scripts/admin-bootstrap.ts 只组装 @couli/db 与这些纯模块，不 import Nest、不跑 dist。运行命令写在脚本头注释里（不改 README、package.json 的 scripts）。
# 不做：后台登录、权限点、step-up 令牌、/admin/v1 路由（都归 F1-06 其余部分）。admin/** 与 F1-06b 相交，排在它之后。风险：admin RV2，整体 RV2。
