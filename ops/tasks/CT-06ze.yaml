# --with-deps chromium」这一步撞了时限，每次都要整作业重跑。做法：① 安装挪到 pnpm build 之后、test:int 之前，慢了
# 就早失败；② 先读出锁文件固定的 playwright 版本，用 actions/cache（v6.1.0，按提交 SHA 固定）缓存
