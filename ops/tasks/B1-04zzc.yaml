# 2026-11-03 be 入账（D10-588；变更记录 20261031-淘宝订单经大淘客 §1 第 24 行「按凑狸的推广位过滤，不入库别家订单」）。联盟账号与优券汇共用，大淘客返回两边全部订单。现在归档在传输层，ourRows 过滤之前，union_raw_payloads 存了别家订单原文。改成过滤后归档，raw_payload_id 仍能回到这一页。先看 infra/archive.ts 的传输包装与 test/spec/union/archive/**。不动金额。RV2。
