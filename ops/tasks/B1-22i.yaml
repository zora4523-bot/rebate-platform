# 2026-10-23 入账（union 线）。依据 08 BR-ATTR-02 细则「后台登记与启停」、04 §3.2 union_pids（D10-152 ⑦、D10-221）。union_pids 是归属表：索引建法过迁移门禁（不接受 squawk 例外），staging 先只读核对重复。迁移槽现序 B1-22a → B3-09f → B1-15r → B2-05b → B1-01zzg → B1-22i，落地时取主干最大 +1。
# 冻结测试 test/spec/union/pids-by-account/activation.int.test.ts [AC-B1-19d#4] 只把「告警不拒绝」改为「拒绝、不改行」（第一类保护路径，独立 Claude 改 + 新鲜独立 Claude 复审，编排加标签）。
# 2026-10-23 编排裁定 D10-231 修正 D10-221：唯一口径改为同一 app × platform × union_account_id × pid_scene 至多一条 active（跨账号各一条可以，B1-19d「按绑定账号取推广位」保留）；标题沿用旧写法（台账标题不可改），以本行为准：索引 (app_id, platform, union_account_id, pid_scene) WHERE status='active'，服务 / 命令行只拒同账号同场景第二条。Codex 用量至 10-30 不可用，测试改由独立 Claude（approvals #36）。
