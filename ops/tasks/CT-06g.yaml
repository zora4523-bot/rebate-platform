# ① set_config('lock_timeout' | 'statement_timeout', <值>, …) 的值不是字面量（NULL、函数表达式、列引用、运算、子查询）一律按「关掉」报；字面量（含 `'…'::text` 类强转）照旧按取值判断。
# ② 定义比对去 `NOT VALID` 只去约束定义末尾（字面量之外）的修饰符；字符串里的 "not valid" 原样参与比较（CHECK (label <> 'not valid') 与 CHECK (label <> '') 不同）。
# ③ 字面量解码保留开头的 UTF-8 BOM（E'\xef\xbb\xbf…' 与无 BOM 的定义不同）。
# ④ 资金表约束按原定义同名重建经 CLI 无免登记写法（squawk constraint-missing-not-valid 与门禁互斥）：资金表上 `-- squawk-ignore constraint-missing-not-valid`（只此一条规则）
#    写在 ALTER TABLE 语句上一行，且该语句里每个 ADD CONSTRAINT 都是与迁移史定义相同（不带 NOT VALID）的同名重建时放行，ignore 复跑也不报；
#    规则名不同、带其他规则、语句里有新约束或定义不同的重建，仍按资金表 ignore 拒。db/AGENTS.md 第 11 条写明这条写法。
