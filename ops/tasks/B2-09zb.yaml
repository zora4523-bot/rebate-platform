title: 月结正差候选生成（FU-SETTLE-ADJ-POSITIVE，BR-FUND-09 ②，D10-769、D10-770、D10-780）——月结快照后与手动触发跑 settle_jobs.job=settle_adjust，对 CREDITED 子订单按 B_settle 与 booked 分路生成正差候选；adminRunSettleAdjust 去 planned
type: impl
# 2026-11-07 pay 入账。方案 couli-runs/B3-lane/settle-adj-positive-plan-20261107.md，契约 CT-24zv（#2573）。只取正差一路（B_settle > booked_base_fen，或相等而结算佣金正数部分 > booked_n_fen）；决-10：开关 settle.adjust.void_on_clawback.enabled 开着时只对写入晚于最近扣回的结算记录生成。
# 逐受益人 diff = 按 B_settle 与快照重拆的应得 − 已入账净额（同 BR-FUND-08）；冻结受益人照常生成（批准时转待补记）；封禁、注销中 / 已注销并入平台行。一次运行一个 settle_adjust_batches，同事务写行，不动账、不改 booked。
# D10-780：同单同 seq 已有旧 commission_version 的 pending 时，同事务先把旧的置 voided_stale_seq（表无新状态，reason 写 superseded_by_version，decided_at 记 Clock，审计照记）再生成；同版本重复由既有 candidate_key 挡。已批准 / 已拒绝的不动。
# RV2。规则测试由新鲜独立 Claude 写（Codex 额度用尽至 11-11，D10-775）；money 评审独立 Claude + 另一位只读复核。B2-09za 已写的有用场景并进本单规则测试。
# 2026-11-07 补 paths：settlement 的 worker 端口没有审计端口，D10-780 的换版本作废审计要由 app.module 注入 admin createSystemAuditWriter（同 B2-09p 给 payout 接系统审计）；端口设可选，worker 夹具不受影响。 2026-11-07 D10-787：test_paths 补 worker-catchup（新鲜独立 Claude 只给 kit.ts 的 billRunsOf 加 job = 'bill' 过滤，期望不变；另一位只读复审只加过滤），引用 kit.ts 的 12 条冻结用例登 red_exempt；去掉未用的 settlement/index.ts。
