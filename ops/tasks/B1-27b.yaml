# 2026-10-22 入账（admin-backend 代 identity 实现，编排 21:1x：identity 排不过来，由本线在 identity 模块新增服务函数；notices 已告 identity）。依据：契约 CT-24p、08 BR-ID-06 细则「客服代办换号」、BR-ID-39 细则「后台改昵称」、04 §6.6 users/{id}/profile。
# refs 列 BR-ID-44（2026-10-22 自 BR-ID-06 细则「客服代办换号」原样拆出，couli #178）与 BR-ID-39（后台改昵称）；旧 phone_hmac 写入 deleted_identities 的保留期在 BR-ID-06 正文，由编排者在第 9 节一句摘录。
# 本线技术取舍（由编排者摘进任务书第 9 节）：只新增文件、不改已有文件的行为——服务 identity/application/admin-profile-edit.ts（复用 bind-phone 的规范化与占用判定、update-nickname 的审核，经 risk 端口查名单）、控制器 identity/http/admin/user-profile.controller.ts，在 identity-admin.module.ts 注册；照 RiskAdminModule.forAdmin 的做法由 app.module 向 IdentityAdminModule.forAdmin 传入绑定改动事务的 auditWriter（createAuditWriter）、带 unbindRevoked(sessionPushTokens) 的会话吊销与 blocklist 服务（#1183 r1 S1）；旧 phone_hmac 写入 deleted_identities（reason=phone_changed，保留期见 BR-ID-06 正文）；黑名单与占用同时命中先报 44001；这里的 44001 是后台侧拒绝，不记 risk_hits、不进被拦请求申诉（照 BR-ID-25 细则同类口径，代理补全的默认，BR-ID-44 / CT-24p 未写，已在 notices 请规划确认）；TODO(规划/11 §2.3): 后台改号清除待加验标记并解绑可信身份以外的第三方身份（BR-WDR-01 细则）— blocked on 待加验标记的表结构与任务；手机号与昵称在一个事务里写并写审计；换号后的会话处理与是否通知旧号按 BR-ID-06 细则，不另取值；不加迁移。
