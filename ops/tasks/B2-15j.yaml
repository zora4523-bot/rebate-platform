id: B2-15j
repo: rebate-platform
title: T+1 收款对账与差错单：按渠道交易账单逐笔核对 out_trade_no / out_refund_no 的金额与状态（渠道有而我方无或非 PAID、我方 PAID 而渠道无、金额不一致、退款不一致 → recon_diffs source R4、type pay_mismatch / pay_anomaly，经 ledger 登记，告警）；终态支付单不改状态；PAY_FEE 分录按（渠道、账单日）一张（借 PAY_CHANNEL_FEE / 贷 CASH_PAY:{pay_channel}）；处置只有补查后正常结束、登记异常收款并退款、人工关闭三种；账务不变量 db/invariants/ledger/ 新增 pay-*.sql（支付类凭证不含 USER_BALANCE、PAID 单恰一张 PAY_RECEIPT、SUCCESS 退款恰一张 PAY_REFUND 或反向 PAY_ANOMALY、PAY_SUSPENSE 余额 = 未退完异常收款合计）接入日终运行器；后台对账差错数据接口（pay.view）
type: impl
# 2026-10-22 收款线入账（BR-PAY-07 全文与细则；BR-WDR-23 同一做法但不套用 R2：不冻结提现、不做余额调账）。账单下载接口在 PayChannel 上（FakePayChannel 用夹具账单；真实通道 B2-15k）。
# 日终运行器只读 db/invariants/ledger/（invariant-files.ts），08 BR-PAY-07 也写 ledger_invariants.sql，所以收款不变量放该目录、文件名 pay- 前缀（独立复核 S1-5）。
