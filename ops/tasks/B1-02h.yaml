id: B1-02h
repo: rebate-platform
title: identity 令牌签发与令牌守卫：access_token（JWT ES256，claims uid / app_id / sid / device_id / scp，2 小时）、refresh_token 生成与哈希、建会话与吊销会话原语、作用域判定、全局判定 ② 10001 / 10002 与 ③ 10403；退出登录 POST /v1/auth/logout
type: impl
# 草稿 2026-10-05，B1-02e 拆分的一段（见 B1-02e 注释）。依据按规划 b9f54fe，编排者摘入任务书第 2 节（约 10KB）：BR-ID-01 条目行（判定顺序 ①～④）；BR-ID-07 条目行前半（到「单飞」之前）
# 与细则的默认值、「退出登录吊销当前 sid」一条、「绑定代际」「登录时绑定」两项（只取 last_login_sid，推送令牌行的绑定归 B1-12b）、「作用域 scp」一项；BR-ID-01 细则「判定」一项与「受限会话」的
# 「签发」一项；BR-ID-10 细则「恢复执行时用哪个幂等键」里 1xxxx 不写幂等记录一句；02 §12.1 access_token 行；04 §5 请求头、鉴权级别、拒绝码判定顺序三行；04 §3.2 sessions / refresh_tokens 行；04 §6.1 logout 行。
# 判定链接线照 B1-03c 注释（编排者 2026-10-05 裁定，任务书带原段）：①～③ 全局；② ③ 必须先于请求体校验（20001），用 B1-03b 在 platform 建的注册点挂在签名之后、Fastify 校验之前，不另建注册点；守卫抛出的错经 B1-01za 的全局过滤器出 ErrorEnvelope；1xxxx 在幂等之前返回，不写幂等记录。
# ②：x-auth 为 login / phone / realname 时缺令牌 10001；令牌无效、过期、签名不符、sid 已吊销 → 10002（sid 吊销逐请求查库，见 README 裁定点）；optional 带令牌按用户、不带按匿名。
# ③：带令牌时 X-App-Id 必须等于令牌 app_id；不带令牌的签名请求，X-App-Id 必须等于 X-Device-Id 注册时的 app_id；否则 10403。只认 App 令牌，aud=h5 由 B1-02f 接入。守卫把
# {uid, app_id, sid, device_id, scp} 放进请求上下文，类型与读取函数由 platform/http 导出（B1-02g、risk 要读，不能反向 import identity）；scp 越权（10405，在 ④a）归 B1-03c；⑦⑧⑨ 不在本任务（README 缺口）。
# 作用域判定：按请求的 X-Platform / X-Channel / X-App-Version 与最低支持版本比较（identity 定义版本查询端口、F1-02b 的 content 实现、app.module 装配），h5、admin 或没有配置时为 full；
# 版本比较做成纯函数放 platform/client-version 导出（B1-03c 守卫复用，不写两份）；供 B1-02j 登录、B1-02k 刷新调用。建会话原语接收调用方事务：先锁设备行、写 sessions 与首个 refresh_token、
# 把 last_login_sid 写成新会话，并留同事务扩展点给 B1-12b 绑定推送令牌；吊销原语按 sid 置 revoked_at 并作废该链 refresh_token（填空列一次，0013 头注释），供退出、B1-02k 调用。
# 退出：吊销本请求的 sid，其他设备不受影响；已吊销会话再调由守卫回 10002（契约 logout 说明）。推送解绑由 B1-12b 补，合并前 05 B1-02 行「退出解除推送绑定」不算完成。ES256 用 node:crypto 实现（不新增依赖；要装库写 deps_needed），JWT 头带 kid 以便轮换。签名密钥进 platform/config：local/test 未配置时启动生成临时密钥对，staging/prod 未配置拒绝启动；私钥不进
# .env.example（gitleaks）；KMS 托管另立任务（私有库 dev-reference/aliyun/kms.md）。refresh_token 为 32 字节随机串，库内只存 SHA-256；日志不打令牌与密钥。实现路由时去掉 logout 的 x-implementation: planned 并重生成 route-schemas.gen.ts。bootstrap、platform/http 与 B1-03b、B1-01y、B1-01za 相交，排在它们之后。
