# 2026-10-23 入账（admin-backend，编排裁定 D10-141 ②：后台申诉接口归 admin，形状已由 couli #177 回写 04，SPEC_REF 17b5fe5 已含）。依据：04 §6.6 `appeals`、§3.2 `appeals`、§11.2 `risk.appeal`；08 BR-ID-36（含细则「被拦截请求申诉」「权限」「维持后再申诉」）、BR-ID-31；编排裁定 D10-154（撤销名单造成的被拦请求另需 risk.blocklist + 动态码）、D10-158（认领只标记不排他）；画板 AdmRiskAppeals / AdmRiskAppealDetail / AdmRiskAppealRegister*（design-hifi/project）。
# 本线技术取舍（由编排者摘进任务书第 9 节）：照 04 §6.6 `appeals` 原文写形状，不另取值——认领与结案带期望 row_version、状态或版本不符 20902（data.resource=appeal，error-codes.yaml 与 catalog.test.ts 补，04 §7 由规划回写）；代为登记申诉人由服务端从对象推出、带 user_id 不符 20001；同对象处理中返回原单、次数用完 30418；被拦请求按完整手机号 / UID / 拦截请求编号查找，按完整手机号命中写审计；列表与详情手机号一律脱敏；结案经 risk 模块服务写入（`appeal.resolved` 同事务入队），后台接口只调用。对外编号用 appeals.id。拒绝码与 data.reason 新值优先复用已登记码，确需新码先请规划登记。实现 B1-27d 待 identity / risk 的结案与登记服务就绪后入账。30418 与 /v1/me/appeals 的按处罚计次形状由 CT-26e 先落（deps），本契约只引用。申诉相关新枚举放 contracts/enums/identity.yaml（appeal_status 等所在处）。08 BR-ID-36 细则交「契约线随本项落地」的两件：没有手机号的被拦请求（第三方首次登录被拦）只能按拦截请求编号查找，列表的脱敏手机号可为空；非名单原因撤销后的一次性放行属服务端内部，存储与校验位置由 B1-27d / risk 定，不进契约。顺手把工作台 appeal_pending 卡示例 route 的 status=pending 改为 processing（#1235 评审）。
# contract_sections 只填 11.1：§6.6 / §11.2 全节带上超限，编排者把 04 §6.6 `appeals` 段、§3.2 `appeals` 与 `risk_hits` 行、§7 的 20902 与 30418 行、§11.2 `risk.appeal`、`risk.freeze`、`risk.ban`、`risk.blocklist` 四行原文逐字摘进第 9 节。
