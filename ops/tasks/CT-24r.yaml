# 本线技术取舍（由编排者摘进任务书第 9 节）：照 04 §6.6 `appeals` 原文写形状，不另取值——认领与结案带期望 row_version、状态或版本不符 20902（data.resource=appeal，error-codes.yaml 与 catalog.test.ts 补，04 §7 由规划回写）；代为登记申诉人由服务端从对象推出、带 user_id 不符 20001；同对象处理中返回原单、次数用完 30418；被拦请求按完整手机号 / UID / 拦截请求编号查找，按完整手机号命中写审计；列表与详情手机号一律脱敏；结案经 risk 模块服务写入（`appeal.resolved` 同事务入队），后台接口只调用。对外编号用 appeals.id。拒绝码与 data.reason 新值优先复用已登记码，确需新码先请规划登记。实现 B1-27d 待 identity / risk 的结案与登记服务就绪后入账。
