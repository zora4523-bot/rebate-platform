title: risk 订单侧命中记录按处置去重：risk_hits_blacklist_once_key 加 risk_action（同一订单最多一条 manual_review、一条 void_commission），recordHit 去重键同步，改判作废时插第二行不改第一行（只追加）
type: impl
# 2026-10-24 入账（W1；编排裁定 D10-293）。起因：B1-09b 独立 Claude money r1 的 out_of_scope S1——B1-09a 的 BLACKLIST_HIT 去重键不含 risk_action，同一订单先记 manual_review（尾号开关关、或 settlement onBlacklistHit 未接线时）后改判作废时，void_commission 行被 DO NOTHING 丢掉，订单 VOID(BLACKLIST) 而命中记录只写 manual_review，与 BR-ID-36 的命中记录 / 申诉展示不符。
# 做法（D10-293）：不用 ON CONFLICT DO UPDATE（app.risk_hits 对 couli_app 只有 SELECT / INSERT，是只追加的证据表）；新迁移同名重建 risk_hits_blacklist_once_key 为 (app_id, rule_id, ref_type, ref_id, value_hmac, risk_action) WHERE rule_id='BLACKLIST_HIT'；recordHit 去重键同步加 risk_action，升级时插第二行；命中记录与申诉展示按「同一订单取最严处置（void_commission 优先）」，两行都保留作历史（展示侧若不在本任务 paths 内，记 followups）。不放宽其他规则的去重。
# 规则测试由新鲜独立 Claude 写（approvals #36）：先 manual_review 后作废 → 两行、各一条；同处置重复 → 仍一条；其他规则不受影响。迁移号落地时按迁移槽取主干最大 + 1（排 W1 B1-09e 之后，编排 01:12）。须在 B1-09n 挂载前合并。
