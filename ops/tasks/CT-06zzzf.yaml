# 放宽两处，仍是机械核对：整张表外层的 as const 在基线与头都有且写法相同时剥掉再判；行字面量认 BigInt 字面量（null 已认），与字符串、数字同等对待。①③、上限、评审确认要求一字不改；删行后回调要加类型实参的仍不放行（D10-669 那种照搬断言处理）。
# 工具单测补正反例：外层 as const 一边有一边没有 → 不放行；BigInt / null 行逐字相同 → 放行，值不同 → 不放行。实现 Opus 子代理；Codex 对抗评审一轮；编排按 #24 加标签。
