# 2026-10-22 入账（admin-backend，编排 21:1x 派工 B1-27；接手 identity 10-17 预占的 B1-27a～c，契约新预占 CT-24p）。依据：04 §6.6 `users/{id}/profile`（形状与错误码已全）、§11.2 `user.phone_change`、08 BR-ID-06 细则「客服代办换号」、BR-ID-39 细则「后台改昵称」、01 F-ADM-04。
# contract_sections 只填 11.1（§11.2 全节带上超限）：编排者把 §11.2 `user.phone_change` 一行与 §6.6 `users/{id}/profile` 原文逐字摘进第 9 节。
# 本线技术取舍（由编排者摘进任务书第 9 节）：响应返回编辑后的用户详情（与 adminGetUser 同形，手机号脱敏）；reason 1–200 字；请求里与当前值相同的字段视为未改动——不写入、不吊销会话、审计不记该字段；全部字段都未改动时直接返回当前详情、不写审计（代理补全的默认，使「保存即生效」的重试结果相同，与用户端 PATCH /v1/me 同昵称不改的做法一致）；不设幂等键；审计记操作人、原因、改动字段与前后值（手机号脱敏）。实现 B1-27b 待规划把 BR-ID-06 细则「客服代办换号」拆成独立编号后入账（BR-ID-06 全文 15KB，带上实现任务书超限；本台账 PR #1183 两家评审 r1 S1：refs 不能置空）；实名更正与副本导出等 couli #178 合并后另立契约（CT-24q）。
