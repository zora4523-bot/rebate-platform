# 2026-10-16 资金线 funds-quote 入账。为什么：api 只要任一联盟端点 live 就按 live 装配，演示报价器在 live 下拒绝（受保护测试 test/spec/catalog/card/demo-quote.test.ts），
# 拼多多 staging 切 live 被挡（HANDOFF 拼多多一节）。W1 followups B1-06w：报价器配置预读键清单写在 app.module，换真实报价器要同步。
# 做法：app.module.ts 的 RebateQuoter 工厂按 (appEnv, unionModeOf(endpoints)) 选报价器；真实报价器需要数据库句柄，没有 DB 而又要真实报价器 → 拒绝启动（不回退演示）。
# LINK_OPEN_PORTS.quoteReads.prepare 改为调用真实报价器的 prepare（演示时仍预读 DEMO_QUOTE_KEYS）；linking 的 LinkOpenQuoteReads.prepare 参数由 appId 扩为开放读取计划
# （LinkOpenReadPlan），link-open-wiring.ts 照传；link-open-reads.ts 导出通用 openScopedReader，app.module 用它包 commission 的规则读取端口。验收：prepare 之后 quote() 不再触库，
# 时钟在预读与报价之间前进时开放仍成功、报价不触库；未预读的读取按 OpenReadNotPrepared 失败。不改 linking 其余逻辑、不改 catalog 卡片组装。预期行为：prod 在后台发布接口落地前无已发布版本，报价 fail-closed。
# outside_needed：切 live 前在 staging 跑一次 db/seeds/0002，并确认 tech_fee_bp、rebate.taobao.compare_rate_ratio_bp 已配置。
# 风险 RV2（linking 与 app.module）。Codex 写规则测试，Claude 过审，Opus 实现，Codex 资金评审。
# 2026-10-17 编排：顺带收口 [AC-B2-03f#34]/#35 显式超时（#568 先给 600_000）为实测 ×3：CI 长跑 100 万次单条最长 91.6 秒 → 300_000；断言、次数不变（test-change，带标签）。
# 开放复核卡片的查看者是调用方（catalog.assemble 用请求 viewer），预读计划须带调用方 userId：LinkOpenReadPlan 加 callerUserId，link-open-requote.ts 组计划时填入（只改这一处）。
