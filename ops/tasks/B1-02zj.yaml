id: B1-02zj
repo: rebate-platform
title: 令牌密钥按进程最小权限拆分（D10-255 ①）：签发方要私钥 + kid，只验签方（stream 等）只要公钥 + kid（新变量 JWT_PUBLIC_KEY_PEM，给私钥时也可由私钥导出）；APP_ENV=staging / prod 下只验签进程缺私钥能启动、缺公钥（且无私钥）拒绝启动，签发进程缺私钥仍拒绝启动
type: impl
# 草稿 2026-10-23（身份与风控线 identity-lane，优先插队）。编排 16:09 D10-255 ① 取 B：staging 部署 main 时 stream 启动即退出（「JWT_PRIVATE_KEY_PEM and JWT_KEY_ID must be set when APP_ENV=staging」），因 B3-03f 起 stream 挂 identity 令牌校验，而 staging 私钥只挂给 api。合并后 ops 给 stream 配 JWT_PUBLIC_KEY_PEM + JWT_KEY_ID 再部署 staging 到 main。
# 技术取舍（本线定）：platform/config/jwt.ts 增 JWT_PUBLIC_KEY_PEM（P-256 SPKI PEM，一块），与 JWT_PRIVATE_KEY_PEM 同给时公钥须与私钥匹配，否则配置错误；JWT_VERIFY_KEYS_JSON（轮换旧 kid）规则不变。identity 的令牌密钥提供方拆成签发器与验签器，按入口装配：签发器只在签发令牌的入口（实现方据代码核实并在输出列明，至少 api），stream 只装验签器。不改令牌格式、算法、kid 选择与轮换语义。规则测试先行，Codex 至 10-30 不可用，由独立 Claude 写（approvals #36）。
