id: B1-04f
repo: rebate-platform
title: 淘宝 listOrders 经大淘客 get-order-details（D10-486 ②）：queryType 1–4、跨度 ≤3 小时分窗、positionIndex 翻页、pageSize ≤100；字段按官方 publisher_order_dto 同名映射到 UnionOrder 与平台无关字段，不用大淘客自算字段；只留凑狸推广位的订单；listOrdersMetering 照拼多多
type: impl
# 草稿 2026-10-31（union 线，账号 4）。依据：编排 D10-486 ②、DEV-NOTES §3.1（请求参数、返回与官方 publisher_order_dto 同名同义、大淘客自算 income / price_by_one / income_by_one / day 不用、近 3 个月回溯）、规划/09 CAP-TB-07、08 BR-FUND-01 / 02（不改），由编排者摘入任务书。无实测录制：按文档字段写，外层 / 列表键与翻页结束条件标 TODO 待复录。
# ① 请求：GET /api/tb-service/get-order-details v1.0.0；queryType 默认 4（更新时间，D10-488 ①），OrderQueryOpt 另收可选时间口径（1 创建 / 2 付款 / 3 结算）供 orders 回扫，调度与回扫窗口归 orders、union 不写死；startTime / endTime 按北京时间「YYYY-MM-DD HH:MM:SS」，TimeWindow 超过 3 小时按 3 小时切窗顺序请求；positionIndex 续页直到无下一页；pageSize 100；orderScene 1。每个上游请求一个配额（listOrdersMetering = 'per_request'，同 B1-04w）。
# ② 映射（同名官方字段）：order_id / sub_order_id = trade_id，parent_order_id = trade_parent_id，promotion_slot = adzone_id（与 site_id、member 组成的 PID 形式由任务书定），attr_params.relation_id = relation_id（special_id 另记或不记，任务书定），raw_status = tk_status 字符串，paid_fen = alipay_total_price 元转分（yuanStrToFen），est_commission_fen = pub_share_pre_fee，settle_commission_fen = pub_share_fee（未结算为 null），paid_at = tk_paid_time，settled_at = tk_earning_time，modified_at = modified_time（北京时间串 → Date），commission_fen 与 N 口径按 specs/attribution.md 的淘宝 N 映射（D10-488：w1 入账，已扣技术服务费的推广者收入，拆 n_base 与补贴；union 只原样给出 pub_share_pre_fee / pub_share_fee / subsidy_fee / alimama_share_fee / service_fee_dto_list 等官方字段，不自行计算 N）；raw_payload_id 照 B1-04p。不映射 income、price_by_one、income_by_one、day。缺必需字段的条目跳过并告警（同拼多多做法），不整页失败。
# ③ 推广位过滤（D10-488 ③）：账号与优券汇共用，只保留 adzone_id（或 PID）属于凑狸在 union_pids 登记过的**全部**推广位（含已停用 retired：停用前产生的订单仍属凑狸）；别家推广位的订单不返回、只计数打一条日志（不带订单号与金额）。推广位清单经注入的读取端口（同 B1-04x 读 union_pids 的做法）；空清单 → 返回空并告警一次。
# ④ 订单源未注入（B1-04e）→ adapter_unimplemented；状态映射（tk_status → PLATFORM_*）与淘宝 N 映射由 w1 另行入账（D10-488，deps 本任务），不在本任务。
# 目录：union/infra/taobao/**、union/infra/dataoke/**（如需列表解析助手）、union/domain/types.ts（OrderQueryOpt 可选时间口径，其他平台忽略）。test_paths：test/spec/union/taobao-orders/**。整体 RV2（订单金额与归属）。
# 完成 2026-11-01（#2115）：settle_commission_fen 只在 tk_earning_time 有值时给（未结算即使 pub_share_fee 为 0.00 也为 null）；orderSlots 推广位读取端口的注册表 / union.module 装配未接（编排认可装配小单）；DataokeClient 新增 exchange 交回传输响应供原文解析。
