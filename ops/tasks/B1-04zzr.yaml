# 2026-11-07 W1 入账（D10-793 ② / D10-798，方案 couli-runs/B3-lane/fu-tb-rescan-tiers-plan-20261107.md）。三档各一条流：query_kind rescan（天档，沿用现有游标）、rescan_hour、rescan_week，scene 留给 order_scene；节奏按「连续走、走完回头」推广周期 P（间隔 = P ÷ (D ÷ cap)，下限 60 秒），起点 now − D + 起点余量，终点 min(now, 增量游标)；调度门照旧逐档判。
# 回扫窗口上限读 order_sync.rescan.taobao.window_minutes（默认 180，运营大促期改 20），增量 20 分钟不动；rescan.window 载荷带 timeBasis（适配器已支持，union 不改）。测试期默认：小时档、天档开，周档关（FU-TB-RESCAN-WEEK-ON）。不自动判大促；跨度报错按失败窗口处理。京东、拼多多单档不变。不改迁移。
# 连带 B1-01zzr：platform/metrics 水位排除与回扫位置 gauge 从精确值 rescan 改为 rescan 前缀。冻结用例按先红逐条列，照 D10-327 由新鲜独立 Claude 改、另一位只读复审，编排按 #24 核。
