id: B1-12u
repo: rebate-platform
title: notification：订阅 wallet.withdrawal_changed，按 BR-TEXT-09 给提现人发提现结果通知——PAID_API / PAID_MANUAL → WD_SUCCESS「提现已到账：{net} 已转入{payout_channel_name}」；REJECTED → WD_REJECTED（驳回原因 NEGATIVE_BALANCE 用「提现未通过：{reason}；抵扣后的余额以钱包显示为准」不带金额，其余「提现未通过：{reason}，{amount} 已退回余额」）；FAILED → WD_FAILED「提现打款未成功：{reason}，{amount} 已退回余额」（账号类失败码追加「，可修改收款账号后重试」，未命中映射用不带金额的兜底句）；service 类，站内信总写、推送随服务开关；同一事务写 inbox_messages 与 notify_logs，按 withdrawal_id + status 去重（BR-WDR-26）
type: impl
# 2026-10-31 入账（identity-lane，编排 D10-453 把 D10-142 的 B1-12q/s/t/u 改派本线；u 先做——端口齐、D10-260 已裁）。单据经 payout createWithdrawalNotificationReader（B2-05l）取 status / reject_reason_code / amount_fen / net_fen / fail_code / payout_channel，事件载荷不改（D10-260）。
# 范围外：WD_OVERDUE（超时检查任务归属待编排裁定，另入账）；WD_FAILED 短信（真实发送要负责人短信签名与模板审批，本任务写 TODO(规划/11 §7.1) blocked on 短信模板审批，不发假短信）。推送经 B1-12o createPushSendCore（非生产演示适配器）。BR-TEXT-09 原文过长（任务书超 24KB），refs 留空、原文摘录放任务书第 9 节。
