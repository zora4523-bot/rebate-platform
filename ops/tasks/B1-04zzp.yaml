# 2026-11-07 be 入账（D10-793 ① / D10-778 ① FU-TB-ARCHIVE-FOREIGN-RIGHTS 的违规半边；上线前必做，淘宝 PID 登记前要合）。依据同 B1-04zzc：变更记录 20261031 §1 第 24 行「不入库别家订单」。get-foul-order-list 的归档在 ourPunishRows 过滤之前，别家推广位的违规单号原文入档。
