# 冻结用例 [AC-B1-04zzc#12]（违规归档仍是原文）与本单相反：照 D10-327 由新鲜独立 Claude 只改这一条的期望，另一位只读复审「只改这一处」；同文件其余用例登 red_exempt。Codex 额度用尽（D10-775），规则测试与评审为新鲜独立 Claude。
