# 「对抗review 可以使用Claude 的子代理 没有上下文的去对抗review」，写测试也允许（Codex 能用时仍优先），见 ops/approvals.yaml 第 36 条。
# 做法：tools/agent/claude-run.sh 以 engine claude-independent 复用 codex-run.sh 的同一流程（命令行、超时、退出码、可信根、
# 运行目录、meta.json），每次 claude -p 新会话（不 resume / continue、不落会话、--safe-mode --restricted、无 MCP 与技能），
# 模型 claude-opus-5-5；评审只给读文件与只读 git，结束后工作区不得有任何变化（否则 12）；写测试只限台账 test_paths 与 paths
# （Edit 规则，大括号展开），台账 tester 须先改为 claude-independent；用量上限 / 过载映射 11；账号由 CLAUDE_INDEPENDENT_CONFIG_DIR 指定，
