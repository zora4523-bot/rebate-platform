#   单轮时限由 RunManager 管）；BR-AI-03（decideToolCall 拒绝、不丢字段）、BR-AI-05（模型只见卡片引用与 <untrusted> 定界）、BR-AI-18 输出侧由编排者摘入任务书 §2。
