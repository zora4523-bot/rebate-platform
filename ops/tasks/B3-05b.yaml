# 2026-10-15 草稿（B3-05 拆分规划子代理，plan.md §3.2–3.3）。B3-03f 开工条件 ③ 的主体：AgentHttpDeps.body = createAgentRunBody(deps)，AgentHttpDeps.labels = createRunLabels(...)。
# 端口（本段定义，后续段实现，核心签名此后不改）：model（Pick<ModelRouter,'complete'> + 本 run 模型时限）、tools（OrchestratorTools：definitions / execute / enabledSearchPlatforms / searchKeyword，B3-04a 实现）、
#   inputCheck（B3-05d；proceed 结果带模型形态文本与占位表，由 B3-05a 产出）、degraded（B3-05c）、deterministic（可选，B3-05e；未接时含链接的消息不调模型、出空结果 notice）、
#   intents（可选，B3-05f；未接时意图输出一律按 out_of_scope）、review（SentenceReviewPort，B3-06b）、texts、prompt、trace（可选 RunTraceSink）。
#   另导出收紧实现 emptyOrchestratorTools()、failClosedInputCheck()（供 B3-03f 在后续段合并前装配；不设放行默认）。
