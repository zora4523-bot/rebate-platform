id: B1-01zh
repo: rebate-platform
title: 幂等标准模式：处理函数已产生效果、写 completed 失败时不再回 50001——有界重试写入，仍失败则保留 processing 并以 outcome_unknown 断开
type: impl
# 2026-10-09 入账（会话 b1-followups-3，followups/INDEX.md F-01，P1；来源 followups/B1-01i-review-s2.md 第 1 条，Claude 实测）。
# 现状：platform/idempotency 标准模式（execute）在处理函数返回后把行改 completed；这一步遇数据库故障时错误外抛，客户端得 50001
# （「失败」），键停在 processing，租约（60 秒）到期后原键重试再执行一次处理函数——按次计费的外部调用（如实名核验）多扣费。
# 改法（编排者裁定，记 couli-runs/B1-01zh/decision-orchestrator.md）：completed 写入遇连接或数据库错误时有界重试（总时长有上限，
# 不阻塞关停）；仍失败则不删行、不改行，抛 IdempotencyError('outcome_unknown')（HTTP 层已有：断开连接、不回包，同事务模式），
# 并记一行不含请求体与键值的 error 日志。处理函数抛错 / 结果不存储时删行的现有行为不变；行已被接管时 idempotency_record_lost 不变。
# 租约到期后的接管规则不在本任务改（业务唯一约束仍是最后一道，规划/02 §18）；文件头注释写明「按次计费的外部调用应走 executeInTransaction」。
# 规则测试（Codex 先写、先红，新文件）：completed 写入失败一次后成功 → 原响应、行 completed；一直失败 → outcome_unknown、
# 行仍 processing、处理函数只调一次、日志无请求体与键值；事务模式不受影响。
