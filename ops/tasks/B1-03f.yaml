id: B1-03f
repo: rebate-platform
title: 设备注册风控：同一 IP 每小时注册设备数上限（device.ip_register_per_hour，42901 + Retry-After，不签发 device_id）与 device_hash 热点告警（24 小时内关联 device_id 数达 device.hash_hot_alert_count，只告警不拦截）
type: impl
# 草稿 2026-10-05，B1-03 拆分的一段（见 B1-03b 注释；B1-02c 注释写明这两项归 B1-03）。依据：BR-ID-05 细则「发码与设备注册的风控默认值」表的 device.ip_register_per_hour 行与
# 「窗口」一段（滑动 [now − 3600 秒, now] 两端闭区间，IP 取网关识别出的客户端 IP）、BR-ID-09 细则「设备标识的无效值」的监控一条、04 §6.1 POST /v1/devices 行，由编排者摘入；
# 验收参照 10 AC-S1-69 ⑤、AC-S1-79 ③。契约已有（CT-15b：registerDevice 的 42901）。
# 只数注册成功的设备；超限时不签发、不写 devices。阈值经 F1-02b 的配置读取取值（B1-03e 定义的端口），键未配置时用 08 的默认值（30、20）兜底。
# devices 写者是 identity：注册用例签发前调 risk「原子占位」——同一个 Redis Lua 脚本里按滑动窗口判定并记入本次（判定与计数一步完成，并发时不会穿透上限），
# 只有确认没有写入（插入前失败、约束拒绝、事务明确回滚）才撤销占位；结果未知（例如提交后连接断开、拿不到确认）保留占位，并按本次签发的 device_id 查库核实，
# 查到已写入就保留、确认未写入再撤销。Redis 不可用（占位脚本执行失败）按编排者裁定拒绝：返回 42901、不签发、不写 devices，首次不可用与恢复时各告警一次。
# 验收：并发上限（同 IP 已成功 29 台时两个并发请求只有一个成功）、明确失败撤销、结果未知保留并核实、Redis 不可用返回 42901（Codex 台账评审 2026-10-05 第 1、2 轮）；热点计数在 risk 用 Redis（键 = app_id + device_hash，24 小时窗口，带 TTL），不读 devices 表。
# 告警只打结构化告警日志（platform/logging 平铺字段，不带 install_secret）；接企业微信告警群归可观测任务，不在这里。
# identity 与 app.module.ts 路径，整体按 RV2。identity 路径与 B1-02e、f、B1-12b 相交，不并行派。
