id: CT-06f
repo: rebate-platform
title: 迁移门禁收口——资金表约束与索引必须显式命名、NOT VALID 加同文件 VALIDATE 的同定义重建放行、E'…' 反斜杠转义与美元引号取值、DO 块里的保护对象替换、set_config 任意位置
type: guard-change
# 2026-10-09 入账（负责人同日「继续任务」；接 CT-06d（#300）两家代码评审与规则测试过审记下的 S2，承负责人 2026-10-08「把剩下的 S2 开成任务继续做」）。只收紧（② 是收窄误拒），不改任何 BR。
# 契约（规则测试按此写；CT-06a～CT-06e 的规则测试不改、继续通过，本任务只新增 test/spec/db/lint-migrations/ 下的文件）：
# ① 资金表对象必须显式命名（未命名的会由 PostgreSQL 自动取名，迁移史里查不到原定义，定义比对只能退回已更新的 schema 快照）：资金表上 `CREATE [UNIQUE] INDEX ON …`
#    （无索引名）、CREATE TABLE / ALTER TABLE ADD [COLUMN] 里不带 `CONSTRAINT <名>` 的 PRIMARY KEY / UNIQUE / CHECK / REFERENCES / EXCLUDE，报
#    `unnamed <index|constraint> on funds or attribution table <裸表名>`；非资金表不管；NOT NULL / DEFAULT 不算约束。
# ② 同一迁移里 `ADD CONSTRAINT <名> … NOT VALID` 之后有 `VALIDATE CONSTRAINT <名>` 的，按已验证定义比对（规范化时去掉 NOT VALID）；只有 NOT VALID 没有 VALIDATE 的仍算定义不同。
# ③ 字面量：`E'…'` 里的反斜杠转义（\' \\）正确切分与解码——定义比对、EXECUTE 解码、超时取值都适用；`set_config(…, $$0$$ | $tag$0$tag$, …)` 的美元引号取值按 0 处理。
# ④ DO 块正文里出现 `CREATE OR REPLACE TRIGGER`、`CREATE OR REPLACE FUNCTION | PROCEDURE`、`DROP TRIGGER | FUNCTION | PROCEDURE | INDEX`、`ALTER TABLE … DROP CONSTRAINT | DISABLE TRIGGER | ENABLE REPLICA TRIGGER`
#    （含 EXECUTE 字符串里的）一律报 `guard change inside a DO block: write it as plain SQL`，不论对象是否资金表（门禁看不到 DO 里的对象定义）。
# ⑤ set_config 出现在语句任意位置（`SELECT 1 FROM set_config(…)`、子查询里）都按关超时检查，补规则测试（实现现已如此）。
# 已知不处理（记录在案）：纯函数只给部分迁移史时的比对（CLI 总给完整史）；pg-boss 升级生成器输出须按门禁改写（db/AGENTS.md 已写明）。
# 碰 tools/**、db/AGENTS.md（第三类保护路径），合并前要批准标签（approvals 第 24 条）。RV2，两家 money 评审。
