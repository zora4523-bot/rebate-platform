id: B2-09y
repo: rebate-platform
title: payout：处置页【立即查询】按同一提现单在途去重（FU-W10-QUERY-DEDUPE，BR-WDR-15、BR-WDR-14，D10-702 ③、D10-707 ②）——同一张单已有一条人工查询在队列里或执行中时，再点不再入队第二条，应答不变
type: impl
# 2026-11-06 withdraw 入账（从 pay 移来，D10-707 ②）。来由：withdraw 对 B2-09s 的评审 S2——admin-unknown-payouts.ts 的 queryAdminPayoutResult 每次请求用随机 manual_request_id 作 singletonKey，不同幂等键的重复点击（或两位处置人同时点）会各入队一条，对同一 out_biz_no 并发查通道、各记一条尝试。
# 做法（只动实现，契约不改）：在途 = 同一 withdrawal_id + execute_seq 的人工查询任务已入队或执行中、结果尚未落尝试记录；在途时新请求不再入队，仍答 submitted（结果照旧出现在 latest_query），审计照记是谁点的。上一条落了记录之后再点，照常入队新的一条。只查不重发（BR-WDR-14）不变，查询结果只作凭证、不迁移状态（BR-WDR-15）不变。不动钱、无迁移。
# 顺序：与 pay 的 B2-09w / B2-09x 同改 admin-unknown-payouts.ts（路径相交不同时在途），按 D10-702 排在它们之后开工（deps）。
# 2026-11-07 开工（#2558 合并后；做法编排已认可）：只把 queryAdminPayoutResult 入队的 singletonKey 去掉随机段（`{withdrawal_id}:{execute_seq}:manual`），靠队列 payout 的 exclusive 策略在途去重；不加表、不加时间窗，query-job.ts 实际不改。
# 开工前实测（实现树一行改动，四个冻结目录 76 条）：两条 B2-09s 冻结用例钉的是本单要改掉的行为，编排 D10-777 准照 D10-327 在本单 spec 提交里改这两个用例块——
#   [AC-B2-09s#14]（query-list）：第一条任务还在队列里时换幂等键再点。旧：队列 2 条、审计 2 条；新：队列 1 条（在途不再入队）、审计仍 2 条、应答 submitted，标题「异键再次入队」改「异键在途不再入队」；同键重放半段不变。
#   [AC-B2-09s#39]（edges）：旧：连续两次异键提交各入队一条、各查一次；新：上一条真正完成后再点才入队新的一条，各查一次、共 2 条 query 尝试。
#   两个文件其余用例逐字不动，登 red_exempt。规则测试改由新鲜独立 Claude 写（Codex 额度用尽至 11-11，approvals #36、D10-775），另一位独立 Claude 只读复审。
