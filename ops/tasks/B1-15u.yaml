repo: rebate-platform
title: 分享中间页 GET /v1/share-pages/{link_id} 与取口令 POST /v1/share-pages/{link_id}/tpwd（BR-ATTR-10 细则「分享页与分享赚入口页」、BR-ATTR-05 细则；契约 CT-15f / CT-02h，planned → 实现）：只答 pid_scene=share 的 link（其他、未知、别的 app → 30144）；卡片为共享子集（无 rebate_*、est_net_price_fen）、quoted_at、jump_url（分享者转链短链，任何环境都不含口令）、open_in_app_url（share.open_in_app.enabled 关时 null）；分享者授权失效（淘宝绑定非 active、拼多多备案失效，京东不判）→ 30102 / 30111、data.reason=sharer_auth_invalid、无 auth_url / state / auth_jump，站长授权中断时同样如此；tpwd_ticket 只在 UA 判为非微信且 link 有口令时下发，否则 null（无 UA 按微信）；取口令：票据绑定 link_id、600 秒有效、最多换 3 次，UA 为微信或缺失、票据无效 / 过期 / 用尽 → 20001 data.fields=[ticket]；按 IP × link_id 限频（share.tpwd_rate_per_min，缺省 5）→ 42901 带 Retry-After；两个响应都 Cache-Control 为 no-store；不签名、不要 X-Device-Id
type: impl
