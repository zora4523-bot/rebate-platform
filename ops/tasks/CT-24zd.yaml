#   命令服务内部错误映射：BatchConflict → 20902；IllegalTransition → 20902；invalid_schedule → 20001 [scheduled_at]；reason_required → 20001 [reason]；switches_off、snapshot_pending → 20001 [batch_id] data.reason；bill_not_ready → 20001 [bill_id] data.reason；SupplementRejected 三种 → 20001 [bill_id] 或 [platform] data.reason。
