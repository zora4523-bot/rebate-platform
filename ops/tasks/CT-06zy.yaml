id: CT-06zy
repo: rebate-platform
title: CT-06zy：contracts / gitleaks / longrun-props 三个工作流加 concurrency（同一 PR 新运行取消旧运行；推 main 不取消）
type: guard-change
# 2026-10-24 入账（ops 线，编排裁定 D10-301）。起因：CI 排队仍是瓶颈；ci.yml、evidence.yml、protected-paths.yml 已有 concurrency
# cancel-in-progress，contracts.yml、gitleaks.yml、longrun-props.yml 没有，同一 PR 连推几次时旧运行照跑到底、占 runner。
# 做法：三个工作流加 concurrency：PR 的组是 `<名>-<github.ref>`、新运行取消旧运行；推到 main 的组是 `<名>-<github.sha>`（每次推送
# 单独一组，`cancel-in-progress` 只在 pull_request 为真），main 上的运行既不互相取消也不互相排队——contracts 在 main 上只比较
# 本次推送前后，取消或合并排队会让那次推送的契约改动没人查。与 ci.yml 的不同就在这一处（ci.yml 对 main 也取消）。evidence.yml、protected-paths.yml 已有，不改。
refs: []
refs_hash: {}
deps: []
paths:
  - '.github/workflows/contracts.yml'
  - '.github/workflows/gitleaks.yml'
  - '.github/workflows/longrun-props.yml'
  - 'ops/tasks/CT-06zy.yaml'
impl: claude
tester: none
