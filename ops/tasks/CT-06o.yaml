#   判断是否精简时不计第 7 节「上一轮失败输出」：先按不带失败输出的完整格式算大小，超限才选精简格式；选定格式后再用现有 attempt >= 2 逻辑截断失败输出（剩余空间按所选格式算），brief.test.ts 加一条第 2 次尝试的用例（Claude 台账评审 r2 S2-1）。
#   不超限的任务输出与现在逐字节相同（既有 brief 测试不改期望）；契约任务的第 2 节格式不变。
