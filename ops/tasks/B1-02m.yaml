# 草稿 2026-10-05（W1 搜索转链线），第 1 轮台账评审 S1-8 裁定新增。宿主 05 B1-02（identity）。端口由使用方定义（B1-05c、B1-06c），identity 实现、app.module 装配
# （同编排者裁定 LEDGER-next §6 第 2、3 条）；identity 按结构类型实现，不 import catalog / linking（02 §4.1 identity 依赖 risk、notification）。
# 依据：BR-ATTR-05（身份只由服务端按令牌注入）、BR-ATTR-06（联盟参数只放 attr_code，不放 user_id）、BR-AI-03、02 §4.1 users.attr_code 归 identity，由编排者摘入任务书第 2 节。
