# 规则测试覆盖：游客、登录用户、他 App 令牌三种情形下三个端口的返回；attr_code 缺失时返回「不可用」而不是 user_id。
# 路径只取 identity 下本任务新建的子目录（与 B1-02e～k 不相交），加 app.module.ts。风险：identity RV1、app.module.ts RV2，整体 RV2。
# 2026-10-08 编排者补：ViewerContext / CallerContext / AttrCodeReader 的默认实现是 CatalogModule.forRoot / LinkingModule.forRoot 自己的 providers，app.module 无法从外部覆盖；
# 本任务给两个 forRoot 加可选的端口覆盖参数（只加参数、默认行为不变），所以 paths 加 catalog.module.ts 与 linking.module.ts 两个文件。
