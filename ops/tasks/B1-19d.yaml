title: union 推广位读取按联盟账号筛选：getActivePid 加可选 unionAccountId 条件（只取该账号下 active 的场景推广位），linking 淘宝 / 拼多多转链按所用账号取推广位（B1-06f「取到后核对、不一致 50301」保留为最后防线）；激活推广位时同场景已有其他联盟账号的 active 推广位则告警（不拒绝）
type: impl
# 草稿 2026-10-14（W1 第八棒）。来源：B1-06f Claude 资金 r2 S2（union 推广位端口不能按联盟账号筛选，多账号跨配置或账号迁移时 B1-06f 只能取到后核对、不一致 50301 拒绝外跳）。
# 依据：BR-ATTR-02（每平台一个联盟账号为默认，多账号是配置可能）、BR-ATTR-08（按 scene 推出 pid_scene，找不到该场景 active 推广位不转链、不得改用 fallback 或其他场景）、BR-ID-17（relation_id 属账号），由编排者摘入任务书。
# 做法：union/pids 的 getActivePid 读查询加可选 unionAccountId（不传时行为不变，兼容已有调用与冻结测试）；linking 的淘宝 / 拼多多组合层按 auth-url 同口径的「所用账号」传入；查不到 → 维持原有不转链口径（返回码沿用现状，不新增码）。
# B1-06f 的「取到后核对所用账号、不一致 50301」不删，保留为最后防线（编排者 2026-10-14）。
# 跨账号告警（编排者 2026-10-14 并入本任务）：setPidStatus 置 active 时，同 app × platform × pid_scene 已有其他联盟账号的 active 推广位 → 只告警不拒绝（服务返回或只读查询给出冲突行，命令行 apps/api/scripts/union-pids.ts 打印告警，不打印凭据）；告警不改审计行形状。
# 风险：union / linking RV2（订单归属）。linking/** 与 union/** 串行。
