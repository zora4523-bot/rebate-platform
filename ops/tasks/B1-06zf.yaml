# 2026-11-05 W1 入账（编排 11:32 立单、D10-647 批方案：couli-runs/B3-lane/fu-pdd-auth-link-plan-20261105.md）。open 的 30111 auth_jump 与 GET /v1/unions/pdd/auth-url 用 pdd-authority.ts 现有身份调 union.pddAuthorityUrl（B1-04h），schema_url → mobile_short_url → url；state 只进 union_auth_sessions，授权以 member.authority.query 为准（BR-ID-22）。
# 点击才生成；生成失败或端口缺失 50303 不写 session（CT-02zd）；缺推广位或 attr_code 50301 maintenance（D10-654、D10-658）。淘宝不动；演示适配器给演示地址；录制只进私有库；评审 Codex money（D10-647）。
