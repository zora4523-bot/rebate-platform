id: B1-09i
repo: rebate-platform
title: 手动同步：POST /admin/v1/order-syncs（时间窗或单号二选一，同一筛选在排队或执行期间返回原请求 reused=true，按窗口上限切分投递、不读不推水位；站长授权暂停拒绝）、GET 列表、GET limits；任务回写状态与拉到 / 入库条数；挂载、去 planned
type: impl
# 2026-10-22 入账草稿（W1 线）。方案 couli-runs/W1-search-linking/orders-plan-b109-v2.md §2（v1 B1-09i 按 couli #176 的 04 §6.6 order-syncs 与 §3.2 order_sync_requests 改）；依据 02 §7.1（窗口上限、回扫范围、manual 去重键）、01 F-ORD-10，由编排者补充摘录。
# 不写资金：只重拉订单交既有流水线。分工 impl claude、tester codex（orders RV2）。
# 本线技术取舍（由编排者摘进任务书第 9 节）：去重键 `platform:account:kind:scene:manual:<筛选摘要>:window_start`，filter_digest 落 order_sync_requests 部分唯一；status_filter 只收 specs/union/<platform>.md 已登记值（方案 K-6，本任务建空登记处，未登记带了即 20001）；
#   按单号（≤50）只拼多多经 getPddOrderDetail，淘宝 / 京东 TODO(规划/11 §4.5) blocked on CAP-TB-07 / CAP-JD-07；站长授权可用性复用 union order-sync-ports，暂停时返回 CT-24n 分配的码（K-4）；熔断期间同样不投递；limits 常量登记在 orders。
# 2026-10-25（W1）：冻结 CT-24n 契约测试 [AC-CT-24n#1] 断言三条手动同步操作 x-implementation=planned，与本任务去 planned 冲突；照 D10-325 / admin #1585 先例先由前置 test-change 把这三条拆成独立块（断言不动），再照 D10-327 把该文件列进 test_paths，本任务作者提交只改拆出的块 B 的期望。
# 2026-10-25（W1）：money r1 S1「完成判定靠最后投递的 final 窗口」与 S2「重投计数重复」须按窗口记进度。本线定：同任务加迁移 order_sync_request_windows（主键 (sync_id, window_start)，投递时插行，窗口任务只把本行由未完成 CAS 为 done / failed 并写本窗计数，请求在无未完成窗口时才记 done、计数取各窗之和；授 SELECT / INSERT / 必要列 UPDATE，不给 DELETE；表名 order 前缀，lint-migrations 按资金表判），paths 加迁移与快照，排迁移槽。
