# 依据：BR-PRICE-01、BR-PRICE-02（适配器出 price_fen / coupon_fen / final_price_fen 三字段并自算券后价，只用 packages/money / domain 的函数；拼多多 price_fen 取 min_group_price）、BR-PROD-03（商品接口不返回 goods_id，不得以任何方式补出）、BR-TEXT-17 细则「联盟物料频道」、09 4_PDD CAP-PDD-01/02/03/10 与 4_PDD_附 §6，由编排者摘入任务书。
# 价格：coupon_fen 只取 coupon_discount（门槛 coupon_min_order_amount 按 min_group_price 判断、有效期按注入的 Clock 判断 coupon_start_time ≤ now < coupon_end_time、余量 coupon_remain_quantity > 0，BR-PRICE-01 细则三条，不满足则 0；probe 产物无余量字段时任务书写明跳过、待 CAP-PDD-02 核对）；平台券、店铺券、收藏券、补贴（platform_discount_list、mall_coupon_*、clt_cpn_*、subsidy_*）不计入，待 CAP-PDD-02 实测另开；coupon ≥ price 或缺价 → price_status='anomaly'；commission_rate_bp = promotion_rate（千分比整数）× 10，整数运算。goods_id 留空、goods_sign 必填；product_key 稳定性（BR-PROD-06）由负责人在切 live 前定，本段不处理。
# 物料：MaterialReq 只有 cursor，本段固定 channel_type=4（精选，与进宝网站一致）；要按频道取另开任务改端口。
