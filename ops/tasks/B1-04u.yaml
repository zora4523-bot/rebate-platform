# 草稿 2026-10-14（台账 #306 评审 S1-2/S1-3/S2-3/S2-7 后从 B1-04g 拆出）。开工前提：CAP-PDD-01/02/03/10 的 probe 录制已在私有库（负责人终端跑探测脚本产生，PDD-lane/plan.md §2）；映射只用 probe 录制里出现过的字段，任务书附字段清单。
