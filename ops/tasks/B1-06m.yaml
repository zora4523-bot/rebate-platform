# 规则测试要覆盖：进程在业务提交后、幂等响应保存前退出（用可控故障注入），租约到期后同键重试只有一条新 link 与一条 attempt、返回首次编号；jump.expire_at 已过的缓存不用于复核失败外跳；单飞窗口内首次 50303 后，同 link 新幂等键 open 仍为 50303。
