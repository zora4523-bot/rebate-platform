# 2026-10-06 入账。来由：B1-02i（建号核心）Codex money 评审第 1 轮 S1——建号计数窗口按注入 Clock（ADR-0001 §4.2 第 10 项，B1-02i 裁定 9.5 第 1 条），
# 而 0005 让 device_registrations.created_at 只能取库默认 now()（防倒填出 BR-ID-05 计数窗口）；staging 用 CLOCK_NOW 把时钟推到将来时新记录全被排除，上限失效。
# 做法：新迁移 0019（编号已与其他会话协调）只给 couli_app 增加 INSERT (created_at) 列权限；不给 UPDATE (created_at)，device_registrations_no_rewrite 照旧；不传时仍取默认 now()。
# 不加防倒填触发器：db/AGENTS.md 第 6 条（默认值外不用 SQL 时钟）与第 8 条（触发器只许禁止 UPDATE / DELETE）；与 ADR-0001 §4.2 第 21 项 booked_at 取应用 Clock 同一做法。迁移头注释写明取代 0005 第 29–30 行。
# 依据：BR-ID-05「同设备注册上限的计数」（窗口口径）、04 §3.2 device_registrations 行、ADR-0001 §4.2 第 10、21 项。
# 分工按规划/11 §1.1：Codex 先写规则测试（先红），Claude 新子代理过审，Opus 子代理只写迁移 SQL，编排者在沙箱外跑迁移与 pnpm db:snapshot 并提交生成物；迁移全局串行。
# B1-02i 依赖本任务：合并后 B1-02i 的建号写入 created_at = 建号使用的同一个 Clock 时刻。
