# 依据：BR-PRICE-01（价格异常时检索不出卡、主动查询出 price_unavailable 卡）、BR-PRICE-03 及细则「无券商品与混排列表的口径说明」（有券卡 price_basis、无券卡 price_basis.general）、BR-PRICE-12（报价快照），由编排者摘入任务书第 2 节。
# 入口：catalog 提供唯一的出卡入口，区分检索（搜索、feeds、Agent 检索）与主动查询；检索遇 price_status='anomaly'（B1-04r 定义）返回「跳过」并记 PRICE_ANOMALY，B1-05d、B1-07a、B1-06k 的检索一律经此入口（三者 deps 已加 B1-05i）。
