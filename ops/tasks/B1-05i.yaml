# 受保护测试：test/spec/catalog/card/assembly.test.ts 的 [AC-B1-05f#8]（第 195 行）对无券卡断言含 price_basis，与 BR-PRICE-03 细则相反——本任务 test_paths 含该文件，由 Codex 在写规则测试阶段只把该断言改为按有无券区分（意图对齐 08），改已有受保护文件，PR 需负责人 owner-approved 标签（need-label 登记）。
