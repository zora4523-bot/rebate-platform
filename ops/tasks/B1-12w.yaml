repo: rebate-platform
title: 阿里云短信真实通道（D10-315）：ACS3 签名挪到 platform 共用（agent 改引用、行为不变）；notification 实现 SendSms 通道接主备框架，签名与模板 CODE 由调用方按编码传入；验证码发送接 identity SmsSender 端口；凭据只走 SMS_ 变量，缺任一保持拒发
type: impl
# 2026-10-24 入账（be-codex；编排 D10-315 及补充 1–3）。不引 SDK：按「V3 版本请求体&签名机制」自封 HTTPS 请求；签名复用 agent B3-03m 的 guard/review/sign.ts，挪到 platform，原文件改为再导出（冻结测试 test/spec/agent/stream-review/sign.test.ts 按路径导入）。
# Dysmsapi 2017-05-25 SendSms（dysmsapi.aliyuncs.com，RPC，参数在 query）：Code=OK → 受理（BizId 为回执编号）；答复了非 OK 的业务码 → 明确拒发；5xx / 非 JSON / 网络错 → 通道失败；超时 ≥1 秒，超时交 identity 记 unknown，不自动重发（接口不幂等）。通道实现 notification/resilience 的 SmsChannel 端口；备用通道未定，不登记备用。
# 设计按 D10-316 预留：通道按 message.template（编码）经调用方给的查找取 SignName 与 TemplateCode；本任务的查找只读部署配置（编码 verify_code → SMS_SIGN_NAME、SMS_TEMPLATE_VERIFY_CODE），适配器不写死变量名。TemplateParam={"code":"<6 位码>"}。
# 模板正文（负责人 10-24）「您的动态码为：${code}，5分钟内有效，请勿泄露！」与 BR-ID-05 的 SMS_CODE_LIFETIME_SECONDS=300 一致，测试锁定（改有效期须同时换模板）。签名单测用官方文档示例逐字比对 Authorization（补充 3）。
# 四个变量 SMS_SIGN_NAME、SMS_TEMPLATE_VERIFY_CODE、SMS_ACCESS_KEY_ID、SMS_ACCESS_KEY_SECRET 替换原声明的 SMS_ALIYUN_ACCESS_KEY_*，进 SMS_CREDENTIAL_ENV_NAMES（local / test 设了即拒启动）；staging / prod 四个齐才用真实通道，缺任一维持现在的拒发 + 启动 warn；值不打日志。写进 infra/staging/README.md 与 .env.example 注释。
# identity 的 fake-sms.ts 与 SmsSender 端口不动（冻结测试按路径监视 createSmsSender；以 B1-02zm #1475 合并后的版本为准）。真实发送验证等合并后编排部署 staging、负责人手机取码，不挡合并。不碰迁移、不占迁移槽。规则测试按 approvals #36 由独立 Claude 写。
