id: CT-06a
repo: rebate-platform
title: CI 门禁：squawk 检查迁移 SQL（02 §16.3「资金表禁止 DROP、改类型、RENAME」，ADR-0001 §2 边界与规范行）——根 devDependency squawk-cli 2.66.0、.squawk.toml（登记为保护路径第二类）、tools/ci/lint-migrations.ts 包装、根脚本 lint:migrations 并入 verify:fast
type: guard-change
# 2026-10-07 入账（负责人同日决定「先把 squawk 和二维码接进去」；依据 couli docs/research/20261007-基础设施自写与开源对照.md §4）。
# 台账评审（Codex，PR #248）两条 P1 已采纳：规则测试由 Codex 先写（test_paths）；.squawk.toml 登记进 protected-paths.json 第二类（含工作流内嵌副本与守卫测试）。
# 版本 2.66.0（2026-09-23 发布，满足 minimumReleaseAge 7 天；2.67.0 为 10-04，未满）；Apache-2.0 OR MIT；无安装脚本；二进制在 7 个可选平台包里。
# 包装脚本契约（规则测试按此写）：`node tools/ci/lint-migrations.ts [--root <仓库>] [--list]`；只把 db/migrations 里序号 > 0018 的 `NNNN_kebab-name.sql`
# 交给 squawk（`-c .squawk.toml`，gcc 报告，stdout）；没有可查文件时打印「nothing to lint」退出 0；squawk 报问题退出 1；文件名不合
# NNNN_kebab-name.sql 退出 1 并写 stderr；squawk 或 .squawk.toml 缺失退出 2；`--list` 只打印将查的路径（每行一个）。
# 规则：默认规则集，排除 prefer-bigint-over-int（_bp 与计数列按 ADR-0001 §4 用 int）、require-lock-timeout / require-statement-timeout
# （迁移由 packages/db/scripts/migrate.ts 单事务执行，超时应设在运行器，记后续）、require-concurrent-index-creation（单事务内不可能）；
# pg_version 18、assume_in_transaction。新迁移里 DROP 列/表、改类型、RENAME 必须报错；非资金表的合法例外在语句上一行写
# `-- squawk-ignore <规则>`（原因写在它上面），资金表不得忽略（评审核对）。0001–0018 永不改（db/AGENTS.md 第 2 条）、不检查。
# 碰 package.json#scripts、pnpm-lock.yaml、protected-paths.json（第二类）与 tools、.github、AGENTS.md（第三类），合并前要批准标签（approvals 第 24 条）。
