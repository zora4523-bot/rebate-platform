# 2026-10-18 入账（be-codex；编排 09:4x 派工「发送风控状态变更站内信」归本线，admin-backend 10-18 01:20 跨线请求：F1-07d 不加发送调用、只写 TODO 指向本任务）。 依据：BR-TEXT-23 细则模板与原因类别字典（{reason_category} 取 risk_reason.<category> 用户文案；{frozen_until} 按 BR-TEXT-11）；risk.state_changed 由 risk 的 setRiskState 在同一事务发出（载荷 app_id、user_id、from、to、reason_category）， 事件至少一次投递、消费端去重（AGENTS 硬规则 4）。frozen_until 由 risk 在同一事务写进载荷（快照，ISO 8601 UTC 字符串，非冻结为 null；台账评审 GT-23bep S1：消费者不得读 user_risk_state 当前行代替事件当时的值），发布改动与测试同步在 B1-03y，本任务只消费。 变体判定：to=frozen 且 frozen_until 空 → frozen；to=frozen 且有到期 → frozen_until；from=frozen、to=normal → unfrozen；to=banned → banned；from=banned、to=normal → unbanned； 经 appealing 的迁移（申诉撤销 / 维持）归 APPEAL_RESULT 任务（BR-ID-36），本任务不发并留 TODO。标题：BR-TEXT-23 未给，代理默认「账户通知」，可经覆盖列改（记 needs 交规划回写）。 接线：events/types.ts 的 EVENT_SUBSCRIPTIONS 登记订阅，platform/queue/catalog.ts 加对应 evt.<consumer> 队列与 ENTRY_PLAN 条目（台账评审 r3 S1）。 平台冻结测试 test/spec/platform/events/contract.test.ts（约第 134 行，subscriptions 精确为 []）与 test/spec/platform/queue/contract.test.ts（约第 139、178 行，队列与 worker 精确比较）：测试阶段由测试作者在同一 PR 只加本任务的订阅 / 队列 / worker 条目，其余不动（第一类保护路径，#24 标签；台账评审 r5 S1）。 编排 10-19 裁定 A（01:4x）后改 C（16:4x）：订阅生效后同事务入队；createHttpApp 给了 dbHandles 时默认启动 JOB_QUEUE、close 时停（startQueue 可显式关），entry.ts 显式 start 改幂等或去掉、生产启动与关停不变；不吞 not_running、不用假队列。
