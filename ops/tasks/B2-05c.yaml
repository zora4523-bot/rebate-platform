# 状态备注：等 B2-05b 合并（withdrawals / withdraw_holds 表）。
# 校验器是纯应用层函数：输入由端口读（配置 withdraw.* 经 content 读取器在调用方句柄上读；风控状态与申诉前状态经 risk；实名、收款账号快照、劳务协议经 identity；余额经 ledger.getBalances；次数与冻结读本模块表），输出首个阻断码与 reason，rules 接口与 POST 建单（B2-05d）共用同一函数。
# 新增三个只读端口（本线拟在本任务内加，已在 notices 告知 identity 线）：identity/ports/withdraw-subject.ts（当前收款账号快照 + 手机 / 证件 / 收款账号 HMAC + 设备哈希）、risk/ports/appeal-prev-state.ts（appealing 的 prev_risk_state）、risk 黑名单只读匹配（不写命中记录，命中记录由调用方在事务外补）。
# 08 没写的取值按代理默认做成配置或开关：withdraw.enabled 缺失按开（30306 只在显式关闭时）；估算用 FeeTaxCalculator 端口，默认实现 fee 0 / tax 0（BR-WDR-19 MVP、BR-WDR-20 税率表到位前）；quick_amounts_fen 默认空数组。
