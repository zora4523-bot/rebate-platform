repo: rebate-platform
title: 淘宝维权 / 违规经大淘客（D10-486 ③）：listRefunds 走 POST get-order-refund（全量维权），listPunishments 走 GET get-foul-order-list（近 30 天）；映射到既有 UnionRefund / UnionPunish，只留凑狸推广位相关订单
type: impl
# 草稿 2026-10-31（union 线，账号 4）。依据：编排 D10-486 ③、DEV-NOTES §3.2 / §3.4，由编排者摘入任务书。无实测录制：按文档字段写，标 TODO 待复录（含「全量维权」是否真为全量）。
# ① listRefunds：queryType 由窗口口径定（默认 5 订单更新，任务书定；startTime 早于 2022-12-20 只能 1–3 的约束照文档校验）；跨度 ≤3 小时切窗、positionIndex 翻页、pageSize 100；每条 → UnionRefund（D10-488 ②，金额口径按 08 BR-CALC-02 / 03 / 18 已有规则，与订单 N 同口径）：order_id = tb_trade_id、refund_id = refund_suit_id，新增 base_refund_fen = tk_commission_fee_refund − tk_commission_alimm_refund_fee − tk_commission_agent_refund_fee，subsidy_refund_fen = tk_subsidy_fee_refund − tk_subsidy_alimm_refund_fee − tk_subsidy_agent_refund_fee（扣哪些服务费以 specs/attribution.md 淘宝 N 映射为准、两边一致）；既有 refund_fen 取 base_refund_fen（维权应扣佣金只用它）；show_return_fee 只原样留存（可选字段，元转分）作对账、不参与金额；refund_status 原样字符串可选字段。元转分只用 yuanStrToFen；任一必需金额缺失 / 非法 → 跳过该条并告警。不改 08。
# ② listPunishments：startTime + span（≤30 天）分段、pageNo 翻页；每条 → UnionPunish：order_id = tb_trade_id，punishment_id 为 tb_trade_id + settle_month 组成的稳定键（任务书定格式），deduction_fen = null（D10-488 ②：违规无扣款字段，处罚按 BR-FUND 走 PUNISH 全额扣回；domain/types.ts 把 deduction_fen 改为 bigint | null，拼多多现有映射不变），另带可选 punish_status / violation_type / settle_month 原样字符串。按 tk_adzone_id 过滤凑狸在 union_pids 登记过的全部推广位（含 retired，同 B1-04f），维权按其订单号是否属凑狸订单或推广位过滤（任务书定，文档维权记录无推广位字段时以 B1-04f 同步过的订单为准）。
# ③ 接入：两个可选端口已在 UnionAdapter 声明；本任务只做 union 侧，消费端（维权导入口）与 funds / admin 对齐后另行接线（不在本任务 paths）。订单源未注入 → 端口不出现或 adapter_unimplemented（与 B1-04f 一致）。
# 目录：union/infra/taobao/**、union/infra/dataoke/**、union/domain/types.ts、union/application/governed-adapter.ts(+.test.ts)。test_paths：test/spec/union/taobao-refunds/**。整体 RV2。
