# 2026-10-22 入账（admin-backend，派工 ③ F1-10i 后端）。依据：契约 CT-24o 原文与台账注释、08 BR-ID-34 细则「验证手机号的登记与更换」、BR-ID-33（加密存储、HMAC、脱敏）、10 AC-S2-59（换号期间短信档用旧号、代改未过新号验证不生效）。
# refs 只列 BR-ID-34（含细则「验证手机号的登记与更换」）：再加 BR-ID-33 任务书超 24KB；BR-ID-33 只用到「手机号 AES-256-GCM 字段级加密 + HMAC 查找 + 3+4 脱敏」一句，由编排者在第 9 节一句指针带过。
# 本线技术取舍（由编排者摘进任务书第 9 节）：不加迁移（verify_phone_cipher / hmac / set_at 已有）；待核验的新号与验证码放 Redis（短时、按账号单条，覆盖前一次），通过才在事务内写 admin_users 并审计；发码复用现有短信端口与后台 step-up 的限频口径（非生产只用假适配器）；新号与其他账号的验证手机号是否允许重复由契约 CT-24o 定。
