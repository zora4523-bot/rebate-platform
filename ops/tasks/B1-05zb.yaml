title: 详情继承来源卡的 entry_source（FU-HOME-DETAIL-REBATE）——getProduct 契约加 from_link_id 查询参数，controller 传给 detail；首页池卡点进淘宝详情不再按无来源报比价区间
type: impl
# 2026-11-05 ops 入账（编排续跑 ①，11-04 14:48 第 ② 件）。staging 复现：首页池卡 tb:W57z2x3SQv664DYNHdo rebate 50/50 normal、tb:W57z2x3SNPX3qqzYim3 18/18 normal；
#   同件 getProduct 25–50、9–18 price_compare_risk；拼多多两边一致。报价同为 commission/rebate-quoter（BR-CALC-20 同一函数），差在 basis 的入口来源。
# BR-PRICE-07 来源判定表：商品详情与卡片派生请求继承来源卡 link 记录的 entry_source，无来源卡才判 price_compare_risk；细则「派生请求带 from_link_id 继承」。
#   catalog/detail.ts 已按 query.from_link_id 经 SourceLinkReader 服务端读来源（不信客户端的 entry_source），但契约 getProduct 无此参数（带上即 20001 fields=[from_link_id]），
#   product.controller.ts 也不传，故详情恒为无来源。改：契约加可选 query from_link_id（uuid，link_id 同形），重生成；controller 透传；读不到 / 他 app / 他人不可读的 link → 按无来源。
# 规则测试钉：池卡 link_id 进详情 → 与池卡同 basis 与金额；无 from_link_id → 淘宝 price_compare_risk；他 app 或不存在的 link → price_compare_risk 且不报错；拼多多不受影响。
# 三端详情从卡片进入时带 from_link_id 另立 FU（客户端），本单只改服务端与契约。合并时占契约槽。RV1（catalog、contracts）。
