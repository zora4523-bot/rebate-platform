id: B1-04y
repo: rebate-platform
title: 拼多多 staging 接线：compose 给用联盟的进程只读挂载 /etc/couli-pdd（client_secret 文件）；loadConfig 增可选 UNION_ENDPOINTS_DIR（绝对路径，只 staging 认）让 staging 从节点挂载的端点目录读 pdd=live；README 写明节点准备步骤
type: impl
# 草稿 2026-10-15（拼多多接入线 pdd-lane）。来源：B1-04t 只做应用侧装配（PDD_CLIENT_SECRET_FILE 由节点文件提供，approvals 28 ②）；config/union-endpoints/pdd.json 随镜像为 demo，B1-04t 注释「切 live 只在 staging 部署配置做」但仓库里没有让 staging 改端点模式的入口；staging compose 现只挂 /etc/pki、/etc/couli-keys、/etc/couli-jwt。
# 做法：① infra/staging/compose.yaml：api、stream、worker、admin（凡装配 UnionModule 的进程，以 app.module 为准）只读挂载节点 /etc/couli-pdd → 容器 /run/couli-pdd，再只读挂载节点 /etc/couli-union-endpoints → /run/couli-union-endpoints；不挂 /etc/couli 下任何路径（受保护测试 AC-B1-01zc 禁止）；payout 不挂。② loadConfig：可选 UNION_ENDPOINTS_DIR（绝对路径；只在 APP_ENV=staging 认，其他环境设了即 ConfigError，问题只写变量名）；UnionModule.forRoot 在设了它时从该目录读端点（同样的四平台校验，prod 本来就拒 demo / replay），否则用镜像内 config/union-endpoints。③ README（infra/staging/README.md）补「拼多多真实调用」一节：节点放 /etc/couli-pdd/client_secret（属主 1000、400，目录 500，由负责人放入，内容不进命令行与环境变量）、/etc/couli-union-endpoints/*.json（四平台齐全，pdd 为 live 且 baseUrl 为官方网关）、staging.env 加 PDD_CLIENT_ID、PDD_CLIENT_SECRET_FILE=/run/couli-pdd/client_secret、PDD_QUERY_CUSTOM_PARAMETERS、UNION_ENDPOINTS_DIR=/run/couli-union-endpoints；IP 白名单只加不删（4_PDD_附 §5）。deploy.sh 的存在性检查不扩（pdd 可选）。
# 不在本任务：节点上实际放文件与切 live（负责人 / 编排在部署侧做）；推广位登记（union-pids.ts，需 super + TOTP）。
# 风险：infra/staging 与 platform/config → RV2。与 B1-04x（platform/config、union.module.ts）串行。
