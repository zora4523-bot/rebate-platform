id: CT-06zxb
repo: rebate-platform
title: CT-06zxb：verify-int 的浏览器依赖安装步骤缓存 apt .deb、加下载超时与重试、单步 10 分钟上限（D10-308）
type: guard-change
# 2026-10-24 入账（ops 线，编排裁定 D10-308）。起因：最近 120 轮 ci.yml 里 verify-int 在 60 分钟被取消的两轮（#1451 run
# 40012028986、#1452 run 40013000324）都卡在「Install Chromium and the CJK fonts for the browser tests」：azure Ubuntu 镜像掉到
# 36–42 kB/s，fonts-noto-cjk（61 MB）一次停 23 分钟后重下，这一步用了 37 / 34 分钟（正常不到 1 分钟），test:int 随后被截断；
# test:int 本身正常 17–30 分钟，不拆分片。做法：① actions/cache/restore + save 缓存 ~/apt-archives/*.deb，键 = runner 镜像
# （ImageOS / ImageVersion）+ 包清单哈希（fonts-noto-cjk 与随 playwright 版本的 chromium 依赖）；精确命中或没有 .deb 时不存；
# ② /etc/apt/apt.conf.d/99couli-ci 写 Acquire::http(s)::Timeout 30、Acquire::Retries 5、下载目录与保留下载包（playwright
# install-deps 内部的 apt-get 同样读到）；③ 该步 timeout-minutes: 10。不改测试与作业时限。主干只有这一处同样的安装步骤。
# 补（本 PR 首轮 CI）：缓存为空时 fonts-noto-cjk 慢速下载 10 分钟被单步上限截断（30 秒超时只管零字节停顿），缓存永远存不上；
# 故本步内临时放一个 /usr/local/sbin/apt-get 包装（sudo 的 secure_path 优先，playwright 的 sudo apt-get 也经过它）：install 时先用
# curl 按 apt 给的 URI 预取 .deb，某镜像 15 秒内低于 300 kB/s 就换下一个 Ubuntu 镜像；apt 对归档目录里已有的文件只比大小，所以包装
# 自己按签名索引核大小（--print-uris）与 SHA256（apt-cache show 同一 Filename），不符即删、换镜像，查不到 SHA256 的留给 apt；再交给真
# apt-get；trap（写包装前设）删包装。测试机 ubuntu:24.04 容器以带 sudo 普通用户实测：正常预取 11 个；镜像返回同大小篡改文件时两次拒收、
# 改从下一个镜像取到正确文件。
