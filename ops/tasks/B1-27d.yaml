id: B1-27d
repo: rebate-platform
title: 迁移：个人信息副本请求表 personal_data_copies（delivery / status 两组枚举、同一用户最多 1 条未结束、retry_of、due_at / expires_at 等）与实名更正旧身份隔离表（建议名 realname_prior_identities，只插入）；列级授权；B1-27a / B1-27c / B1-27h 的前置
type: impl
# 2026-10-24 草稿（admin-backend，B1-27 拆分）。依据：04 §3.2「实名更正旧身份（表名由契约线定）」与 `personal_data_copies` 两行、§2.5 `personal_data_copy_delivery` / `personal_data_copy_status`（CT-24q 已把两组枚举落进 contracts/enums/identity.yaml）；08 BR-ID-25 细则「实名更正」中「旧身份留存」一项、BR-ID-40 细则（由编排者在第 9 节摘句，不进 refs：两条 BR 原文各约 11.5KB，同引超任务书上限）。主干现无这两张表（origin/main 09af3398 的 db/schema.sql 核过）。
# 拆分理由：两张表分别是 B1-27a（实名更正）与 B1-27c / B1-27h（副本）的前置；迁移单列一个 RV2 任务，实现任务不碰 db/**，迁移槽只占一次。照 B1-15r 先例 refs 留空、依据写在第 9 节。
# 本线技术取舍（由编排者摘进任务书第 9 节）：① personal_data_copies：id uuid（v7）、app_id、对外编号（与契约里的 export_id / copy_id 同一个值，以 contracts/openapi.yaml 为准）、user_id（引用 users）、requested_by（引用 admin_users）、delivery（CHECK in_app_sms / wecom_session，取值照 contracts/enums/identity.yaml）、status（CHECK 七个值，同上）、retry_of（自引用，可空）、object_key（可空）、due_at 非空、generated_at / delivered_at / expires_at / failure_reason 可空、row_version、created_at、updated_at；部分唯一索引 (app_id, user_id) WHERE status IN (pending, running, ready) 落实「同一用户同时最多 1 条未结束」；原因说明、身份核对结论、两条通道情况与提取码 / 口令一律不设列（04 §3.2 原文：只进 audit_logs、口令不落库）。② 旧身份表：app_id、user_id、旧 name_cipher、旧 id_no_cipher、旧 id_no_hmac、旧 verified_at、corrected_at（更正时刻）、created_at；密文用独立数据密钥（B1-27e）加密，表上不存密钥；只授 couli_app INSERT，不授 SELECT / UPDATE / DELETE 给 couli_app 与 couli_readonly（查看接口与权限点单列、另立规划回写与契约任务，CT-24q 注释；注销不提前删，BR-ID-28，留存期 BR-ID-30 ⑬ 到期删除另开任务）。③ personal_data_copies 授 couli_app SELECT / INSERT 与 status、object_key、generated_at、delivered_at、expires_at、failure_reason、row_version、updated_at 的列级 UPDATE；不授 DELETE（请求记录留存待 BR-ID-30 补登）。④ 迁移号落地时取主干最大 + 1（D10-116）；schema.sql / db.gen.ts 在测试机快照（outside_needed）。
# TODO(规划/11 §2.3): 旧身份表的正式表名回写 04 §3.2（04 写「表名由契约线定」）— blocked on 本任务评审定名后由规划线一句回写；TODO(规划/11 §2.3): personal_data_copies 请求记录留存期与删除 — blocked on BR-ID-30 细则「个人信息副本请求记录」补登。
