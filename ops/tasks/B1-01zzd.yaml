id: B1-01zzd
repo: rebate-platform
title: pg-url 口令打码改为线性时间：去掉对抗输入下的平方级回溯与重复扫描，[AC-B1-01zy#6] 百万次运行不再超单条时限
type: impl
# 2026-10-17 入账（会话 longrun-pgurl；来源 couli-runs/followups/staging-b1-01zc-zd.md 第 28 条：#505、#576 longrun-run 上 [AC-B1-01zy#6] 单条约 700 s 超 600 s）。
# 实测（Node 24，M 系列本机，packages/db/src/pg-url.ts 主干 ffedd9b5）：测试那类输入是线性的但约 40 ns/字符，每次运行 6 次调用约 150 µs，百万次约 150 s，GitHub runner 慢 4～5 倍即超时；
# 对抗输入是平方级甚至更差（redactCredentials 单次）：'a'×32000 1.8 s；'x://'+'b'×32000 1.3 s；"password='x' "+'q'×32000+"'" 1.6 s；'password=a,'×6400 12.5 s；"password='a "×6400 8.1 s。
# 根因：URL_CREDENTIALS 从字母串每个位置重试 scheme 且 \S*@ 每次扫到空白段尾；ENDS_IN_ASSIGNMENT 带 $ 不锚定，对引号段每个起点重试；
# maskPasswordParameters 对已在打码范围内的每个口令赋值都从头再跑 valueEnd 到值尾（k 个口令 × n）；未加引号状态逐字符 new 数组 + 正则。describeError 在错误消息上调用，属日志路径。
# 改法：语义不变（B1-01zy 冻结测试 test/spec/db/pg-url-*、[AC-B1-01zy#6]/#7 全绿），整体 O(n)：URL 凭据改为按空白段一次扫描；引号段末尾赋值判断改为自右向左定长检查；
# 已在打码范围内的口令赋值复用已算出的值尾或只扫增量（一次扫描内不回退）；热循环不再逐字符分配。
# 测试（Codex 先写、先红）：test/spec/db/pg-url-linear/** 对上面各类对抗输入在约 128 KB 规模给绝对时限（线性实现毫秒级、现实现数秒以上），并核对输出与语义一致；
# [AC-B1-01zy#6] 单条时限随 propRuns() 放大（第 2 个参数 { timeout: Math.max(600_000, propRuns()) }，每次 1 ms 余量，Vitest 5），生成器与断言不变。
