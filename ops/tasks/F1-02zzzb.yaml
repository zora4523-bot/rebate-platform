id: F1-02zzzb
repo: rebate-platform
title: bridge_origins 签名白名单（FU-X-BRIDGE-ORIGINS，D10-608 / 610 / 612）——契约 ConfigBridgeOrigins {jws}（并入 CT-03c）+ 服务端 ES256 签名与缓存 + 签名密钥加载 + staging 挂载，同一个 PR 交付
type: impl
# 2026-11-04 ops 入账（编排 D10-612：契约与服务端同 PR，主干任何时刻不红；不可放宽的冻结改动随实现同 PR，D10-327）。形状照 CT-03c 台账注释（已并入）：
#   JWS 头 {alg: ES256, kid, typ: couli-bridge-origins+jws}，签名 R‖S 64 字节（非 DER）；载荷 {v: 1, app_id, env, version, origins}；version 单调、不设过期。
# 服务端：client-config 读 bridge_origins 配置项（未签名的 {origins}），按 (version, kid, env) 缓存签名、同版本只签一次（ETag 稳定）；未配置时用 h5_base_url 的 origin 签默认值。 保存时校验（非空、规范化 https origin、必须含 h5_base_url 的 origin）随 B2-03v 登记的 config.risk 键落在 content。
# 密钥：platform/config 读 CONFIG_SIGN_KEY_FILE / CONFIG_SIGN_KEY_ID（只 api 用）；local 启动时临时生成，staging 节点文件 /etc/couli-config-sign → /run/couli-config-sign 只读挂给 api，prod 走 KMS（负责人上线项，本单不做，prod 缺钥拒绝启动）；staging 缺钥也拒绝启动。与 JWT 签名钥分开。
# 冻结测试：test/spec/content/config/delivery.int.test.ts 的 [AC-F1-02c#1] / [#2] / [#20] 与 test/spec/content/config-etag/domain.int.test.ts 夹具按新形状只改钉值、不放宽，
#   由新鲜独立 Claude（或 Codex）改，落地时 #24 报核编排逐条看；config-etag/domain.int.test.ts 只为类型换夹具值、用例一条没动，移出 test_paths（D10-623 更正，按 #24 报核、protected-paths 标签管住）；#20 表里的 bridge_origins 行移到新目录；
#   delivery.int.test.ts 未改的 124 个用例 / 表行（标题与用例体与主干逐字相同）登记 red_exempt（D10-620 (b1)）。
#   跨 app 的冻结 [AC-F1-02zr#8] / [AC-F1-02h#2] 按 D10-624 甲改三条断言（保留 app_id 绑定），两个文件进 test_paths；red_exempt_outside 与它们未改用例的 red_exempt 待 CT-06zzzc 合并后补登。新规则测试放 test/spec/content/bridge-origins/。合并时占契约槽。RV2。
