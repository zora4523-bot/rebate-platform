# 2026-11-02 编排（w1 B1-09p money r1 只读核出）：**现有钱包缺陷**——snapshot-store 只写 v1 金额行，planOrderSyncColumns 改佣金就把 commission_version 推到 2，readCommissionSnapshot 抛错，该用户 /v1/wallet/summary 整个失败；B1-09n 接线后第一笔佣金变化即触发。本单 refresh 必须写 orders 当前 commission_version 的金额行，规则测试含「佣金变化后钱包正常、与订单页同数」；须先于 B1-09n 落地。
# 2026-11-02 D10-565、D10-568（W1 改派，D10-564）：不变量是订单 commission_version ≥ 1 时该版本的金额行与 totals 一定存在。快照生成时同事务：orders 版本 0 → 置 1（乐观锁 WHERE commission_version = 0）；已 ≥ 1 → 写当前版本的行（refresh 同一函数）。三个调用方都经 runCommissionSnapshot，只改这一处。CREDITED 在扣回前把上一版本复制到当前版本；R9 / R10 后金额行等于新应得归 FU-CREDITED-AMOUNT-ROWS。refresh 的 N 与快照同口径（pdd 减 service_fee_fen，缺失时 pending 不写）；其余读者归 FU-PDD-NET-N。
