# 2026-10-18 入账（后台后端线 admin-backend，F1-07 第四批）。依据 05 F1-07、04 §6.6 / §11.2、契约 CT-02j（#647）adminUpdateUserRiskState 的 description。
# refs 为 BR-ID-31（裁定 A′，同 F1-07c）。BR-ID-36（冻结与申诉）本体 + 细则 18.7KB，单独放进任务书也约 28KB，拆任务放不下，不进 refs；本任务的冻结 / 解冻只经既有 setRiskState、不碰提现 / 入账 / 申诉，取值以契约 adminUpdateUserRiskState 为准（frozen_until 晚于当前时刻、冻结不动会话与绑定），由 Codex 代码评审对照契约把关；冻结 / 解冻按 BR-ID-36 的规则测试留后续任务（out-of-scope.md 登记）。（Claude 台账评审 r2 S2-2）
# 取值裁定见 couli-runs/ADMIN-backend/f107-plan.md（裁定 1、2、3、4、5、8 与「CT-02j 实现方自定、编排者认可」）。
# 要点：风控状态唯一写入口 risk/application/risk-state.ts setRiskState（不加新迁移边，冻结测试 test/spec/risk/risk-state/** 不改）；
#   封禁即提现阻断靠既有读时判定与 risk.state_changed（提现单不写）；冻结不动会话与绑定；appealing 一律 44004（裁定 1）；
#   解封联动导出给申诉撤销复用；
#   顺手改过时注释（risk-state.ts「F1-10 / B1-27」、revoke-sessions.ts「ban (B1-31)」）。
#   会话吊销与 linking 联动都以端口注入、在 app.module.ts 装配（identity 已导入 risk，risk 直接 import identity 会成环，.dependency-cruiser no-circular）。
#   并发：风控状态变更事务先取用户级锁 `SELECT … FROM app.users WHERE app_id = ? AND id = ? FOR UPDATE`（与 F1-07c 的绑定操作同一把锁），再 setRiskState 与绑定联动，避免与 enable 交错出 banned + invalid（GitHub Codex #696 P2）。
#   SetRiskState 加可选 expected_row_version（null 只在无记录时首建，其余不匹配 20902），不传时行为不变，冻结测试不改。
#   封禁要跨进程失效风控状态缓存（BR-ID-01：缓存 ≤60 秒且封禁时必须主动失效；risk-state.ts 的进程缓存是各进程自己的 Map，risk.state_changed 尚无消费者，platform 生产订阅表为空；sms-login 允许封禁用户重新登录，旧会话吊销后新会话在窗口内仍会过第⑤关）：在 risk/** 内用 risk 模块已注入的 RedisHandle（只有 get / set / eval，无订阅；不改 platform/redis）做**版本戳**而非广播：风控状态变更事务在**提交前**把将写入的 row_version 写入 Redis 键（按 app_id + user_id，带 TTL ≥ 缓存期；用 eval 只增不减地写——键里已有更大版本则不覆盖，防迟到的旧写回退）；写键失败即让整个变更事务回滚、接口返回 50001（fail-closed，管理员重试），事务在写键后回滚时键高于库内版本，各进程只是多读库直到 TTL 过期（安全）；第⑤关命中本地缓存时先 GET 该键，键的版本高于缓存条目、或 GET 失败 / 超时，即按 fresh 读库并按现有 pending / 水位规则更新缓存（失败一律读库，不当作 normal）；键缺失时沿用本地缓存（≤60 秒，BR-ID-01 允许）。不改 platform 事件订阅、队列与 worker。验收用例：同一 PG / Redis 上起 admin 与 api 两个应用实例，api 先读到并缓存 normal，admin 封禁成功后 api 的下一次第⑤关判定即为 10006（不靠 60 秒过期）；Redis 读失败时该次判定读库；写键失败时封禁不生效且返回 50001（GitHub Codex #696 第 4、5、6 轮 P1）。
#   站内信 RISK_STATE_CHANGED：不加发送调用（notification 尚无发送端口）；触发源是 setRiskState 已发的 risk.state_changed，发送由通知线订阅实现，代码里写 TODO 指向通知线跟进任务；契约措辞由 CT-02p 改为「由通知模块发送」，不保留 planned（编排 10-18 09:2x 裁定 ②；台账评审 r2 S2-3）。
