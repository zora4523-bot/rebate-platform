# 后台权限点的 step-up 档位（规划/04 §11 权限点表的 step-up 列；08 BR-ID-34「后台 step-up 分两档」）。
# 键集合与 contracts/enums/admin.yaml 的 admin_permission 完全一致，按枚举顺序排列。
#
# 结构：
#   version      每次改动递增
#   permissions  每条 {key, step_up_tier, operations}
#     key            admin_permission 的值
#     step_up_tier   该权限点的操作所需档位：totp（动态码）/ sms（短信，发到账号登记的验证手机号）/ null（不需要）
#     operations     档位与 step_up_tier 不同的操作，每条 {operation, tier}；没有则为 []
#
# 运行时不解析本文件：apps/api/src/modules/admin/scripts/generate-permissions.ts 生成
# apps/api/src/modules/admin/domain/permissions.gen.ts，单元测试核对两者一致；改动本文件后重新生成。
version: '1'
