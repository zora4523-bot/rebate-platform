# 后台导出任务状态 admin_exports.status（export_status）的状态机（规划/04 §6.6 exports；规划/08 BR-ID-34 细则「后台导出任务」、
# BR-ID-30 ⑨；契约 contracts/enums/admin.yaml export_status 与 openapi adminCreateExport 的 Lifecycle 段，任务 CT-24k；本任务 B1-34g）。
# 生成 packages/domain/src/state-machines/export-task.gen.ts（node packages/domain/scripts/state-machines.ts；--verify 只比对）。
# 生成物勿手改，改这里再生成。
#
# 写法约定（同 CT-04e、F1-02u）：
# - guard 只是规则文字说明，transition() 不求值；权限、CAS、并发名额、审计与副作用由服务层负责。
# - 状态值与 contracts/enums/admin.yaml 的 export_status 六值逐值一致（小写）；事件用大写蛇形名。
#
# 表外说明：
# - 只有下面六行迁移（七条边），其余组合一律为表外事件。
# - 创建任务（POST /admin/v1/exports）直接插入 pending 行，不经本状态机的迁移，故没有 from: [null] 的入库首态行。
# - 没有取消接口：CANCEL 只由创建人账号停用触发。
# - expired 与 cancelled 是终态（不可下载、不可重试）；done 只能到 expired；只有 failed 可重试。
name: export-task
field: status
states: [pending, running, done, failed, expired, cancelled]
# START 开始生成；COMPLETE 文件生成完成；FAIL 生成失败；EXPIRE 文件过期；CANCEL 创建人账号停用；RETRY 创建人重试。
events: [START, COMPLETE, FAIL, EXPIRE, CANCEL, RETRY]
transitions:
  - id: E1
    from: [pending]
    event: START
    to: running
    guard: '后台任务领取排队中的任务开始生成；同一创建人同时生成中的任务不超过 admin.export.max_running_per_admin，其余留在 pending 等名额空出'
    test_id: SM-EXP-E1
  - id: E2
    from: [running]
    event: COMPLETE
    to: done
    guard: '一个 CSV 文件已写入私有对象存储桶（行数不超过 admin.export.max_rows，可为 0 行），写 row_count 与 expires_at（生成后 24 小时，BR-ID-30 ⑨）；未脱敏任务另写 export_unmasked 审计的行数'
    test_id: SM-EXP-E2
  - id: E3
    from: [running]
    event: FAIL
    to: failed
    guard: '生成失败（含行数超过 admin.export.max_rows），写 failure_reason'
    test_id: SM-EXP-E3
  - id: E4
    from: [done]
    event: EXPIRE
    to: expired
    guard: '到 expires_at（文件生成后 24 小时，对象存储生命周期规则删除文件，BR-ID-30 ⑨）；之后不可下载、不可重试'
    test_id: SM-EXP-E4
  - id: E5
    from: [pending, running]
    event: CANCEL
    to: cancelled
    guard: '创建人后台账号被停用时取消其未完成的任务，并写审计记录；没有取消接口'
    test_id: SM-EXP-E5
  - id: E6
    from: [failed]
    event: RETRY
    to: pending
    guard: '创建人经 POST /admin/v1/exports/{id}/retry 重试；只有 failed 可重试，重新排队等待生成'
    test_id: SM-EXP-E6
