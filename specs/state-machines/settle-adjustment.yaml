# 正差补差候选状态 settle_adjustments.status 的状态机（规划/04 §2.5；规划/08 BR-FUND-09 ②、BR-CALC-23；任务 B2-04d，编排裁定 S7 选 A）。
# 08 没有给这张表编号的迁移表；本文件按 BR-FUND-09 ② 与 04 §2.5 的取值说明转写，SA 编号与英文事件名是本任务的技术命名。
# 生成 packages/domain/src/state-machines/settle-adjustment.gen.ts
# （node packages/domain/scripts/state-machines.ts；--verify 只比对）。生成物勿手改，改这里再生成。
#
# 写法约定（同 CT-04a、B2-03j）：
# - from 中 null 表示「—」（入库首态：R1 生成补差候选行）。
# - guard 只作说明，transition() 不求值；差额重算、授权、锁、审计与记账由服务层负责。
# - 状态值与 contracts/enums/fund.yaml 的 settle_adjustment_status 一致（小写）。
#
# 表外说明：只有正差进候选（负差在写入结算额的同一事务内立即记账，不经本表）；
# approved、rejected、voided_stale_seq、voided_by_clawback 都是终态，不重开、不互转。
name: settle-adjustment
field: status
states: [pending, approved, rejected, voided_stale_seq, voided_by_clawback]
# CREATE 生成候选；APPROVE 批准；REJECT 驳回；VOID_STALE_SEQ 因 seq 过期作废；VOID_BY_CLAWBACK 因扣回作废。
events: [CREATE, APPROVE, REJECT, VOID_STALE_SEQ, VOID_BY_CLAWBACK]
transitions:
  - id: SA1
    from: [null]
    event: CREATE
    to: pending
    guard: 'rebate_status=CREDITED 的子订单整单正差（B_settle > booked_base_fen，或两者相等而结算佣金的正数部分 > booked_n_fen）；R1 随月结账单生成任务运行或 finance 手动触发，候选行记录生成时的 seq；settle.adjust.void_on_clawback.enabled=on 时，同一条结算记录（seq）只在其写入时刻晚于该子订单最近一次扣回（CLAWBACK）时才生成'
    test_id: AC-B2-04d#17
  - id: SA2
    from: [pending]
    event: APPROVE
    to: approved
    guard: '超管或被勾选补差权限的账号 step-up 批准（一人可完成，写审计）；候选行 seq 等于该订单当前 seq；写凭证时按 orders.settle_commission_fen 当前值换算的 B_settle 与当前净额重算，diff=0 不写凭证'
    test_id: AC-B2-04d#17
  - id: SA3
    from: [pending]
    event: REJECT
    to: rejected
    guard: '驳回：不记账、不写凭证，保留候选与驳回理由（BR-CALC-23）'
    test_id: AC-B2-04d#17
  - id: SA4
    from: [pending]
    event: VOID_STALE_SEQ
    to: voided_stale_seq
    guard: '候选行 seq ≠ 该订单当前 seq（过期）：该行作废，不记账、不写凭证'
    test_id: AC-B2-04d#17
  - id: SA5
    from: [pending]
    event: VOID_BY_CLAWBACK
    to: voided_by_clawback
    guard: '该子订单发生扣回（CLAWBACK）且 settle.adjust.void_on_clawback.enabled=on：扣回的同一事务内作废该单全部未批准的正差候选（作废原因「因扣回作废」，批准接口返回已作废）；off 时候选照常生成、由批准人把关'
    test_id: AC-B2-04d#17
