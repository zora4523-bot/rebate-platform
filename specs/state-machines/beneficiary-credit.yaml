# 待补记义务状态 beneficiary_credits.status 的状态机（规划/04 §2.5；规划/08 BR-FUND-04 ⑫；任务 B2-04d，编排裁定 S7 选 A）。
# 08 没有给这张表编号的迁移表；本文件按 BR-FUND-04 ⑫ 与 04 §2.5 的取值说明转写，BC 编号与英文事件名是本任务的技术命名。
# 生成 packages/domain/src/state-machines/beneficiary-credit.gen.ts
# （node packages/domain/scripts/state-machines.ts；--verify 只比对）。生成物勿手改，改这里再生成。
#
# 写法约定（同 CT-04a、B2-03j）：
# - from 中 null 表示「—」（入库首态：在产生待补记额的事务内插入义务行）。
# - guard 只作说明，transition() 不求值；金额重算、锁内重验、凭证与副作用由服务层负责。
# - 状态值与 contracts/enums/fund.yaml 的 beneficiary_credit_status 一致（小写）。
#
# 表外说明：done、forfeited、voided 都是终态；义务关闭后不重开，之后再出现的待补记额开新义务、用新 ID（BC1）。
# 仍冻结或申诉中（批次明细记 deferred）、或剩余未履约金额随 booked_base_fen 与净额重算时，义务保持 open，不迁移。
name: beneficiary-credit
field: status
states: [open, done, forfeited, voided]
# OPEN 开立；COMPLETE 完成（补记或处置给受益人）；FORFEIT 没收；VOID 作废。
events: [OPEN, COMPLETE, FORFEIT, VOID]
transitions:
  - id: BC1
    from: [null]
    event: OPEN
    to: open
    guard: 'CREDITED 子订单上受益人出现待补记额（入账时暂缓 R5 开首次入账义务；改派重记 R14 开改派入账义务，2026-10-18 起不开放；正差被延后或 R13 恢复时受益人冻结或申诉中开延后差额义务）；同一 (子订单, 受益人, 角色) 同时最多一个未完成义务，已有未完成义务时并入它、不另开；在产生它的事务内登记开立事件与归属快照，分配新的 beneficiary_credit_id'
    test_id: AC-B2-04d#11
  - id: BC2
    from: [open]
    event: COMPLETE
    to: done
    guard: '补记项执行：锁内重验订单仍为 CREDITED、rights_pending=false、结算记录 seq 与生成补记项时一致、归属快照未变、义务仍未完成且本单 BR-FUND-19 ⑤ 等式成立；受益人状态正常（含注销冷静期）时按剩余未履约金额入账，凭证与义务完成同一事务提交，金额为 0 不写凭证、义务同样完成；或迁移 R9、R10（含正差候选获批）等事务把剩余未履约金额整笔补给了受益人，同一事务关闭并关联实际履约的凭证'
    test_id: AC-B2-04d#11
  - id: BC3
    from: [open]
    event: FORFEIT
    to: forfeited
    guard: '补记项执行时受益人已封禁、已进入注销处理或已注销、已识别未成年人的推广份额：没收剩余未履约金额（带 forfeit_reason，金额为 0 不写凭证）；或迁移 R9、R10（含正差候选获批）等事务把剩余未履约金额整笔归了平台，同一事务关闭并关联实际履约的凭证；首次入账、改派入账义务没收时追加 forfeited 事件，延后差额义务不追加'
    test_id: AC-B2-04d#11
  - id: BC4
    from: [open]
    event: VOID
    to: voided
    guard: '订单转 CLAWED_BACK（迁移 R8）或改派（迁移 R14）时，同一事务作废该单未完成的义务'
    test_id: AC-B2-04d#11
