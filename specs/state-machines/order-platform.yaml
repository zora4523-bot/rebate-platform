# 订单平台状态 orders.platform_status 的状态机（规划/04 §4.1；规划/08 BR-FUND-01 platform_status 迁移表 P1–P15）。
# 迁移表只在 08 维护；本文件按 SPEC_REF 逐行转写，生成 packages/domain/src/state-machines/order-platform.gen.ts
# （node packages/domain/scripts/state-machines.ts；--verify 只比对）。生成物勿手改，改这里再生成。
#
# 写法约定（CT-04a 编排口径 D10-26）：
# - from 中 null 表示「—」（入库首态，订单尚未入库）；'*' 表示「任意」，只用于 P10 / P15 两个特殊判定。
# - to 为 same 表示「不变」。
# - guard 只是原文文字说明，transition() 不求值；守卫与副作用由调用方负责。
# - 一行只写一个事件；原文一格里有多个事件的（P8、P9）拆成同编号的多行。
# - 平台状态码到事件的映射见 BR-FUND-02 与 specs/order-status-map/<platform>.csv。
# 原文表外说明（逐字）：判定先于写库：先按本表判定本次事件，属于表外事件或 P10 的，不更新订单的任何列；
# P11–P14 的入库首态与跳级只补 history 与时间字段，能否进 WAITING、能否入账仍按 R4 守卫与 BR-FUND-04 的月结校验。
# platform_status=SETTLED 只表示联盟订单状态为「结算」，不表示已回款；回款由 BR-FUND-20 的 UNION_RECEIVABLE 核销表示。
# 表外事件：内部抛 IllegalTransition、不重试、告警；表外事件与 P10 倒退的报文不写订单的任何列（规划/04 §4.1）。
name: order-platform
field: platform_status
states: [DEPOSIT_PAID, PAID, RECEIVED, SETTLED, INVALID]
# 平台事件（原文「平台事件」列括号内的内部编码）：
# PLATFORM_DEPOSIT_PAID 付定金；PLATFORM_PAID 付款；PLATFORM_RECEIVED 确认收货/完成；PLATFORM_SETTLED 结算；
# PLATFORM_INVALID 失效；PLATFORM_RIGHTS 维权；PLATFORM_PUNISH 处罚。
events:
  - PLATFORM_DEPOSIT_PAID
  - PLATFORM_PAID
  - PLATFORM_RECEIVED
  - PLATFORM_SETTLED
  - PLATFORM_INVALID
  - PLATFORM_RIGHTS
  - PLATFORM_PUNISH
# P10 / P15 的判定依据：「事件对应的阶段」与当前 platform_status 比较（原文 P10、P15 与表下说明）。
# stages 是阶段的推进顺序（按首态行 P1、P2、P11、P12 的推进：DEPOSIT_PAID < PAID < RECEIVED < SETTLED）；
# INVALID 不在其中，是终态：之后的非失效事件只按 P9 处理，不算倒退。
stages: [DEPOSIT_PAID, PAID, RECEIVED, SETTLED]
# event_states：事件对应的平台状态（维权、处罚不对应状态，不参与 P10 / P15 判定）。
event_states:
  PLATFORM_DEPOSIT_PAID: DEPOSIT_PAID
  PLATFORM_PAID: PAID
  PLATFORM_RECEIVED: RECEIVED
  PLATFORM_SETTLED: SETTLED
  PLATFORM_INVALID: INVALID
transitions:
  # P1 | — | 付定金（PLATFORM_DEPOSIT_PAID） | DEPOSIT_PAID | （说明空）
  - id: P1
    from: [null]
    event: PLATFORM_DEPOSIT_PAID
    to: DEPOSIT_PAID
    guard: '—'
    test_id: SM-PLT-P1
  # P2 | — / DEPOSIT_PAID | 付款（PLATFORM_PAID） | PAID | （说明空）
  - id: P2
    from: [null, DEPOSIT_PAID]
    event: PLATFORM_PAID
    to: PAID
    guard: '—'
    test_id: SM-PLT-P2
  # P3 | PAID | 确认收货/完成（PLATFORM_RECEIVED） | RECEIVED | 写 received_at
  - id: P3
    from: [PAID]
    event: PLATFORM_RECEIVED
    to: RECEIVED
    guard: '—'
    test_id: SM-PLT-P3
  # P4 | RECEIVED | 结算（PLATFORM_SETTLED） | SETTLED | 写 settled_at；结算额写 order_settlements（BR-FUND-09）
  - id: P4
    from: [RECEIVED]
    event: PLATFORM_SETTLED
    to: SETTLED
    guard: '—'
    test_id: SM-PLT-P4
  # P5 | DEPOSIT_PAID / PAID | 结算（PLATFORM_SETTLED，此前未给收货） | SETTLED |
  # 同一事务依次补写 →PAID（如缺）、→RECEIVED、→SETTLED 三条 history；received_at 取结算时间
  - id: P5
    from: [DEPOSIT_PAID, PAID]
    event: PLATFORM_SETTLED
    to: SETTLED
    guard: '此前未给收货'
    test_id: SM-PLT-P5
  # P6 | DEPOSIT_PAID / PAID / RECEIVED | 失效（PLATFORM_INVALID） | INVALID | （说明空）
  - id: P6
    from: [DEPOSIT_PAID, PAID, RECEIVED]
    event: PLATFORM_INVALID
    to: INVALID
    guard: '—'
    test_id: SM-PLT-P6
  # P7 | SETTLED | 失效（PLATFORM_INVALID） | 不变 |
  # 写 order_rights(type=INVALID_AFTER_SETTLE, status=SUCCEEDED)，settlement 按 BR-FUND-08 处理
  - id: P7
    from: [SETTLED]
    event: PLATFORM_INVALID
    to: same
    guard: '—'
    test_id: SM-PLT-P7
  # P8 | PAID / RECEIVED / SETTLED | 维权/处罚（PLATFORM_RIGHTS / PLATFORM_PUNISH） | 不变 |
  # 写 order_rights（处罚 type=PUNISH，映射见 BR-FUND-02）；结算前同样只写 order_rights
  - id: P8
    from: [PAID, RECEIVED, SETTLED]
    event: PLATFORM_RIGHTS
    to: same
    guard: '—'
    test_id: SM-PLT-P8
  - id: P8
    from: [PAID, RECEIVED, SETTLED]
    event: PLATFORM_PUNISH
    to: same
    guard: '—'
    test_id: SM-PLT-P8
  # P9 | INVALID | 平台回传非失效状态（PLATFORM_PAID / PLATFORM_RECEIVED / PLATFORM_SETTLED） | 平台当前状态 |
  # 记 history 并告警；rebate_status 不自动变化，按 BR-FUND-22
  - id: P9
    from: [INVALID]
    event: PLATFORM_PAID
    to: PAID
    guard: '平台回传非失效状态'
    test_id: SM-PLT-P9
  - id: P9
    from: [INVALID]
    event: PLATFORM_RECEIVED
    to: RECEIVED
    guard: '平台回传非失效状态'
    test_id: SM-PLT-P9
  - id: P9
    from: [INVALID]
    event: PLATFORM_SETTLED
    to: SETTLED
    guard: '平台回传非失效状态'
    test_id: SM-PLT-P9
  # P10 | 任意 | 比当前更早阶段的状态码（倒退；按事件对应的阶段与当前状态比较得出，不是单独的事件） | 不变 |
  # 写待处理表并告警；整条报文不落 orders 的任何列，原始报文留在 union_raw_payloads；待处理表记录与
  # order_illegal_transition 事件在本次事务内写入并提交（负责人 2026-10-03 资金规则对齐决-12 选 A；
  # 开关 order_sync.regression_hold.enabled，默认 on；off 时状态不迁移，报文里的金额、数量、时间、结算记录照常处理）
  - id: P10
    kind: backward
    from: ['*']
    event: null
    to: same
    guard: '比当前更早阶段的状态码（倒退；按事件对应的阶段与当前状态比较得出，不是单独的事件）'
    test_id: SM-PLT-P10
  # P11 | — | 确认收货/完成（PLATFORM_RECEIVED，首次入库即已收货） | RECEIVED |
  # 同一事务补写 →PAID、→RECEIVED 两条 history；received_at 取平台返回的收货时间。
  # 缺该时间时按 P2 落 PAID，收货事件进待处理表，不进 WAITING（BR-FUND-02）
  - id: P11
    from: [null]
    event: PLATFORM_RECEIVED
    to: RECEIVED
    guard: '首次入库即已收货；缺平台收货时间时按 P2 落 PAID，收货事件进待处理表，不进 WAITING（BR-FUND-02）'
    test_id: SM-PLT-P11
  # P12 | — | 结算（PLATFORM_SETTLED，首次入库即已结算） | SETTLED |
  # 同一事务补写 →PAID、→RECEIVED、→SETTLED 三条 history；received_at 取平台收货时间，缺时取结算时间（同 P5）；
  # 结算额写 order_settlements
  - id: P12
    from: [null]
    event: PLATFORM_SETTLED
    to: SETTLED
    guard: '首次入库即已结算'
    test_id: SM-PLT-P12
  # P13 | — | 失效（PLATFORM_INVALID，首次入库即失效，且有付款时间） | INVALID |
  # 入库，供去重、找回判定与展示；返利状态按 R1 或 R2 入库后同一事务按 R6 置 VOID；不生成快照（BR-CALC-10）。
  # 两个付款时间都为空的不入库（BR-ATTR-25）
  - id: P13
    from: [null]
    event: PLATFORM_INVALID
    to: INVALID
    guard: '首次入库即失效，且有付款时间；两个付款时间都为空的不入库（BR-ATTR-25）'
    test_id: SM-PLT-P13
  # P14 | DEPOSIT_PAID | 确认收货/完成（PLATFORM_RECEIVED，此前没见到付款） | RECEIVED |
  # 同一事务补写 →PAID、→RECEIVED；按 P2 的做法在同一事务生成快照（paid_at 取值按 BR-CALC-11）；received_at 同 P11
  - id: P14
    from: [DEPOSIT_PAID]
    event: PLATFORM_RECEIVED
    to: RECEIVED
    guard: '此前没见到付款'
    test_id: SM-PLT-P14
  # P15 | 任意 | 与当前状态相同（重复上报，或不同原始码映射到同一状态） | 不变 |
  # 不是迁移：不写 history、不告警、不算表外事件。本次报文的其余数据（佣金、数量、时间、结算记录、维权）照常处理
  - id: P15
    kind: same_state
    from: ['*']
    event: null
    to: same
    guard: '与当前状态相同（重复上报，或不同原始码映射到同一状态）'
    test_id: SM-PLT-P15
