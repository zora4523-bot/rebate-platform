# 资金术语键清单（唯一一份机器可读清单；规划/08 BR-TEXT-12 细则「资金术语键」，规划/04 §11.2 权限点
# content.fund_terms）。后台权限守卫（能改文案键或通知模板的每个写入口共用的同一个键级检查）与 CI 都读本文件，
# 不按键名另猜；本文件与 08 不一致时以 08 为准修本文件。归类与例外表的改动按资金类评审。
#
# 结构（packages/contracts-ts/scripts/fund-term-keys.ts 校验，pnpm contracts:check 里跑）：
#   fund_terms / ordinary   两段，各有三个列表：
#     prefixes          键名以它开头的全部键归这一段（按字符串前缀比对，如 error.303 命中 error.30301.x）
#     keys              单列的键（整键相等才命中）
#     notify_templates  通知模板编码（contracts/enums/ops.yaml notify_template_code；一个编码下的全部变体随编码归类）
#   exempt                  例外表 {key, reason}：只收归 ordinary、而默认文案命中关键词核对的键——带金额变量
#                           （④ {amount} {rebate} {rebate_sum} {sum} {promo_sum} {net} {fee} {tax} {max}）、
#                           用到 BR-TEXT-01 术语对照表「用户词」、或含「返利」「收益」「提现」「到账」「余额」
#                           「冻结」「扣回」「结算」「入账」「抵扣」之一；没有理由 CI 失败。关键词只作辅助核对，
#                           不决定归不归资金术语。
#   检查：contracts/texts.default.json 的每个键、notify_template_code 的每个编码都恰好落在一段里（前缀或单列命中）；
#   没有归类或两段都命中即失败；两段的前缀互不为前缀，单列的键不被另一段命中。新键、新模板须先归类才能合入。
#   守卫：清单里查不到的键或模板按资金术语处理，并提示先归类。
#   ordinary 段只用 08 写明整组归普通的前缀，其余逐键列出，不用 external_page. 这类整前缀
#   （external_page.product_unresolved 单列资金术语）。
#
# 08 列了、texts.default.json 里还没有的键（tag.rebate、btn.buy.no_rebate、btn.buy.rebate_suffix、jump_tip，普通段的
# btn.buy、btn.buy.coupon）照 08 先归类；08「还没有取键名的资金文案」取键名后补进 fund_terms.keys。
# P1 订阅提醒模板 watch.price_drop.* 进 notify_template_code 时归 fund_terms（BR-WATCH-14）。
