exempt:
  - key: agent.notice.search_disabled
    reason: 只是请用户改用发链接查返利，不说有没有返利（08 BR-TEXT-12 细则写明归普通）
  - key: agent.refuse.out_of_scope
    reason: 介绍助手能做的事（查返利、解答返利规则），不说金额、状态或有没有返利
  - key: agent.welcome
    reason: 介绍助手能做的事（查返利），不说金额、状态或有没有返利
  - key: clipboard.prompt
    reason: 只是请用户去查返利，不说有没有返利（08 BR-TEXT-12 细则的例子）
  - key: error.10401
    reason: 「已失效」说的是请求，不是订单或金额
  - key: error.20003
    reason: 「已失效」说的是验证码
  - key: error.30102
    reason: 「已失效」说的是淘宝授权，只要求重新授权，不说有没有返利（08 BR-TEXT-12 细则列为普通）
  - key: error.30143
    reason: 「已失效」说的是商品信息，请用户重新搜索
  - key: error.30144
    reason: 「已失效」说的是购买链接，正在重新获取
  - key: favorite.invalid
    reason: 「已失效」说的是收藏的商品已下架或不可推广，不说订单、金额或有没有返利
  - key: error.50304.search_disabled
    reason: 只是请用户改用粘贴链接查返利，不说有没有返利（08 BR-TEXT-12 细则写明归普通）
  - key: link_landing.invalid
    reason: 「已失效」说的是链接（08 BR-TEXT-12 细则的例子）
  - key: perm.push.card_hint
    reason: 通知权限的用途说明（08 BR-TEXT-12 细则的例子）
  - key: perm.push.guide_bar
    reason: 通知权限的用途说明，同 perm.push.card_hint
  - key: privacy.basic_mode.notice
    reason: 说明开启完整功能后能登录、查返利，不说有没有返利
  - key: home.guest_value.desc
    reason: 只是请游客下单前先来查返利，不说金额、状态或有没有返利（同 clipboard.prompt）
  - key: invite.bind_phone_guide.benefit
