# Agent 输入检查关键词表（规划/08 BR-AI-18；禁售类别按 F-PROD-08 禁售黑名单）。规则只在 08 维护，
# 本文件是代理按 BR-AI-18 与 F-PROD-08 的类别起草的词表（plan.md U-5，代理可自定），评审时复核。
# 运行时不读本文件：词表写在 apps/api/src/modules/agent/preprocess/input/keywords.ts，
# 规则测试 test/spec/agent/preprocess-input/** 比对两者逐项一致，改词两处一起改。
#
# 结构：
#   advice      问诊、用药、法律、投资「建议类问题」的问法短语，命中出 agent.refuse.advice（计配额）。
#               只收「请求建议」的问法，不收商品名：找药品、保健品、医疗用品、法律书、理财书按找货处理。
#   prohibited  禁售查询词（F-PROD-08：处方药、烟草电子烟、成人用品、二类及以上医疗器械、彩票、虚拟币、
#               枪械刀具），命中出 agent.refuse.prohibited（计配额）。
# 匹配：用户原文去掉链接与口令后做 NFKC、转小写、去空白，再按子串比对；紧接在「非」之后的命中不算
#   （「非处方药」是找货，不是「处方药」）。advice 的找货豁免按分句判定（命中词先从分句里去掉；
#   负责人 2026-10-16「用药优先」）：① 读物请求（书、教材、课程、绘本、杂志等与找 / 买 / 推荐 / 有没有
#   同句）一律放行，含投资、法律、医疗主题；② 其余情况下问诊、用药类命中（吃几片、怎么吃 / 用、用量、
#   剂量、副作用、能一起吃吗、吃什么药、饭前还是饭后等）一律拒答，带购买词也不豁免；③ 分句有投资标的
#   （股票、基金、币、理财产品、期货）按投资建议拒答；④ 其余有找货 / 购买意图且有商品名词或后面还有
#   内容的量词时按找货放行，否则拒答（「这个合同有没有法律问题」）。
# prohibited 按 F-PROD-08 逐类列写法；「刀具」按清单原文整词拦截，「厨房刀具」也拒答（放宽须先改 08）；
#   器械只拦类别写法，不列具体器械名（血压计等按找货，由结果层类目黑名单过滤）。
# 模型抽取的 q 命中禁售词由工具层处理（B3-04b）。
