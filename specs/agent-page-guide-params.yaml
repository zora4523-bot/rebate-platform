# 页面引导输入来源②「用户要求带参数打开」的识别模式（规划/08 BR-AI-01 细则「页面引导」：
# 「名称=值」「名称:值」一类参数写法，或单号、ID 一类标识；模式由 05 B3-05 写进 specs/，代理可自定）。
# 运行时不读本文件：模式写在 apps/api/src/modules/agent/preprocess/input/params.ts，
# 规则测试 test/spec/agent/preprocess-input/** 比对两者逐项一致，改模式两处一起改。
#
# 结构：patterns 为 JavaScript 正则源字符串（按 u 标志编译，不带 g），任一命中即 params_requested。
# 比对对象：用户原文去掉 parse_input 识别出的链接与口令之后的文本（URL 查询串里的 id=… 不算），未脱敏
#   （≥11 位数字换成占位符之前；脱敏不能吞掉参数证据）。
# 不得命中的普通问句（08 例）：钱包在哪、提现记录在哪看、我的订单在哪看、昨天买的那单怎么还没返、
#   我余额还有多少、帮我注销账号。
patterns:
  # 名称=值（半角或全角等号）；名称、等号、值之间可有空白（status = pending）
  - '\p{L}[\p{L}\p{N}_]*\s*[=＝]\s*[^\s=＝]'
  # 名称:值。英文标识名与冒号（半角或全角）、冒号与值之间都可有空白（半角或全角，如 status : pending）；
  # 中文名称只认紧贴的半角冒号（名称:值），「分享文案：」「问题：」一类中文行文的全角冒号不算
  - '(?:\p{L}[\p{L}\p{N}_]*:|(?<![A-Za-z0-9_])[A-Za-z_][A-Za-z0-9_]*\s*[:：])\s*[^\s:：]'
  # 单号 / 编号 / 流水号 + 至少 4 位且含数字的标识（订单号、运单号都含「单号」）
  - '(?:单号|编号|流水号)\s*[:：]?\s*(?=[A-Za-z0-9-]*\d)[A-Za-z0-9-]{4,}'
  # ID + 至少 4 位且含数字的标识；前面紧挨字母的不算（Android 等）
  - '(?<![A-Za-z])[Ii][Dd]\s*[:：]?\s*(?=[A-Za-z0-9-]*\d)[A-Za-z0-9-]{4,}'
  # 单独的 ≥11 位连续数字（订单号、长 ID；与 BR-AI-14 脱敏表的数字识别同一口径）
  - '(?<!\d)\d{11,}(?!\d)'
