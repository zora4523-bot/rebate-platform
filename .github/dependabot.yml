# Dependabot 版本升级（CT-23，规划/05 CT-23）。
# 只开 PR、不自动合并：依赖 PR 仍走 deps 任务与对抗评审，锁文件只由 deps 任务改。
# cooldown 7 天对齐 ADR-0001 §2「新版本发布满 7 天才装」与 pnpm-workspace.yaml 的
# minimumReleaseAge（10080 分钟）。pnpm 工作区由根目录锁文件覆盖，只配根目录一项。
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
