# Base checks for every pull request and every push to main (规划/11 §3.2, §4.1, §4.2).
# Written on 2026-10-01 without a GitHub remote: nothing in this file has run on GitHub yet.
# TODO(规划/11 §9.3 #10): first run on a real runner, then back-fill the timings — blocked on GitHub remote.
#
# Rules for every workflow in this repo (checked by tools/ci/check-workflows.ts):
#   - no workflow-level `paths` filters; path-conditional work uses a job-level `if` plus an
#     `if: always()` summary job, and only summary jobs are required checks;
#   - job ids are unique across all workflows and jobs carry no `name:`, so the check context
#     equals the job id;
#   - every action is pinned to a full commit SHA with a version comment.
name: ci

on:
  pull_request:
    # labeled / unlabeled: guard-git reads the owner approval label, so the check reruns when it
    # is added or removed; the verify jobs then reuse an earlier pass on the same tested tree
    # (verify-reuse, D10-242).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-reuse:
    # D10-242 (CT-06zm): an owner-approval label added or removed changes no code, so on a
    # labeled / unlabeled event the three verify jobs reuse what already passed instead of running
    # a second time. Reuse holds only when, for EACH of verify-fast, verify-props and verify-int,
    # an earlier run of this workflow file (ci.yml) for the same PR head SHA has that job's latest
    # attempt concluded `success` AND carries the artifact `verified-<job>-<tree>` that the job
    # uploads only after all of its steps passed, <tree> being the tree it tested. The tree of
    # this event's checkout (the PR merge commit as of now) must equal it, so a base branch that
    # moved since then (a different merge result) means a full run; failed, cancelled or skipped
    # jobs never count. Any other event, a missing record or an API error: reuse is not output and
    # everything runs as before. guard-git and the other workflows still run on label events.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree of this event: $tree (head $HEAD_SHA)"
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id")
          reuse=true
          for job in verify-fast verify-props verify-int; do
            found=''
            for run in $runs; do
              ok=$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq "[.jobs[] | select(.name == \"$job\" and .conclusion == \"success\" and .head_sha == \"$HEAD_SHA\")] | length")
              [ "$ok" -ge 1 ] || continue
              art=$(gh api "repos/$REPO/actions/runs/$run/artifacts?name=verified-$job-$tree&per_page=100" \
                --jq "[.artifacts[] | select(.name == \"verified-$job-$tree\" and .expired == false)] | length")
              [ "$art" -ge 1 ] || continue
              found=$run
              break
            done
            if [ -n "$found" ]; then
              echo "$job: passed on this tree in run $found, reused"
            else
              echo "$job: no passing run on this tree, runs in full"
              reuse=false
            fi
          done
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}

  verify-fast:
    # D10-242 (CT-06zm): skipped only when verify-reuse found a success of this very job on the
    # same tested tree (see verify-reuse); every other event, and any failure of verify-reuse,
    # runs it in full.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    # 20 → 35 (2026-10-14): main's verify-fast reached 19m50s on 2026-10-10 and PRs are being
    # cancelled at the cap (two 100k-run property passes plus pnpm verify:fast).
    # 35 → 20 (2026-10-17): the two 100k-run property passes moved to verify-props (#658, #664
    # and #665 hit the 35-minute cap on them). What is left here took 8–13 minutes in the last
    # seven green runs of 2026-10-17; 20 is that with a 1.5× margin.
    # 20 → 30 (2026-10-19, CT-06z): green in the 30 latest ci runs 11m21s–19m10s, p90 19m00s
    # (95% of the cap); 30 is the maximum with a 1.5× margin, rounded up to a multiple of 5.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # The spec-ref and banned-terms guards and the tools/ops ledger tests read planning text
      # with `git show <SPEC_REF>:<path>`, so the public planning repository is checked out with
      # full history into the git-ignored .tmp/ directory (规划/11 §5.3).
      - name: Check out the planning repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zora4523-bot/couli
          path: .tmp/spec-repo
          fetch-depth: 0
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:fast
        env:
          COULI_SPEC_REPO: ${{ github.workspace }}/.tmp/spec-repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-fast-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file is only a placeholder.
          path: .nvmrc
          retention-days: 7
          if-no-files-found: error

  verify-props:
    # PR property tier (规划/11 §4.2): 100k runs with the fixed seed, then 100k runs with a seed
    # derived from the first 8 hex digits of the commit SHA. Split out of verify-fast on
    # 2026-10-17 so the two passes (6–11 minutes each, growing with every task) run in parallel
    # with it instead of pushing it past its cap; same steps, same runs, same seeds. The spec
    # tests resolve workspace packages from source (vitest.shared.ts `couli-src`) and read no
    # planning text, so neither `pnpm build` nor the planning repository is needed here.
    # D10-242 (CT-06zm): skipped only when verify-reuse found a success of this very job on the
    # same tested tree (see verify-reuse); every other event, and any failure of verify-reuse,
    # runs it in full.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    # 35 → 60 (2026-10-19, CT-06z): green in the 30 latest ci runs 16m40s–32m13s, p90 31m30s
    # (90% of the cap); the maximum with a 1.5× margin, rounded up to a multiple of 5, is 50,
    # plus 10 for the [AC-B2-01j#20] property test of B2-01l (#812), which makes this job longer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Property tests, 100k runs, fixed seed
        run: pnpm --filter @couli/spec-tests test
        env:
          PROP_RUNS: '100000'
      - name: Property tests, 100k runs, seed from commit SHA
        run: |
          PROP_SEED="$((16#${COMMIT_SHA:0:8}))"
          export PROP_SEED
          echo "PROP_SEED=${PROP_SEED}"
          pnpm --filter @couli/spec-tests test
        env:
          PROP_RUNS: '100000'
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-props-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file is only a placeholder.
          path: .nvmrc
          retention-days: 7
          if-no-files-found: error

  verify-int:
    # Needs Docker (Testcontainers starts the one-shot PostgreSQL): ubuntu-latest, never ubuntu-slim.
    # The one-shot Redis of the integration tests (TEST_REDIS_URL) is a service container with
    # the image of infra/local/compose.yaml and tools/ops/verify-container.sh, data on tmpfs only.
    # D10-242 (CT-06zm): skipped only when verify-reuse found a success of this very job on the
    # same tested tree (see verify-reuse); every other event, and any failure of verify-reuse,
    # runs it in full.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    # 30 → 45 (2026-10-19, CT-06z): green in the 30 latest ci runs 17m05s–29m16s, p90 29m05s
    # (97% of the cap); 45 is the maximum with a 1.5× margin, rounded up to a multiple of 5.
    # 45 → 60 (2026-10-22, CT-06ze): #1173, #1190 and #1167 hit 45 minutes in the browser install
    # step after test:int had passed; the install now runs first and is cached (below).
    timeout-minutes: 60
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Browser tests (F1-01j, test/vitest.browser.config.ts): the Chromium of the playwright the
      # lockfile pins (the test package's own CLI, so the version follows pnpm-lock.yaml) with its
      # system libraries, and the Noto CJK fonts the verify image has, so Chinese text renders
      # with the same glyphs as in tools/ops/verify-container.sh. Installed before test:int
      # (CT-06ze, 2026-10-22) so a slow install fails fast instead of after the integration
      # tests; the browser download is cached per playwright version, the system libraries and
      # fonts still come from apt on every run.
      - name: Read the pinned playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @couli/spec-tests exec playwright --version | awk '{print $2}')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected playwright --version output: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache the playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - name: Install Chromium and the CJK fonts for the browser tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          if [ "$CACHE_HIT" = true ]; then
            pnpm --filter @couli/spec-tests exec playwright install-deps chromium
          else
            pnpm --filter @couli/spec-tests exec playwright install --with-deps chromium
          fi
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      # A service container takes no command, so the redis-server settings of
      # infra/local/compose.yaml (no RDB, no AOF, noeviction with an explicit limit;
      # ADR-0001 §4.2 #17) are applied at run time.
      - name: Configure the one-shot Redis
        run: |
          reply="$(docker exec "$REDIS_ID" redis-cli CONFIG SET save '' appendonly no maxmemory 256mb maxmemory-policy noeviction)"
          if [ "$reply" != OK ]; then
            echo "::error::CONFIG SET on the one-shot Redis replied: ${reply}"
            exit 1
          fi
          # From the runner, the way the tests connect (TEST_REDIS_URL): the published port answers.
          pong=''
          if exec 3<>/dev/tcp/127.0.0.1/6379; then
            printf 'PING\r\n' >&3
            IFS= read -r -t 5 pong <&3 || true
            exec 3>&-
          fi
          if [ "${pong%$'\r'}" != '+PONG' ]; then
            echo "::error::the one-shot Redis does not answer PING on 127.0.0.1:6379 (got: ${pong})"
            exit 1
          fi
        env:
          REDIS_ID: ${{ job.services.redis.id }}
      # PROP_RUNS (D10-210, CT-06zg): the property cases inside the integration tests read their run
      # count from PROP_RUNS (some scale it, e.g. test/spec/agent/stream-finalize/model.prop.int.test.ts
      # runs max(20, PROP_RUNS / 100)). 2000 is the long-run tier of their design (PR 200 / long run
      # 2000, test/spec/ledger/posting/properties.int.test.ts). Unset, they fell to the
      # @couli/testing default of 10000, which was not a choice ([AC-B2-02f#23] alone took 783 s).
      # verify-props and longrun-props keep their own run counts.
      - run: pnpm test:int
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          PROP_RUNS: '2000'
      - run: pnpm --filter @couli/spec-tests run test:browser
      # Build smoke (F1-01k, test/vitest.build-smoke.config.ts): builds the H5 entries (APP_ENV=test)
      # and the admin console into a temporary directory, serves each on 127.0.0.1 and opens it in
      # the same Chromium (playwright library): first screen, initial-JS budgets, no jsxDEV.
      # Screenshots stay in test/.tmp/build-smoke/screenshots/ on the runner.
      - run: pnpm --filter @couli/spec-tests run test:smoke
      - run: pnpm db:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-int-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file is only a placeholder.
          path: .nvmrc
          retention-days: 7
          if-no-files-found: error

  guard-git:
    # Git-dependent guards run from the BASE copy of tools/guard against the PR tree, so a branch
    # cannot weaken the guards that judge it (规划/11 §2.4, §8). A change to this job's script
    # therefore takes effect only once it is on the base branch.
    # Owner approval (owner decision 2026-10-02): with the label `owner-approved-<first 12 chars
    # of the head sha>` added by the repository owner account (the same check as the
    # protected-paths workflow, tools/guard/lib/owner-approval.mjs), protected-paths problems and
    # changed add-only test assets are reported as warnings; every other guard still fails.
    # Task branches (owner decision 2026-10-02, ops/approvals.yaml id 14): the path guard starts
    # at the spec_commit of ops/evidence/<id>.json once it is verified to lie between the base and
    # the head; the commits before it are checked as the rule-test author's (path-guard-author).
    # Without a usable spec_commit it starts at the base, as before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: base/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: base/.nvmrc
          package-manager-cache: false
      - name: Install the base copy's dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile
      - name: Run the base copy's guards against the PR tree
        run: |
          if [ ! -f base/tools/guard/run.ts ]; then
            echo "::error::base branch has no tools/guard/run.ts; the guards cannot run"
            exit 1
          fi
          set -- git --base "$BASE_SHA" --cwd "$GITHUB_WORKSPACE/pr" --pr-number "$PR_NUMBER"
          case "$HEAD_REF" in
            task/*)
              task_id="${HEAD_REF#task/}"
              if ! printf '%s' "$task_id" | grep -Eq '^[A-Za-z0-9._-]+$'; then
                echo "::error::branch name does not carry a valid task id"
                exit 1
              fi
              set -- "$@" --task "$task_id"
              ;;
          esac
          node base/tools/guard/run.ts "$@"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  ci-gate:
    # Summary job: the only required check of this workflow (ops/branch-protection.json).
    if: always()
    needs: [verify-fast, verify-props, verify-int, guard-git, verify-reuse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise
        run: |
          echo "verify-fast=${FAST} verify-props=${PROPS} verify-int=${INT} guard-git=${GUARD} event=${EVENT} reuse=${REUSE_RESULT}/${REUSE}"
          # A verify job passes when it succeeded, or (label event, D10-242) when verify-reuse
          # itself succeeded and found its success on the same tested tree, so it was skipped.
          reused() { [ "$REUSE_RESULT" = success ] && [ "$REUSE" = true ] && [ "$1" = skipped ]; }
          [ "$FAST" = success ] || reused "$FAST" || exit 1
          [ "$PROPS" = success ] || reused "$PROPS" || exit 1
          [ "$INT" = success ] || reused "$INT" || exit 1
          if [ "$EVENT" = pull_request ]; then
            [ "$GUARD" = success ] || exit 1
          else
            [ "$GUARD" = skipped ] || [ "$GUARD" = success ] || exit 1
          fi
        env:
          FAST: ${{ needs.verify-fast.result }}
          PROPS: ${{ needs.verify-props.result }}
          INT: ${{ needs.verify-int.result }}
          GUARD: ${{ needs.guard-git.result }}
          REUSE_RESULT: ${{ needs.verify-reuse.result }}
          REUSE: ${{ needs.verify-reuse.outputs.reuse }}
          EVENT: ${{ github.event_name }}
