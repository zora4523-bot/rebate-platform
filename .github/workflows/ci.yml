# Base checks for every pull request and every push to main (规划/11 §3.2, §4.1, §4.2).
# Written on 2026-10-01 without a GitHub remote: nothing in this file has run on GitHub yet.
# TODO(规划/11 §9.3 #10): first run on a real runner, then back-fill the timings — blocked on GitHub remote.
#
# Rules for every workflow in this repo (checked by tools/ci/check-workflows.ts):
#   - no workflow-level `paths` filters; path-conditional work uses a job-level `if` plus an
#     `if: always()` summary job, and only summary jobs are required checks;
#   - job ids are unique across all workflows and jobs carry no `name:`, so the check context
#     equals the job id;
#   - every action is pinned to a full commit SHA with a version comment.
name: ci

on:
  pull_request:
    # labeled / unlabeled: guard-git reads the owner approval label, so the check reruns when it
    # is added or removed; the verify jobs then reuse an earlier pass on the same tested tree
    # (verify-reuse, D10-242).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-reuse:
    # D10-242 (CT-06zm): an owner-approval label added or removed changes no code, so on a
    # labeled / unlabeled event the verify jobs reuse what already passed instead of running a
    # second time. Reuse holds only when, for EACH of verify-static, verify-unit, verify-spec-1,
    # verify-spec-2 (the four jobs that replaced verify-fast, CT-06zx), verify-props-1,
    # verify-props-2 (the two shards that replaced verify-props, CT-06zxa) and verify-int, an
    # earlier run of this workflow file (ci.yml) for the same PR head SHA has that job's latest
    # attempt concluded `success` AND carries the artifact `verified-<job>-<tree>` that the job
    # uploads only after all of its steps passed, <tree> being the tree it tested. The tree of
    # this event's checkout (the PR merge commit as of now) must equal it, so a base branch that
    # moved since then (a different merge result) means a full run; failed, cancelled or skipped
    # jobs never count. Any other event, a missing record or an API error: reuse is not output and
    # everything runs as before. guard-git and the other workflows still run on label events.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: find
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree of this event: $tree (head $HEAD_SHA)"
          runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id")
          reuse=true
          for job in verify-static verify-unit verify-spec-1 verify-spec-2 verify-props-1 verify-props-2 verify-int; do
            found=''
            for run in $runs; do
              ok=$(gh api "repos/$REPO/actions/runs/$run/jobs?filter=latest&per_page=100" \
                --jq "[.jobs[] | select(.name == \"$job\" and .conclusion == \"success\" and .head_sha == \"$HEAD_SHA\")] | length")
              [ "$ok" -ge 1 ] || continue
              art=$(gh api "repos/$REPO/actions/runs/$run/artifacts?name=verified-$job-$tree&per_page=100" \
                --jq "[.artifacts[] | select(.name == \"verified-$job-$tree\" and .expired == false)] | length")
              [ "$art" -ge 1 ] || continue
              found=$run
              break
            done
            if [ -n "$found" ]; then
              echo "$job: passed on this tree in run $found, reused"
            else
              echo "$job: no passing run on this tree, runs in full"
              reuse=false
            fi
          done
          echo "reuse=$reuse" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}

  # D10-298 (CT-06zx): the former verify-fast job ran `pnpm verify:fast` on one runner, 849–1475 s
  # (p90 about 23–25 minutes), most of it `turbo run test` with 12 packages competing for 4 cores.
  # It is split into the four parallel jobs below, which together run every command of the
  # verify:fast script (package.json; the script itself is unchanged and still runs whole locally
  # and in tools/ops/verify-container.sh):
  #   verify-static  typecheck, lint, format:check, depcruise, lint:migrations, contracts:check,
  #                  guard:static
  #   verify-unit    `turbo run test` without @couli/spec-tests (so with @couli/tools), then
  #                  `pnpm --filter @couli/api run smoke:entries`
  #   verify-spec-1  @couli/spec-tests `test` with --shard=1/2
  #   verify-spec-2  @couli/spec-tests `test` with --shard=2/2
  # Vitest shards by file: it sorts the test files by the SHA-1 of their path and cuts the list
  # into contiguous ranges, so the two shards are disjoint and their union is the whole set
  # (vitest BaseSequencer.shard). Each job installs from the setup-node pnpm store cache (keyed
  # by pnpm-lock.yaml; `pnpm install --frozen-lockfile` still checks every package against the
  # lockfile's integrity hashes). Each job is skipped only when verify-reuse found a success of
  # that very job on the same tested tree (D10-242, CT-06zm); every other event, and any failure
  # of verify-reuse, runs it in full. timeout-minutes 30 each (D10-298); after a day of runs:
  # if the p90 is still above 20 minutes or verify-unit becomes the critical path, tools and the
  # spec tests are split further.
  verify-static:
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The spec-ref and banned-terms guards (guard:static) read planning text with
      # `git show <SPEC_REF>:<path>`, so the public planning repository is checked out with full
      # history into the git-ignored .tmp/ directory (规划/11 §5.3).
      - name: Check out the planning repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zora4523-bot/couli
          path: .tmp/spec-repo
          fetch-depth: 0
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      # The verify:fast commands of this job, in the script's order.
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run depcruise
      - run: pnpm run lint:migrations
      - run: pnpm run contracts:check
      - run: pnpm run guard:static
        env:
          COULI_SPEC_REPO: ${{ github.workspace }}/.tmp/spec-repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-static-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
          if-no-files-found: error

  verify-unit:
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The tools/ops ledger tests (and the guard tests of @couli/tools) read planning text with
      # `git show <SPEC_REF>:<path>`, so the public planning repository is checked out with full
      # history into the git-ignored .tmp/ directory (规划/11 §5.3).
      - name: Check out the planning repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zora4523-bot/couli
          path: .tmp/spec-repo
          fetch-depth: 0
          persist-credentials: false
      - run: pnpm install --frozen-lockfile
      # `tsc -b` (the same command as typecheck): smoke:entries runs the built entries in
      # apps/api/dist, and in verify:fast every test ran after typecheck had built dist/, so the
      # tests here run under the same precondition.
      - run: pnpm build
      # The verify:fast `pnpm run test` (turbo run test --env-mode=loose) minus @couli/spec-tests,
      # which verify-spec-1 / verify-spec-2 run.
      - run: pnpm exec turbo run test --env-mode=loose --filter='!@couli/spec-tests'
        env:
          COULI_SPEC_REPO: ${{ github.workspace }}/.tmp/spec-repo
      - run: pnpm --filter @couli/api run smoke:entries
        env:
          COULI_SPEC_REPO: ${{ github.workspace }}/.tmp/spec-repo
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-unit-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
          if-no-files-found: error

  verify-spec-1:
    # The spec tests resolve workspace packages from source (vitest.shared.ts `couli-src`) and
    # read no planning text (verify-props runs the same suite the same way), so neither a build
    # nor the planning repository is needed here. PROP_RUNS / PROP_SEED stay unset, as in
    # verify:fast.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package's own `test` script (vitest run), with the shard appended by pnpm.
      - run: pnpm --filter @couli/spec-tests run test --shard=1/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-spec-1-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
          if-no-files-found: error

  verify-spec-2:
    # Same as verify-spec-1, other shard.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The package's own `test` script (vitest run), with the shard appended by pnpm.
      - run: pnpm --filter @couli/spec-tests run test --shard=2/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-spec-2-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
          if-no-files-found: error

  verify-props-1:
    # PR property tier (规划/11 §4.2): 100k runs with the fixed seed, then 100k runs with a seed
    # derived from the first 8 hex digits of the commit SHA. Split out of verify-fast on
    # 2026-10-17 so the two passes (6–11 minutes each, growing with every task) run in parallel
    # with it instead of pushing it past its cap; same steps, same runs, same seeds. The spec
    # tests resolve workspace packages from source (vitest.shared.ts `couli-src`) and read no
    # planning text, so neither `pnpm build` nor the planning repository is needed here.
    # D10-242 (CT-06zm): skipped only when verify-reuse found a success of this very job on the
    # same tested tree (see verify-reuse); every other event, and any failure of verify-reuse,
    # runs it in full.
    # D10-304 (CT-06zxa): split into verify-props-1 / verify-props-2, each running both passes on
    # half of the spec-test files (vitest --shard=i/2, as verify-spec-1 / -2); runs, seeds and
    # steps unchanged. The 12 latest green runs of the single job took 27–53 min (p50 40, p90
    # 52.5) against its 60-minute cap; each shard keeps the 60-minute cap. pnpm store cached.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    # 35 → 60 (2026-10-19, CT-06z): green in the 30 latest ci runs 16m40s–32m13s, p90 31m30s
    # (90% of the cap); the maximum with a 1.5× margin, rounded up to a multiple of 5, is 50,
    # plus 10 for the [AC-B2-01j#20] property test of B2-01l (#812), which makes this job longer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Property tests, 100k runs, fixed seed
        run: pnpm --filter @couli/spec-tests run test --shard=1/2
        env:
          PROP_RUNS: '100000'
      - name: Property tests, 100k runs, seed from commit SHA
        run: |
          PROP_SEED="$((16#${COMMIT_SHA:0:8}))"
          export PROP_SEED
          echo "PROP_SEED=${PROP_SEED}"
          pnpm --filter @couli/spec-tests run test --shard=1/2
        env:
          PROP_RUNS: '100000'
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-props-1-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
          if-no-files-found: error

  verify-props-2:
    # Same as verify-props-1, other shard.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    # 35 → 60 (2026-10-19, CT-06z): green in the 30 latest ci runs 16m40s–32m13s, p90 31m30s
    # (90% of the cap); the maximum with a 1.5× margin, rounded up to a multiple of 5, is 50,
    # plus 10 for the [AC-B2-01j#20] property test of B2-01l (#812), which makes this job longer.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Property tests, 100k runs, fixed seed
        run: pnpm --filter @couli/spec-tests run test --shard=2/2
        env:
          PROP_RUNS: '100000'
      - name: Property tests, 100k runs, seed from commit SHA
        run: |
          PROP_SEED="$((16#${COMMIT_SHA:0:8}))"
          export PROP_SEED
          echo "PROP_SEED=${PROP_SEED}"
          pnpm --filter @couli/spec-tests run test --shard=2/2
        env:
          PROP_RUNS: '100000'
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-props-2-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
          if-no-files-found: error

  verify-int:
    # Needs Docker (Testcontainers starts the one-shot PostgreSQL): ubuntu-latest, never ubuntu-slim.
    # The one-shot Redis of the integration tests (TEST_REDIS_URL) is a service container with
    # the image of infra/local/compose.yaml and tools/ops/verify-container.sh, data on tmpfs only.
    # D10-242 (CT-06zm): skipped only when verify-reuse found a success of this very job on the
    # same tested tree (see verify-reuse); every other event, and any failure of verify-reuse,
    # runs it in full.
    needs: [verify-reuse]
    if: ${{ !cancelled() && needs.verify-reuse.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    # 30 → 45 (2026-10-19, CT-06z): green in the 30 latest ci runs 17m05s–29m16s, p90 29m05s
    # (97% of the cap); 45 is the maximum with a 1.5× margin, rounded up to a multiple of 5.
    # 45 → 60 (2026-10-22, CT-06ze): #1173, #1190 and #1167 hit 45 minutes in the browser install
    # step after test:int had passed; the install now runs first and is cached (below).
    # 60 → 90 (2026-10-31, CT-06zza): test:int itself grew from 707 files / 8706 tests (#1190) to
    # 1283 files / 13760 tests; green runs on 10-30/31 took 35–59 minutes (four of eight sampled at
    # 58–59) and #2010 (run 41175931885) was cancelled at 60 after 56 minutes of passing test:int.
    # 90 is the 59-minute maximum with a 1.5× margin; splitting test:int into shards is CT-06zzb.
    timeout-minutes: 90
    services:
      redis:
        image: redis:7.4.11-alpine
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --tmpfs /data
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tree this job tests (the PR merge commit, or the pushed commit): recorded before
      # anything runs, uploaded under that name only when every step passed (D10-242).
      - id: tested
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$tree" > "$RUNNER_TEMP/verified-tree.txt"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Browser tests (F1-01j, test/vitest.browser.config.ts): the Chromium of the playwright the
      # lockfile pins (the test package's own CLI, so the version follows pnpm-lock.yaml) with its
      # system libraries, and the Noto CJK fonts the verify image has, so Chinese text renders
      # with the same glyphs as in tools/ops/verify-container.sh. Installed before test:int
      # (CT-06ze, 2026-10-22) so a slow install fails fast instead of after the integration
      # tests; the browser download is cached per playwright version, the system libraries and
      # fonts come from apt, their .deb files cached per runner image (CT-06zxb).
      - name: Read the pinned playwright version
        id: playwright
        run: |
          version="$(pnpm --filter @couli/spec-tests exec playwright --version | awk '{print $2}')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected playwright --version output: ${version}"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Cache the playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      # D10-308 (CT-06zxb): the apt downloads of the next step are cached as .deb files. Two
      # verify-int runs (#1451, #1452, 2026-10-23) were cut at 60 minutes after this step took
      # 34–37 minutes: the Azure Ubuntu mirror fell to ~40 kB/s and fonts-noto-cjk (61 MB) stalled
      # for 23 minutes before a retry. The key is the runner image (ImageOS / ImageVersion) and a
      # hash of the package list (fonts-noto-cjk plus playwright's chromium dependencies, which
      # follow the pinned playwright version); a hit means apt finds the .deb files and downloads
      # nothing it already has.
      - name: Read the runner image for the apt cache
        id: apt-key
        run: |
          echo "image=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
          echo "packages=$(printf 'fonts-noto-cjk playwright-%s-chromium-deps' "$PLAYWRIGHT" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
        env:
          PLAYWRIGHT: ${{ steps.playwright.outputs.version }}
      - name: Restore the apt .deb cache
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-debs-${{ steps.apt-key.outputs.image }}-${{ steps.apt-key.outputs.packages }}
      # apt (and the apt-get that `playwright install-deps` runs) reads its options from an
      # apt.conf.d file: downloads go to ~/apt-archives and are kept; a download that receives
      # nothing for 30 s is dropped and retried up to 5 times (a slow but moving download is not
      # cut by this; the prefetch wrapper below, the cache and the step limit bound it). The step has
      # its own 10-minute limit so a mirror that stays slow fails the job early (rerun it) instead of
      # eating the job's 60 minutes: a run where this step alone took 10–25 minutes used to pass and
      # now fails, by design; `apt-get update` is not cached and counts against the same 10 minutes.
      # The job limit and the tests are unchanged.
      - name: Install Chromium and the CJK fonts for the browser tests
        id: apt-install
        timeout-minutes: 10
        run: |
          mkdir -p "$HOME/apt-archives/partial"
          printf '%s\n' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            'Acquire::Retries "5";' \
            "Dir::Cache::Archives \"$HOME/apt-archives\";" \
            'APT::Keep-Downloaded-Packages "true";' \
            'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
            | sudo tee /etc/apt/apt.conf.d/99couli-ci > /dev/null
          # A slow but moving download is not cut by the timeout above (the first run of this
          # change stalled 10 minutes on fonts-noto-cjk with nothing cached yet). So, for this step
          # only, `apt-get install` (ours, and the `sudo apt-get` playwright runs: sudo's
          # secure_path puts /usr/local/sbin first) goes through a wrapper that first fetches the
          # .deb files with curl, drops a mirror that stays under 300 kB/s for 15 s and tries the
          # next Ubuntu mirror, then runs the real apt-get, which downloads whatever it still lacks.
          # apt only compares the size of a file already in its archive directory, so the wrapper
          # itself checks every prefetched file against the size and hash apt takes from the signed
          # index (size from --print-uris, SHA256 from apt-cache show of the same Filename); a mismatch
          # is deleted and the next mirror tried, and a file without a SHA256 there is left to apt.
          trap 'sudo rm -f /usr/local/sbin/apt-get' EXIT
          sudo tee /usr/local/sbin/apt-get > /dev/null <<'WRAPPER'
          #!/bin/bash
          eval "$(/usr/bin/apt-config shell ARCH Dir::Cache::archives/d)"
          ARCH=${ARCH%/}
          case " $* " in
            *" install "*)
              /usr/bin/apt-get --print-uris -qq "$@" 2>/dev/null | while read -r uri file size _; do
                uri=${uri//\'/}
                path=${uri#*://*/ubuntu/}
                [ "$path" != "$uri" ] || continue
                [ -s "$ARCH/$file" ] && continue
                # --print-uris gives MD5 on this runner; the SHA256 comes from the same signed index entry.
                name=${file%%_*}
                version=${file#*_}
                version=${version%_*}
                version=${version//%3a/:}
                # The URI is %-escaped (+ ~), the index Filename is not.
                filename=$(printf '%b' "${path//%/\\x}")
                want=$(/usr/bin/apt-cache show "$name=$version" 2>/dev/null \
                  | awk -v f="$filename" '/^Filename: /{m=($2==f)} m&&/^SHA256: /{print $2; exit}')
                if [ -z "$want" ]; then
                  echo "no SHA256 in the index for $file; left to apt" >&2
                  continue
                fi
                for base in "${uri%%/ubuntu/*}/ubuntu" http://archive.ubuntu.com/ubuntu http://security.ubuntu.com/ubuntu http://mirrors.edge.kernel.org/ubuntu; do
                  if curl -fsSL --connect-timeout 10 --speed-limit 300000 --speed-time 15 -o "$ARCH/partial/$file" "$base/$path" \
                    && [ "$(stat -c %s "$ARCH/partial/$file")" = "$size" ] \
                    && [ "$(sha256sum "$ARCH/partial/$file" | cut -d' ' -f1)" = "$want" ]; then
                    mv "$ARCH/partial/$file" "$ARCH/$file"
                    echo "prefetched $file from $base"
                    break
                  fi
                  rm -f "$ARCH/partial/$file"
                  echo "slow, failed or not matching the index: $base for $file" >&2
                done
              done
              ;;
          esac
          exec /usr/bin/apt-get "$@"
          WRAPPER
          sudo chmod 755 /usr/local/sbin/apt-get
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          if [ "$CACHE_HIT" = true ]; then
            pnpm --filter @couli/spec-tests exec playwright install-deps chromium
          else
            pnpm --filter @couli/spec-tests exec playwright install --with-deps chromium
          fi
          sudo chmod -R a+rX "$HOME/apt-archives"
          debs=$(find "$HOME/apt-archives" -maxdepth 1 -name '*.deb' | wc -l)
          echo "apt .deb files kept: ${debs}"
          echo "debs=${debs}" >> "$GITHUB_OUTPUT"
        env:
          CACHE_HIT: ${{ steps.playwright-cache.outputs.cache-hit }}
      # Saved right after the install, so a later test failure still keeps the cache; skipped on an
      # exact hit (the key exists already) and when apt kept no .deb file (a save of nothing fails).
      - name: Save the apt .deb cache
        if: ${{ steps.apt-cache.outputs.cache-hit != 'true' && steps.apt-install.outputs.debs != '0' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives/*.deb
          key: apt-debs-${{ steps.apt-key.outputs.image }}-${{ steps.apt-key.outputs.packages }}
      # A service container takes no command, so the redis-server settings of
      # infra/local/compose.yaml (no RDB, no AOF, noeviction with an explicit limit;
      # ADR-0001 §4.2 #17) are applied at run time.
      - name: Configure the one-shot Redis
        run: |
          reply="$(docker exec "$REDIS_ID" redis-cli CONFIG SET save '' appendonly no maxmemory 256mb maxmemory-policy noeviction)"
          if [ "$reply" != OK ]; then
            echo "::error::CONFIG SET on the one-shot Redis replied: ${reply}"
            exit 1
          fi
          # From the runner, the way the tests connect (TEST_REDIS_URL): the published port answers.
          pong=''
          if exec 3<>/dev/tcp/127.0.0.1/6379; then
            printf 'PING\r\n' >&3
            IFS= read -r -t 5 pong <&3 || true
            exec 3>&-
          fi
          if [ "${pong%$'\r'}" != '+PONG' ]; then
            echo "::error::the one-shot Redis does not answer PING on 127.0.0.1:6379 (got: ${pong})"
            exit 1
          fi
        env:
          REDIS_ID: ${{ job.services.redis.id }}
      # PROP_RUNS (D10-210, CT-06zg): the property cases inside the integration tests read their run
      # count from PROP_RUNS (some scale it, e.g. test/spec/agent/stream-finalize/model.prop.int.test.ts
      # runs max(20, PROP_RUNS / 100)). 2000 is the long-run tier of their design (PR 200 / long run
      # 2000, test/spec/ledger/posting/properties.int.test.ts). Unset, they fell to the
      # @couli/testing default of 10000, which was not a choice ([AC-B2-02f#23] alone took 783 s).
      # verify-props and longrun-props keep their own run counts.
      - run: pnpm test:int
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0
          PROP_RUNS: '2000'
      # D10-253 (CT-06zn): the browser tests failed now and then on their first files with "Failed
      # to fetch dynamically imported module"; the requests died with net::ERR_NETWORK_CHANGED.
      # After test:int, testcontainers (Ryuk) removes the one-shot containers and their networks
      # asynchronously, and Chromium aborts in-flight requests when it sees the host's links
      # change. So wait until no testcontainers container or network is left (at most 120 s; on
      # timeout list what is left and go on), then until two `ip -o link` samples 2 s apart are
      # equal, whole lines (state and flags too; at most 60 s). No retry, no test change.
      - name: Wait for the integration containers and the host network to settle
        timeout-minutes: 5
        run: |
          left=''
          for _ in $(seq 1 60); do
            left="$(docker ps -aq --filter label=org.testcontainers=true)$(docker network ls -q --filter label=org.testcontainers=true)"
            [ -z "$left" ] && break
            sleep 2
          done
          if [ -n "$left" ]; then
            echo "::warning::testcontainers objects still present after 120 s:"
            docker ps -a --filter label=org.testcontainers=true
            docker network ls --filter label=org.testcontainers=true
          fi
          prev=''
          settled=''
          for _ in $(seq 1 30); do
            cur="$(ip -o link | sort)"
            if [ -n "$prev" ] && [ "$cur" = "$prev" ]; then settled=yes; break; fi
            prev="$cur"
            sleep 2
          done
          [ -n "$settled" ] || echo "::warning::host links still changing after 60 s"
          echo "host links:"
          echo "$cur"
      - run: pnpm --filter @couli/spec-tests run test:browser
      # Build smoke (F1-01k, test/vitest.build-smoke.config.ts): builds the H5 entries (APP_ENV=test)
      # and the admin console into a temporary directory, serves each on 127.0.0.1 and opens it in
      # the same Chromium (playwright library): first screen, initial-JS budgets, no jsxDEV.
      # Screenshots stay in test/.tmp/build-smoke/screenshots/ on the runner.
      - run: pnpm --filter @couli/spec-tests run test:smoke
      - run: pnpm db:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-verify-int-${{ steps.tested.outputs.tree }}
          # The artifact name is the record (job and tested tree); the file only holds the tree id,
          # written by the `tested` step (upload-artifact skips dot-files such as .nvmrc by default).
          path: ${{ runner.temp }}/verified-tree.txt
          retention-days: 7
          if-no-files-found: error

  guard-git:
    # Git-dependent guards run from the BASE copy of tools/guard against the PR tree, so a branch
    # cannot weaken the guards that judge it (规划/11 §2.4, §8). A change to this job's script
    # therefore takes effect only once it is on the base branch.
    # Owner approval (owner decision 2026-10-02): with the label `owner-approved-<first 12 chars
    # of the head sha>` added by the repository owner account (the same check as the
    # protected-paths workflow, tools/guard/lib/owner-approval.mjs), protected-paths problems and
    # changed add-only test assets are reported as warnings; every other guard still fails.
    # Task branches (owner decision 2026-10-02, ops/approvals.yaml id 14): the path guard starts
    # at the spec_commit of ops/evidence/<id>.json once it is verified to lie between the base and
    # the head; the commits before it are checked as the rule-test author's (path-guard-author).
    # Without a usable spec_commit it starts at the base, as before.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - name: Check out the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: base/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: base/.nvmrc
          package-manager-cache: false
      - name: Install the base copy's dependencies
        working-directory: base
        run: pnpm install --frozen-lockfile
      - name: Run the base copy's guards against the PR tree
        run: |
          if [ ! -f base/tools/guard/run.ts ]; then
            echo "::error::base branch has no tools/guard/run.ts; the guards cannot run"
            exit 1
          fi
          set -- git --base "$BASE_SHA" --cwd "$GITHUB_WORKSPACE/pr" --pr-number "$PR_NUMBER"
          case "$HEAD_REF" in
            task/*)
              task_id="${HEAD_REF#task/}"
              if ! printf '%s' "$task_id" | grep -Eq '^[A-Za-z0-9._-]+$'; then
                echo "::error::branch name does not carry a valid task id"
                exit 1
              fi
              set -- "$@" --task "$task_id"
              ;;
          esac
          node base/tools/guard/run.ts "$@"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  ci-gate:
    # Summary job: the only required check of this workflow (ops/branch-protection.json).
    # CT-06zx: verify-static, verify-unit, verify-spec-1 and verify-spec-2 replace verify-fast;
    # each must pass (or be reused) on its own; so must verify-props-1 and verify-props-2 (CT-06zxa).
    if: always()
    needs:
      - verify-static
      - verify-unit
      - verify-spec-1
      - verify-spec-2
      - verify-props-1
      - verify-props-2
      - verify-int
      - guard-git
      - verify-reuse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarise
        run: |
          echo "verify-static=${STATIC} verify-unit=${UNIT} verify-spec-1=${SPEC1} verify-spec-2=${SPEC2} verify-props-1=${PROPS1} verify-props-2=${PROPS2} verify-int=${INT} guard-git=${GUARD} event=${EVENT} reuse=${REUSE_RESULT}/${REUSE}"
          # A verify job passes when it succeeded, or (label event, D10-242) when verify-reuse
          # itself succeeded and found its success on the same tested tree, so it was skipped.
          reused() { [ "$REUSE_RESULT" = success ] && [ "$REUSE" = true ] && [ "$1" = skipped ]; }
          [ "$STATIC" = success ] || reused "$STATIC" || exit 1
          [ "$UNIT" = success ] || reused "$UNIT" || exit 1
          [ "$SPEC1" = success ] || reused "$SPEC1" || exit 1
          [ "$SPEC2" = success ] || reused "$SPEC2" || exit 1
          [ "$PROPS1" = success ] || reused "$PROPS1" || exit 1
          [ "$PROPS2" = success ] || reused "$PROPS2" || exit 1
          [ "$INT" = success ] || reused "$INT" || exit 1
          if [ "$EVENT" = pull_request ]; then
            [ "$GUARD" = success ] || exit 1
          else
            [ "$GUARD" = skipped ] || [ "$GUARD" = success ] || exit 1
          fi
        env:
          STATIC: ${{ needs.verify-static.result }}
          UNIT: ${{ needs.verify-unit.result }}
          SPEC1: ${{ needs.verify-spec-1.result }}
          SPEC2: ${{ needs.verify-spec-2.result }}
          PROPS1: ${{ needs.verify-props-1.result }}
          PROPS2: ${{ needs.verify-props-2.result }}
          INT: ${{ needs.verify-int.result }}
          GUARD: ${{ needs.guard-git.result }}
          REUSE_RESULT: ${{ needs.verify-reuse.result }}
          REUSE: ${{ needs.verify-reuse.outputs.reuse }}
          EVENT: ${{ github.event_name }}
